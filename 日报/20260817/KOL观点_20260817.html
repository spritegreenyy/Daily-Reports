，<b class=\"em\">欧元中期承压</b></span>"]]], ["美联储 / 利率", [["@biancoresearch", "", "Nvidia 某种程度上正在成为 AI 的中央银行、AI 的美联储。同时过去十年仅13%的美国大盘主动基金跑赢指数，主动权益基金自2015年以来每年持续流出。 <span style=\"color:#8fa0b3\">交易含义：Nvidia 的定价权堪比央行，<b class=\"em\">其资本配置决策将主导AI产业链流动性；</b>主动基金持续失血强化指数化投资趋势</span>"], ["@LukeGromen", "全球宏观", "美国在2026年3月向韩国展示了韩国利率水平，远低于某些其他国家，这并不令人意外。 <span style=\"color:#8fa0b3\">交易含义：美国对盟友的利率施压反映美元霸权下的政策工具，关注韩元及亚洲利率传导</span>"]]], ["AI 算力 / GPU", [["@unusual_whales", "市场流", "美国公共债务已达创纪录的39.8万亿美元，距40万亿仅差2000亿。同时Nvidia融资模式中，借款人及贷款人承担违约风险，<b class=\"em\">但最终尾部风险通过养老金等工具落在普通家庭储蓄上。</b> <span style=\"color:#8fa0b3\">交易含义：债务天花板与AI融资链条的尾部风险叠加，一旦违约事件触发，<b class=\"em\">家庭部门将成最终买单者</b></span>"]]], ["比特币 / 加密", [["@McClellanOsc", "技术分析", "比特币期货2017年首次纳入COT报告，早期交易清淡。多数期货中商业交易者是聪明钱，但比特币中几乎没有交易者符合生产商或用户资格，大型投机者主导。 <span style=\"color:#8fa0b3\">交易含义：COT数据对比特币的指引意义弱于传统商品，大型投机者仓位变化更值得关注</span>"]]]]], ["地缘政治", [["中东", [["@ianbremmer", "地缘政治 (Eurasia Group)", "霍尔木兹海峡若长期关闭，相当于对全球能源贸易征收20%的过路税，这是极其悲哀且危险的局面。 <span style=\"color:#8fa0b3\">交易含义：海峡中断持续时间是油价定价的核心变量，每延长一周，<b class=\"em\">原油风险溢价将非线性抬升</b></span>"], ["@AliVaez", "", "美伊双方都没准备好敲定协议，都赌对方在几天或几周内会更绝望，因此再次陷入比耐力的僵局；所谓伊朗内部分裂的说法纯属无稽之谈。 <span style=\"color:#8fa0b3\">交易含义：谈判僵局持续意味着伊朗原油出口恢复遥遥无期，供给端缺口维持，<b class=\"em\">油价下方支撑较强</b></span>"]]], ["俄乌", [["@michaeldweiss", "俄乌问题专家", "<b class=\"em\">乌克兰在冬季前不可能获得足够的爱国者导弹来保护关键基础设施，</b>无论个别国家象征性释放库存与否；俄军伤亡数字从3万飙升至4.3万，战事烈度急剧升级。 <span style=\"color:#8fa0b3\">交易含义：<b class=\"em\">乌克兰基础设施冬季遭重创将加剧欧洲能源与财政压力，</b>天然气价格或再现脉冲式上涨</span>"], ["@samagreene", "", "对俄境内袭击的目的从来不是让俄罗斯人反对战争，而是让他们反对日益艰难的经济——这是克里姆林宫无法在不解决战争的前提下解决的问题。 <span style=\"color:#8fa0b3\">交易含义：俄罗斯经济压力若转化为内部政治风险，<b class=\"em\">将增加普京在谈判桌上让步的可能性，</b>利空原油</span>"], ["@RALee85", "", "乌克兰外交部称至少2982名来自37个非洲国家的公民被招募进俄军，其中486人确认阵亡，另有35名来自17国的公民被扣押。 <span style=\"color:#8fa0b3\">交易含义：俄罗斯大规模海外征兵显示其本土兵力枯竭，战争长期化对俄经济与社会稳定的消耗在加剧</span>"]]], ["中美", [["@PhillipsPOBrien", "战略研究", "特朗普的对华强硬从一开始就是为放弃乌克兰、服务普京利益而设的稻草人；美国已虚弱到无法保护太平洋盟友，官方承认这一点，整个对华转向是骗局。 <span style=\"color:#8fa0b3\">交易含义：美国安全承诺可信度崩塌，<b class=\"em\">将系统性推升盟友体系内的风险溢价，</b>利好黄金与军工，利空美元资产</span>"]]], ["其他地缘", [["@shashj", "", "<b class=\"em\">美国将安全保证（驻军、演习）与盟友是否参与其选择的战争挂钩，</b>这完全超出正常盟友关系摩擦范畴，是史无前例的威胁。 <span style=\"color:#8fa0b3\">交易含义：美日、美韩同盟关系若因此松动，<b class=\"em\">东亚安全风险溢价将显著上升，</b>日元与韩元或承压</span>"], ["@DerekJGrossman", "", "特朗普明显想要与金正恩开启新一轮峰会，<b class=\"em\">并沿用朝鲜官方口径将美韩年度军演称为“战争游戏”，</b>这令人震惊但毫不意外。 <span style=\"color:#8fa0b3\">交易含义：美朝峰会若成行，<b class=\"em\">可能短暂缓和半岛紧张，</b>但削弱美韩同盟基础，韩国国防自主概念或受关注</span>"]]]]], ["能源", [["原油", [["@JavierBlas", "能源记者 (BBG)", "尽管伊朗再度发动袭击，中东产油国仍在大规模外运原油，实物供应并未中断，但伊朗军方高层宣称霍尔木兹海峡的&#x27;地缘杠杆&#x27;将永久性改变，<b class=\"em\">市场需重新定价长期风险。</b> <span style=\"color:#8fa0b3\">交易含义：<b class=\"em\">实物供应与地缘风险脱钩，</b>油价波动率可能上升，但趋势方向取决于是否出现实际断供</span>"], ["@chigrl", "", "塞内加尔因油价冲击上调汽油至990 CFA/升、柴油至755 CFA/升，政府被迫削减补贴，显示高油价正从产油国向消费国财政端传导。 <span style=\"color:#8fa0b3\">交易含义：新兴市场国家财政压力上升，<b class=\"em\">可能引发需求破坏或社会动荡，</b>成为油价上行的隐性天花板</span>"]]]]], ["农产品", [["最近有效 · 08-11 · 天气气候", [["@climateguyw", "气候研究", "8月10日西部CAT3热浪已减弱为CAT2，但平原和南部正形成新的独立CAT2热浪；<b class=\"em\">下一个以化石燃料公司命名的热浪将用“Delphi”。</b> <span style=\"color:#8fa0b3\">交易含义：极端高温事件频发且区域转移，<b class=\"em\">可能加剧局部能源需求与农作物生长压力</b></span>"]]]]], ["AI半导体", [["英伟达", [["@danielnewmanUV", "科技 / 企业战略", "英伟达投资组合回报超300%，且深化供应链合作，是精明资本运作而非单纯循环融资；<b class=\"em\">但需警惕客户依赖度上升带来的风险。</b> <span style=\"color:#8fa0b3\">交易含义：若市场将投资视为循环融资，可能压制NVDA估值；反之，<b class=\"em\">供应链协同效应将强化其生态壁垒</b></span>"]]], ["推理", [["@simonw", "", "Qwen 3.8 27B本地模型体验极佳，是近期最有趣的本地运行模型，<b class=\"em\">可能推动边缘推理需求增长。</b> <span style=\"color:#8fa0b3\">交易含义：<b class=\"em\">本地模型性能提升或分流云端推理需求，</b>影响AI芯片的部署结构</span>"]]]]]]}, "report_en": {"insights": [{"title": "Top Buzz · Macro", "points": ["Core view: <b class=\"em\">Key View: @BillAckman criticizes Ro Khanna's startup failure debt forgiveness tax plan: founders whose companies fail would owe tax on forgiven debt at ordinary rates,</b> but the company is bankrupt and the founder cannot pay, effectively punishing them with personal bankruptcy."]}, {"title": "Biggest Divergence · Middle East", "points": ["Core view: <b class=\"em\">Key View: @AliVaez: Neither the US nor Iran is ready to finalize a deal,</b> each betting the other will become more desperate in days or weeks, thus falling back into a stalemate of endurance; claims of internal Iranian divisions are pure nonsense."]}, {"title": "High Alert · Russia-Ukraine", "points": ["Core view: <b class=\"em\">Key View: @michaeldweiss (Russia-Ukraine expert): Ukraine cannot obtain enough Patriot missiles to protect critical infrastructure before winter,</b> regardless of symbolic releases from individual countries; Russian military casualties have surged from 30,000 to 43,000, indicating a sharp escalation in conflict intensity."]}, {"title": "Contrarian Variable · AI Compute / GPU", "points": ["Core view: Key View: @unusual_whales (Market Flow): US public debt has hit a record $39.8 trillion, just $200 billion shy of $40 trillion. Meanwhile, in Nvidia's financing model, borrowers and lenders bear default risk, <b class=\"em\">but the ultimate tail risk falls on household savings through vehicles like pensions.</b>"]}, {"title": "Sentiment Shift · Macro", "points": ["Core view: Key View: @jam_croissant: When people no longer contribute any value, they no longer hold any power. <b class=\"em\">Humans are becoming annoying distractions that the economic system no longer needs,</b> and the current system effectively leads to zero freedom, zero pursuit of happiness, zero life."]}], "unique": [["@unusual_whales", "US public debt has hit a record $39.8 trillion, just $200 billion shy of $40 trillion. Meanwhile, in Nvidia's financing model, borrowers and lenders bear default risk, but the ultimate tail risk falls on household savings through vehicles like pensions.", "The combination of the debt ceiling and tail risks in the AI financing chain means that if a default event triggers, households will be the ultimate payers"], ["@BillAckman", "Criticizes Ro Khanna's startup failure debt forgiveness tax plan: founders whose companies fail would owe tax on forgiven debt at ordinary rates, but the company is bankrupt and the founder cannot pay, effectively punishing them with personal bankruptcy.", "If enacted, this policy would significantly dampen entrepreneurial risk appetite, negative for early-stage venture capital and tech valuations"], ["@leadlagreport", "If Japan collapses, it will trigger contagion. The 'Godzilla Margin Call' mentioned earlier on CNBC is coming.", "The Japanese market is the weak link in global liquidity; sharp moves in JGBs or the yen could trigger cross-asset deleveraging"], ["@ianbremmer", "If the Strait of Hormuz is closed for a long time, it would be equivalent to imposing a 20% toll on global energy trade, an extremely sad and dangerous situation.", "The duration of the strait's disruption is the core variable for oil pricing; each additional week will non-linearly raise the risk premium on crude"]], "sections": [["Macro", [["Macro", [["@BillAckman", "", "<b class=\"em\">Criticizes Ro Khanna's startup failure debt forgiveness tax plan: founders whose companies fail would owe tax on forgiven debt at ordinary rates,</b> but the company is bankrupt and the founder cannot pay, effectively punishing them with personal bankruptcy. <span style=\"color:#8fa0b3\">Trading Implication: If enacted, this policy would significantly dampen entrepreneurial risk appetite, <b class=\"em\">negative for early-stage venture capital and tech valuations</b></span>"], ["@jam_croissant", "", "When people no longer contribute any value, they no longer hold any power. <b class=\"em\">Humans are becoming annoying distractions that the economic system no longer needs,</b> and the current system effectively leads to zero freedom, zero pursuit of happiness, zero life. <span style=\"color:#8fa0b3\">Trading Implication: Extreme pessimistic narratives reflect deep market anxiety about AI replacing labor, <b class=\"em\">which could heighten social instability and policy intervention risks</b></span>"], ["@chamath", "", "The build-vs-buy math has decisively shifted toward build. In the SaaS era, buying software was cheaper and faster, but Gartner data shows enterprise software procurement cycles are increasingly complex, and the cost advantage of building in-house has reversed. <span style=\"color:#8fa0b3\">Trading Implication: Enterprise software spending will shift toward in-house builds, negative for traditional SaaS subscription models, <b class=\"em\">positive for AI infrastructure and developer tools</b></span>"], ["@elerianm", "Macro Economist", "Over the past week, different asset classes seem to be living in different realities, with divergences deepening both between Main Street and Wall Street and within each. <span style=\"color:#8fa0b3\">Trading Implication: The disconnect between asset pricing and the real economy is widening, cross-asset correlations are falling, and the effectiveness of diversification is improving</span>"], ["@charliebilello", "", "Different presidents, different parties, same direction: more money printing, more debt, higher prices. US fiscal expansion and currency debasement are a bipartisan long-term trend. <span style=\"color:#8fa0b3\">Trading Implication: Long-term positive for hard assets like gold and bitcoin, <b class=\"em\">negative for dollar purchasing power and fixed income</b></span>"], ["@leadlagreport", "", "If Japan collapses, it will trigger contagion. <b class=\"em\">The 'Godzilla Margin Call' mentioned earlier on CNBC is coming.</b> <span style=\"color:#8fa0b3\">Trading Implication: The Japanese market is the weak link in global liquidity; <b class=\"em\">sharp moves in JGBs or the yen could trigger cross-asset deleveraging</b></span>"], ["@MichaelAArouet", "", "Germany is in a deadly spiral: industrial collapse, with only the government creating jobs; rapid population aging, with lifetime welfare attracting large numbers of low-skilled immigrants; no reforms, only higher taxes further stifling growth. <span style=\"color:#8fa0b3\">Trading Implication: Germany's structural economic decline will drag on eurozone growth, limiting ECB policy space, <b class=\"em\">weighing on the euro medium-term</b></span>"]]], ["Fed / Rates", [["@biancoresearch", "", "Nvidia is in some ways becoming the central bank of AI, the Fed of AI. Meanwhile, over the past decade, only 13% of large-cap active US funds beat their index, and active equity funds have seen continuous outflows every year since 2015. <span style=\"color:#8fa0b3\">Trading Implication: Nvidia's pricing power rivals central banks, <b class=\"em\">and its capital allocation decisions will dominate AI supply chain liquidity;</b> persistent active fund outflows reinforce the trend toward index investing</span>"], ["@LukeGromen", "Global Macro", "In March 2026, the US showed South Korea its interest rate level, which was far lower than some other countries, which is not surprising. <span style=\"color:#8fa0b3\">Trading Implication: US interest rate pressure on allies reflects policy tools under dollar hegemony; watch for transmission to the won and Asian rates</span>"]]], ["AI Compute / GPU", [["@unusual_whales", "Market Flow", "US public debt has hit a record $39.8 trillion, just $200 billion shy of $40 trillion. Meanwhile, in Nvidia's financing model, borrowers and lenders bear default risk, <b class=\"em\">but the ultimate tail risk falls on household savings through vehicles like pensions.</b> <span style=\"color:#8fa0b3\">Trading Implication: The combination of the debt ceiling and tail risks in the AI financing chain means that if a default event triggers, <b class=\"em\">households will be the ultimate payers</b></span>"]]], ["Bitcoin / Crypto", [["@McClellanOsc", "Technical Analysis", "Bitcoin futures were first included in the COT report in 2017, with thin early trading. In most futures, commercial traders are the smart money, but in bitcoin, almost no traders qualify as producers or users, and large speculators dominate. <span style=\"color:#8fa0b3\">Trading Implication: COT data is less informative for bitcoin than for traditional commodities; changes in large speculator positions are more noteworthy</span>"]]]]], ["Geopolitics", [["Middle East", [["@ianbremmer", "Geopolitics (Eurasia Group)", "If the Strait of Hormuz is closed for a long time, it would be equivalent to imposing a 20% toll on global energy trade, an extremely sad and dangerous situation. <span style=\"color:#8fa0b3\">Trading Implication: The duration of the strait's disruption is the core variable for oil pricing; each additional week <b class=\"em\">will non-linearly raise the risk premium on crude</b></span>"], ["@AliVaez", "", "Neither the US nor Iran is ready to finalize a deal, each betting the other will become more desperate in days or weeks, thus falling back into a stalemate of endurance; claims of internal Iranian divisions are pure nonsense. <span style=\"color:#8fa0b3\">Trading Implication: A prolonged negotiation impasse means Iran's oil export recovery is far off, supply-side gaps persist, <b class=\"em\">oil prices have strong downside support</b></span>"]]], ["Russia-Ukraine", [["@michaeldweiss", "Russia-Ukraine Expert", "<b class=\"em\">Ukraine cannot obtain enough Patriot missiles to protect critical infrastructure before winter,</b> regardless of symbolic releases from individual countries; Russian military casualties have surged from 30,000 to 43,000, indicating a sharp escalation in conflict intensity. <span style=\"color:#8fa0b3\">Trading Implication: <b class=\"em\">Severe winter damage to Ukraine's infrastructure will exacerbate European energy and fiscal pressures,</b> natural gas prices may see another spike</span>"], ["@samagreene", "", "The purpose of strikes on Russian territory has never been to turn Russians against the war, but to turn them against the increasingly difficult economy—a problem the Kremlin cannot solve without resolving the war. <span style=\"color:#8fa0b3\">Trading Implication: If Russian economic pressures translate into internal political risks, <b class=\"em\">it would increase the likelihood of Putin making concessions at the negotiating table,</b> negative for oil</span>"], ["@RALee85", "", "Ukraine's Foreign Ministry says at least 2,982 citizens from 37 African countries have been recruited into the Russian military, with 486 confirmed killed, and another 35 citizens from 17 countries are detained. <span style=\"color:#8fa0b3\">Trading Implication: Russia's large-scale overseas recruitment indicates domestic manpower exhaustion, and the prolonged war is increasingly draining Russia's economy and social stability</span>"]]], ["US-China", [["@PhillipsPOBrien", "Strategic Studies", "Trump's hawkishness on China was from the start a straw man designed to abandon Ukraine and serve Putin's interests; the US is too weak to protect its Pacific allies, and officials admit this, making the entire pivot to China a fraud. <span style=\"color:#8fa0b3\">Trading Implication: The credibility of US security commitments is collapsing, <b class=\"em\">systematically raising risk premiums within the alliance system,</b> positive for gold and defense, negative for dollar assets</span>"]]], ["Other Geopolitics", [["@shashj", "", "<b class=\"em\">The US is linking security guarantees (troop deployments, exercises) to whether allies participate in its chosen wars,</b> which goes far beyond normal alliance friction and is an unprecedented threat. <span style=\"color:#8fa0b3\">Trading Implication: If US-Japan or US-South Korea alliances loosen as a result, <b class=\"em\">East Asian security risk premiums will rise significantly,</b> and the yen and won may come under pressure</span>"], ["@DerekJGrossman", "", "Trump clearly wants to open a new round of summits with Kim Jong-un, <b class=\"em\">and is adopting North Korea's official rhetoric by calling annual US-South Korea military exercises 'war games,'</b> which is shocking but not surprising. <span style=\"color:#8fa0b3\">Trading Implication: If a US-North Korea summit materializes, <b class=\"em\">it may briefly ease tensions on the peninsula,</b> but it undermines the US-South Korea alliance foundation, and South Korean defense self-reliance concepts may gain attention</span>"]]]]], ["AI Semiconductors", [["Nvidia", [["@danielnewmanUV", "Tech / Corporate Strategy", "Nvidia's investment portfolio returns exceed 300% and deepen supply chain partnerships, which is savvy capital allocation rather than mere circular financing; <b class=\"em\">but one should be wary of risks from rising customer dependence.</b> <span style=\"color:#8fa0b3\">Trading Implication: If the market views the investments as circular financing, it could suppress NVDA's valuation; conversely, <b class=\"em\">supply chain synergies will strengthen its ecosystem moat</b></span>"]]], ["Inference", [["@simonw", "", "Qwen 3.8 27B local model provides an excellent experience and is the most interesting locally run model recently, <b class=\"em\">which may drive growth in edge inference demand.</b> <span style=\"color:#8fa0b3\">Trading Implication: <b class=\"em\">Improved local model performance could divert cloud inference demand,</b> affecting the deployment structure of AI chips</span>"]]]]], ["Energy", [["Crude Oil", [["@JavierBlas", "Energy Journalist (BBG)", "Despite renewed Iranian attacks, Middle Eastern producers are still shipping crude at scale, physical supply has not been disrupted, but senior Iranian military officials claim the 'geopolitical leverage' of the Strait of Hormuz will change permanently, <b class=\"em\">and the market needs to reprice long-term risks.</b> <span style=\"color:#8fa0b3\">Trading Implication: <b class=\"em\">Physical supply and geopolitical risk are decoupling,</b> oil volatility may rise, but the trend direction depends on whether actual supply disruptions occur</span>"], ["@chigrl", "", "Senegal has raised gasoline to 990 CFA/liter and diesel to 755 CFA/liter due to the oil price shock, forcing the government to cut subsidies, showing that high oil prices are transmitting from producers to consumers' fiscal positions. <span style=\"color:#8fa0b3\">Trading Implication: Fiscal pressures in emerging markets are rising, <b class=\"em\">which could trigger demand destruction or social unrest,</b> acting as a hidden ceiling on oil prices</span>"]]]]], ["Agriculture", [["Latest valid · 08-11 · Weather & Climate", [["@climateguyw", "Climate Research", "On August 10, the western CAT3 heatwave weakened to CAT2, but new independent CAT2 heatwaves are forming in the plains and south; <b class=\"em\">the next heatwave named after a fossil fuel company will be called 'Delphi'.</b> <span style=\"color:#8fa0b3\">Trading implication: Extreme heat events are frequent and shifting regions, <b class=\"em\">may intensify local energy demand and crop growth stress</b></span>"]]]]]]}, "tweets": [{"h": "BillAckman", "tier": 1, "b": "macro", "t": "2026-08-16 22:34", "x_zh": "在@RoKhanna的计划下，如果公司失败，创始人将获得债务免除收入（DFI），该收入按普通税率征税。\n\n公司失败后，创始人从哪里找到现金来支付DFI的税款？\n\n因此，对失败初创企业的惩罚是资不抵债和……", "x_en": "Under \n@RoKhanna\n’s plan, if the company fails, the founder has debt forgiveness income (DFI) which is taxable at ordinary rates. \n\nWhere will the founder find the cash to pay the taxes on DFI after his company fails?\n\nSo the penalty for a failed startup is insolvency and the", "u": "https://x.com/BillAckman/status/2089118514741129636", "lk": 6507, "rt": 546, "rp": 424, "eng": 7477, "lang": "en", "tags": ["macro", "equities", "activist"], "important": true}, {"h": "BillAckman", "tier": 1, "b": "macro", "t": "2026-08-16 19:41", "x_zh": "Ayaan非常了不起。值得关注。", "x_en": "Ayaan is incredible. Worth a follow.", "u": "https://x.com/BillAckman/status/2089074981816631374", "lk": 6477, "rt": 509, "rp": 118, "eng": 7104, "lang": "en", "tags": ["macro", "equitie , "tags": ["macro", "options_flow", "trader"], "important": true}, {"h": "jam_croissant", "tier": 1, "b": "macro", "t": "2026-08-16 19:29", "x_zh": "当人们不再贡献任何价值时，他们就不再拥有任何权力……\n\n人类正走向成为经济中令人讨厌的干扰物，而经济不再需要我们。\n\n当前形式的系统实际上导致……\n\n0自由，0追求幸福……0生命", "x_en": "When the PEOPLE no longer contribute ANY VALUE,  they no longer have ANY POWER…\n\nHumans are on our way to becoming an annoying distraction to an economy that no longer needs us. \n\nThe system in its current form de facto leads to…\n\n0 Liberty, 0 Pursuit of happiness… 0 Life", "u": "https://x.com/jam_croissant/status/2089072037339771133", "lk": 491, "rt": 60, "rp": 57, "eng": 608, "lang": "en", "tags": ["macro", "volatility", "options"], "important": true}, {"h": "chamath", "tier": 1, "b": "macro", "t": "2026-08-16 10:58", "x_zh": "自建与购买的成本计算现在明显偏向自建。在整个SaaS浪潮中，购买软件总是比自建更便宜、更快。但购买流程变得越来越复杂。Gartner表示，复杂企业软件的购买群体", "x_en": "Build-vs-Buy Math is Now Squarely in Build\n\nFor the entirety of the SaaS wave, it was always cheaper and faster to buy software vs build what you needed. \n\nBut the buying cycle continues to get more complicated. \n\nGartner says the buying group for a complex enterprise software", "u": "https://x.com/chamath/status/2088943590093275277", "lk": 458, "rt": 46, "rp": 79, "eng": 583, "lang": "en", "tags": ["macro", "equities", "technology"], "important": true}, {"h": "LynAldenContact", "tier": 1, "b": "macro", "t": "2026-08-16 17:16", "x_zh": "世界各地实验室正在培育微型人脑。很快，它们可能比神经网络更聪明。https://wired.com/story/organoids-lab-grown-brains-neural-networks/…", "x_en": "Mini human brains are being grown in labs all over the world. Soon, they could outthink neural networks. \nhttps://\nwired.com/story/organoid\ns-lab-grown-brains-neural-networks/\n…", "u": "https://x.com/LynAldenContact/status/2089038496845517088", "lk": 521, "rt": 27, "rp": 31, "eng": 579, "lang": "en", "tags": ["macro", "rates_fx", "liquidity"], "important": true}, {"h": "charliebilello", "tier": 2, "b": "macro", "t": "2026-08-16 19:48", "x_zh": "\"复利是世界第八大奇迹。理解它的人，从中获利；不理解它的人，会付出代价。\" - 阿尔伯特·爱因斯坦 视频：https://youtube.com/watch?v=FSl1ZpKhop4&t=551s …", "x_en": "\"Compound interest is the eighth wonder of the world. He who understands it, earns it; he who doesn't, pays it.\" - Albert Einstein\n\nVideo: \nhttps://\nyoutube.com/watch?v=FSl1Zp\nKhop4&t=551s\n…", "u": "https://x.com/charliebilello/status/2089076729877062137", "lk": 453, "rt": 66, "rp": 30, "eng": 549, "lang": "en", "tags": ["macro", "data", "markets"], "important": true}, {"h": "unusual_whales", "tier": 2, "b": "macro", "t": "2026-08-17 01:47", "x_zh": "来自BI：\"英伟达预先获得付款，借款人和他们的贷款人承担违约风险，而由于私人信贷最终通过养老金等工具由普通储户提供资金，尾部风险落在家庭身上。\"", "x_en": "From BI: \"Nvidia gets paid upfront, the borrowers and their lenders carry the default risk, and because private credit is ultimately funded by ordinary savers through instruments like pension funds, the tail risk lands on households.\"", "u": "https://x.com/unusual_whales/status/2089167231716651313", "lk": 396, "rt": 55, "rp": 69, "eng": 520, "lang": "en", "tags": ["macro", "options_flow", "trader"], "important": true}, {"h": "mark_dow", "tier": 2, "b": "macro", "t": "2026-08-16 15:19", "x_zh": "但他在《学徒》节目中表现得那么好", "x_en": "But he was so good on The Apprentice", "u": "https://x.com/mark_dow/status/2089009180539834764", "lk": 464, "rt": 43, "rp": 11, "eng": 518, "lang": "en", "tags": ["macro", "rates_fx", "trader"], "important": true}, {"h": "biancoresearch", "tier": 1, "b": "macro", "t": "2026-08-16 07:04", "x_zh": "\"从某种意义上说，英伟达正在成为AI的中央银行。AI的美联储。\"", "x_en": "\"In some ways, Nvidia is kind of becoming the central bank of AI. The Federal Reserve of AI.", "u": "https://x.com/biancoresearch/status/2088884671715180650", "lk": 402, "rt": 52, "rp": 63, "eng": 517, "lang": "en", "tags": ["macro", "rates_fx", "bonds"], "important": true}, {"h": "jimcramer", "tier": 1, "b": "macro", "t": "2026-08-16 18:00", "x_zh": "厨师们行动了！更多精彩即将到来！", "x_en": "The cooks in action! Much more to come!", "u": "https://x.com/jimcramer/stat economics is changing:”\n“Modern-day economics is a Cambrian explosion of new methodology and research subfields. Thousands of papers in the subject are published each year, many of which weave in insights about human behaviour and social norms.", "u": "https://x.com/elerianm/status/2089040611303170341", "lk": 193, "rt": 52, "rp": 17, "eng": 262, "lang": "en", "tags": ["macro", "central_banks", "teacher_required"], "important": true}, {"h": "elerianm", "tier": 1, "b": "macro", "t": "2026-08-16 12:59", "x_zh": "请查看下方链接，了解我对全球经济和市场的每周观察。我们刚刚度过一周，不同资产类别似乎处于不同的现实中，包括主街与华尔街之间以及各自内部的更深差异。将其视为进一步", "x_en": "Please find below the links to my weekly look at the global economy and markets.\nWe come from a week when different asset classes seemed to inhabit different realities, including deeper variances between Main Street and Wall Street, as well as within them.\nThink of it as further", "u": "https://x.com/elerianm/status/2088973930119721051", "lk": 152, "rt": 44, "rp": 25, "eng": 221, "lang": "en", "tags": ["macro", "central_banks", "teacher_required"], "important": true}, {"h": "leadlagreport", "tier": 2, "b": "macro", "t": "2026-08-17 01:07", "x_zh": "我在CNBC上提到了哥斯拉追加保证金通知。很少人知道。", "x_en": "I mentioned the Godzilla Margin Call on CNBC.\n\nFew.", "u": "https://x.com/leadlagreport/status/2089157143354126653", "lk": 167, "rt": 11, "rp": 15, "eng": 193, "lang": "en", "tags": ["macro", "cross_asset", "risk"], "important": true}, {"h": "biancoresearch", "tier": 1, "b": "macro", "t": "2026-08-16 07:58", "x_zh": "过去十年，美国大盘基金中仅有13%跑赢指数——“如果你看主动型股票共同基金，自2015年以来每年都有持续的资金流出，”……“这是一个只有与纽约喷气机队相比才算是输的趋势。”", "x_en": "Just 13% of U.S. large-cap funds have outperformed indexes over the past decade\n-\n“If you look at active equity mutual funds, they’ve had outflows every year consistently since 2015,” ... “That’s a losing trend only compared to the New York Jets.”", "u": "https://x.com/biancoresearch/status/2088898070645756399", "lk": 151, "rt": 15, "rp": 22, "eng": 188, "lang": "en", "tag  "tier": 2, "b": "geopolitics", "t": "2026-08-16 22:12", "x_zh": "他正急于与俄罗斯、朝鲜和中国结盟。谁知道呢，也许最终还会加上伊朗。", "x_en": "He is just itching to join an alliance with Russia, North Korea and China. \nAnd who knows, maybe eventually Iran.", "u": "https://x.com/PhillipsPOBrien/status/2089113152700989440", "lk": 1144, "rt": 280, "rp": 14, "eng": 1438, "lang": "en", "tags": ["geopolitics", "ukraine", "military"], "important": true}, {"h": "PhillipsPOBrien", "tier": 2, "b": "geopolitics", "t": "2026-08-16 18:31", "x_zh": "过去几个月揭示的是，美国已经削弱到无法保护其在太平洋地区的盟友免受中国影响。然而，现在美国政府正式承认了这一点。整个特朗普转向对抗中国的策略都是一场骗局。", "x_en": "What the last months have revealed, is that the USA has so weakened itself that it could not protect its allies in the Pacific from China.\nHowever, now the US government is admitting that officially.\nThe whole Trumpian pivot to confront China was a sham.", "u": "https://x.com/PhillipsPOBrien/status/2089057521419866156", "lk": 1040, "rt": 352, "rp": 43, "eng": 1435, "lang": "en", "tags": ["geopolitics", "ukraine", "military"], "important": true}, {"h": "PhillipsPOBrien", "tier": 2, "b": "geopolitics", "t": "2026-08-16 19:51", "x_zh": "我想知道人们是否终于意识到，特朗普转向对抗中国的策略从一开始就是一个稻草人，目的是为了抛弃乌克兰并服务于普京的利益？", "x_en": "I wonder if it is finally dawning on people that Trump’s pivot to confront China was, from the start, simply a straw man put up to abandon Ukraine and serve Putin’s interest?", "u": "https://x.com/PhillipsPOBrien/status/2089077702548418881", "lk": 844, "rt": 163, "rp": 10, "eng": 1017, "lang": "en", "tags": ["geopolitics", "ukraine", "military"], "important": true}, {"h": "michaeldweiss", "tier": 2, "b": "geopolitics", "t": "2026-08-16 19:19", "x_zh": "不久之前30K还是一个里程碑。现在已经是43K了。", "x_en": "30K was a milestone not long ago. Now it's 43K.", "u": "https://x.com/michaeldweiss/status/2089069523705979200", "lk": 840, "rt": 110, "rp": 10, "eng": 960, "lang": "en", "tags": ["geopolitics", "russia", "middle_east"], "important": true}, {"h": "PhillipsPOBrien", "tier": 2, "b": "geopolitics", "t": "2026-08-16 19:44", "x_zh": "美国不再是一个严肃的国家。", "x_en": "The USA is no longer a serious country.", "u": "https://x.com/PhillipsPOBrien/status/2089075953515303124", "lk": 781, "rt": 143, "rp": 6, "eng": 930, "lang": "en", "tags": ["geopolitics", "ukraine", "military"], "important": true}, {"h": "samagreene", "tier": 1, "b": "geopolitics", "t": "2026-08-16 14:16", "x_zh": "抱歉，但我不同意。这些攻击从来不是为了促使俄罗斯人反对战争，而是为了让俄罗斯人反对日益艰难的经济，而这个问题克里姆林宫在不解决战争的情况下无法解决。", "x_en": "Sorry, but I disagree. These attacks were never about getting Russians to oppose the war. They were about getting Russians to oppose an increasingly difficult economy, a problem the Kremlin can’t solve without addressing the war.", "u": "https://x.com/samagreene/status/2088993242905780282", "lk": 405, "rt": 66, "rp": 1, "eng": 472, "lang": "en", "tags": ["geopolitics", "russia", "political_risk"], "important": true}, {"h": "michaeldweiss", "tier": 2, "b": "geopolitics", "t": "2026-08-16 20:13", "x_zh": "@jackwatling：“关键在于，从现在到冬天，乌克兰不会收到足够的‘爱国者’系统来保护其关键国家基础设施，无论一些国家是否做出政治姿态，从其库存中释放更多系统。在这一点上……”", "x_en": ".\n@jackwatling\n: \"The point is that Ukraine is not going to receive enough Patriots between now and the winter to save its critical national infrastructure, irrespective of whether some countries make the political gesture of releasing a few more from their stockpiles. At this", "u": "https://x.com/michaeldweiss/status/2089083100412170489", "lk": 316, "rt": 123, "rp": 11, "eng": 450, "lang": "en", "tags": ["geopolitics", "russia", "middle_east"], "important": true}, {"h": "ianbremmer", "tier": 1, "b": "geopolitics", "t": "2026-08-16 23:43", "x_zh": "这就像海峡20%的通行费一样。可悲。", "x_en": "it’s like the 20% toll on the strait. \nsad.", "u": "https://x.com/ianbremmer/status/2089135881940591000", "lk": 338, "rt": 24, "rp": 27, "eng": 389, "lang": "en", "tags": ["geopolitics", "political_risk", "global_macro"], "important": true}, {"h": "shashj", "tier": 1, "b": "geopolitics", "t": "2026-08-16 23:02", "x_zh": "美国盟友在外交政策分歧时期关系紧张是正常的。但美国将安全保障——以及支撑这些保障的东西，如部队部署和演习——与盟友加入美国的选择性战争挂钩，这一点完全不正常。", "x_en": "It's normal for US alliances to be strained in times of foreign policy divergence. Not normal, at all, for the US to link security guarantees - and the things that underpin them, like troop deployments and exercises -  to allies joining US wars of choice.", "u": "https://x.com/shashj/status/2089125672585253063", "lk": 285, "rt": 66, "rp": 11, "eng": 362, "lang": "en", "tags": ["geopolitics", "defense", "europe"], "important": true}, {"h": "RALee85", "tier": 1, "b": "geopolitics", "t": "2026-08-16 19:18", "x_zh": "“乌克兰外交部表示，来自37个非洲国家的至少2,982人已被招募进俄罗斯武装部队。其中，已知有486人阵亡。详情：外交部称，来自17个非洲国家的35名公民正被关押在……”", "x_en": "“Ukraine's Foreign Ministry has stated that at least 2,982 individuals from 37 African countries have been recruited into Russia's armed forces. Of them, 486 are known to have been killed.\n\nDetails: The ministry stated that 35 citizens from 17 African countries are being held on", "u": "https://x.com/RALee85/status/2089069188187132203", "lk": 159, "rt": 36, "rp": 11, "eng": 206, "lang": "en", "tags": ["geopolitics", "russia", "military"], "important": true}, {"h": "AliVaez", "tier": 2, "b": "geopolitics", "t": "2026-08-16 12:19", "x_zh": "我们现在能停止关于伊朗内部分裂的胡言乱语吗？", "x_en": "Can we stop this nonsense about internal Iranian divisions now?", "u": "https://x.com/AliVaez/status/2088963746693525608", "lk": 134, "rt": 42, "rp": 0, "eng": 176, "lang": "en", "tags": ["geopolitics", "middle_east", "iran"], "important": true}, {"h": "MassDara", "tier": 1, "b": "geopolitics", "t": "2026-08-16 18:03", "x_zh": "这太危险了，而他做到了。致敬。", "x_en": "This is so dangerous and he did it. Respect", "u": "https://x.com/MassDara/status/2089050488415064553", "lk": 120, "rt": 8, "rp": 0, "eng": 128, "lang": "en", "tags": ["geopolitics", "defense", "military"], "important": true}, {"h": "BarakRavid", "tier": 1, "b": "geopolitics", "t": "2026-08-16 22:57", "x_zh": "伊拉克库尔德斯坦总统办公室确认巴尔扎尼在美伊秘密沟通渠道中的角色。https://iranintl.com/en/202608162788", "x_en": "Iraqi Kurdistan president’s office confirms Barzani’s US-Iran backchannel role \nhttps://\niranintl.com/en/202608162788", "u": "https://x.com/BarakRavid/status/2089124294567637502", "lk": 72, "rt": 20, "rp": 18, "eng": 110, "lang": "en", "tags": ["geopolitics", "middle_east", "diplomacy"], "important": true}, {"h": "AliVaez", "tier": 2, "b": "geopolitics", "t": "2026-08-16 11:51", "x_zh": "告诉《纽约时报》：双方都还没准备好敲定协议。他们都认为，在几天或几周内，对方会更加绝望，因此他们能从中得到更多。这就是为什么我们再次陷入这场耐力游戏。", "x_en": "Told \n@nytimes\n: Neither side is ready to finalize a deal. They both think that in a matter of days/weeks, the other side will be more desperate, so they’ll be able to get more out of it. This is why we are locked into this game of endurance again.", "u": "https://x.com/AliVaez/status/2088956849601048589", "lk": 54, "rt": 16, "rp": 0, "eng": 70, "lang": "en", "tags": ["geopolitics", "middle_east", "iran"], "important": false}, {"h": "DerekJGrossman", "tier": 1, "b": "geopolitics", "t": "2026-08-17 00:40", "x_zh": "是的，这很疯狂，但坦率地说，我不明白为什么有人会对此感到惊讶。特朗普显然想与朝鲜的金正恩开启新一轮峰会，并且过去曾将美韩年度军演称为“战争游戏”，附和朝鲜政权。这真是可悲。", "x_en": "Yes this is nuts, but frankly, I don’t understand how anyone could be surprised at this point. Trump clearly wants a new round of summitry with North Korea’s Kim and has labeled annual US-South Korea military drills “war games” in the past, parroting the regime. It’s just sad.", "u": "https://x.com/DerekJGrossman/status/2089150428806312427", "lk": 29, "rt": 4, "rp": 7, "eng": 40, "lang": "en", "tags": ["geopolitics", "indo_pacific", "security"], "important": false}, {"h": "joshua_landis", "tier": 2, "b": "geopolitics", "t": "2026-08-16 18:56", "x_zh": "伊朗冲击波的长期阴影\n\n@JasonBordoff 和 @OSullivanMeghan 警告说，如果霍尔木兹海峡在未来几个月内仍然关闭，可能会出现更严重的能源冲击。\n\n“人们很容易得出结论，能源供应中断的危险已经……”", "x_en": "The Long Shadow of the Iran Shock \n\n\n@JasonBordoff\n & \n@OSullivanMeghan\n They warn that a more severe energy shock may be coming if the Strait of Hormuz remains closed in the months     var kol=new Set(tw.map(function(t){return t.h})).size; $("#tstat").innerHTML=tx("show")+' <b>'+tw.length+'</b> / '+m.n_tweets+' · <b>'+kol+'</b> '+tx("kols")+' · '+tx("monitor")+' '+m.n_accounts+' '+tx("accounts");
    var s=$("#stream"); if(!tw.length){s.innerHTML='<div class="empty">'+tx("empty")+'</div>';return} s.innerHTML="";
    tw.forEach(function(t){
      var B=BOARDS[t.b]||{color:"#5b8def"}, body=bodyOf(t), tags=(t.tags||[]).map(function(x){return '<span class="tag" data-tag="'+esc(x)+'">'+esc(x)+'</span>'}).join("");
      var c=document.createElement("div"); c.className="card"; c.tabIndex=0; c.style.setProperty("--bc",B.color);
      c.innerHTML='<div class="chead"><span class="hand" data-h="'+esc(t.h)+'">@'+esc(t.h)+'</span><span class="bchip" style="background:'+B.color+'">'+boardShort(t.b)+'</span>'+(t.tier===1?'<span class="t1">'+tx("tier1")+'</span>':'')+'<span class="lang">'+(t.lang==="zh"?tx("langZh"):tx("langEn"))+'</span><span class="time mono">'+esc(t.t)+'</span></div><div class="cbody">'+hl(body,st.q)+'</div><div class="cfoot"><span class="eng mono"><span>♥ '+fmt(t.lk)+'</span><span>⟲ '+fmt(t.rt)+'</span><span>💬 '+fmt(t.rp)+'</span></span><span class="tags">'+tags+'</span><span class="open">'+tx("open")+'</span></div>';
      var bodyEl=c.querySelector(".cbody"); requestAnimationFrame(function(){if(bodyEl.scrollHeight>bodyEl.clientHeight+4){bodyEl.classList.add("clamp"); var mm=document.createElement("span"); mm.className="more"; mm.textContent=tx("more"); bodyEl.after(mm); mm.onclick=function(e){e.stopPropagation();bodyEl.classList.toggle("open");bodyEl.classList.toggle("clamp");mm.textContent=bodyEl.classList.contains("open")?tx("less"):tx("more")}}});
      c.onclick=function(){window.open(t.u,"_blank","noopener")}; c.onkeydown=function(e){if(e.key==="Enter")window.open(t.u,"_blank","noopener")};
      c.querySelector(".hand").onclick=function(e){e.stopPropagation();jumpHandle(t.h)}; c.querySelectorAll(".tag").forEach(function(tg){tg.onclick=function(e){e.stopPropagation();$("#q").value=tg.dataset.tag;st.q=tg.dataset.tag;$("#clr").style.display="block";render()}});
      s.appendChild(c);
    })
  }
  function renderAll(){syncUi();renderReport();renderBrief();renderIndices();buildPills();render();setView(st.view,false)}
  var qi=$("#q"),clr=$("#clr"); qi.oninput=function(){st.q=qi.value.trim();clr.style.display=qi.value?"block":"none";render()}; clr.onclick=function(){qi.value="";st.q="";clr.style.display="none";qi.focus();render()};
  document.addEventListener("keydown",function(e){if(e.key==="/"&&document.activeElement!==qi){e.preventDefault();qi.focus()} if(e.key==="Escape"&&document.activeElement===qi){qi.value="";st.q="";clr.style.display="none";render()}});
  function seg(id,key){var el=$(id);el.querySelectorAll("button").forEach(function(b){b.onclick=function(){el.querySelectorAll("button").forEach(function(x){x.removeAttribute("data-on")});b.setAttribute("data-on","1");st[key]=b.dataset.v;render()}})}
  seg("#sortSeg","sort"); seg("#tierSeg","tier"); seg("#langSeg","lang");
  $("#reset").onclick=function(){st.board="all";st.tier="all";st.lang="all";st.sort="hot";st.q="";qi.value="";clr.style.display="none";[["#sortSeg","hot"],["#tierSeg","all"],["#langSeg","all"]].forEach(function(p){var el=$(p[0]);el.querySelectorAll("button").forEach(function(x){x.setAttribute("data-on",x.dataset.v===p[1]?"1":"")})});buildPills();render()};
  app.querySelectorAll(".langsw button").forEach(function(b){b.onclick=function(){uiLang=b.dataset.lang;renderAll()}});
  $("#viewNav").querySelectorAll("button").forEach(function(b){b.onclick=function(){setView(b.dataset.view,true)}});$("#openFull").onclick=function(){setView('full',true)};
  app.querySelectorAll(".range button").forEach(function(b){b.onclick=function(){st.range=+b.dataset.range;renderAll()}});
  renderAll();
})();
</script>
