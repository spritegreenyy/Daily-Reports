<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KOL 交易主线 · 可视化终端 · 2026-07-28</title>
<style>html,body{margin:0;background:#0e1620}</style>
</head>
<body>
<div id="kolapp">
<style>
  #kolapp *{box-sizing:border-box}
  #kolapp{--ink:#0e1620;--panel:#16212e;--panel2:#1b2836;--line:#26374a;--tx:#e7edf4;--mut:#8fa0b3;--mut2:#63748a;--gold:#e7b24d;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--tx);background:var(--ink);min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased}
  #kolapp .mono{font-family:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
  #kolapp b{color:#f4b74a;font-weight:700} #kolapp mark{background:rgba(231,178,77,.26);color:#ffe4a3;border-radius:2px;padding:0 3px;font-weight:600}
  #kolapp .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  #kolapp .mast{background:linear-gradient(120deg,#132234,#0e1620);border-bottom:1px solid var(--line);padding:22px 0 18px}
  #kolapp .mast h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.5px}
  #kolapp .mast h1 .g{color:var(--gold)} #kolapp .mast .win{color:var(--mut);font-size:12.5px;margin-top:5px}
  #kolapp .mast .sub{color:var(--mut2);font-size:12px;margin-top:3px}
  #kolapp .mtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  #kolapp .langsw{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);padding:3px}
  #kolapp .langsw button{border:0;background:transparent;color:var(--mut);font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;cursor:pointer}
  #kolapp .langsw button[data-on="1"]{background:var(--gold);color:#0e1620}
  #kolapp select.date{margin-left:auto;background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:13px;cursor:pointer}
  #kolapp .sect{padding:22px 0 6px} #kolapp .stitle{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--mut);text-transform:uppercase;display:flex;align-items:center;gap:10px;margin-bottom:14px}
  #kolapp .stitle::before{content:"";width:5px;height:15px;background:var(--gold);border-radius:2px}
  #kolapp .ins,#kolapp .uq,#kolapp .stream{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  #kolapp .icard,#kolapp .ucard,#kolapp .card,#kolapp .bsec{background:var(--panel);border:1px solid var(--line);border-radius:11px}
  #kolapp .idxgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  #kolapp .idxcard{background:linear-gradient(145deg,var(--panel),#131f2d);border:1px solid var(--line);border-radius:13px;padding:16px 17px;min-width:0;position:relative;overflow:hidden}
  #kolapp .idxcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ic,#8fa0b3)}
  #kolapp .idxcard.nodata{background:var(--panel);border-style:dashed;opacity:.78}
  #kolapp .idxhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.idxhead b{font-size:15px!important;color:var(--tx)!important}
  #kolapp .idxconf{font-size:10px;font-weight:700;letter-spacing:.3px;border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--mut)}
  #kolapp .idxconf.low{color:#e7b24d;border-color:rgba(231,178,77,.35)}.idxconf.mid{color:#71b9e6;border-color:rgba(113,185,230,.35)}.idxconf.high{color:#55c9a5;border-color:rgba(85,201,165,.35)}
  #kolapp .idxhero{display:flex;align-items:flex-end;gap:12px;margin:11px 0 8px}.idxscore{font:800 34px "SF Mono",ui-monospace,monospace;line-height:1}.idxscore.pos{color:#55c9a5}.idxscore.neg{color:#ef7f73}.idxscore.none{color:var(--mut2)}
  #kolapp .idxstate{font-size:12px;color:var(--mut);padding-bottom:3px}.idxunder{font-size:10.5px;color:var(--mut2);line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #kolapp .idxaxis{height:9px;background:var(--panel2);border-radius:6px;position:relative;margin:13px 0 11px}.idxaxis::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:#607086}
  #kolapp .idxfill{position:absolute;height:100%;border-radius:6px}.idxmeta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.idxstat{border-top:1px solid var(--line);padding-top:8px}.idxstat strong{display:block;font:700 14px "SF Mono",ui-monospace,monospace;color:var(--tx)}.idxstat strong small{font-size:9px;color:var(--mut);font-weight:600}.idxstat span{font-size:9.5px;color:var(--mut2)}
  #kolapp .idxtrend{display:flex;align-items:center;gap:10px;margin-top:11px}.idxtrendlabel{font-size:9.5px;color:var(--mut2);white-space:nowrap}.idxspark{height:30px;flex:1}.idxspark svg{width:100%;height:30px;display:block}
  #kolapp .idxempty{margin-top:13px;border:1px dashed var(--line);border-radius:9px;padding:17px 12px;text-align:center;color:var(--mut2);font-size:11px}.idxformula{display:inline-block;margin-top:12px;padding:6px 10px;border:1px solid rgba(231,178,77,.28);border-radius:7px;background:rgba(231,178,77,.07);color:#f1c76f;font:600 11px "SF Mono",ui-monospace,monospace}.idxnote{font-size:10.5px;color:var(--mut2);margin-top:7px;line-height:1.55}
  #kolapp .comp{background:#f3efe5;color:#17202a;border:1px solid #d6ccb6;border-radius:15px;padding:18px;margin-bottom:14px;box-shadow:0 12px 28px rgba(0,0,0,.12)}
  #kolapp .comphead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}.comptitle{font:800 20px Georgia,"Songti SC",serif;color:#13251f}.compsub{font-size:10.5px;color:#7e7565;margin-top:3px}
  #kolapp .range{display:inline-flex;border:1px solid #cfc3aa;border-radius:999px;padding:3px;background:#e8e0d0;white-space:nowrap}.range button{border:0;background:transparent;color:#746a5a;padding:4px 9px;border-radius:999px;font-size:10px;font-weight:700;cursor:pointer}.range button[data-on="1"]{background:#173f35;color:#fff}
  #kolapp .compkpis{display:grid;grid-template-columns:1.25fr repeat(5,1fr);gap:8px;margin-bottom:13px}.compkpi{background:rgba(255,255,255,.58);border:1px solid #ddd3bf;border-radius:10px;padding:10px 11px;min-width:0}.compkpi.hero{background:#173f35;border-color:#173f35}.compkpi span{display:block;color:#837968;font-size:9.5px;white-space:nowrap}.compkpi strong{display:block;color:#17251f;font:800 19px "SF Mono",ui-monospace,monospace;margin-top:2px;white-space:nowrap}.compkpi.hero span{color:#bfcfc7}.compkpi.hero strong{color:#f0be4e;font-size:27px}.compkpi strong.up{color:#168264}.compkpi strong.down{color:#bd4438}.compkpi small{display:block;color:#958a78;font-size:8.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #kolapp .compchart{height:315px;background:#fbfaf6;border:1px solid #ded5c3;border-radius:11px;overflow:hidden;position:relative}.compchart svg{display:block;width:100%;height:100%}.complegend{display:flex;gap:13px;align-items:center;flex-wrap:wrap;color:#786f61;font-size:9.5px;margin:8px 2px 0}.complegend i{display:inline-block;width:12px;height:3px;margin-right:4px;vertical-align:middle}.complegend i.line{height:2px;background:#111}.complegend i.event{height:8px;width:8px;background:#9b7c35;transform:rotate(45deg)}
  #kolapp .charttip{display:none;position:absolute;z-index:3;max-width:270px;padding:8px 10px;border-radius:7px;background:rgba(19,37,31,.96);color:#fff;font-size:10px;line-height:1.55;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.24);white-space:pre-line}.compchart .hoverpoint{cursor:crosshair}
  #kolapp .compformula{margin-top:11px;padding:9px 11px;border-left:3px solid #b78a27;background:#ece4d4;color:#5e5547;font-size:10px;line-height:1.55}.compformula b{color:#173f35!important}
  #kolapp .bt{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:14px}.bttop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.bttitle{font-size:13px;font-weight:800}.btmethod{font-size:9.5px;color:var(--mut2)}.bttable{width:100%;border-collapse:collapse;font-size:10.5px}.bttable th{text-align:left;color:var(--mut2);font-weight:600;padding:6px;border-bottom:1px solid var(--line)}.bttable td{padding:7px 6px;border-bottom:1px solid rgba(38,55,74,.65);font-variant-numeric:tabular-nums}.bttable tr:last-child td{border-bottom:0}.bttable .samplelow{color:#e7b24d}.bttable .positive{color:#55c9a5}.bttable .negative{color:#ef7f73}
  #kolapp .icard{padding:14px 16px} #kolapp .icard h3{margin:0 0 9px;font-size:14.5px;font-weight:700;line-height:1.4;color:#fff;display:flex;gap:8px}
  #kolapp .inum{flex:0 0 auto;width:20px;height:20px;border-radius:6px;background:var(--gold);color:#0e1620;font-size:12px;font-weight:800;display:grid;place-items:center;margin-top:1px}
  #kolapp .icard li{list-style:none;font-size:12.8px;color:#cdd8e6;margin:6px 0;padding-left:12px;position:relative}
  #kolapp .icard li::before{content:"";position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:var(--mut2)}
  #kolapp .icard ul{margin:0;padding:0}
  #kolapp .bhead{padding:9px 14px;font-size:14px;font-weight:700;color:#0e1620;cursor:pointer;display:flex;align-items:center;gap:8px}
  #kolapp .bhead .arrow{margin-left:auto;font-size:12px;opacity:.7} #kolapp .bbody{padding:6px 14px 12px}
  #kolapp .subg{margin-top:11px} #kolapp .subh{font-size:11.5px;font-weight:700;letter-spacing:.5px;padding:2px 0 2px 8px;margin-bottom:5px;border-left:3px solid var(--sc)}
  #kolapp .vp{font-size:12.8px;color:#cdd8e6;margin:5px 0;padding-left:2px} #kolapp .vh{font-weight:700;color:var(--tx);cursor:pointer} #kolapp .vh:hover,#kolapp .ucard .uh:hover{color:var(--gold)}
  #kolapp .vr{color:var(--mut2);font-size:11px;margin:0 5px}
  #kolapp .ucard{border-left:3px solid #35bfad;padding:12px 14px} #kolapp .ucard .uh{font-weight:700;font-size:13px;color:#35bfad;cursor:pointer}
  #kolapp .ucard .uv{font-size:12.6px;color:#cdd8e6;margin:6px 0} #kolapp .ucard .ui{font-size:11.8px;color:var(--mut);border-top:1px solid var(--line);padding-top:7px;margin-top:7px}
  #kolapp .tdiv{margin:30px 0 0;border-top:1px dashed var(--line);padding-top:4px}
  #kolapp .ctrl{position:sticky;top:0;z-index:15;background:rgba(14,22,32,.94);backdrop-filter:blur(6px);padding:12px 0;border-bottom:1px solid var(--line)}
  #kolapp .pills{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  #kolapp .pill{border:1px solid var(--line);background:var(--panel);color:var(--mut);border-radius:999px;padding:5px 13px;font-size:13px;cursor:pointer;display:inline-flex;gap:7px;white-space:nowrap}
  #kolapp .pill[data-on="1"]{color:#0e1620;font-weight:600}
  #kolapp .pill .cnt{font-size:11px;color:var(--mut2)} #kolapp .pill[data-on="1"] .cnt{color:rgba(14,22,32,.6)}
  #kolapp .row2{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  #kolapp .search{flex:1;min-width:190px;position:relative}
  #kolapp .search input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:9px 32px 9px 34px;font-size:14px;outline:none}
  #kolapp .search .ic{position:absolute;left:11px;top:9px;color:var(--mut2)} #kolapp .search .clr{position:absolute;right:9px;top:7px;color:var(--mut2);cursor:pointer;font-size:16px;display:none}
  #kolapp .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden} #kolapp .seg button{background:var(--panel);color:var(--mut);border:0;padding:8px 12px;font-size:12.5px;cursor:pointer}
  #kolapp .seg button+button{border-left:1px solid var(--line)} #kolapp .seg button[data-on="1"]{background:var(--panel2);color:var(--gold)}
  #kolapp .reset{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:8px 12px;font-size:12.5px;cursor:pointer}
  #kolapp .tstat{font-size:12px;color:var(--mut);margin:10px 0} #kolapp .tstat b{color:var(--tx)}
  #kolapp .stream{padding:4px 0 60px;align-items:start}
  #kolapp .card{border-left:3px solid var(--bc,#5b8def);padding:12px 14px;cursor:pointer;overflow:hidden}
  #kolapp .chead{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
  #kolapp .hand{font-weight:700;font-size:13.5px} #kolapp .hand:hover{color:var(--gold)}
  #kolapp .bchip{font-size:10.5px;padding:1px 7px;border-radius:5px;font-weight:600;color:#0e1620}
  #kolapp .t1{font-size:10px;color:var(--gold);border:1px solid rgba(231,178,77,.4);border-radius:4px;padding:0 4px}
  #kolapp .lang{font-size:10px;color:var(--mut2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
  #kolapp .time{margin-left:auto;font-size:11px;color:var(--mut2)}
  #kolapp .cbody{font-size:13.3px;color:#d3ddeb;white-space:pre-wrap;word-break:break-word;max-height:8.6em;overflow:hidden;position:relative}
  #kolapp .cbody.open{max-height:none} #kolapp .cbody.clamp::after{content:"";position:absolute;bottom:0;left:0;right:0;height:2.2em;background:linear-gradient(180deg,transparent,var(--panel))}
  #kolapp .more{font-size:11.5px;color:var(--mut2);margin-top:3px;display:inline-block;cursor:pointer}
  #kolapp .cfoot{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line);flex-wrap:wrap}
  #kolapp .eng{display:flex;gap:11px;font-size:11.5px;color:var(--mut)} #kolapp .tags{display:flex;gap:5px;flex-wrap:wrap}
  #kolapp .tag{font-size:10.5px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;cursor:pointer}
  #kolapp .open{margin-left:auto;font-size:11.5px;color:var(--gold);white-space:nowrap}
  #kolapp .empty{grid-column:1/-1;text-align:center;color:var(--mut2);padding:50px 20px}
  @media (max-width:820px){#kolapp .idxgrid{grid-template-columns:repeat(2,minmax(0,1fr))}#kolapp .compkpis{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:560px){#kolapp .ins,#kolapp .uq,#kolapp .stream,#kolapp .idxgrid{grid-template-columns:1fr}#kolapp .comp{padding:13px}#kolapp .comphead{display:block}#kolapp .range{margin-top:9px}#kolapp .compkpis{grid-template-columns:repeat(2,1fr)}#kolapp .compchart{height:270px}.bttable{font-size:9px}}
</style>

<div class="mast"><div class="wrap">
  <div class="mtop">
    <h1 id="title"></h1>
    <div class="langsw"><button type="button" data-lang="zh">中</button><button type="button" data-lang="en">EN</button></div>
    <select class="date" id="dateSel"></select>
  </div>
  <div class="win" id="win"></div>
  <div class="sub" id="sub"></div>
</div></div>

<div class="wrap">
  <div class="sect"><div class="stitle" id="st1"></div><div class="ins" id="insights"></div></div>
  <div class="sect"><div class="stitle" id="stidx"></div>
    <div class="comp">
      <div class="comphead"><div><div class="comptitle" id="comptitle"></div><div class="compsub" id="compsub"></div></div><div class="range"><button type="button" data-range="30">30D</button><button type="button" data-range="60">60D</button></div></div>
      <div class="compkpis" id="compkpis"></div>
      <div class="compchart" id="compchart"></div>
      <div class="complegend" id="complegend"></div>
      <div class="compformula" id="compformula"></div>
    </div>
    <div class="bt"><div class="bttop"><div class="bttitle" id="bttitle"></div><div class="btmethod" id="btmethod"></div></div><div id="backtest"></div></div>
    <div class="idxgrid" id="indices"></div><div class="idxformula" id="idxformula"></div><div class="idxnote" id="idxnote"></div>
  </div>
  <div class="sect"><div class="stitle" id="st2"></div><div id="sections"></div></div>
  <div class="sect"><div class="stitle" id="st3"></div><div class="uq" id="unique"></div></div>
  <div class="tdiv"></div>
  <div class="sect"><div class="stitle" id="st4"></div></div>
</div>

<div class="ctrl"><div class="wrap">
  <div class="pills" id="boardPills"></div>
  <div class="row2">
    <div class="search"><span class="ic">🔍</span><input id="q" type="text" autocomplete="off"><span class="clr" id="clr">×</span></div>
    <div class="seg" id="sortSeg"><button data-v="hot" data-on="1"></button><button data-v="new"></button></div>
    <div class="seg" id="tierSeg"><button data-v="all" data-on="1"></button><button data-v="1"></button><button data-v="2"></button></div>
    <div class="seg" id="langSeg"><button data-v="all" data-on="1"></button><button data-v="zh"></button><button data-v="en"></button></div>
    <button class="reset" id="reset"></button>
  </div>

hike, already close to Citadel's expectations, not out of reach. <span style=\"color:#8fa0b3\">Trading Implication: If the probability of a rate hike continues to rise, <b class=\"em\">it will pressure risk assets, especially long-duration tech stocks</b></span>"], ["@BobEUnlimited", "Macro Research", "While the market focuses on the US earnings season, European earnings upgrades are surging; JPMorgan's quant team says Europe is the strongest region for earnings upgrades. <span style=\"color:#8fa0b3\">Trading Implication: If funds rotate from the US to Europe, <b class=\"em\">it will change the current US stock-dominated landscape</b></span>"], ["@charliebilello", "", "Google's Q2 net profit of $112 billion set a record, but free cash flow turned negative due to AI spending, causing the stock to fall 7% the next day; CXMT surged 466% on its first day to a market cap of $484 billion, becoming the most expensive stock on A-shares. <span style=\"color:#8fa0b3\">Trading Implication: The payback period for AI capital expenditure is shortening; <b class=\"em\">deteriorating free cash flow will suppress valuations</b></span>"]]], ["Crude Oil / Distillates", [["@M_McDonough", "", "After the US-Iran ceasefire, Brent fell to $88.88, but only 2 oil tankers passed through the Strait of Hormuz in 24 hours, and 9 through the Bab el-Mandeb; actual shipping disruptions continue. <span style=\"color:#8fa0b3\">Trading Implication: The oil price decline is sentiment-driven, <b class=\"em\">but physical supply risks remain,</b> be alert for a rebound</span>"]]]]], ["Geopolitics", [["Middle East", [["@ianbremmer", "Geopolitics (Eurasia Group)", "The Iran war has already cost the average US household an extra $562 in fuel costs. Trump bets economic pain will force Tehran to concede, while Tehran bets the US cannot sustain the cost long-term. <span style=\"color:#8fa0b3\">Trading Implication: Both sides are testing each other's endurance; <b class=\"em\">oil prices and inflation data will serve as the real-time scoreboard for the game</b></span>"], ["@BarakRavid", "Middle East reporter (Axios)", "<b class=\"em\">Israel, Lebanon, and the US will hold talks in Rome on August 4-6,</b> discussing the redeployment of Israeli forces in southern Lebanon and land border disputes. Trump says the pause in attacks is due to mediators' request to give negotiations another chance. <span style=\"color:#8fa0b3\">Trading Implication: If the Rome talks make progress, <b class=\"em\">the Middle East risk premium will significantly decline;</b> if they collapse, the probability of conflict escalation rises sharply</span>"], ["@Charles_Lister", "", "<b class=\"em\">Turkish President Erdogan is about to meet with the leadership of the Syrian Democratic Forces (SDF),</b> a symbolic first step before the SDF's formal dissolution. <span style=\"color:#8fa0b3\">Trading Implication: <b class=\"em\">Turkey's engagement with Kurdish forces could alter the power structure in northern Syria,</b> affecting regional stability</span>"]]], ["Russia-Ukraine", [["@KofmanMichael", "", "Just back from a field trip to Ukraine, with in-depth exchanges with commanders of the 475th Regiment Code 9.2 and the 1st Independent Assault Regiment's drone assault units; Ukrainian drone tactics are rapidly iterating. <span style=\"color:#8fa0b3\">Trading Implication: <b class=\"em\">Drone tactical innovation may change the battlefield balance,</b> worth watching its impact on Russian defenses and equipment attrition</span>"]]], ["China-US", [["@DerekJGrossman", "", "The Indian government is furious over China's readout of the China-India foreign ministers' meeting, as China claims New Delhi accepted Beijing's territorial claims on Tibet. <span style=\"color:#8fa0b3\">Trading Implication: New rifts in China-India border talks <b class=\"em\">may affect bilateral relations and regional cooperation</b></span>"]]]]], ["Commodities", [["Crude Oil", [["@JavierBlas", "Energy reporter (BBG)", "More VLCCs are detouring around Africa to pick up Saudi crude in Egypt, adding 25 days one way; <b class=\"em\">costly but supply not yet disrupted.</b> <span style=\"color:#8fa0b3\">Trading Implication: If detours become the norm, <b class=\"em\">tanker rates and crude landed costs will remain under pressure</b></span>"]]]]], ["Weather & Climate", [["Latest valid · 07-22 · El Niño Status", [["@natolambert", "", "El Niño Costero off Peru is rapidly intensifying, with sea surface temperatures in the Niño 1+2 region approaching +3°C, similar to the strong 1997 El Niño event; expected to expand to Ecuador within two weeks, <b class=\"em\">potentially triggering extreme precipitation and flood risks along the South American coast.</b> <span style=\"color:#8fa0b3\">Trading Implication: If El Niño expands to the central equatorial Pacific, it will strengthen the global weather anomaly trading logic, <b class=\"em\">favoring long positions in agricultural commodities.</b></span>"]]], ["Latest valid · 07-22 · Weather / El Niño", [["@natolambert", "", "El Niño Costero off Peru is rapidly intensifying, with sea surface temperatures in the Niño 1+2 region approaching +3°C, similar to the strong 1997 El Niño event; expected to expand to Ecuador within two weeks, <b class=\"em\">potentially triggering extreme precipitation and flood risks along the South American coast.</b> <span style=\"color:#8fa0b3\">Trading Implication: If El Niño expands to the central equatorial Pacific, it will strengthen the global weather anomaly trading logic, <b class=\"em\">favoring long positions in agricultural commodities.</b></span>"]]]]], ["AI & Semiconductors", [["Nvidia", [["@AndrewYNg", "", "Jensen Huang's open letter is worth reading; the OpenAI-Hugging Face hack proves open-source models and defense toolchains are more secure; the claim that closed models are safer is just regulatory capture. <span style=\"color:#8fa0b3\">Trading Implication: If regulation shifts to mandatory closure, it will suppress the pace of open-source ecosystem innovation, <b class=\"em\">bearish for Nvidia inference chip demand</b></span>"]]], ["Inference", [["@swyx", "", "Cost per input/output token as a relevant metric became obsolete last year; <b class=\"em\">if you haven't updated the x-axis to cost per task,</b> it's no longer credible by Artificial Analysis standards. <span style=\"color:#8fa0b3\">Trading Implication: Metric shifts will reshape the competitive landscape for inference chip cost-effectiveness, <b class=\"em\">favoring architectures that optimize task-level costs</b></span>"], ["@jaminball", "", "Kimi K3 weights are now open-source; Baseten and Fireworks both price at $3 per million input tokens and $15 per million output tokens, with a blended cost of $5.40, matching Kimi's direct pricing. <span style=\"color:#8fa0b3\">Trading Implication: Inference service prices are converging; differentiation shifts to task efficiency rather than pure token cost</span>"]]]]]]}, "tweets": [{"h": "RaoulGMI", "tier": 1, "b": "macro", "t": "2026-07-27 20:09", "x_zh": "比特币与全球流动性的相关性为87%，纳斯达克为97%。这告诉你大多数人从未意识到的事情：这些资产并非真正根据盈利、新闻或当周热点在交易，它们追踪的是系统中的货币总量。", "x_en": "Bitcoin is 87% correlated to global liquidity. The NASDAQ is 97% correlated.\n\nWhich tells you something most people never realise. These assets are not really trading on earnings, or news, or whatever the story of the week is. They’re tracking the amount of money in the system.", "u": "https://x.com/RaoulGMI/status/2081834392440225908", "lk": 1727, "rt": 164, "rp": 155, "eng": 2046, "lang": "en", "tags": ["macro", "crypto", "long_cycle"]}, {"h": "chamath", "tier": 1, "b": "macro", "t": "2026-07-27 21:07", "x_zh": "你还在担心蒸馏？如果这是真的，那太可悲了。代币发行放缓会阻止这种疯狂。", "x_en": "And you’re worried about distillation?\n\nThis is sad if true. A slowdown in tokenmaxxing would stop this madness.", "u": "https://x.com/chamath/status/2081848871219581153", "lk": 1825, "rt": 124, "rp": 87, "eng": 2036, "lang": "en", "tags": ["macro", "equities", "technology"]}, {"h": "RaoulGMI", "tier": 1, "b": "macro", "t": "2026-07-27 18:20", "x_zh": "我不知道他们对Opus 5做了什么，但这绝对是一个烂摊子般的模型。它不停地犯错，陷入死胡同，无法完成任务，还会创建你从未要求的新任务，最终陷入无限循环。真是一团糟。@AnthropicAI", "x_en": "I don't know what the hell they did with Opus 5 but it's an absolute shitshow of a model. It just endlessly makes mistakes, goes off down rabbit holes, doesn't finish tasks. Creates new tasks you never asked it for and just ends up in an endless loop. It's a mess. \n@AnthropicAI", "u": "https://x.com/RaoulGMI/status/2081807030826705146", "lk": 1587, "rt": 81, "rp": 301, "eng": 1969, "lang": "en", "tags": ["macro", "crypto", "long_cycle"]}, {"h": "LawrenceLepard", "tier": 2, "b": "macro", "t": "2026-07-27 20:44", "x_zh": "我的好朋友，比特币持有者、顶级宏观分析师、医学博士兼基金经理回来了。值得关注。", "x_en": "My good friend, Bitcoiner and top tier macro analyst, medical doctor and fund manager is back.  Worth a follow.", "u": "https://x.com/LawrenceLepard/status/2081843261195309121", "lk": 1745, "rt": 61, "rp": 65, "eng": 1871, "lang": "en", "tags": ["macro", "gold", "hard_assets"]}, {"h": "jimcramer", "tier": 1, "b": "macro", "t": "2026-07-27 15:21", "x_zh": "当出现今早半导体板块这样的反转时，很难在日内逆转跌势，因为卖家往往规模庞大、动机明确且常带杠杆，所以他们必须离场。", "x_en": "When you have reversals like you have in the semis this morning, it is very difficult to reverse the downturn intraday as the sellers tend to be monstrous, motivated and often margined. So they have to get out", "u": "https://x.com/jimcramer/status/2081761867832152510", "lk": 910, "rt": 96, "rp": 177, "eng": 1183, "lang": "en", "tags": ["macro", "equities", "teacher_required"]}, {"h": "LukeGromen", "tier": 1, "b": "macro", "t": "2026-07-27 20:48", "x_zh": "“这仅仅是前奏……他们烧书的地方，最终也会烧人。”——海因里希·海涅（1797-1856）", "x_en": "“It was just the prelude… Where they burn books, they will ultimately burn people too.” \n\nHeinrich Heine (1797-1856)", "u": "https://x.com/LukeGromen/status/2081844157383876973", "lk": 783, "rt": 122, "rp": 39, "eng": 944, "lang": "en", "tags": ["macro", "sovereign_debt", "commodities"]}, {"h": "chamath", "tier": 1, "b": "macro", "t": "2026-07-28 06:54", "x_zh": "大麻令人作呕。经常使用是通往愚蠢和失败的单行道。出去走走，喝杯酒，社交一下，晒晒太阳，打个优步。完毕。", "x_en": "Marijuana is disgusting. Regular use is a one way door to becoming a retard and a loser. \n\nGo out. Have a glass of wine. Be social. Get some sun. Take an uber. Fin.", "u": "https://x.com/chamath/status/2081996815549788479", "lk": 704, "rt": 48, "rp": 161, "eng": 913, "lang": "en", "tags": ["macro", "equities", "technology"]}, {"h": "jimcramer", "tier": 1, "b": "macro", "t": "2026-07-27 14:13", "x_zh": "英伟达的成交量支持下跌。我想说，如果没有融资问题，英伟达的股票本应飙升。但对市场而言，唯一重要的是融资，以及它如何因2000年的记忆而对英伟达产生负面影响。", "x_en": "the volume in Nvidia supports the decline.. I would say if there were no financing involved Nvidia's stock would be soaring. All that matters to the market, though, is the financing and how Nvidia it will impact Nvidia negatively BECAUSE of memories of 2000", "u": "https://x.com/jimcramer/status/2081744861162619252", "lk": 616, "rt": 31, "rp": 135, "eng": 782, "lang": "en", "tags": ["macro", "equities", "teacher_required"]}, {"h": "CathieDWood", "tier": 1, "b": "macro", "t": "2026-07-28 03:03", "x_zh": "星舰成功溅落对#SpaceX来说或许是改变游戏规则的消息；然而，该股今天进一步跌破其IPO价格。股市正在攀爬“忧虑之墙”。牛市不会以这种方式结束。它们会在每个人都相信天空才是极限时结束！", "x_en": "Starship’s successful splashdown was perhaps game-changing news for #SpaceX; yet, the stock dropped further below its IPO price today. The equity market is climbing a “wall of worry”. Bull markets do not end in this way. They end when everyone believes the sky is the limit!", "u": "https://x.com/CathieDWood/status/2081938556889550991", "lk": 594, "rt": 49, "rp": 72, "eng": 715, "lang": "en", "tags": ["macro", "equities", "innovation"]}, {"h": "jimcramer", "tier": 1, "b": "macro", "t": "2026-07-28 01:07", "x_zh": "SK Hijinx确实不负其新绰号。他们的股东是谁？送他们去DraftKings上几堂投资课吧。", "x_en": "SK Hijinx really living up to its new moniker. Who are their shareholders? Send them to DraftKings for some investing lessons", "u": "https://x.com/jimcramer/status/2081909447736057923", "lk": 556, "rt": 47, "rp": 98, "eng": 701, "lang": "en", "tags": ["macro", "equities", "teacher_required"]}, {"h": "jimcramer", "tier": 1, "b": "macro", "t": "2026-07-27 13:44", "x_zh": "非半导体的科技股 vs 英伟达。英伟达第一国民银行开始真正让人抓狂了……", "x_en": "Tech that's not semi v. Nvidia. First National Bank of Nvidia is starting to really cause people to freak out...", "u": "https://x.com/jimcramer/status/2081737560456364258", "lk": 481, "rt": 28, "rp": 95, "eng": 604, "lang": "en", "tags": ["macro", "equities", "teacher_required"]}, {"h": "TaviCosta", "tier": 1, "b": "macro", "t": "2026-07-28 01:05", "x_zh": "第四次转折。他作为政治家的崛起是我在过去十年中看到的最令人担忧的发展之一。", "x_en": "The Fourth Turning.\n\nHis rise as a politician has been one of the most concerning developments I’ve seen in the last decade.", "u": "https://x.com/TaviCosta/status/2081908759392043411", "lk": 447, "rt": 37, "rp": 70, "eng": 554, "lang": "en", "tags": ["macro", "commodities", "cycle"]}, {"h": "LizAnnSonders", "tier": 1, "b": "macro", "t": "2026-07-27 13:03", "x_zh": "我从今天开始休假，到8月7日基本不会上X。祝大家两周愉快。", "x_en": "I’m on vacation starting today and I’ll be generally off X through August 7. Have a great two weeks everyone.", "u": "https://x.com/LizAnnSonders/status/2081727065968292310", "lk": 497, "rt": 8, "rp": 33, "eng": 538, "lang": "en", "tags": ["macro", "equities", "sellside"]}, {"h": "chamath", "tier": 1, "b": "macro", "t": "2026-07-27 21:55", "x_zh": "对愚蠢的代币最大化者来说简直是异端邪说……", "x_en": "Heresy to the buffoon tokenmaxxers…", "u": "https://x.com/chamath/status/2081861129471475982", "lk": 475, "rt": 21, "rp": 32, "eng": 528, "lang": "en", "tags": ["macro", "equities", "technology"]}, {"h": "jimcramer", "tier": 1, "b": "macro", "t": "2026-07-27 13:15", "x_zh": "今天市场试图弄清楚一个后盾是好是坏，一份合同是真实的还是短暂的，或者我们是否应该只持有3M。", "x_en": "Today market trying to figure out if a backstop is good or bad, that a contract is real or ephemeral or should we just own 3M", "u": "https://x.com/jimcramer/status/2081730257556553816", "lk": 360, "rt": 20, "rp": 82, "eng": 462, "lang": "en", "tags": ["macro", "equities", "teacher_required"]}, {"h": "LawrenceLepard", "tier": 2, "b": "macro", "t": "2026-07-27 17:18", "x_zh": "别担心Don，Kevin知道。", "x_en": "Not to worry Don, Kevin knows.", "u": "https://x.com/LawrenceLepard/status/2081791262336651477", "lk": 394, "rt": 19, "rp": 37, "eng": 450, "lang": "en", "tags": ["macro", "gold", "hard_assets"]}, {"h": "jimcramer", "tier": 1, "b": "macro", "t": "2026-07-27 19:12", "x_zh": "企业软件这边有点棘手... ServiceNow 应该给多少倍估值？Workday 呢？", "x_en": "Struggling with enterprise software here... What multiple should ServiceNow have? How about Workday?", "u": "https://x.com/jimcramer/status/2081819982745219325", "lk": 273, "rt": 25, "rp": 114, "eng": 412, "lang": "en", "tags": ["macro", "equities", "teacher_required"]}, {"h": "jimcramer", "tier": 1, "b": "macro", "t": "2026-07-28 01:28", "x_zh": "科技股表现不佳的一个被低估的原因。对我们市场来说简直是噩梦般的补充。", "x_en": "Under-rated reason for tech under-performance. Nightmare addition to our markets", "u": "https://x.com/jimcramer/status/2081914554091487254", "lk": 286, "rt": 16, "rp": 79, "eng": 381, "lang": "en", "tags": ["macro", "equities", "teacher_required"]}, {"h": "CathieDWood", "tier": 1, "b": "macro", "t": "2026-07-28 03:17", "x_zh": "你美丽而永恒，@mayemusk！对于那些像你一样，拥有健康、充满挑战和有趣的生活，并有爱你的孩子和伴侣的人来说，七十岁是崇高的。你是我们的灵感源泉。", "x_en": "You are beautiful and timeless, \n@mayemusk\n! For those who have lived healthy, challenging, and interesting lives with loving children and partners, like you have, the seventies are sublime. You are an inspiration.", "u": "https://x.com/CathieDWood/status/2081942063533138042", "lk": 292, "rt": 17, "rp": 31, "eng": 340, "lang": "en", "tags": ["macro", "equities", "innovation"]}, {"h": "chamath", "tier": 1, "b": "macro", "t": "2026-07-27 11:59", "x_zh": "8090年代的软件工厂是统一控制平面，将大型企业的产品和工程组织转变为自我改进的机器。\n\n- 它集中了上下文。\n- 它为整个产品组织提供了代理框架，而不仅仅是一个仓库。\n- 它", "x_en": "8090's Software Factory is the unified control plane that turns product and engineering organizations of large enterprises into a self-improving machine.\n\n- It centralizes context.\n- It provides an agent harness for an entire product organization, not just a repository.\n- It", "u": "https://x.com/chamath/status/2081711144834633819", "lk": 259, "rt": 13, "rp": 47, "eng": 319, "lang": "en", "tags": ["macro", "equities", "technology"]}, {"h": "charliebilello", "tier": 2, "b": "macro", "t": "2026-07-27 19:57", "x_zh": "谷歌第二季度盈利1120亿美元，创下任何公司历史上最高的季度净利润。\n\n但财报发布后其股价下跌了7%。\n\n为什么？\n\nAI支出担忧，谷歌自由现金流首次转为负值。\n\n视频：\nhttps://youtube.com/watch?v=6gkWRdPujf8&t=46s\n...", "x_en": "Google earned $112 billion in Q2, the highest quarterly net income for any company in history.\n\nBut its stock fell 7% the day after its earnings report.\n\nWhy?\n\nAI spending concerns, with Google's free cash flow turning negative for the first time.\n\nVideo: \nhttps://\nyoutube.com/watch?v=6gkWRd\nPujf8&t=46s\n…", "u": "https://x.com/charliebilello/status/2081831466175205815", "lk": 239, "rt": 48, "rp": 20, "eng": 307, "lang": "en", "tags": ["macro", "data", "markets"]}, {"h": "HenrikZeberg", "tier": 1, "b": "macro", "t": "2026-07-27 15:26", "x_zh": "市场回调——很快将转变为另一轮强劲的牛市起飞。\n\n股票目前正在从2026年3月低点强劲反弹后稍作喘息。这不是顶部。强劲的反弹即将开始...\n\n在此观看更新：\n\nhttps://open.substack.com/pub/henrikzeberg/p/market-correction-soon-to-turn-into?r=ole86&utm_campaign=post&utm_medium=web&showWelcomeOnShare=true\n...", "x_en": "Market Correction - soon to turn into another powerful Bull take-off. \n\nEquities are currently taking a breather after the strong rally out of the March 2026 bottom. It is NOT the Top. A strong rally will begin...\n\nWatch the Update here:\n\nhttps://\nopen.substack.com/pub/henrikzebe\nrg/p/market-correction-soon-to-turn-into?r=ole86&utm_campaign=post&utm_medium=web&showWelcomeOnShare=true\n…", "u": "https://x.com/HenrikZeberg/status/2081763217856950495", "lk": 254, "rt": 15, "rp": 5, "eng": 274, "lang": "en", "tags": ["macro", "technical", "cross_asset"]}, {"h": "LawrenceLepard", "tier": 2, "b": "macro", "t": "2026-07-27 20:55", "x_zh": "我祖父和父亲有个说法让我想起这个：\n\n“如果愿望是马，乞丐也能骑。”", "x_en": "My grandfather and father had an expression this reminds me of:\n\n“If wishes were horses then beggars would ride.”", "u": "https://x.com/LawrenceLepard/status/2081845879544119316", "lk": 221, "rt": 13, "rp": 26, "eng": 260, "lang": "en", "tags": ["macro", "gold", "hard_assets"]}, {"h": "jimcramer", "tier": 1, "b": "macro", "t": "2026-07-27 18:43", "x_zh": "要理解表面下正在发生的事情，只需阅读Bing West的《CAT 5》。", "x_en": "To understand what's happening underneath, just read CAT 5 by Bing West", "u": "https://x.com/jimcramer/status/2081812851950293167", "lk": 200, "rt": 9, "rp": 51, "eng": 260, "lang": "en", "tags": ["macro", "equities", "teacher_required"]}, {"h": "biancoresearch", "tier": 1, "b": "macro", "t": "2026-07-27 22:22", "x_zh": "市场定价今日收盘时隐含加息概率为38%，因此与Citadel的预期相差不远。", "x_en": "Market pricing closed today with a 38% probability of a hike, so it is not that far from Citadel.\n\n\nhttps://\nx.com/biancoresearch\n/status/2081746046212870634?s=20\n…", "u": "https://x.com/biancoresearch/status/2081867832552194401", "lk": 187, "rt": 19, "rp": 34, "eng": 240, "lang": "en", "tags": ["macro", "rates_fx", "bonds"]}, {"h": "charliebilello", "tier": 2, "b": "macro", "t": "2026-07-27 17:51", "x_zh": "存储芯片制造商CXMT首日暴涨466%后，市值达4840亿美元，成为中国大陆市值最高的上市公司。泡沫？什么泡沫？", "x_en": "After a 466% first-day pop, memory-chip maker CXMT is worth $484 billion - making it the most valuable company listed in mainland China.\n\nBubble? What bubble?", "u": "https://x.com/charliebilello/status/2081799748680360374", "lk": 163, "rt": 23, "rp": 30, "eng": 216, "lang": "en", "tags": ["macro", "data", "markets"]}, {"h": "McClellanOsc", "tier": 2, "b": "macro", "t": "2026-07-27 19:52", "x_zh": "NDX的下行测量目标约为27,200点，即较当前再跌约3%。当这一目标实现时，我们应通过纳斯达克100股票的McClellan A-D振荡器出现一个漂亮的超卖读数来寻求确认。", "x_en": "Downside measuring objective for the NDX is about 27,200, so down another ~3% from here. When that arrives, we should look for , "x_en": "Coming back from another field research trip to Ukraine. Had great conversations with commanders of the more innovative drone-assault units: Oleksandr “Flint” Nastenko of Code 9.2, 475th Regiment, and Dmytro “Perun” Filatov of 1st Separate Assault Regiment. More to follow.", "u": "https://x.com/KofmanMichael/status/2081760006886642007", "lk": 823, "rt": 67, "rp": 10, "eng": 900, "lang": "en", "tags": ["geopolitics", "russia", "military"]}, {"h": "ianbremmer", "tier": 1, "b": "geopolitics", "t": "2026-07-27 16:51", "x_zh": "自伊朗战争开始以来，美国人额外增加了730亿美元的燃料成本……即每户562美元。", "x_en": "$73 billion in additional fuel costs for americans since the start of the iran war…or $562 per household.", "u": "https://x.com/ianbremmer/status/2081784609478418929", "lk": 411, "rt": 127, "rp": 23, "eng": 561, "lang": "en", "tags": ["geopolitics", "political_risk", "global_macro"]}, {"h": "michaeldweiss", "tier": 2, "b": "geopolitics", "t": "2026-07-27 20:04", "x_zh": "Dreher多年来一直由Viktor Orban的政府资助，而特朗普政府全力支持该政府，结果几个月前却非常尴尬。我很愿意接受这样的想法：Vance想与新纳粹和反犹分子保持友好关系，以利于他的……", "x_en": "Dreher was funded for years by Viktor Orban’s government, which the Trump administration backed to the hilt, only to be hugely embarrassed a few months ago. I’m perfectly willing to entertain the idea that Vance wants to stay chummy with neo-Nazis and anti-Semites to benefit his", "u": "https://x.com/michaeldweiss/status/2081833085549605264", "lk": 372, "rt": 88, "rp": 20, "eng": 480, "lang": "en", "tags": ["geopolitics", "russia", "middle_east"]}, {"h": "BarakRavid", "tier": 1, "b": "geopolitics", "t": "2026-07-27 22:19", "x_zh": "以色列总理内塔尼亚胡及其代表团刚刚抵达华盛顿，以色列总理办公室表示。", "x_en": "Prime Minister Netanyahu and his delegation have just landed in Washington, Israeli prime minister's office said", "u": "https://x.com/BarakRavid/status/2081867010615427365", "lk": 359, "rt": 60, "rp": 55, "eng": 474, "lang": "en", "tags": ["geopolitics", "middle_east", "diplomacy"]}, {"h": "ianbremmer", "tier": 1, "b": "geopolitics", "t": "2026-07-27 17:25", "x_zh": "特朗普赌经济痛苦会迫使伊朗退缩。德黑兰赌美国不会承受这些代价。", "x_en": "trump is betting\neconomic pain will force iran to back down.\ntehran is betting\nthe us won't tolerate the costs.\n\n@gzeromedia", "u": "https://x.com/ianbremmer/status/2081793099982889442", "lk": 233, "rt": 32, "rp": 15, "eng": 280, "lang": "en", "tags": ["geopolitics", "political_risk", "global_macro"]}, {"h": "michaeldweiss", "tier": 2, "b": "geopolitics", "t": "2026-07-27 20:50", "x_zh": "特朗普现在在推广一条称Tucker Carlson为反犹分子的推文。", "x_en": "Trump now boosting a tweet calling Tucker Carlson an anti-Semite.", "u": "https://x.com/michaeldweiss/status/2081844823166763051", "lk": 219, "rt": 34, "rp": 9, "eng": 262, "lang": "en", "tags": ["geopolitics", "russia", "middle_east"]}, {"h": "BarakRavid", "tier": 1, "b": "geopolitics", "t": "2026-07-28 00:27", "x_zh": "以色列、黎巴嫩和美国预计下周将在罗马举行会谈，讨论可能扩大以色列在黎巴嫩南部的军事重新部署进程，并商讨两国间的陆地边界争端，一位国务院官员表示。接下来", "x_en": "Israel, Lebanon and the U.S. are expected to hold talks next week in Rome on potentially expanding the process of Israeli military redeployment in Southern Lebanon and discuss the land border disputes between the countries, a State Department official said  \nThe next", "u": "https://x.com/BarakRavid/status/2081899364809662508", "lk": 170, "rt": 39, "rp": 26, "eng": 235, "lang": "en", "tags": ["geopolitics", "middle_east", "diplomacy"]}, {"h": "BarakRavid", "tier": 1, "b": "geopolitics", "t": "2026-07-27 18:41", "x_zh": "特朗普表示，他决定暂停周五的袭击行动，因为在美伊之间以及中东其他国家之间斡旋的国家请求他再给谈判一次机会。\n“所有参与与伊朗接触的人都对我说：‘别开火，’”特朗普说，他强调在他看来，伊朗人想要达成协议。", "x_en": "Trump said he decided to suspend Friday's strike operation because countries mediating between the US and Iran, as well as other nations in the Middle East, asked him to give negotiations another chance. \"Everyone involved in engaging with Iran told me: 'Don't fire,'\" Trump said, emphasizing that in his view, the Iranians want to reach a deal.", "u": "https://x.com/BarakRavid/status/2081812287988310064", "lk": 130, "rt": 15, "rp": 31, "eng": 176, "lang": "zh", "tags": ["geopolitics", "middle_east", "diplomacy"]}, {"h": "BarakRavid", "tier": 1, "b": "geopolitics", "t": "2026-07-28 00:21", "x_zh": "以色列、黎巴嫩和美国预计将于下周在罗马举行会谈，讨论扩大以色列国防军在黎巴嫩南部重新部署进程，并就两国之间的陆地边界争议进行讨论，美国国务院一位高级官员向我透露了这一消息。\n\n 下轮由美国主导、以色列和黎巴嫩参与的会谈将于8月4日至6日在罗马举行。", "x_en": "Israel, Lebanon, and the US are expected to hold talks in Rome next week to discuss expanding the redeployment process of the Israel Defense Forces in southern Lebanon and to address disputes over the land border between the two countries, a senior US State Department official told me. The next round of US-led talks involving Israel and Lebanon will take place in Rome from August 4 to 6.", "u": "https://x.com/BarakRavid/status/2081897877664653369", "lk": 125, "rt": 12, "rp": 15, "eng": 152, "lang": "zh", "tags": ["geopolitics", "middle_east", "diplomacy"]}, {"h": "Charles_Lister", "tier": 2, "b": "geopolitics", "t": "2026-07-27 22:09", "x_zh": "此外，@AJSyriaNowN 报道称，#土耳其总统 #埃尔多安 很快将与 #SDF 领导层会面——这是该运动正式解散前的一个象征性初步步骤。", "x_en": "To add to this, \n@AJSyriaNowN\n is now reporting that #Turkey's President #Erdogan will soon meet with the #SDF leadership -- in a symbolic first step ahead of the movement's formal dissolution.", "u": "https://x.com/Charles_Lister/status/2081864605148545096", "lk": 108, "rt": 15, "rp": 3, "eng": 126, "lang": "en", "tags": ["geopolitics", "middle_east", "syria"]}, {"h": "ianbremmer", "tier": 1, "b": "geopolitics", "t": "2026-07-27 21:01", "x_zh": "胡塞武装不仅仅是在执行伊朗的命令。他们正在推进自己的谈判、自己的筹码和自己的战争。@gzeromedia", "x_en": "the houthis aren't just doing iran's bidding.\nthey're pursuing their own negotiations,\ntheir own leverage, and their own war.\n\n@gzeromedia", "u": "https://x.com/ianbremmer/status/2081847564605759878", "lk": 89, "rt": 14, "rp": 7, "eng": 110, "lang": "en", "tags": ["geopolitics", "political_risk", "global_macro"]}, {"h": "DerekJGrossman", "tier": 1, "b": "geopolitics", "t": "2026-07-28 02:37", "x_zh": "“印度政府对中国关于上周三外长苏杰生与王毅外长会晤的通报感到愤怒，该通报称新德里接受了北京对西藏的领土主张。”", "x_en": "\"The Indian government angrily reacted to a Chinese read-out of last Wednesday’s meeting between External Affairs Minister S. Jaishankar and Foreign Minister Wang Yi that claimed New Delhi accepted Beijing’s territorial claims over Tibet.\"", "u": "https://x.com/DerekJGrossman/status/2081931976567882155", "lk": 81, "rt": 19, "rp": 9, "eng": 109, "lang": "en", "tags": ["geopolitics", "indo_pacific", "security"]}, {"h": "PeterLBrandt", "tier": 1, "b": "commodities", "t": "2026-07-27 12:49", "x_zh": "没有人比阿克塞尔做得更好。他是我股票投资思路的主要来源。", "x_en": "Nobody does it better than Aksel. He is my main source for ideas in equities", "u": "https://x.com/PeterLBrandt/status/2081723640161476841", "lk": 558, "rt": 8, "rp": 24, "eng": 590, "lang": "en", "tags": ["commodities", "technical", "trader"]}, {"h": "PeterLBrandt", "tier": 1, "b": "commodities", "t": "2026-07-27 22:52", "x_zh": "以重叠方式考虑交易，在1000笔交易中，如果你的胜率甚至只有50%，会有大约135次连续出现你最近10笔交易中有8笔亏损的情况。那些大牌YouTuber从未告诉过你这一点，对吧？", "x_en": "Considering trades on an overlapping basis, in 1,000 trades there will be about 135 stretches whereby 8 of your last 10 trades were losers if your win rate is even 50%. No big shot You-Tubers ever told you about this, did they?", "u": "https://x.com/PeterLBrandt/status/2081875483290218711", "lk": 255, "rt": 11, "rp": 20, "eng": 286, "lang": "en", "tags": ["commodities", "technical", "trader"]}, {"h": "JavierBlas", "tier": 1, "b": "commodities", "t": "2026-07-28 06:50", "x_zh": "更多油轮（VLCC）正驶向埃及，以装载沙特原油（通过一条绕过红海的旁通管道），而非经由红海。绕行非洲的航程单程增加了25天。这是一条昂贵的绕行路线，但有效，目前保证了沙特石油的流动。", "x_en": "More oil tankers (VLCCs) are heading toward Egypt to pick up Saudi crude (via a bypass pipeline for the bypass pipeline), rather than the Red Sea. The voyage around Africa adds 25 days extra (each way). It's an expensive detour, but it works, keeping Saudi oil flowing for now.", "u": "https://x.com/JavierBlas/status/2081995793225888135", "lk": 217, "rt": 51, "rp": 13, "eng": 281, "lang": "en", "tags": ["commodities", "oil_energy", "supply_demand"]}, {"h": "PeterLBrandt", "tier": 1, "b": "commodities", "t": "2026-07-27 22:15", "x_zh": "通常我最适合交易的形态是那些在不同结构名称下以二元方式设置的形态——要么飙升，要么暴跌。", "x_en": "Usually the best patterns for me to trade are those that under different structural names are set up in a binary way -- to spike up or down", "u": "https://x.com/PeterLBrandt/status/2081866092910375142", "lk": 206, "rt": 5, "rp": 16, "eng": 227, "lang": "en", "tags": ["commodities", "technical", "trader"]}, {"h": "chigrl", "tier": 1, "b": "commodities", "t": "2026-07-27 22:11", "x_zh": "纽约市将开设政府运营的杂货店，承诺农产品、牛奶、肉类和面包提供30%折扣。对于任何倡导这项灾难性立法的人，这项提案本应帮助的阶层最终将受到最严重的打击。", "x_en": "NYC will now open government run grocery stores with the promise of 30% discounts on produce, milk, meat, and bread. \n\nFor anyone advocating for this disaster legislation, the classes that this proposes to help will be hit the hardest in the end.", "u": "https://x.com/chigrl/status/2081865191583539391", "lk": 194, "rt": 18, "rp": 11, "eng": 223, "lang": "en", "tags": ["commodities", "oil_energy", "metals"]}, {"h": "chigrl", "tier": 1, "b": "commodities", "t": "2026-07-27 23:00", "x_zh": "美国建立在一个特定的哲学体系之上，这是其他国家从未尝试过编纂的。其中最重要的一点是：有限政府，权力列举。", "x_en": "The United States was founded on a specific philosophical package that no other country had ever tried to codify. \nThe big one being: Limited government with enumerated powers", "u": "https://x.com/chigrl/status/2081877433578397931", "lk": 155, "rt": 15, "rp": 2, "eng": 172, "lang": "en", "tags": ["commodities", "oil_energy", "metals"]}, {"h": "JavierBlas", "tier": 1, "b": "commodities", "t": "2026-07-28 05:20", "x_zh": "美国与伊朗之间的战争-停火-谅解备忘录-战争-事实上的停火已经持续了150天。当然，我不是在数日子。", "x_en": "The U.S.-Iran war-cease-fire-MoU-war-again-de-facto-ceasefire has gone on now for 150 days. Not that I’m counting, of course.", "u": "https://x.com/JavierBlas/status/2081973115626643680", "lk": 138, "rt": 10, "rp": 7, "eng": 155, "lang": "en", "tags": ["commodities", "oil_energy", "supply_demand"]}, {"h": "chigrl", "tier": 1, "b": "commodities", "t": "2026-07-27 20:11", "x_zh": "NVDA今日收盘下跌超过5%>>>英伟达信用风险在互换市场因AI交易谈判而飙升。周一，保护英伟达公司债务免于违约的成本创下纪录最大涨幅，此前有报道称这家芯片制造商正在就超过7500亿美元的", "x_en": "NVDA closes down over 5% today>>> \n\nNvidia Credit Risk Jumps in Swaps Market on AI Deal Talks\n\nThe cost of protecting Nvidia Corp.’s debt against default surged by the most on record Monday, after reports of the chipmaker being in conversations on more than $750 billion of", "u": "https://x.com/chigrl/status/2081834803142570319", "lk": 100, "rt": 26, "rp": 6, "eng": 132, "lang": "en", "tags": ["commodities", "oil_energy", "metals"]}, {"h": "chigrl", "tier": 1, "b": "commodities", "t": "2026-07-27 21:16", "x_zh": "不是我糟糕的打字导致错别字，是我键盘上的猫。", "x_en": "Its not my terrible typing causing typos, it is the cat on my keyboard.", "u": "https://x.com/chigrl/status/2081851343841436092", "lk": 93, "rt": 1, "rp": 10, "eng": 104, "lang": "en", "tags": ["commodities", "oil_energy", "metals"]}, {"h": "AndrewYNg", "tier": 2, "b": "ai_semis", "t": "2026-07-27 17:01", "x_zh": "黄仁勋的举动很好。英伟达的信写得很好，值得一读。正如我们在OpenAI-Hugging Face黑客事件中看到的，我们需要开放模型和防御工具。让我们停止相信封闭模型更安全的公关宣传——那只是监管俘获。", "x_en": "Good move by \n@JensenHuang\n. The Nvidia letter is well written and worth reading. As we saw with the OpenAI-Hugging Face hack, we need open models and harnesses for defense. \n\nLets stop believing the PR that closed models are safer. - that's just regulatory capture.", "u": "https://x.com/AndrewYNg/status/2081787106062746002", "lk": 3573, "rt": 369, "rp": 116, "eng": 4058, "lang": "en", "tags": ["ai_semis", "ai_research", "enterprise_ai"]}, {"h": "fchollet", "tier": 2, "b": "ai_semis", "t": "2026-07-27 20:16", "x_zh": "在科学中，你必须报告那些不成功的实验，而不仅仅是成功的。人工智能也是如此。（我希望如此。）", "x_en": "In science, you have to report the experiments that didn't work, not just the ones that did. Same with AI. (I wish.)", "u": "https://x.com/fchollet/status/2081836094044168339", "lk": 916, "rt": 68, "rp": 70, "eng": 1054, "lang": "en", "tags": ["ai_semis", "ai_research", "models"]}, {"h": "gdb", "tier": 2, "b": "ai_semis", "t": "2026-07-27 23:00", "x_zh": "上周，我们向企业推出了ChatGPT Work。这是一个很棒的产品。因此，对于ChatGPT Enterprise客户，请在8月21日前注册，每位在两周内首次尝试Work的团队成员将获得最高200美元的积分，有效期14天。已经是客户了？", "x_en": "Last week, we made ChatGPT Work available to enterprises. It's an awesome product.\n\nSo for ChatGPT Enterprise customers, enroll by August 21, and each teammate who tries Work for the first time within two weeks gets up to $200 in credits, valid for 14 days.\n\nAlready a customer?", "u": "https://x.com/gdb/status/2081877298538746165", "lk": 635, "rt": 54, "rp": 71, "eng": 760, "lang": "en", "tags": ["ai_semis", "ai", "executive"]}, {"h": "bgurley", "tier": 2, "b": "ai_semis", "t": "2026-07-27 14:53", "x_zh": "“开放”项目本质上已经比专有大型公司掌握所有牌局的情况更安全。更多眼睛、更多透明度、更多分析。这种合作——多家公司共同致力于确保AI安全——正是正确的举措。这是", "x_en": "\"Open\" projects are already inherently safer than situations where proprietary large companies hold all the cards. More eyes, more transparency, more analysis.\n\nThis collaboration - multiple companies all working to ensure AI safety together - is the exact right move. \n\nThis is", "u": "https://x.com/bgurley/status/2081754784843919580", "lk": 503, "rt": 59, "rp": 24, "eng": 586, "lang": "en", "tags": ["ai_semis", "venture", "technology"]}, {"h": "natolambert", "tier": 2, "b": "ai_semis", "t": "2026-07-27 23:07", "x_zh": "我读了Anthropic关于开放权重模型的那篇文章，尽管里面没有新内容，但这是对他们立场的合理重复，这个网站将在接下来的12小时内集体失去理智。附注：禁止蒸馏仍然很愚蠢。", "x_en": "I read the Anthropic open-weight model piece and despite there being nothing new in it, it was a reasonable repeat of their positions, this site will collectively lose their minds for the next 12 hours.\n\np.s. banning distillation is still dumb.", "u": "https://x.com/natolambert/status/2081879291877581117", "lk": 506, "rt": 27, "rp": 45, "eng": 578, "lang": "en", "tags": ["ai_semis", "ai_research", "models"]}, {"h": "natolambert", "tier": 2, "b": "ai_semis", "t": "2026-07-27 17:11", "x_zh": "伙计们，我们做到了，最好的时间线，模型许可证推文火了。我的时刻。", "x_en": "Guys we made it, the best timeline, model license tweets go VIRAL. My moment.", "u": "https://x.com/natolambert/status/2081789467640336437", "lk": 278, "rt": 8, "rp": 7, "eng": 293, "lang": "en", "tags": ["ai_semis", "ai_research", "models"]}, {"h": "swyx", "tier": 2, "b": "ai_semis", "t": "2026-07-28 00:47", "x_zh": "顺便说一句，每输入/输出代币的成本作为相关衡量标准在去年某个时候已经失效了。如果你还没有按照@ArtificialAnlys的建议将x轴更新为每任务成本，那么我不知道如今你是否还能被认真对待。", "x_en": "incidentally, $ per input/output tokens died as a relevant cost measure sometime last year\n\nif you haven’t updated your x axes to $/task per \n@ArtificialAnlys\n then idk if you can be taken seriously anymore these days", "u": "https://x.com/swyx/status/2081904230768816487", "lk": 126, "rt": 10, "rp": 35, "eng": 171, "lang": "en", "tags": ["ai_semis", "ai_engineering", "developer"]}, {"h": "jaminball", "tier": 2, "b": "ai_semis", "t": "2026-07-27 19:52", "x_zh": "Kimi K3权重已发布，第三方提供该模型服务的定价也已公布。Baseten和Fireworks的定价均为每百万输入代币3美元，每百万输出代币15美元。混合成本为5.40美元。这个定价与Kimi直接提供的相同。有很多", "x_en": "Kimi K3 weights are out, and so is the pricing from 3rd parties to serve the model. \n\nPricing from both Baseten and Fireworks is $3 / 1m input tokens, and $15 / 1m output tokens. This is $5.40 blended. \n\nThe pricing is the same that Kimi offers directly. There was lots of", "u": "https://x.com/jaminball/status/2081829990015127743", "lk": 135, "rt": 10, "rp": 19, "eng": 164, "lang": "en", "tags": ["ai_semis", "software", "tech_equities"]}, {"h": "danielnewmanUV", "tier": 2, "b": "ai_semis", "t": "2026-07-28 02:41", "x_zh": "我不敢相信市场卖出了这个。中国只生产了DUV的一小部分。", "x_en": "I can’t believe the market sold this. China making a tiny fraction of the DUV.", "u": "https://x.com/danielnewmanUV/status/2081933130085376077", "lk": 114, "rt": 5, "rp": 12, "eng": 131, "lang": "en", "tags": ["ai_semis", "enterprise_tech", "semiconductors"]}, {"h": "fchollet", "tier": 2, "b": "ai_semis", "t": "2026-07-27 15:58", "x_zh": "非常有趣的概念——不是针对静态基准或内部生成的奖励模型进行优化，而是通过真实的经济互动来评估智能体。使用外部市场作为奖励信号的一部分，从根本上改变了优化问题。", "x_en": "Really interesting concept -- instead of optimizing against static benchmarks or internally generated reward models, agents are evaluated through real economic interactions. Using an external market as part of the reward signal changes the optimization problem in a fundamental", "u": "https://x.com/fchollet/status/2081771242609168883", "lk": 87, "rt": 19, "rp": 19, "eng": 125, "lang": "en", "tags": ["ai_semis", "ai_research", "models"]}, {"h": "natolambert", "tier": 2, "b": "ai_semis", "t": "2026-07-27 18:31", "x_zh": "与AI智能体进行对话太棒了。我刚刚让Fable用我们一个参考Olmo 2模型的KL距离的真实数据制作了一张幻灯片，它用wandb API生成了这个（我稍微编辑了文字）。", "x_en": "Making talks with AI agents is awesome. I just told Fable to make a slide with real data on the KL distance from one of our reference Olmo 2 models and it made this with the wandb api (I edited text slightly).", "u": "https://x.com/natolambert/status/2081809676271026533", "lk": 86, "rt": 10, "rp": 16, "eng": 112, "lang": "en", "tags": ["ai_semis", "ai_research", "models"]}, {"h": "natolambert", "tier": 2, "b": "ai_semis", "t": "2026-07-27 23:13", "x_zh": "我理解为什么Anthropic担心中国，我认为很大程度上是因为看到一家年轻公司对任何国家采取如此对抗的立场很奇怪。通常你会把这种事留给政府。尽管Anthropic针对的是中国政府，但中国人讨厌Ant。", "x_en": "I understand why Anthropic is worried about China, I think a lot of it is that it's just weird to see a young company take such an antagonistic position on any country. Normally you leave that to the govt. Even though Anthropic targets the chinese govt, people in china hate Ant.", "u": "https://x.com/natolambert/status/2081880569525477500", "lk": 77, "rt": 0, "rp": 10, "eng": 87, "lang": "en", "tags": ["ai_semis", "ai_research", "models"]}], "indices": {"energy": {"label_zh": "能源", "label_en": "Energy", "color": "#ef8f4c", "score": null, "raw_score": null, "confidence": 0.0, "status": "no_data", "mentions": 0, "signal_tweets": 0, "kols": 0, "bullish": 0, "bearish": 0}, "metals": {"label_zh": "金属", "label_en": "Metals", "col   var IDXUNDER={zh:{energy:'原油 · 成品油 · 天然气 · LNG',metals:'黄金 · 白银 · 铜 · 铝 · 锌 · 镍 · 锂',grains:'玉米 · 小麦 · 大豆 · 豆粕 · 豆油',softs:'白糖 · 咖啡 · 可可 · 棉花 · 橙汁 · 天然橡胶'},en:{energy:'Crude · Products · Natural Gas · LNG',metals:'Gold · Silver · Copper · Aluminum · Zinc · Nickel · Lithium',grains:'Corn · Wheat · Soybeans · Meal · Soy Oil',softs:'Sugar · Coffee · Cocoa · Cotton · Orange Juice · Natural Rubber'}};

    rows.forEach(function(row,i){if(row.score===null||row.score===undefined)return;var details=[row.date,tx('total')+' '+signed(row.score,1)];['energy','metals','grains','softs'].forEach(function(key){var v=(row.contributions||{})[key];if(v!==null&&v!==undefined)details.push(tx(key)+' '+signed(v,1))});if(row.event)details.push(tx('event')+' · '+(uiLang==='en'?(row.event_en||row.event_zh):(row.event_zh||row.event_en)));out.push('<circle class="hoverpoint" data-tip="'+attr(details.join('&#10;'))+'" cx="'+x(i).toFixed(1)+'" cy="'+y(row.score).toFixed(1)+'" r="4" fill="#111"></circle>')});

  function renderIndices(){

    var ih=$("#insights");ih.innerHTML=""; r.insights.forEach(function(it,i){var c=document.createElement("div");c.className="icard";c.innerHTML='<h3><span class="inum">'+(i+1)+'</span><span>'+it.title+'</span></h3><ul>'+it.points.map(function(p){return "<li>"+p+"</li>"}).join("")+'</ul>';ih.appendChild(c)});

  function buildPills(){

  function pass(t){
