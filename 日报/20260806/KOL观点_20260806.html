显示，股市峰值通常在经济衰退开始前出现，如1990年7月股市见顶后11天衰退开始（伊拉克入侵科威特），当前需警惕类似风险。", "若经济数据转弱，股市可能提前见顶，建议降低风险敞口"], ["@Charles_Lister", "叙利亚SDF整合数据严重虚报：1月30日签约时实际人数远不足6万，阿拉伯人几乎全部叛逃，YPJ问题未解，少数族裔民兵各自为政。", "叙利亚统一进程比表面更脆弱，若整合失败，可能重新点燃冲突，影响中东稳定"], ["@Ole_S_Hansen", "黄金终于显现突破一个月盘整区间的迹象，中国和央行需求强劲，类似2022-23年，抵消了收益率上升和西方投资者冷淡的影响。", "若中国需求持续，黄金有望在利率逆风中维持强势，但需警惕西方资金流出压力"]], "sections": [["宏观经济", [["贵金属", [["@LukeGromen", "全球宏观", "若美债储备在危机中无法出售而不加剧债务螺旋，则其作为外汇储备的功能已失效；对比年初黄金储备被快速出售并缓和危机，<b class=\"em\">市场应关注这一结构性转变。</b> <span style=\"color:#8fa0b3\">交易含义：美元信用边际弱化，黄金作为储备替代品的逻辑增强，<b class=\"em\">利好金价长期走势</b></span>"], ["@elerianm", "宏观经济学家", "黄金价格已回落至6月中旬水平，这可能是一个买入机会，<b class=\"em\">但需关注后续走势。</b> <span style=\"color:#8fa0b3\">交易含义：<b class=\"em\">金价回调至关键支撑位，</b>若企稳可考虑逢低做多</span>"], ["@SantiagoAuFund", "", "尽管市场热议美元替代方案，但‘寻找’仍将持续，<b class=\"em\">因为只有一个合适的替代品（可能指黄金），</b>资金流向那里对世界其他地区的伤害大于对美国。 <span style=\"color:#8fa0b3\">交易含义：美元体系松动，但替代过程漫长，<b class=\"em\">黄金或成最大受益者</b></span>"]]], ["宏观经济", [["@chamath", "", "AGI已近在眼前，当前市场的剧烈波动（如AI相关资产抛售）是符合逻辑的调整，而非趋势逆转。 <span style=\"color:#8fa0b3\">交易含义：若AGI叙事持续，AI板块回调可能是加仓机会，<b class=\"em\">但需警惕叙事证伪风险</b></span>"], ["@RaoulGMI", "全球宏观", "加密市场的核心不是代币涨跌，而是资金正以硅基速度流动，<b class=\"em\">数十亿代理将自主交易、谈判与结算，</b>这是Reed定律的首次历史性体现。 <span style=\"color:#8fa0b3\">交易含义：关注加密基础设施与AI代理结合的项目，<b class=\"em\">传统金融结算网络可能面临颠覆</b></span>"], ["@TaviCosta", "宏观策略 (Crescat)", "大宗商品市场出现干净的向上突破形态，这是明确的趋势信号，<b class=\"em\">应据此调整仓位。</b> <span style=\"color:#8fa0b3\">交易含义：突破确认后，趋势跟踪策略可加仓，<b class=\"em\">但需设置严格止损以防假突破</b></span>"], ["@WarrenPies", "宏观策略", "<b class=\"em\">市场对KW（可能指某央行官员）无法控制委员会感到不满，</b>这暴露了内部治理问题，而非简单的沟通失误。 <span style=\"color:#8fa0b3\">交易含义：<b class=\"em\">央行内部政策分歧可能加大市场对政策路径的不确定性，</b>增加利率波动</span>"], ["@AndreasSteno", "", "市场情绪极度悲观，以至于内存公司业绩超预期都被忽视，<b class=\"em\">这可能是过度看空的信号。</b> <span style=\"color:#8fa0b3\">交易含义：若情绪极端，<b class=\"em\">超预期财报可能引发空头回补，</b>半导体板块存在反弹机会</span>"], ["@jimcramer", "", "尽管市场恐慌，但刚刚发生了多年来最大的交割（可能指期权或期货），<b class=\"em\">在恐慌前应记住这一点。</b> <span style=\"color:#8fa0b3\">交易含义：<b class=\"em\">大额交割可能引发短期流动性冲击，</b>但之后市场往往回归基本面</span>"], ["@TimmerFidelity", "", "AI和半导体板块的震荡并未吓跑投机者，韩国和美国的快钱仍在涌入，市场情绪依然高涨。 <span style=\"color:#8fa0b3\">交易含义：若投机资金持续流入，AI板块可能维持高位，<b class=\"em\">但需警惕流动性逆转风险</b></span>"], ["@biancoresearch", "", "历史数据显示，股市峰值通常在经济衰退开始前出现，如1990年7月股市见顶后11天衰退开始（伊拉克入侵科威特），<b class=\"em\">当前需警惕类似风险。</b> <span style=\"color:#8fa0b3\">交易含义：若经济数据转弱，股市可能提前见顶，<b class=\"em\">建议降低风险敞口</b></span>"]]], ["美股 / 资金流", [["@charliebilello", "", "标普500昨日首次突破7700点，为年内第8个百点里程碑，一年前为6300点，五年翻倍，十年三倍，市场处于历史高位。 <span style=\"color:#8fa0b3\">交易含义：指数高位运行，但估值与盈利增长需匹配，<b class=\"em\">警惕回调风险</b></span>"]]], ["中国 / 中美", [["@MichaelAArouet", "", "净零政策导致欧洲钢铁产量自2015年下降25%，转而从亚洲进口，但中国钢铁的碳排放量几乎是欧洲的两倍，政策效果适得其反。 <span style=\"color:#8fa0b3\">交易含义：绿色政策可能推高进口成本，<b class=\"em\">关注相关行业利润与政策调整风险</b></span>"]]]]], ["地缘政治", [["中东", [["@vali_nasr", "中东学者", "特朗普在伊朗问题上陷入死局：当前军事强度无法取胜，外交解决又需付出国内政治代价。伊朗通过阿曼谈判明确不会放弃霍尔木兹海峡，<b class=\"em\">特朗普只能发泄式回应。</b> <span style=\"color:#8fa0b3\">交易含义：霍尔木兹海峡风险溢价将持续存在，油价下方支撑较强，<b class=\"em\">但需警惕特朗普突然升级军事行动</b></span>"], ["@Charles_Lister", "", "叙利亚SDF整合数据严重虚报：1月30日签约时实际人数远不足6万，阿拉伯人几乎全部叛逃，YPJ问题未解，少数族裔民兵各自为政。 <span style=\"color:#8fa0b3\">交易含义：叙利亚统一进程比表面更脆弱，若整合失败，<b class=\"em\">可能重新点燃冲突，</b>影响中东稳定</span>"], ["@joshua_landis", "", "真主党与大马士革关系因叙利亚内战中的对立历史而极差，但双方仍在接触，此次会晤对黎巴嫩和叙利亚都有重大意义。 <span style=\"color:#8fa0b3\">交易含义：若真主党与叙利亚政府关系缓和，<b class=\"em\">可能改变黎巴嫩国内政治平衡，</b>影响区域代理格局</span>"]]], ["俄乌", [["@PhillipsPOBrien", "战略研究", "西方对乌援助近一个月无实质变化：无新武器、无新制裁，全是空话。批评那些为拒绝提供爱国者系统辩护的人，这等于在帮普京杀害乌克兰平民。 <span style=\"color:#8fa0b3\">交易含义：若西方援助持续空转，乌克兰战场态势可能进一步恶化，<b class=\"em\">避险资产或获支撑</b></span>"], ["@RALee85", "", "俄罗斯无人机生产商Uraldronzavod负责人遭汽车炸弹袭击重伤，这是普京侵乌战争引发国内反噬的最新迹象，亲战博主成为攻击目标。 <span style=\"color:#8fa0b3\">交易含义：俄国内部不稳定信号增加，若此类事件频发，可能影响战争持续能力，<b class=\"em\">利好避险交易</b></span>"], ["@anneapplebaum", "", "被自杀式无人机追杀的经历，是人类认知无法理解的体验，这种飞行机器如同有生命一般。 <span style=\"color:#8fa0b3\">交易含义：<b class=\"em\">无人机战争的心理冲击可能影响前线士兵士气，</b>间接影响战局走向</span>"]]], ["其他地缘", [["@shashj", "", "<b class=\"em\">英国广播公司BBC拥有</b>5500<b class=\"em\">名记者却只有一名防务记者，</b>且几年前还试图裁掉这个岗位，被总参谋长个人干预才保住。 <span style=\"color:#8fa0b3\">交易含义：西方媒体对防务议题报道能力不足，<b class=\"em\">可能影响公众对安全威胁的认知，</b>间接影响政策走向</span>"]]]]], ["大宗商品", [["原油", [["@JavierBlas", "能源记者 (BBG)", "6月美国占欧洲LNG进口约60%、日本石油进口约30%，美伊战争是主因，但页岩革命对全球地缘经济的影响仍被严重低估。 <span style=\"color:#8fa0b3\">交易含义：<b class=\"em\">美国能源出口的杠杆作用将持续重塑全球贸易流向，</b>关注其对能源定价权的长期影响</span>"], ["@chigrl", "", "伊朗与阿曼的协议未包含美国，实质上赋予伊朗对霍尔木兹海峡的更大控制权，海湾其他GCC国家对此并不乐见。 <span style=\"color:#8fa0b3\">交易含义：该协议可能加剧海湾内部裂痕，<b class=\"em\">提升原油的地缘政治风险溢价</b></span>"]]], ["金属", [["@PeterLBrandt", "", "黄金采用Cw/O形态分析，目标区间4517-4830美元，当前正处于该形态的确认阶段，<b class=\"em\">突破后上行空间可观。</b> <span style=\"color:#8fa0b3\">交易含义：若金价有效突破4830美元，可能触发新一轮技术性买盘，<b class=\"em\">加速上行</b></span>"], ["@Ole_S_Hansen", "盛宝银行 商品策略", "黄金终于显现突破一个月盘整区间的迹象，<b class=\"em\">中国和央行需求强劲，</b>类似2022-23年，抵消了收益率上升和西方投资者冷淡的影响。 <span style=\"color:#8fa0b3\">交易含义：若中国需求持续，黄金有望在利率逆风中维持强势，<b class=\"em\">但需警惕西方资金流出压力</b></span>"]]]]], ["天气气候", [["天气气候", [["@climateguyw", "气候研究", "8月5日西部热浪仍为危险级CAT3，本周将再度增强；同时东部正形成独立热穹顶，东西两线高温并行，<b class=\"em\">需警惕电力与能源需求共振。</b> <span style=\"color:#8fa0b3\">交易含义：<b class=\"em\">双热穹顶叠加将放大电力负荷峰值，</b>天然气与电价波动率或显著上升</span>"]]]]], ["AI半导体", [["AMD", [["@danielnewmanUV", "科技 / 企业战略", "Futurum Equities重申AMD买入评级，维持800美元目标价，认为当前市场恐慌是买入机会。 <span style=\"color:#8fa0b3\">交易含义：800美元目标价隐含较大上行空间，<b class=\"em\">但需关注市场整体风险偏好变化</b></span>"]]]]]]}, "report_en": {"insights": [{"title": "Top Buzz · Precious Metals", "points": ["Core view: Key View: @LukeGromen (Global Macro): If U.S. Treasury reserves cannot be sold during a crisis without exacerbating the debt spiral, their function as foreign exchange reserves is void; compared to the rapid sale of gold reserves earlier this year which eased the crisis, <b class=\"em\">the market should focus on this structural shift.</b>"]}, {"title": "High Alert · Russia-Ukraine", "points": ["Core view: <b class=\"em\">Key View: @PhillipsPOBrien (Strategic Studies): Western aid to Ukraine has seen no substantive change in nearly a month: no new weapons, no new sanctions,</b> all empty talk. Criticizing those who defend the refusal to provide Patriot systems is tantamount to helping Putin kill Ukrainian civilians."]}, {"title": "Contrarian Variable · Macro Economy", "points": ["Core view: Key View: @AndreasSteno: Market sentiment is so extremely pessimistic that even memory companies' earnings beats are being ignored, <b class=\"em\">which could be a sign of excessive bearishness.</b>"]}, {"title": "Sentiment Shift · Macro Economy", "points": ["Core view: <b class=\"em\">Key View: @TimmerFidelity: The volatility in AI and semiconductor sectors has not scared off speculators,</b> with fast money from Korea and the U.S. still pouring in, market sentiment remains elevated."]}, {"title": "Unique Perspective · Macro Economy", "points": ["Core view: Key View: @biancoresearch: Historical data shows that stock market peaks typically occur before the start of a recession, such as in July 1990 when the market peaked 11 days before the recession began (Iraq's invasion of Kuwait), <b class=\"em\">and similar risks should be watched now.</b>"]}], "unique": [["@AndreasSteno", "Market sentiment is so extremely pessimistic that even memory companies' earnings beats are being ignored, which could be a sign of excessive bearishness.", "If sentiment is extreme, earnings surprises could trigger short covering, presenting a rebound opportunity in the semiconductor sector"], ["@biancoresearch", "Historical data shows that stock market peaks typically occur before the start of a recession, such as in July 1990 when the market peaked 11 days before the recession began (Iraq's invasion of Kuwait), and similar risks should be watched now.", "If economic data weakens, the stock market may peak early, suggesting reducing risk exposure"], ["@Charles_Lister", "Syria's SDF integration data is severely inflated: the actual number was far below 60,000 at the time of signing on January 30, Arabs have almost all defected, the YPJ issue remains unresolved, and minority militias are fragmented.", "Syria's unification process is more fragile than it appears; if integration fails, it could reignite conflict and affect Middle East stability"], ["@Ole_S_Hansen", "Gold is finally showing signs of breaking out of a one-month consolidation range, with strong demand from China and central banks, similar to 2022-23, offsetting the impact of rising yields and tepid Western investor interest.", "If Chinese demand persists, gold may maintain strength despite headwinds from rates, but be wary of Western outflows"]], "sections": [["Macro Economy", [["Precious Metals", [["@LukeGromen", "Global Macro", "If U.S. Treasury reserves cannot be sold during a crisis without exacerbating the debt spiral, their function as foreign exchange reserves is void; compared to the rapid sale of gold reserves earlier this year which eased the crisis, <b class=\"em\">the market should focus on this structural shift.</b> <span style=\"color:#8fa0b3\">Trading Implication: The marginal weakening of USD credit strengthens the case for gold as a reserve substitute, <b class=\"em\">positive for long-term gold prices</b></span>"], ["@elerianm", "Macro Economist", "Gold prices have fallen back to mid-June levels, which could be a buying opportunity, <b class=\"em\">but follow-through needs to be watched.</b> <span style=\"color:#8fa0b3\">Trading Implication: <b class=\"em\">Gold has pulled back to key support levels,</b> consider buying dips if it stabilizes</span>"], ["@SantiagoAuFund", "", "Despite market chatter about USD alternatives, the 'search' will continue, <b class=\"em\">because there is only one suitable substitute (possibly gold),</b> and capital flows there hurt the rest of the world more than the U.S. <span style=\"color:#8fa0b3\">Trading Implication: The USD system is loosening, but the replacement process is lengthy, <b class=\"em\">gold may be the biggest beneficiary</b></span>"]]], ["Macro Economy", [["@chamath", "", "AGI is imminent, and the current market volatility (such as the sell-off in AI-related assets) is a logical adjustment, not a trend reversal. <span style=\"color:#8fa0b3\">Trading Implication: If the AGI narrative persists, AI sector pullbacks may be opportunities to add, <b class=\"em\">but be wary of narrative debunking risks</b></span>"], ["@RaoulGMI", "Global Macro", "The core of the crypto market is not token price movements, but that capital is moving at silicon speed, <b class=\"em\">with billions of agents autonomously trading, negotiating, and settling,</b> marking the first historical manifestation of Reed's Law. <span style=\"color:#8fa0b3\">Trading Implication: Focus on projects combining crypto infrastructure with AI agents, <b class=\"em\">traditional financial settlement networks may face disruption</b></span>"], ["@TaviCosta", "Macro Strategy (Crescat)", "Commodities are showing a clean upside breakout pattern, a clear trend signal, <b class=\"em\">and positions should be adjusted accordingly.</b> <span style=\"color:#8fa0b3\">Trading Implication: After confirmation, trend-following strategies can add, <b class=\"em\">but set strict stop-losses to guard against false breakouts</b></span>"], ["@WarrenPies", "Macro Strategy", "<b class=\"em\">The market is frustrated that KW (possibly a central bank official) cannot control the committee,</b> exposing internal governance issues rather than simple communication failures. <span style=\"color:#8fa0b3\">Trading Implication: <b class=\"em\">Internal policy divisions at central banks may increase market uncertainty about policy paths,</b> adding to rate volatility</span>"], ["@AndreasSteno", "", "Market sentiment is so extremely pessimistic that even memory companies' earnings beats are being ignored, <b class=\"em\">which could be a sign of excessive bearishness.</b> <span style=\"color:#8fa0b3\">Trading Implication: If sentiment is extreme, <b class=\"em\">earnings surprises could trigger short covering,</b> presenting a rebound opportunity in the semiconductor sector</span>"], ["@jimcramer", "", "Despite market panic, the largest delivery in years (possibly options or futures) just occurred, <b class=\"em\">and this should be remembered before panic.</b> <span style=\"color:#8fa0b3\">Trading Implication: <b class=\"em\">Large deliveries may cause short-term liquidity shocks,</b> but markets often revert to fundamentals afterward</span>"], ["@TimmerFidelity", "", "The volatility in AI and semiconductor sectors has not scared off speculators, with fast money from Korea and the U.S. still pouring in, market sentiment remains elevated. <span style=\"color:#8fa0b3\">Trading Implication: If speculative inflows persist, the AI sector may stay at high levels, <b class=\"em\">but be wary of liquidity reversal risks</b></span>"], ["@biancoresearch", "", "Historical data shows that stock market peaks typically occur before the start of a recession, such as in July 1990 when the market peaked 11 days before the recession began (Iraq's invasion of Kuwait), <b class=\"em\">and similar risks should be watched now.</b> <span style=\"color:#8fa0b3\">Trading Implication: If economic data weakens, the stock market may peak early, <b class=\"em\">suggesting reducing risk exposure</b></span>"]]], ["US Stocks / Fund Flows", [["@charliebilello", "", "The S&P 500 broke above 7,700 for the first time yesterday, the 8th 100-point milestone this year, up from 6,300 a year ago, doubled in five years, tripled in ten years, with the market at record highs. <span style=\"color:#8fa0b3\">Trading Implication: Index at high levels, but valuations and earnings growth need to align, <b class=\"em\">beware of pullback risks</b></span>"]]], ["China / US-China", [["@MichaelAArouet", "", "Net-zero policies have led to a 25% decline in European steel production since 2015, shifting to imports from Asia, but Chinese steel has nearly double the carbon emissions of European steel, making the policy counterproductive. <span style=\"color:#8fa0b3\">Trading Implication: Green policies may raise import costs, <b class=\"em\">watch for profit and policy adjustment risks in related industries</b></span>"]]]]], ["Geopolitics", [["Middle East", [["@vali_nasr", "Middle East Scholar", "Trump is in a deadlock on Iran: current military intensity cannot win, and diplomatic resolution would incur domestic political costs. Iran has made clear through Omani talks it will not give up the Strait of Hormuz, <b class=\"em\">so Trump can only respond with venting.</b> <span style=\"color:#8fa0b3\">Trading Implication: The risk premium on the Strait of Hormuz will persist, with strong downside support for oil prices, <b class=\"em\">but be alert to sudden escalation of military action by Trump</b></span>"], ["@Charles_Lister", "", "Syria's SDF integration data is severely inflated: the actual number was far below 60,000 at the time of signing on January 30, Arabs have almost all defected, the YPJ issue remains unresolved, and minority militias are fragmented. <span style=\"color:#8fa0b3\">Trading Implication: Syria's unification process is more fragile than it appears; if integration fails, <b class=\"em\">it could reignite conflict,</b> affecting Middle East stability</span>"], ["@joshua_landis", "", "Hezbollah's relationship with Damascus is extremely poor due to opposing histories in the Syrian civil war, but both sides are still in contact, and this meeting is significant for both Lebanon and Syria. <span style=\"color:#8fa0b3\">Trading Implication: If Hezbollah-Syria relations ease, <b class=\"em\">it could alter Lebanon's domestic political balance,</b> affecting regional proxy dynamics</span>"]]], ["Russia-Ukraine", [["@PhillipsPOBrien", "Strategic Studies", "Western aid to Ukraine has seen no substantive change in nearly a month: no new weapons, no new sanctions, all empty talk. Criticizing those who defend the refusal to provide Patriot systems is tantamount to helping Putin kill Ukrainian civilians. <span style=\"color:#8fa0b3\">Trading Implication: If Western aid continues to stall, the situation on the Ukrainian battlefield may further deteriorate, <b class=\"em\">potentially supporting safe-haven assets</b></span>"], ["@RALee85", "", "The head of Russian drone manufacturer Uraldronzavod was seriously injured in a car bomb attack, the latest sign of domestic backlash from Putin's invasion of Ukraine, with pro-war bloggers becoming targets. <span style=\"color:#8fa0b3\">Trading Implication: Increasing signs of internal instability in Russia; if such incidents become frequent, they may affect the sustainability of the war effort, <b class=\"em\">favoring safe-haven trades</b></span>"], ["@anneapplebaum", "", "The experience of being hunted by a suicide drone is beyond human cognitive understanding; these flying machines seem almost alive. <span style=\"color:#8fa0b3\">Trading Implication: <b class=\"em\">The psychological impact of drone warfare may affect frontline soldiers' morale,</b> indirectly influencing the course of the conflict</span>"]]], ["Other Geopolitics", [["@shashj", "", "<b class=\"em\">The BBC has 5,500 journalists but only one defense correspondent,</b> and a few years ago it even tried to cut that role, only saved by the personal intervention of the Chief of the Defence Staff. <span style=\"color:#8fa0b3\">Trading Implication: Western media's inadequate coverage of defense issues <b class=\"em\">may affect public perception of security threats,</b> indirectly influencing policy directions</span>"]]]]], ["Commodities", [["Crude Oil", [["@JavierBlas", "Energy Journalist (BBG)", "In June, the U.S. accounted for about 60% of European LNG imports and about 30% of Japanese oil imports, mainly due to the U.S.-Iran war, but the impact of the shale revolution on global geopolitical economics is still severely underestimated. <span style=\"color:#8fa0b3\">Trading Implication: <b class=\"em\">The leverage of U.S. energy exports will continue to reshape global trade flows,</b> watch its long-term impact on energy pricing power</span>"], ["@chigrl", "", "The Iran-Oman agreement does not include the U.S., effectively giving Iran greater control over the Strait of Hormuz, which other GCC countries are not pleased about. <span style=\"color:#8fa0b3\">Trading Implication: This agreement may deepen divisions within the Gulf, <b class=\"em\">increasing the geopolitical risk premium on crude oil</b></span>"]]], ["Metals", [["@PeterLBrandt", "", "Gold is analyzed using the Cw/O pattern, with a target range of $4,517-$4,830, currently in the confirmation phase of this pattern, <b class=\"em\">with significant upside potential after a breakout.</b> <span style=\"color:#8fa0b3\">Trading Implication: If gold effectively breaks above $4,830, it may trigger a new wave of technical buying, <b class=\"em\">accelerating the upside</b></span>"], ["@Ole_S_Hansen", "Saxo Bank Commodity Strategy", "Gold is finally showing signs of breaking out of a one-month consolidation range, <b class=\"em\">with strong demand from China and central banks,</b> similar to 2022-23, offsetting the impact of rising yields and tepid Western investor interest. <span style=\"color:#8fa0b3\">Trading Implication: If Chinese demand persists, gold may maintain strength despite headwinds from rates, <b class=\"em\">but be wary of Western outflows</b></span>"]]]]], ["Weather & Climate", [["Weather & Climate", [["@climateguyw", "Climate Research", "The western heatwave on August 5 remains at dangerous CAT3 and will intensify again this week; meanwhile, an independent heat dome is forming in the east, with high temperatures on both fronts, <b class=\"em\">requiring vigilance for resonance in electricity and energy demand.</b> <span style=\"color:#8fa0b3\">Trading Implication: <b class=\"em\">Dual heat domes will amplify peak electricity loads,</b> potentially significantly increasing volatility in natural gas and electricity prices</span>"]]]]], ["AI & Semiconductors", [["AMD", [["@danielnewmanUV", "Technology / Corporate Strategy", "Futurum Equities reiterates a Buy rating on AMD, maintaining a $800 price target, believing the current market panic is a buying opportunity. <span style=\"color:#8fa0b3\">Trading Implication: The $800 price target implies significant upside, <b class=\"em\">but attention should be paid to changes in overall market risk appetite</b></span>"]]]]]]}, "tweets": [{"h": "LukeGromen", "tier": 1, "b": "macro", "t": "2026-08-05 13:27", "x_zh": "如果美国国债储备在危机中无法出售，而不会因威胁债务螺旋而使危机恶化，那么美国国债就不再适合作为外汇储备。相比之下，今年早些时候，黄金储备被轻松快速地出售，并缓和了危机。让我们拭目以待。", "x_en": "If UST reserves cannot be sold in a crisis without making said crisis worse by threatening a debt spiral, then UST’s are no longer fit for purpose as FX reserves.\n\nIn contrast, earlier this year, gold reserves were sold easily & quickly & de-escalated the crisis.\n\nLet’s watch.", "u": "https://x.com/LukeGromen/status/2084994712767754440", "lk": 1867, "rt": 443, "rp": 110, "eng": 2420, "lang": "en", "tags": ["macro", "sovereign_debt", "commodities"], "important": true}, {"h": "chamath", "tier": 1, "b": "macro", "t": "2026-08-05 16:51", "x_zh": "如前所述，AGI 现已触手可及，因此这些举措是合乎逻辑的。", "x_en": "As said earlier, AGI is now at hand so these moves are logical.", "u": "https://x.com/chamath/status/2085045972535500968", "lk": 2128, "rt": 88, "rp": 143, "eng": 2359, "lang": "en", "tags": ["macro", "equities", "technology"], "important": true}, {"h": "RaoulGMI", "tier": 1, "b": "macro", "t": "2026-08-05 17:25", "x_zh": "大多数人仍然认为加密货币就是代币的涨跌。其实不是。或者至少，这只是正在发生的事情中最小的部分。资金即将以硅速流动。数十亿个代理相互交易、谈判、结算并运行完整的……", "x_en": "Most people still think crypto is about tokens going up and down.\n\nIt isn't. Or at least, that's the smallest part of what's happening.\n\nMoney is about to start moving at silicon speed. Billions of agents transacting with each other, negotiating, settling and running full", "u": "https://x.com/RaoulGMI/status/2085054479653617727", "lk": 1690, "rt": 258, "rp": 171, "eng": 2119, "lang": "en", "tags": ["macro", "crypto", "long_cycle"], "important": true}, {"h": "TaviCosta", "tier": 1, "b": "macro", "t": "2026-08-05 16:07", "x_zh": "它来了。这就是干净突破的样子。据此行动。https://tavicosta.substack.com/p/list-of-breakouts …", "x_en": "There it goes.\n\nThis is what a clean breakout looks like.\n\nAct accordingly.\n\n\nhttps://\ntavicosta.substack.com/p/list-of-brea\nkouts\n…", "u": "https://x.com/TaviCosta/status/2085034992552251818", "lk": 1599, "rt": 213, "rp": 62, "eng": 1874, "lang": "en", "tags": ["macro", "commodities", "cycle"], "important": true}, {"h": "RaoulGMI", "tier": 1, "b": "macro", "t": "2026-08-05 16:35", "x_zh": "我们现在处于双重指数增长中。这是历史上里德定律的第一个真实例子。多年来我一直在构建这个想法。我早在 2022 年就写过里德定律，2023 年称 AI 是它的第一个真正例子，到 2025 年我指出几乎没有人……", "x_en": "We're now in a double exponential. The first real example of Reed's Law in history.\n\nI've been building toward this idea for years. I first wrote about Reed's Law back in 2022, called AI the first true example of it in 2023, and by 2025 I was pointing out that almost nobody had", "u": "https://x.com/RaoulGMI/status/2085042078317224328", "lk": 965, "rt": 128, "rp": 95, "eng": 1188, "lang": "en", "tags": ["macro", "crypto", "long_cycle"], "important": true}, {"h": "WarrenPies", "tier": 1, "b": "macro", "t": "2026-08-05 16:51", "x_zh": "尽管每个人都说“烧得好，兄弟”，但这是一个愚蠢的评论。记者们一直“报道”幕后八卦。也许该问问自己，为什么 KW 无法控制委员会。答案是一颗难以下咽的药丸。", "x_en": "Despite everyone saying \"sick burn bro,\" this is a dumb comment. Reporters have always \"reported\" backroom gossip. Maybe ask yourself why KW is incapable of controlling the committee. The answer is a tough pill to swallow.", "u": "https://x.com/WarrenPies/status/2085046146951483706", "lk": 582, "rt": 36, "rp": 58, "eng": 676, "lang": "en", "tags": ["macro", "oil_energy", "cycle"], "important": true}, {"h": "AndreasSteno", "tier": 1, "b": "macro", "t": "2026-08-05 20:11", "x_z "rp": 61, "eng": 434, "lang": "en", "tags": ["macro", "rates_fx", "cross_asset"], "important": true}, {"h": "jimcramer", "tier": 1, "b": "macro", "t": "2026-08-05 20:30", "x_zh": "Jamie 正确地谈论了杠杆，但多年来最大的交割刚刚发生！让我们在恐慌之前记住这一点。", "x_en": "Jamie is correctly talking about leverage but the biggest delivering in years JUST HAPPENED!  Let's remember that before we panic from this", "u": "https://x.com/jimcramer/status/2085101221577154562", "lk": 294, "rt": 12, "rp": 59, "eng": 365, "lang": "en", "tags": ["macro", "equities", "teacher_required"], "important": true}, {"h": "TimmerFidelity", "tier": 1, "b": "macro", "t": "2026-08-05 13:34", "x_zh": "一个理性的人会认为，最近 AI 动能和半导体领域的震荡会让投机者望而却步，但事实并非如此。事实上，根据下图，韩国和美国的快钱似乎正在...", "x_en": "A reasonable person would have assumed that the recent shakeout in the AI momentum and semiconductor space would have sent speculators running for the hills, but that has not been the case. In fact, per the chart below it appears that the fast money in South Korea and the US is", "u": "https://x.com/TimmerFidelity/status/2084996498429768019", "lk": 283, "rt": 36, "rp": 9, "eng": 328, "lang": "en", "tags": ["macro", "equities", "cycle"], "important": true}, {"h": "DariusDale42", "tier": 2, "b": "macro", "t": "2026-08-05 14:14", "x_zh": "更正：Dale 2048。我有年幼的孩子，我希望在被暗杀之前看到他们长大。顺便说一句，纵观历史，那些“看清真相”的人往往会被暗杀：格拉古兄弟、亚伯拉罕·林肯、圣雄甘地、休伊·朗、肯尼迪、马丁·路德·金等。", "x_en": "CORRECTION: Dale 2048 . I have young children whom I would like to see grow up before I get assassinated.\n\nFWIW, throughout history, people who “red pill” the system tend to get assassinated: the Gracchi brothers, Abraham Lincoln, Mahatma Gandhi, Huey Long, JFK, MLK, etc.", "u": "https://x.com/DariusDale42/status/2085006495670825352", "lk": 243, "rt": 31, "rp": 38, "eng": 312, "lang": "en", "tags": ["macro", "risk_regime", "quant"], "important": true}, {"h": "biancoresearch", "tier": 1, "b": "macro", "t": "2026-08-05 21:03", "x_zh": "下表显示了股市在衰退开始前多少天见顶。所有数字均为负数，意味着股市在衰退开始前见顶。1990年7月，衰退在11天后开始，当时伊拉克入侵科威特。油价上涨...", "x_en": "The table below shows how many days before the recession starts the stock market peaks. All the numbers are negative, meaning the stock market peaks before the recession starts. \n\nIn July 1990, the recession started 11 days later when Iraq invaded Kuwait. The price of oil went up", "u": "https://x.com/biancoresearch/status/2085109397374619905", "lk": 208, "rt": 27, "rp": 48, "eng": 283, "lang": "en", "tags": ["macro", "rates_fx", "bonds"], "important": true}, {"h": "elerianm", "tier": 1, "b": "macro", "t": "2026-08-05 20:14", "x_zh": "金价已回到6月中旬的水平。#经济 #市场 #黄金", "x_en": "The gold price is back at mid-June levels.\n#economy #markets #gold", "u": "https://x.com/elerianm/status/2085097183020290352", "lk": 227, "rt": 28, "rp": 22, "eng": 277, "lang": "en", "tags": ["macro", "central_banks", "teacher_required"], "important": true}, {"h": "charliebilello", "tier": 2, "b": "macro", "t": "2026-08-05 14:44", "x_zh": "标普500指数昨日首次突破7700点，这是今年第8次触及100点的里程碑。一年前该指数为6300点，五年前为4400点，十年前为2200点。", "x_en": "The S&P 500 crossed above 7,700 yesterday for the first time, its 8th 100-point milestone of the year. A year ago it was at 6,300. 5 years ago it was at 4,400. 10 years ago it was at 2,200.", "u": "https://x.com/charliebilello/status/2085014052078547036", "lk": 185, "rt": 41, "rp": 41, "eng": 267, "lang": "en", "tags": ["macro", "data", "markets"], "important": true}, {"h": "BobEUnlimited", "tier": 1, "b": "macro", "t": "2026-08-05 16:15", "x_zh": "我们能否都承认，配置者被欺骗了，相信了“因子中性”和“特质收益”的神话，而实际上这些多策略基金大多只是收取高费用的动量交易者，加上一些会计把戏。感谢 @nishantkumar07。", "x_en": "Can we all accept that allocators got duped into believing the \"factor neutral\" and \"idio\" myths, when in reality most of these multistrats are just high-fee momo traders with some accounting tricks. h/t \n@nishantkumar07", "u": "https://x.com/BobEUnlimited/status/2085036895973601442", "lk": 190, "rt": 15, "rp": 47, "eng": 252, "lang": "en", "tags": ["macro", "rates_fx", "cycle"], "important": true}, {"h": "MichaelAArouet", "tier": 2, "b": "macro", "t": "2026-08-05 08:41", "x_zh": "净零政策的另一个例子是钢铁生产。钢铁生产是能源密集型的，随着能源价格上涨，自2015年以来欧洲的钢铁产量下降了25%。欧洲转而从亚洲进口钢铁，但中国制造的钢铁在生产和运输过程中产生的排放量几乎是欧洲的两倍。想要", "x_en": "Another example of Net Zero policies is steel production. It is energy-intensive, and with higher energy prices it dropped in Europe by 25% since 2015.\n\nEurope imports steel from Asia instead. But steel made in China causes almost twice as many emissions to build and ship.\n\nWant", "u": "https://x.com/MichaelAArouet/status/2084922606797377970", "lk": 146, "rt": 70, "rp": 4, "eng": 220, "lang": "en", "tags": ["macro", "economics", "data"], "important": true}, {"h": "charliebilello", "tier": 2, "b": "macro", "t": "2026-08-05 14:15", "x_zh": "标普500指数昨日收盘创下历史新高，这是自6月2日以来的首次。这是该指数今年第25次创下历史新高，也是自2024年初以来的第121次。", "x_en": "The S&P 500 closed at an all-time high yesterday for the first time since June 2. This was its 25th all-time high of the year and 121st all-time high since the start of 2024.", "u": "https://x.com/charliebilello/status/2085006813448048957", "lk": 119, "rt": 23, "rp": 22, "eng": 164, "lang": "en", "tags": ["macro", "data", "markets"], "important": true}, {"h": "SantiagoAuFund", "tier": 1, "b": "macro", "t": "2026-08-05 19:44", "x_zh": "尽管通常的怀疑者对此有令人窒息的评论……关键词仍然是“他们的寻找”。而这种寻找将持续很长时间。因为只有一个合适的替代品。资金流向那里对世界其他地区的伤害大于对美国的伤害。", "x_en": "Despite the usual suspects breathless takes on this below...the key words remain \"their search for\".  And that search will continue for a long time.  Bc there is only one suitable alternative.  And funds flowing there hurt the rest of the world more than it hurts the U.S.", "u": "https://x.com/SantiagoAuFund/status/2085089631138173198", "lk": 114, "rt": 16, "rp": 29, "eng": 159, "lang": "en", "tags": ["macro", "rates_fx", "dollar"], "important": true}, {"h": "jam_croissant", "tier": 1, "b": "macro", "t": "2026-08-05 16:32", "x_zh": "#rumbs - 今天早些时候在 @tastyliveshow 上", "x_en": "#rumbs - Earlier today on \n@tastyliveshow", "u": "https://x.com/       $("#briefList").innerHTML=items.map(function(it){var text=uiLang==='en'?(it.text_en||it.text_zh):(it.text_zh||it.text_en),label=uiLang==='en'?(it.board_en||it.board):(it.board_zh||it.board),dir=it.direction>0?tx('bull'):(it.direction<0?tx('bear'):tx('neutralView')),bd=it.breakdown||{},dirClass=it.direction<0?' bear':'',penalty=bd.noise_penalty?(' · <b>'+tx('noiseShort')+'</b> -'+bd.noise_penalty):'',reach=it.influence_score===null||it.influence_score===undefined?'':('<span class="view-chip">'+tx('influenceScore')+' '+Math.round(it.influence_score)+' · '+fmt(it.followers_count||0)+' '+tx('followers')+'</span>');return '<article class="brief-item"><div class="view-score"><strong>'+Math.round(it.score)+'</strong><span>'+tx('viewScore')+'</span></div><div class="brief-copy"><div class="view-meta"><strong>@'+esc(it.handle)+'</strong><span class="view-chip">'+esc(label)+'</span><span class="view-chip direction'+dirClass+'">'+dir+'</span><span class="view-chip">'+tx('kolScore')+' '+Math.round(it.kol_score||0)+'</span>'+reach+'<a class="view-open" href="'+attr(it.url)+'" target="_blank" rel="noopener">'+tx('sourceLink')+'</a></div><b>'+esc(text.slice(0,140))+(text.length>140?'…':'')+'</b><div class="view-break"><b>'+tx('relevanceShort')+'</b> '+(bd.relevance||0)+'/30 · <b>'+tx('sourceShort')+'</b> '+(bd.source||0)+'/20 · <b>'+tx('engagementShort')+'</b> '+(bd.engagement||0)+'/20 · <b>'+tx('stanceShort')+'</b> '+(bd.stance||0)+'/15 · <b>'+tx('specificityShort')+'</b> '+(bd.specificity||0)+'/10 · <b>'+tx('freshnessShort')+'</b> '+(bd.freshness||0)+'/5'+penalty+'</div></div></article>'}).join('');
    }else{
      var fallback=(r.insights||[]).slice(0,5);$("#briefList").innerHTML=fallback.map(function(it,i){var points=it.points||[],main=points[0]||it.title;return '<article class="brief-item"><div class="view-score"><strong>'+String(i+1).padStart(2,'0')+'</strong><span>TOP</span></div><div class="brief-copy"><b>'+it.title+'</b><p>'+main+'</p></div></article>'}).join('');
    }
    var kols=(ranking.top_kols||[]).slice(0,5);$("#kolRankTitle").textContent=tx('kolRankTitle');$("#kolRankDesc").textContent=tx('kolRankDesc');$("#scoreNote").textContent=tx('scoreNote');$("#kolRankList").innerHTML=kols.map(function(it,i){var followers=it.followers_count===null||it.followers_count===undefined?'':(' · '+fmt(it.followers_count)+' '+tx('followers'));return '<div class="kol-row"><span class="kr">'+String(i+1).padStart(2,'0')+'</span><div class="kh"><b>@'+esc(it.handle)+'</b><small>'+it.qualified_views+' '+tx('viewUnit')+' · '+fmt(it.engagement)+' '+tx('engagementShort')+followers+'</small></div><span class="ks">'+Math.round(it.score)+'</span></div>'}).join('');
    $("#growthRankTitle").textContent=tx('growthRankTitle');$("#growthRankDesc").textContent=tx('growthRankDesc');var growers=(ranking.growth_leaders||[]).slice(0,5);$("#growthRankList").innerHTML=growers.length?growers.map(function(it,i){return '<div class="kol-row growth-row"><span class="kr">'+String(i+1).padStart(2,'0')+'</span><div class="kh"><b>@'+esc(it.handle)+'</b><small>'+fmt(it.followers_count)+' '+tx('followers')+' · +'+fmt(it.delta_1d)+'</small></div><span class="ks">+'+(it.growth_1d_pct||0).toFixed(2)+'%</span></div>'}).join(''):'<div class="growth-empty">'+tx('growthBaseline')+'</div>';
  }

  function setView(view,scroll){
    st.view=view==='full'?'full':'brief';app.setAttribute('data-view',st.view);
    $("#viewNav").querySelectorAll('button').forEach(function(b){var on=b.dataset.view===st.view;b.setAttribute('data-on',on?'1':'0');b.setAttribute('aria-pressed',on?'true':'false')});
    var url=new URL(location.href);if(st.view==='full')url.searchParams.set('view','full');else url.searchParams.delete('view');history.replaceState(null,'',url.pathname+(url.search?'?'+url.searchParams.toString():'')+url.hash);
    if(scroll)window.scrollTo({top:0,behavior:'smooth'});
  }

  function renderReport(){
    renderAlerts();
    var r=report(),m=cur().meta;
    $("#win").textContent=uiLang==="en"?m.window_en:m.window_zh; $("#sub").textContent=uiLang==="en"?m.subtitle_en:m.subtitle_zh;
    var ih=$("#insights");ih.innerHTML=""; r.insights.forEach(function(it,i){var c=document.createElement("div");c.className="icard";c.innerHTML='<h3><span class="inum">'+(i+1)+'</span><span>'+it.title+'</span></h3><ul>'+it.points.map(function(p){return "<li>"+p+"</li>"}).join("")+'</ul>';ih.appendChild(c)});
    var sh=$("#sections");sh.innerHTML="";
    r.sections.forEach(function(pair){
      var name=pair[0],subs=pair[1],col=REPC[name]||"#5b8def",nvp=subs.reduce(function(a,s){return a+s[1].length},0);
      var inner=subs.map(function(sd){return '<div class="subg"><div class="subh" style="--sc:'+col+';color:'+col+'">'+sd[0]+'</div>'+sd[1].map(function(row){return '<div class="vp"><span class="vh" data-h="'+esc(row[0].replace("@",""))+'">'+row[0]+'</span>'+(row[1]?'<span class="vr">'+row[1]+'</span>':'')+row[2]+'</div>'}).join("")+'</div>'}).join("");
      var box=document.createElement("div");box.className="bsec";box.innerHTML='<div class="bhead" style="background:'+col+'">'+name+' <span style="font-weight:500;opacity:.75;font-size:12px">'+subs.length+' '+tx("domains")+' · '+nvp+' '+tx("items")+'</span><span class="arrow">▾</span></div><div class="bbody">'+inner+'</div>';
      var bd=box.querySelector(".bbody"),hd=box.querySelector(".bhead"); hd.onclick=function(){bd.style.display=bd.style.display==="none"?"":"none";box.querySelector(".arrow").textContent=bd.style.display==="none"?"▸":"▾"}; sh.appendChild(box);
    });
    sh.querySelectorAll(".vh").forEach(function(v){v.onclick=function(){jumpHandle(v.dataset.h)}});
    var uh=$("#unique");uh.innerHTML=""; r.unique.forEach(function(u){var c=document.createElement("div");c.className="ucard";c.innerHTML='<div class="uh" data-h="'+esc(u[0].replace("@",""))+'">'+u[0]+'</div><div class="uv">'+u[1]+'</div><div class="ui">'+tx("meaning")+u[2]+'</div>';c.querySelector(".uh").onclick=function(){jumpHandle(u[0].replace("@",""))};uh.appendChild(c)});
  }
  function buildPills(){
    var tw=cur().tweets,wrap=$("#boardPills");wrap.innerHTML=""; var counts={all:tw.length};Object.keys(BOARDS).forEach(function(k){counts[k]=0}); tw.forEach(function(t){counts[t.b]=(counts[t.b]||0)+1});
    function mk(key,label,color){var p=document.createElement("button");p.className="pill";p.innerHTML=label+' <span class="cnt">'+(counts[key]||0)+'</span>';if(st.board===key){p.setAttribute("data-on","1");p.style.background=color;p.style.borderColor=color} p.onclick=function(){st.board=key;buildPills();render()};return p}
    wrap.appendChild(mk("all",tx("all"),"#e7b24d")); Object.keys(BOARDS).forEach(function(k){wrap.appendChild(mk(k,boardLabel(k),BOARDS[k].color))});
  }
  function pass(t){
    if(st.board!=="all"&&t.b!==st.board)return false;
    if(st.tier!=="all"&&(""+t.tier)!==st.tier)return false;
    if(st.lang!=="all"&&t.lang!==st.lang)return false;
    if(st.q){var q=st.q.toLowerCase(); var hay=(bodyOf(t)+" "+(t.x_zh||"")+" "+(t.x_en||"")+" @"+t.h+" "+(t.tags||[]).join(" ")).toLowerCase(); if(hay.indexOf(q)<0)return false}
    return true
  }
  function render(){
    var m=cur().meta,tw=cur().tweets.filter(pass); tw.sort(function(a,b){return st.sort==="hot"?b.eng-a.eng:(a.t<b.t?1:-1)});
    var kol=new Set(tw.map(function(t){return t.h})).size; $("#tstat").innerHTML=tx("show")+' <b>'+tw.length+'</b> / '+m.n_tweets+' · <b>'+kol+'</b> '+tx("kols")+' · '+tx("monitor")+' '+m.n_accounts+' '+tx("accounts");
    var s=$("#stream"); if(!tw.length){s.innerHTML='<div class="empty">'+tx("empty")+'</div>';return} s.innerHTML="";
    tw.forEach(function(t){
      var B=BOARDS[t.b]||{color:"#5b8def"}, body=bodyOf(t), tags=(t.tags||[]).map(function(x){return '<span class="tag" data-tag="'+esc(x)+'">'+esc(x)+'</span>'}).join("");
      var c=document.createElement("div"); c.className="card"; c.tabIndex=0; c.style.setProperty("--bc",B.color);
      c.innerHTML='<div class="chead"><span class="hand" data-h="'+esc(t.h)+'">@'+esc(t.h)+'</span><span class="bchip" style="background:'+B.color+'">'+boardShort(t.b)+'</span>'+(t.tier===1?'<span class="t1">'+tx("tier1")+'</span>':'')+'<span class="lang">'+(t.lang==="zh"?tx("langZh"):tx("langEn"))+'</span><span class="time mono">'+esc(t.t)+'</span></div><div class="cbody">'+hl(body,st.q)+'</div><div class="cfoot"><span class="eng mono"><span>♥ '+fmt(t.lk)+'</span><span>⟲ '+fmt(t.rt)+'</span><span>💬 '+fmt(t.rp)+'</span></span><span class="tags">'+tags+'</span><span class="open">'+tx("open")+'</span></div>';
      var bodyEl=c.querySelector(".cbody"); requestAnimationFrame(function(){if(bodyEl.scrollHeight>bodyEl.clientHeight+4){bodyEl.classList.add("clamp"); var mm=document.createElement("span"); mm.className="more"; mm.textContent=tx("more"); bodyEl.after(mm); mm.onclick=function(e){e.stopPropagation();bodyEl.classList.toggle("open");bodyEl.classList.toggle("clamp");mm.textContent=bodyEl.classList.contains("open")?tx("less"):tx("more")}}});
      c.onclick=function(){window.open(t.u,"_blank","noopener")}; c.onkeydown=function(e){if(e.key==="Enter")window.open(t.u,"_blank","noopener")};
      c.querySelector(".hand").onclick=function(e){e.stopPropagation();jumpHandle(t.h)}; c.querySelectorAll(".tag").forEach(function(tg){tg.onclick=function(e){e.stopPropagation();$("#q").value=tg.dataset.tag;st.q=tg.dataset.tag;$("#clr").style.display="block";render()}});
      s.appendChild(c);
    })
  }
  function renderAll(){syncUi();renderReport();renderBrief();renderIndices();buildPills();render();setView(st.view,false)}
  var qi=$("#q"),clr=$("#clr"); qi.oninput=function(){st.q=qi.value.trim();clr.style.display=qi.value?"block":"none";render()}; clr.onclick=function(){qi.value="";st.q="";clr.style.display="none";qi.focus();render()};
  document.addEventListener("keydown",function(e){if(e.key==="/"&&document.activeElement!==qi){e.preventDefault();qi.focus()} if(e.key==="Escape"&&document.activeElement===qi){qi.value="";st.q="";clr.style.display="none";render()}});
  function seg(id,key){var el=$(id);el.querySelectorAll("button").forEach(function(b){b.onclick=function(){el.querySelectorAll("button").forEach(function(x){x.removeAttribute("data-on")});b.setAttribute("data-on","1");st[key]=b.dataset.v;render()}})}
  seg("#sortSeg","sort"); seg("#tierSeg","tier"); seg("#langSeg","lang");
  $("#reset").onclick=function(){st.board="all";st.tier="all";st.lang="all";st.sort="hot";st.q="";qi.value="";clr.style.display="none";[["#sortSeg","hot"],["#tierSeg","all"],["#langSeg","all"]].forEach(function(p){var el=$(p[0]);el.querySelectorAll("button").forEach(function(x){x.setAttribute("data-on",x.dataset.v===p[1]?"1":"")})});buildPills();render()};
  app.querySelectorAll(".langsw button").forEach(function(b){b.onclick=function(){uiLang=b.dataset.lang;renderAll()}});
  $("#viewNav").querySelectorAll("button").forEach(function(b){b.onclick=function(){setView(b.dataset.view,true)}});$("#openFull").onclick=function(){setView('full',true)};
  app.querySelectorAll(".range button").forEach(function(b){b.onclick=function(){st.range=+b.dataset.range;renderAll()}});
  renderAll();
})();
