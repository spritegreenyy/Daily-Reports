估了供应中断的持续性。</b>", "交易结论：库存大幅消耗与看空情绪背离，<b class=\"em\">若供应中断持续，</b>油价存在向上修正的逆向交易机会"]}], "unique": [["@BobEUnlimited", "非正式部门就业崩塌是最大被忽视的劳动力市场主题，家庭调查显示经济-wide层面的疲软远比薪资调查显示的更广。", "若非正式就业持续恶化，消费数据将滞后反映，经济衰退风险被低估"], ["@LukeGromen", "为恢复1922年热那亚会议前黄金作为全球主要/唯一储备资产的角色，金价需远高于5000美元/盎司，当前准备动作指向百年未见的变革，对美元资产构成重大利好。", "若金价突破5000美元关口，主权债务与美元体系将面临重估，黄金多头逻辑强化"], ["@WarrenPies", "历史上89次非农负增长后的美联储会议中，仅1999年11月和2005年11月两次加息，9月会议前还有一份NFP报告，当前数据不支持9月加息。", "若9月前就业继续走弱，加息预期将彻底落空，利率市场将重新定价"], ["@LawrenceLepard", "美联储H.4.1报告显示互换额度从零增加500亿美元，几乎肯定与日本有关，这解释了Bessent为何要求解除FIMA上限，下周报告可能看到1000亿美元。", "互换额度激增暗示美元流动性紧张，若下周突破1000亿，黄金和白银将获得强支撑"]], "sections": [["宏观经济", [["AI 算力 / GPU", [["@chamath", "", "电力是AI发展的硬约束，数据中心被关闭、GPU售罄、模型商品化、现货价格上涨，关键在电力而非分布式电池等未来规划。 <span style=\"color:#8fa0b3\">交易含义：<b class=\"em\">电力短缺将限制AI产能扩张，</b>电力相关资产和公用事业板块值得关注</span>"]]], ["贵金属", [["@LukeGromen", "全球宏观", "为恢复1922年热那亚会议前黄金作为全球主要/唯一储备资产的角色，金价需远高于5000美元/盎司，当前准备动作指向百年未见的变革，<b class=\"em\">对美元资产构成重大利好。</b> <span style=\"color:#8fa0b3\">交易含义：若金价突破5000美元关口，<b class=\"em\">主权债务与美元体系将面临重估，</b>黄金多头逻辑强化</span>"], ["@TimmerFidelity", "", "黄金全年在4000美元附近盘整，三角形形态可能下探，但全球货币供应增速从7%回升至9%，<b class=\"em\">为金价提供基本面支撑。</b> <span style=\"color:#8fa0b3\">交易含义：货币供应回升若持续，<b class=\"em\">黄金下行空间有限，</b>4000美元附近是中期布局区</span>"]]], ["美联储 / 利率", [["@biancoresearch", "", "FOMC决策现在由十二位独立投票者做出，而非主席主导，这是美联储观察者最难理解的变化，对Warsh不提供前瞻指引的批评是误解。 <span style=\"color:#8fa0b3\">交易含义：政策路径不确定性上升，利率波动率可能加大，<b class=\"em\">交易员需降低对单一信号的依赖</b></span>"], ["@WarrenPies", "宏观策略", "历史上89次非农负增长后的美联储会议中，仅1999年11月和2005年11月两次加息，9月会议前还有一份NFP报告，当前数据不支持9月加息。 <span style=\"color:#8fa0b3\">交易含义：若9月前就业继续走弱，加息预期将彻底落空，<b class=\"em\">利率市场将重新定价</b></span>"], ["@AndreasSteno", "", "我们已有全街最软的NFP预测，实际数据比预测还低，<b class=\"em\">预期美联储将对就业和价格双双感到鸽派惊讶，</b>不会加息。 <span style=\"color:#8fa0b3\">交易含义：若美联储转鸽，<b class=\"em\">美元和美债收益率将承压，</b>风险资产获得喘息</span>"], ["@LawrenceLepard", "", "美联储H.4.1报告显示互换额度从零增加500亿美元，几乎肯定与日本有关，这解释了Bessent为何要求解除FIMA上限，<b class=\"em\">下周报告可能看到</b>1000亿<b class=\"em\">美元。</b> <span style=\"color:#8fa0b3\">交易含义：互换额度激增暗示美元流动性紧张，若下周突破1000亿，<b class=\"em\">黄金和白银将获得强支撑</b></span>"], ["@Stephanie_Link", "", "本周经济数据整体不错，ISM和初请失业金抵消了疲软NFP，<b class=\"em\">AHE、ULC和生产率指向通胀下行，</b>EPS同比+48%才是关键。 <span style=\"color:#8fa0b3\">交易含义：若EPS增长持续，股市估值压力将被盈利消化，<b class=\"em\">但通胀下行可能压缩名义增长</b></span>"]]], ["宏观经济", [["@RaoulGMI", "全球宏观", "瓶颈理论：找到世界前进道路上的阻碍，资本就会涌向那里。宇宙在求解单位能量的智能，瓶颈将被清除，<b class=\"em\">下一阶段AI代理将自主分配资本并决定构建什么。</b> <span style=\"color:#8fa0b3\">交易含义：资本将集中流向解决能源和算力瓶颈的领域，<b class=\"em\">AI代理自主化将重塑资本配置格局</b></span>"], ["@BobEUnlimited", "宏观研究", "非正式部门就业崩塌是最大被忽视的劳动力市场主题，家庭调查显示经济-wide层面的疲软远比薪资调查显示的更广。 <span style=\"color:#8fa0b3\">交易含义：若非正式就业持续恶化，消费数据将滞后反映，<b class=\"em\">经济衰退风险被低估</b></span>"], ["@EconguyRosie", "", "<b class=\"em\">宏观多头试图用世界杯效应粉饰这份就业报告，</b>但薪资和家庭调查双双收缩，数据扭曲的说法站不住脚。 <span style=\"color:#8fa0b3\">交易含义：若就业收缩被证实，<b class=\"em\">市场对经济韧性的定价将面临修正</b></span>"], ["@charliebilello", "", "7月失业率降至4.1%并非因就业改善，而是26.4万人退出劳动力市场，参与率降至61.4%（2021年2月以来最低），就业报告实质疲弱。 <span style=\"color:#8fa0b3\">交易含义：参与率持续下降掩盖了就业市场真实恶化，若趋势延续，<b class=\"em\">消费和通胀预期将下修</b></span>"]]]]], ["地缘政治", [["中东", [["@ianbremmer", "地缘政治 (Eurasia Group)", "沙特-土耳其-巴基斯坦防御同盟实质上是核心伊斯兰联盟，<b class=\"em\">直接回应美伊战争后美国地区安全承诺不可靠的认知；</b>该同盟方向与亚伯拉罕协议截然不同，标志中东安全架构从美国主导转向区域自主整合。 <span style=\"color:#8fa0b3\">交易含义：<b class=\"em\">地区安全架构重构将改变原油风险溢价定价逻辑，</b>美国盟友体系分化可能加速美元资产在中东的避险地位弱化</span>"], ["@BarakRavid", "中东记者 (Axios)", "伊朗谈判团队正等待最高国家安全委员会就与阿曼和美国的核协议给予最终批准，调解国外交官预期批准很快到来；若获批，<b class=\"em\">美伊关系正常化将进入实质执行阶段。</b> <span style=\"color:#8fa0b3\">交易含义：核协议批准落地将直接压低原油地缘溢价，<b class=\"em\">但需警惕批准后执行细节分歧引发的二次波动</b></span>"], ["@Charles_Lister", "", "所谓叙利亚武装分子2024年12月越过1974年停火线的说法是近期凭空出现的虚构叙事，被以色列高层反复引用；事实是阿萨德离开后数小时内以色列单方面入侵叙利亚。 <span style=\"color:#8fa0b3\">交易含义：叙以边境叙事战升级可能为以色列进一步军事行动提供借口，<b class=\"em\">关注戈兰高地局势对地区风险溢价的边际影响</b></span>"]]], ["俄乌", [["@PhillipsPOBrien", "战略研究", "特朗普政府正在挪用国会已拨付的应援乌资金，这实质上是行政分支对立法分支拨款权的侵犯，<b class=\"em\">将削弱乌克兰在战场上的持续作战能力。</b> <span style=\"color:#8fa0b3\">交易含义：援乌资金挪用若持续，<b class=\"em\">乌克兰前线弹药短缺将加速，</b>欧洲安全资产和国防股可能获得重新定价</span>"]]]]], ["能源", [["原油", [["@Go_Rozen", "", "霍尔木兹海峡持续受阻数月，美国原油及成品油库存自3月以来已下降约2亿桶，但投资者仍极度看空；我们认为真正的危机可能还在后面，<b class=\"em\">市场低估了供应中断的持续性。</b> <span style=\"color:#8fa0b3\">交易含义：库存大幅消耗与看空情绪背离，<b class=\"em\">若供应中断持续，</b>油价存在向上修正的逆向交易机会</span>"], ["@JavierBlas", "能源记者 (BBG)", "伊朗内部外交官与伊斯兰革命卫队（IRGC）之间存在分歧，<b class=\"em\">这是理解伊朗石油供应前景的关键变量。</b> <span style=\"color:#8fa0b3\">交易含义：伊朗内部权力斗争可能影响其原油出口政策，<b class=\"em\">增加供应端的不确定性</b></span>"]]]]], ["农产品", [["最近有效 · 08-06 · 天气气候", [["@climateguyw", "气候研究", "8月5日西部热浪仍为危险级CAT3，本周将再度增强；同时东部正形成独立热穹顶，东西两线高温并行，<b class=\"em\">需警惕电力与能源需求共振。</b> <span style=\"color:#8fa0b3\">交易含义：<b class=\"em\">双热穹顶叠加将放大电力负荷峰值，</b>天然气与电价波动率或显著上升</span>"]]]]], ["AI半导体", [["推理", [["@fchollet", "", "测试时计算（TTC）将计算转化为任意任务技能水平，唯一变量是支付意愿，<b class=\"em\">推理算力需求或呈指数级增长。</b> <span style=\"color:#8fa0b3\">交易含义：TTC范式确立，<b class=\"em\">推理算力需求可能远超市场预期</b></span>"]]], ["其他 AI / 半导体", [["@EconomyApp", "", "Uber Q2 FY26：预订量增长24%，年化FCF超100亿美元，自动驾驶已在7城运营目标15城，成熟市场份额提升，但估值仅约10倍2027年EBITDA。 <span style=\"color:#8fa0b3\">交易含义：Uber估值与增长数据背离，<b class=\"em\">自动驾驶规模化或成估值重估催化剂</b></span>"], ["@skorusARK", "", "轨道计算投资时机与电动车发展相似：当计算资源溢价极高时投资，可让先行者通过成本优势逐步建立壁垒，存在类似EV的爬坡动态。 <span style=\"color:#8fa0b3\">交易含义：轨道计算若复制EV路径，早期投资者或享成本曲线下降红利</span>"]]]]]]}, "report_en": {"insights": [{"title": "Top Buzz · AI Compute / GPU", "points": ["Core view: <b class=\"em\">Key View: @chamath: Electricity is the hard constraint on AI development,</b> data centers are being shut down, GPUs are sold out, models are commoditized, and spot prices are rising. The key is electricity, not future plans like distributed batteries."]}, {"title": "Biggest Divergence · Fed / Rates", "points": ["Core view: Key View: @LawrenceLepard: The Fed's H.4.1 report shows swap lines increased by $50 billion from zero, almost certainly related to Japan. This explains why Bessent asked to lift the FIMA cap. <b class=\"em\">Next week's report could show</b> $100 billion <b class=\"em\">.</b>"]}, {"title": "High Alert · Fed / Rates", "points": ["Core view: <b class=\"em\">Key View: @biancoresearch: FOMC decisions are now made by twelve independent voters,</b> not the chair. This is the hardest change for Fed watchers to understand, and criticism of Warsh for not providing forward guidance is a misunderstanding."]}, {"title": "Contrarian Variable · Precious Metals", "points": ["Core view: Key View: @LukeGromen (Global Macro): To restore gold's role as the world's primary/sole reserve asset as before the 1922 Genoa Conference, gold prices need to be well above $5,000/oz. Current preparations point to a transformation unseen in a century, <b class=\"em\">a major positive for dollar assets.</b>"]}, {"title": "Sentiment Shift · Crude Oil", "points": ["Core view: Key View: @Go_Rozen: The Strait of Hormuz has been blocked for months, and U.S. crude and product inventories have fallen by about 200 million barrels since March, yet investors remain extremely bearish. We think the real crisis may still be ahead; <b class=\"em\">the market underestimates the persistence of supply disruptions.</b>"]}], "unique": [["@BobEUnlimited", "The collapse in informal-sector employment is the biggest overlooked labor market theme. Household surveys show broader economic weakness than payroll surveys suggest.", "If informal employment continues to deteriorate, consumer data will lag, and recession risk is underestimated."], ["@LukeGromen", "To restore gold's role as the world's primary/sole reserve asset as before the 1922 Genoa Conference, gold prices need to be well above $5,000/oz. Current preparations point to a transformation unseen in a century, a major positive for dollar assets.", "If gold breaks above $5,000, sovereign debt and the dollar system will face repricing, strengthening the bullish case for gold."], ["@WarrenPies", "Historically, in 89 Fed meetings following negative nonfarm payrolls, only two hikes occurred (Nov 1999 and Nov 2005). There is another NFP report before the September meeting, and current data do not support a September hike.", "If employment continues to weaken before September, rate hike expectations will be dashed, and the rates market will reprice."], ["@LawrenceLepard", "The Fed's H.4.1 report shows swap lines increased by $50 billion from zero, almost certainly related to Japan. This explains why Bessent asked to lift the FIMA cap. Next week's report could show $100 billion.", "The surge in swap lines suggests dollar liquidity stress. If it breaks $100 billion next week, gold and silver will find strong support."]], "sections": [["Macro Economy", [["AI Compute / GPU", [["@chamath", "", "Electricity is the hard constraint on AI development. Data centers are being shut down, GPUs are sold out, models are commoditized, and spot prices are rising. The key is electricity, not future plans like distributed batteries. <span style=\"color:#8fa0b3\">Trading implication: <b class=\"em\">Electricity shortages will limit AI capacity expansion,</b> making power-related assets and utilities worth attention.</span>"]]], ["Precious Metals", [["@LukeGromen", "Global Macro", "To restore gold's role as the world's primary/sole reserve asset as before the 1922 Genoa Conference, gold prices need to be well above $5,000/oz. Current preparations point to a transformation unseen in a century, <b class=\"em\">a major positive for dollar assets.</b> <span style=\"color:#8fa0b3\">Trading implication: If gold breaks above $5,000, <b class=\"em\">sovereign debt and the dollar system will face repricing,</b> strengthening the bullish case for gold.</span>"], ["@TimmerFidelity", "", "Gold has been consolidating around $4,000 all year. A triangle pattern could break lower, but global money supply growth has picked up from 7% to 9%, <b class=\"em\">providing fundamental support for gold prices.</b> <span style=\"color:#8fa0b3\">Trading implication: If money supply growth persists, <b class=\"em\">downside for gold is limited,</b> and $4,000 is a mid-term accumulation zone.</span>"]]], ["Fed / Rates", [["@biancoresearch", "", "FOMC decisions are now made by twelve independent voters, not the chair. This is the hardest change for Fed watchers to understand, and criticism of Warsh for not providing forward guidance is a misunderstanding. <span style=\"color:#8fa0b3\">Trading implication: Policy path uncertainty is rising, and rate volatility may increase. <b class=\"em\">Traders should reduce reliance on any single signal</b>.</span>"], ["@WarrenPies", "Macro Strategy", "Historically, in 89 Fed meetings following negative nonfarm payrolls, only two hikes occurred (Nov 1999 and Nov 2005). There is another NFP report before the September meeting, and current data do not support a September hike. <span style=\"color:#8fa0b3\">Trading implication: If employment continues to weaken before September, rate hike expectations will be dashed, <b class=\"em\">and the rates market will reprice</b>.</span>"], ["@AndreasSteno", "", "We already had the softest NFP forecast on the street, and actual data came in even lower. <b class=\"em\">We expect the Fed to be dovishly surprised on both employment and prices,</b> and they will not hike. <span style=\"color:#8fa0b3\">Trading implication: If the Fed turns dovish, <b class=\"em\">the dollar and Treasury yields will face pressure,</b> giving risk assets some breathing room.</span>"], ["@LawrenceLepard", "", "The Fed's H.4.1 report shows swap lines increased by $50 billion from zero, almost certainly related to Japan. This explains why Bessent asked to lift the FIMA cap. <b class=\"em\">Next week's report could show</b> $100 billion <b class=\"em\">.</b> <span style=\"color:#8fa0b3\">Trading implication: The surge in swap lines suggests dollar liquidity stress. If it breaks $100 billion next week, <b class=\"em\">gold and silver will find strong support</b>.</span>"], ["@Stephanie_Link", "", "This week's economic data were generally solid. ISM and jobless claims offset the weak NFP. <b class=\"em\">AHE, ULC, and productivity point to disinflation,</b> and EPS +48% YoY is the key. <span style=\"color:#8fa0b3\">Trading implication: If EPS growth persists, equity valuation pressure will be absorbed by earnings, <b class=\"em\">but disinflation may compress nominal growth</b>.</span>"]]], ["Macro Economy", [["@RaoulGMI", "Global Macro", "Bottleneck theory: Find the bottleneck on the world's path forward, and capital will flow there. The universe is solving for intelligence per unit energy, and bottlenecks will be cleared. <b class=\"em\">The next phase is AI agents autonomously allocating capital and deciding what to build.</b> <span style=\"color:#8fa0b3\">Trading implication: Capital will concentrate in areas solving energy and compute bottlenecks, <b class=\"em\">and AI agent autonomy will reshape capital allocation</b>.</span>"], ["@BobEUnlimited", "Macro Research", "The collapse in informal-sector employment is the biggest overlooked labor market theme. Household surveys show broader economic weakness than payroll surveys suggest. <span style=\"color:#8fa0b3\">Trading implication: If informal employment continues to deteriorate, consumer data will lag, <b class=\"em\">and recession risk is underestimated</b>.</span>"], ["@EconguyRosie", "", "<b class=\"em\">Macro bulls are trying to spin this jobs report with the World Cup effect,</b> but both payrolls and household surveys contracted, and the data distortion argument doesn't hold. <span style=\"color:#8fa0b3\">Trading implication: If the employment contraction is confirmed, <b class=\"em\">market pricing of economic resilience will face a correction</b>.</span>"], ["@charliebilello", "", "The July unemployment rate fell to 4.1% not because of improved employment, but because 264,000 people left the labor force. The participation rate fell to 61.4% (lowest since Feb 2021), making the jobs report fundamentally weak. <span style=\"color:#8fa0b3\">Trading implication: Falling participation masks the true deterioration in the labor market. If the trend continues, <b class=\"em\">consumer and inflation expectations will be revised down</b>.</span>"]]]]], ["Geopolitics", [["Middle East", [["@ianbremmer", "Geopolitics (Eurasia Group)", "The Saudi-Turkey-Pakistan defense pact is essentially a core Islamic alliance, <b class=\"em\">a direct response to the perception that U.S. regional security commitments are unreliable after the U.S.-Iran war;</b> the alliance's direction is starkly different from the Abraham Accords, marking a shift in Middle East security architecture from U.S.-led to regional self-integration. <span style=\"color:#8fa0b3\">Trading implication: <b class=\"em\">The restructuring of regional security architecture will change the pricing logic of crude oil risk premiums,</b> and fragmentation of U.S. alliances may accelerate the weakening of the dollar's safe-haven status in the Middle East.</span>"], ["@BarakRavid", "Middle East Correspondent (Axios)", "The Iranian negotiating team is awaiting final approval from the Supreme National Security Council on a nuclear deal with Oman and the U.S. Mediator diplomats expect approval soon. If approved, <b class=\"em\">U.S.-Iran normalization will enter a substantive implementation phase.</b> <span style=\"color:#8fa0b3\">Trading implication: Approval of the nuclear deal would directly lower geopolitical premiums on oil, <b class=\"em\">but watch for secondary volatility from implementation details after approval</b>.</span>"], ["@Charles_Lister", "", "The claim that Syrian militants crossed the 1974 ceasefire line in December 2024 is a fabricated narrative that emerged recently, repeatedly cited by Israeli officials. The fact is that Israel unilaterally invaded Syria within hours of Assad's departure. <span style=\"color:#8fa0b3\">Trading implication: The narrative war on the Syria-Israel border could provide a pretext for further Israeli military action, <b class=\"em\">so watch the marginal impact of Golan Heights tensions on regional risk premiums</b>.</span>"]]], ["Russia-Ukraine", [["@PhillipsPOBrien", "Strategic Studies", "The Trump administration is diverting congressionally appropriated funds intended for Ukraine, which is essentially an infringement by the executive branch on legislative appropriation powers. <b class=\"em\">This will weaken Ukraine's sustained combat capability on the battlefield.</b> <span style=\"color:#8fa0b3\">Trading implication: If diversion of Ukraine aid continues, <b class=\"em\">Ukraine's frontline ammunition shortages will accelerate,</b> and European security assets and defense stocks may see repricing.</span>"]]]]], ["AI Semiconductors", [["Inference", [["@fchollet", "", "Test-time compute (TTC) converts compute into skill level for any task, with the only variable being willingness to pay. <b class=\"em\">Inference compute demand could grow exponentially.</b> <span style=\"color:#8fa0b3\">Trading implication: With the TTC paradigm established, <b class=\"em\">inference compute demand may far exceed market expectations</b>.</span>"]]], ["Other AI / Semiconductors", [["@EconomyApp", "", "Uber Q2 FY26: Bookings grew 24%, annualized FCF exceeded $10 billion, autonomous driving is already operating in 7 cities targeting 15, mature market share is rising, but valuation is only about 10x 2027 EBITDA. <span style=\"color:#8fa0b3\">Trading implication: Uber's valuation diverges from growth data, <b class=\"em\">and autonomous driving scale-up could be a catalyst for valuation re-rating</b>.</span>"], ["@skorusARK", "", "The timing of investment in orbital computing is similar to EVs: investing when compute resources command a high premium allows early movers to build moats through cost advantages, with similar ramp dynamics to EVs. <span style=\"color:#8fa0b3\">Trading implication: If orbital computing replicates the EV path, early investors could enjoy the benefits of falling cost curves.</span>"]]]]], ["Energy", [["Crude Oil", [["@Go_Rozen", "", "The Strait of Hormuz has been blocked for months, and U.S. crude and product inventories have fallen by about 200 million barrels since March, yet investors remain extremely bearish. We think the real crisis may still be ahead; <b class=\"em\">the market underestimates the persistence of supply disruptions.</b> <span style=\"color:#8fa0b3\">Trading implication: The divergence between large inventory draws and bearish sentiment suggests <b class=\"em\">if supply disruptions persist,</b> there is a contrarian opportunity for oil prices to correct higher.</span>"], ["@JavierBlas", "Energy Correspondent (BBG)", "There are divisions between Iranian diplomats and the Islamic Revolutionary Guard Corps (IRGC), <b class=\"em\">a key variable for understanding Iran's oil supply outlook.</b> <span style=\"color:#8fa0b3\">Trading implication: Internal power struggles in Iran could affect its crude export policy, <b class=\"em\">adding to supply-side uncertainty</b>.</span>"]]]]], ["Agriculture", [["Latest valid · 08-06 · Weather & Climate", [["@climateguyw", "Climate Research", "The western heatwave on August 5 remains at dangerous CAT3 and will intensify again this week; meanwhile, an independent heat dome is forming in the east, with high temperatures on both fronts, <b class=\"em\">requiring vigilance for resonance in electricity and energy demand.</b> <span style=\"color:#8fa0b3\">Trading Implication: <b class=\"em\">Dual heat domes will amplify peak electricity loads,</b> potentially significantly increasing volatility in natural gas and electricity prices</span>"]]]]]]}, "tweets": [{"h": "chamath", "tier": 1, "b": "macro", "t": "2026-08-07 07:36", "x_zh": "电力是绝对的约束条件。数据中心被关闭，GPU售罄，模型被商品化，现货价格上涨，这些都导致电力成为关键。不是关于电力的幻想计划，不是BTM或分布式电池的未来预测等等，而是", "x_en": "Power is THE binding constraint. \n\nData centers are being shut down, GPUs are sold out, models are being commoditized and spot rates are rising all leads to power being critical. Not fanciful plans for power, future forecasts of BTM or distributed batteries blah blah blah but", "u": "https://x.com/chamath/status/2085631260722921760", "lk": 2335, "rt": 296, "rp": 172, "eng": 2803, "lang": "en", "tags": ["macro", "equities", "technology"], "important": true}, {"h": "MichaelAArouet", "tier": 2, "b": "macro", "t": "2026-08-07 14:53", "x_zh": "左派如何能板着脸，用更高的税收惩罚在那里工作的人，将钱重新分配给不想工作的人，并认真称之为“社会正义”？", "x_en": "How do the left keep a straight face when they punish people working there with higher taxes to redistribute the money to people who don’t want to work, and seriously call it “social justice”?", "u": "https://x.com/MichaelAArouet/status/2085741114363924970", "lk": 1533, "rt": 187, "rp": 35, "eng": 1755, "lang": "en", "tags": ["macro", "economics", "data"], "important": true}, {"h": "LukeGromen", "tier": 1, "b": "macro", "t": "2026-08-07 14:13", "x_zh": "为“百年未见的变化”所做的准备仍在继续——即黄金恢复其作为世界主要/唯一储备资产的角色，就像1922年热那亚会议之前那样。黄金可能需要远高于5000美元/盎司才能恢复这一角色。这对美国来说极为利好。", "x_en": "Preparations continue for “changes not seen in 100 years” - a.k.a. for gold to resume its role as the world’s primary/sole reserve asset, as it was pre-1922 Genoa Conference\n\nGold likely needs to be way higher than $5,000/oz. to resume that role\n\nThis is massively bullish for USA", "u": "https://x.com/LukeGromen/status/2085731000554807759", "lk": 1028, "rt": 150, "rp": 58, "eng": 1236, "lang": "en", "tags": ["macro", "sovereign_debt", "commodities"], "important": true}, {"h": "biancoresearch", "tier": 1, "b": "macro", "t": "2026-08-07 11:17", "x_zh": "CEO是Mat Ishiba，菲尼克斯太阳队的大股东，并且拥有在2030年购买芝加哥白袜队的选项。这是商业中最古老的故事：当你被一支职业体育队分散注意力，更不用说两支职业体育队时，你原来的业务就会衰落。", "x_en": "The CEO is Mat Ishiba, majority owner of the Phoenix Suns and has an option to buy the Chicago White Sox in 2030.\n\nThis is the oldest story in business: when you're distracted by a professional sports team, let alone two professional sports teams, your original business falls", "u": "https://x.com/biancoresearch/status/2085686790078202223", "lk": 817, "rt": 42, "rp": 59, "eng": 918, "lang": "en", "tags": ["macro", "rates_fx", "bonds"], "important": true}, {"h": "leadlagreport", "tier": 2, "b": "macro", "t": "2026-08-07 23:34", "x_zh": "美国是世界上唯一一个穷人都肥胖的地方。想一想这一点。", "x_en": "America is the only place in the world where poor people are obese.\n\nThink about that for a moment.", "u": "https://x.com/leadlagreport/status/2085872168429146124", "lk": 603, "rt": 57, "rp": 134, "eng": 794, "lang": "en", "tags": ["macro", "cross_asset", "risk"], "important": true}, {"h": "chamath", "tier": 1, "b": "macro", "t": "2026-08-07 07:50", "x_zh": "如果报道准确，没有任何蒸馏来启动它。从而证明了许多事情是破坏价值而非增加价值的……", "x_en": "And if reports are accurate, with zero distillation to jumpstart it. \n\nThus proving many things that are more value destructive than value accreting…", "u": "https://x.com/chamath/status/2085634732620931377", "lk": 622, "rt": 48, "rp": 69, "eng": 739, "lang": "en", "tags": ["macro", "equities", "technology"], "important": true}, {"h": "BillAckman", "tier": 1, "b": "macro", "t": "2026-08-08 01:03", "x_zh": "关于数据中心建设的有趣想法和框架。这是我喜欢@VivekGRamaswamy竞选州长的原因之一。", "x_en": "Interesting idea and framework on data center construction. This is among the reasons why I like \n@VivekGRamaswamy\n for governor.", "u": "https://x.com/BillAckman/status/2085894695125741854", "lk": 571, "rt": 48, "rp": 47, "eng": 666, "lang": "en", "tags": ["macro", "equities", "activist"], "important": true}, {"h": "RaoulGMI", "tier": 1, "b": "macro", "t": "2026-08-07 17:26", "x_zh": "有一个我不断回归的原则……瓶颈理论。找到阻碍世界前进的东西，那就是资本涌入的地方。因为宇宙正在以单位能量的智能为目标，它将清除一切障碍。", "x_en": "There's a principle I keep coming back to… the bottleneck theory.\n\nFind whatever is standing between the world and where it's trying to get to, and that's where the capital floods. Because the universe is solving for intelligence per unit of energy, and it will clear every", "u": "https://x.com/RaoulGMI/status/2085779691646898273", "lk": 464, "rt": 52, "rp": 56, "eng": 572, "lang": "en", "tags": ["macro", "crypto", "long_cycle"], "important": true}, {"h": "RaoulGMI", "tier": 1, "b": "macro", "t": "2026-08-07 21:38", "x_zh": "下一阶段才是真正起飞的时候。\n\n现在的智能体是半自主的，大致上按你说的去做。\n\n但下一版本才会变得疯狂……它们会自己分配资金，自己决定要构建什么。你会把你的主智能体交给", "x_en": "The next phase is where this really takes off.\n\nAgents are semi-autonomous now, doing what you tell them to, more or less.\n\nBut the next version of them is where it gets wild… they'll allocate their own capital and decide for themselves what to build. You’ll hand your head-agent", "u": "https://x.com/RaoulGMI/status/2085842971665351165", "lk": 442, "rt": 59, "rp": 55, "eng": 556, "lang": "en", "tags": ["macro", "crypto", "long_cycle"], "important": true}, {"h": "EconguyRosie", "tier": 2, "b": "macro", "t": "2026-08-07 14:39", "x_zh": "宏观多头正竭尽全力为这份糟糕的就业报告涂脂抹粉，尽管薪资调查和家庭调查都显示收缩。他们的口头禅是数据被世界杯效应扭曲了，显然这是州和……的唯一原因", "x_en": "The macro bulls are doing their best to paint lipstick on this pig of an employment report, with both the payroll and household surveys showing contraction.  The mantra is that the data were distorted by the World Cup effect that apparently was the only reason that state and", "u": "https://x.com/EconguyRosie/status/2085737597167337519", "lk": 416, "rt": 75, "rp": 45, "eng": 536, "lang": "en", "tags": ["macro", "economics", "cycle"], "important": true}, {"h": "LukeGromen", "tier": 1, "b": "macro", "t": "2026-08-07 15:38", "x_zh": "那么，是AI开始削减工作岗位，还是这些数字是“假新闻”？\n\n如果AI正在削减工作岗位（短期内必须如此才能证明牛市论点的合理性），这意味着AI正在与贝森特竞争借钱（推高贝森特的资本成本），同时削弱贝森特的税基。", "x_en": "So, is AI starting to cut into jobs, or are these numbers “fake news”?\n\nIf AI is cutting into jobs (as it must near term to justify the bull case), it means AI is competing with Bessent to borrow money (raising Bessent’s cost of capital), while undermining Bessent’s tax base.", "u": "https://x.com/LukeGromen/status/2085752490323038587", "lk": 412, "rt": 44, "rp": 53, "eng": 509, "lang": "en", "tags": ["macro", "sovereign_debt", "commodities"], "important": true}, {"h": "WarrenPies", "tier": 1, "b": "macro", "t": "2026-08-07 16:09", "x_zh": "在负就业报告之后，美联储仅加息过两次（1999年11月和2005年11月）。\n\n这是在89次紧随负就业增长之后的美联储会议中发生的。\n\n注意，在9月会议之前还有另一份非农报告。", "x_en": "The Fed has only hiked twice following a negative jobs report (Nov 1999 and Nov 2005).\n\nThis is out of 89 Fed meetings immediately following negative jobs growth.\n\nNote, there is another NFP report prior to the September meeting.", "u": "https://x.com/WarrenPies/status/2085760352743051585", "lk": 297, "rt": 35, "rp": 19, "eng": 351, "lang": "en", "tags": ["macro", "oil_energy", "cycle"], "important": true}, {"h": "LawrenceLepard", "tier": 2, "b": "macro", "t": "2026-08-07 21:59", "x_zh": "美联储H.4.1报告昨日显示互换额度增加500亿美元，从零起步，几乎可以肯定与日本有关。现在我们明白为什么贝森特想要解除600亿美元的FIMA上限。下周四的报告将会很有趣……你能说1000亿美元吗？", "x_en": "Fed H.4.1 report yesterday showed a $50B increase in swap lines up from zero almost certainly related to Japan. Now we know why Bessent wants the $60B FIMA cap lifted.  Next Thursday’s report will be interesting ….  can you say $100B?", "u": "https://x.com/LawrenceLepard/status/2085848213257330876", "lk": 282, "rt": 35, "rp": 33, "eng": 350, "lang": "en", "tags": ["macro", "gold", "hard_assets"], "important": true}, {"h": "WarrenPies", "tier": 1, "b": "macro", "t": "2026-08-07 12:58", "x_zh": "7月就业\n\n又是一份疲软的劳动力报告（-2.3万岗位+负修正）。\n\n住宅建筑薪资连续第四个月下降……现在处于2022年以来的最低水平。\n\n失业率因劳动力参与率下降再次降至4.1%。黄金年龄劳动力参与率降至83.3%，在多年低点附近徘徊。", "x_en": "JULY JOBS\n\nAnother weak labor report (-23k jobs + neg revision).\n\nRes construction payrolls down for the 4th straight month...now at the lowest level since 2022.\n\nUE rate drops to 4.1% again due to falling LFPR. Prime-age LFPR down to 83.3% bouncing around a multi-year low.", "u": "https://x.com/WarrenPies/status/2085712236807364666", "lk": 259, "rt": 35, "rp": 22, "eng": 316, "lang": "en", "tags": ["macro", "oil_energy", "cycle"], "important": true}, {"h": "biancoresearch", "tier": 1, "b": "macro", "t": "2026-08-07 10:15", "x_zh": "目前，美联储观察者最难理解的是，FOMC政策决策现在由十二位独立投票者做出，而不是由一位主席告诉其他十一位如何投票。\n\n这就是为什么批评沃什没有提供前瞻指引或反应函数……", "x_en": "Right now, the hardest thing for Fed watchers to understand is the FOMC policy decisions are now made by twelve independent voters, not a chairman who tells the other eleven how to vote.\n\nThis is why the criticism of Warsh for not providing forward guidance or a reaction function", "u": "https://x.com/biancoresearch/status/2085671198348718093", "lk": 247, "rt": 20, "rp": 44, "eng": 311, "lang": "en", "tags": ["macro", "rates_fx", "bonds"], "important": true}, {"h": "AndreasSteno", "tier": 1, "b": "macro", "t": "2026-08-07 12:45", "x_zh": "我们拥有华尔街最软的非农预测，但实际数据甚至比我们的预测还低一点……正如我们告诉客户的，我们预计美联储将对就业和价格双双感到鸽派意外\n\n没有加息，因为我们的实时数据在整个沟通过程中一直在告诉美联储这一点", "x_en": "We had the softest NFP forecast on the street, but it actually came in even a little below that call...  and as we have said to clients, we expect the Fed to be dovishly surprised by BOTH jobs and prices\n\nNo hikes as our live-data has told the Fed throughout this communication", "u": "https://x.com/AndreasSteno/status/2085708911185625197", "lk": 240, "rt": 22, "rp": 24, "eng": 286, "lang": "en", "tags": ["macro", "rates_fx", "cross_asset"], "important": true}, {"h": "charliebilello", "tier": 2, "b": "macro", "t": "2026-08-07 17:15", "x_zh": "美国失业率在7月降至4.1%。通常，这会是好消息。但失业率下降并非因为失业者找到了工作，而是有26.4万人退出了劳动力市场，导致劳动参与率降至61.4%（自2021年2月以来最低）。", "x_en": "The US Unemployment Rate moved down to 4.1% in July. Normally, that would be good news. But it didn’t fall because people who were unemployed found jobs. Instead, 264k people simply left the labor force, pushing the participation rate down to 61.4% (lowest since February 2021).", "u": "https://x.com/charliebilello/status/2085776887230406880", "lk": 139, "rt": 28, "rp": 28, "eng": 195, "lang": "en", "tags": ["macro", "data", "markets"], "important": true}, {"h": "charliebilello", "tier": 2, "b": "macro", "t": "2026-08-07 16:57", "x_zh": "美国失业率在7月降至4.1%，为2025年6月以来最低。就业岗位减少2.3万个，而预期为增加8.8万个。5月和6月的就业数据被下修10.3万个。薪资同比增速为+3.2%（自2021年5月以来最低）。在疲弱报告后，美联储不再预期在9月加息。", "x_en": "US Unemployment Rate moved down to 4.1% in July, the lowest level since June 2025. 23k jobs were lost vs. an 88k expected gain. May/June jobs were revised down 103k. YoY wage growth: +3.2% (lowest since May '21). After weak report, Fed is no longer expected to hike in September.", "u": "https://x.com/charliebilello/status/2085772252897829054", "lk": 132, "rt": 14, "rp": 27, "eng": 173, "lang": "en", "tags": ["macro", "data", "markets"], "important": true}, {"h": "TimmerFidelity", "tier": 1, "b": "macro", "t": "2026-08-07 22:38", "x_zh": "黄金今年一直被困在4000美元左右的区间内，仅从三角形图表形态来看，金价可能会进一步走低。但对黄金而言的好消息是，全球货币供应量再次上升，其增长率从7%回升至9%。但仍低于……", "x_en": "Gold has been stuck in a range around $4,000 all year, and based on the triangle chart pattern alone, it might well go a bit lower than that. But the good news for gold is that the global money supply is rising again, with its growth rate recovering from 7% to 9%. It’s still down", "u": "https://x.com/TimmerFidelity/status/2085858021004239216", "lk": 128, "rt": 21, "rp": 12, "eng": 161, "lang": "en", "tags": ["macro", "equities", "cycle"], "important": true}, {"h": "LawrenceLepard", "tier": 2, "b": "macro", "t": "2026-08-07 15:31", "x_zh": "Robert的分析非常出色。910亿美元可不是开玩笑的。", "x_en": "Excellent analysis by Robert.  $91B is no joke.", "u": "https://x.com/LawrenceLepard/status/2085750645563220244", "lk": 127, "rt": 13, "rp": 6, "eng": 146, "lang": "en", "tags": ["macro", "gold", "hard_assets"], "important": true}, {"h": "TimmerFidelity", "tier": 1, "b": "macro", "t": "2026-08-07 16:37", "x_zh": "有两种粗略估算方法可以确定债券收益率上升的影响。债券与股票估值图表显示了股票远期市盈率与债券“市盈率”（收益率倒数）的散点图。目前两者的倍数都在20倍左右。如果10年期……", "x_en": "There are two back-of-the-envelope approaches to determining the impact of higher bond yields. The Bond vs Equity Valuations chart shows a scatter plot of the equity forward P/E against the bond “P/E” (inverse of yield). Currently both multiples are around 20x. if the 10-year", "u": "https://x.com/TimmerFidelity/status/2085767367099892184", "lk": 119, "rt": 16, "rp": 8, "eng": 143, "lang": "en", "tags": ["macro", "equities", "cycle"], "important": true}, {"h": "McClellanOsc", "tier": 2, "b": "macro", "t": "2026-08-07 21:17", "x_zh": "这张图表最初创建时缺少重要背景信息。所以我用红色添加了它。", "x_en": "This chart as originally created is missing important context. So I added it, in red.", "u": "https://x.com/McClellanOsc/status/2085837871085466089", "lk": 121, "rt": 11, "rp": 6, "eng": 138, "lang": "en", "tags": ["macro", "technical", "cycle"], "important": true}, {"h": "BobEUnlimited", "tier": 1, "b": "macro", "t": "2026-08-07 13:47", "x_zh": "非正规部门就业的崩溃是最大的劳动力市场主题，但未受到关注。当所有人都关注非农就业（蓝线）时，家庭调查（红线）包含了非正规工作，并捕捉到了整体经济层面的更广泛疲软。", "x_en": "The collapse in informal sector employment is the biggest labor market theme not getting attention. \n\nWhile everyone focuses on payrolls (blue), the HH survey (red) includes informal work and is picking up the broader weakness at the economy-wide level.", "u": "https://x.com/BobEUnlimited/status/2085724461815234912", "lk": 85, "rt": 17, "rp": 20, "eng": 122, "lang": "en", "tags": ["macro", "rates_fx", "cycle"], "important": true}, {"h": "LawrenceLepard", "tier": 2, "b": "macro", "t": "2026-08-07 22:18", "x_zh": "LL：值得你花时间。\n\n让白银疯狂的美联储恐慌 | Michael Oliver\nhttps://youtu.be/aXg4M1ZVkwE?si=7I6waSe9TYdLjZx2\n… 通过 @YouTube", "x_en": "LL:  worth your time.\n\nThe Fed Panic That Sends Silver Berserk | Michael Oliver \nhttps://\nyoutu.be/aXg4M1ZVkwE?si\n=7I6waSe9TYdLjZx2\n… via \n@YouTube", "u": "https://x.com/LawrenceLepard/status/2085853152331350088", "lk": 100, "rt": 10, "rp": 9, "eng": 119, "lang": "en", "tags": ["macro", "gold", "hard_assets"], "important": true}, {"h": "LawrenceLepard", "tier": 2, "b": "macro", "t": "2026-08-07 16:40", "x_zh": "这是一次非常有趣的对话。Tom 懂了！", "x_en": "This was a super fun conversation. Tom gets it!", "u": "https://x.com/LawrenceLepard/status/2085768127338410269", "lk": 106, "rt": 9, "rp": 0, "eng": 115, "lang": "en", act—in effect a core islamic alliance— is a direct response to us iran war and perception the united states can’t be relied on for regional security. \n\n(and, goes without saying, a very different direction in the region than the abraham", "u": "https://x.com/ianbremmer/status/2085733650604155170", "lk": 1044, "rt": 236, "rp": 69, "eng": 1349, "lang": "en", "tags": ["geopolitics", "political_risk", "global_macro"], "important": true}, {"h": "PhillipsPOBrien", "tier": 2, "b": "geopolitics", "t": "2026-08-07 14:40", "x_zh": "啊，原来特朗普政府就是在窃取国会拨给乌克兰的援助资金。", "x_en": "Ah, turns out that the Trump administration is just stealing congressionally appropriated funds that should be helping Ukraine.", "u": "https://x.com/PhillipsPOBrien/status/2085737905759146450", "lk": 829, "rt": 272, "rp": 0, "eng": 1101, "lang": "en", "tags": ["geopolitics", "ukraine", "military"], "important": true}, {"h": "BarakRavid", "tier": 1, "b": "geopolitics", "t": "2026-08-07 17:33", "x_zh": "一位来自调解国家的外交官告诉我，伊朗谈判代表正在等待伊朗最高国家安全委员会对与阿曼和美国协议的最终批准。这位外交官说：“我们预计很快就会获得批准。”", "x_en": "A diplomat from one of the mediating countries told me Iranian negotiators are waiting for final approvals from the Iranian supreme national security council about the deal with Oman and the US. \"We expect this approval soon\", the diplomat said", "u": "https://x.com/BarakRavid/status/2085781324422431130", "lk": 518, "rt": 146, "rp": 144, "eng": 808, "lang": "en", "tags": ["geopolitics", "middle_east", "diplomacy"], "important": true}, {"h": "Charles_Lister", "tier": 2, "b": "geopolitics", "t": "2026-08-07 12:35", "x_zh": "“叙利亚武装分子”在2024年12月**没有**越过1974年停火线。这个虚构的说法——用红色标出——最近几周凭空出现，并被以色列高级领导人反复使用。真相是什么？在阿萨德离开后的几小时内，以色列单方面入侵了叙利亚。", "x_en": "\"Syrian militants\" did **not** cross the 1974 line in Dec 2024.\n\nThis fictional narrative - in red - has come out of nowhere in recent weeks & been used repeatedly by senior #Israel leaders.\n\nThe truth? \n\nWithin hours of #Assad leaving, #Israel unilaterally invaded #Syria.", "u": " 账户（=管理资金及其他报告持仓）的原油净持仓图表 #OOTT 最新值为8月4日。", "x_en": "Charts on crude net-positioning of non-commercial accounts (=managed money and other reportables) in Brent and WTI futures and options combined (ICE, CFTC)  #OOTT  latest value is August 4", "u": "https://x.com/staunovo/status/2085813731867476388", "lk": 45, "rt": 9, "rp": 0, "eng": 54, "lang": "en", "tags": ["commodities", "oil_energy", "sellside"], "important": false}, {"h": "sama", "tier": 2, "b": "ai_semis", "t": "2026-08-07 22:54", "x_zh": "astra是一个强大的模型，我们正在努力使其广泛可用。\n\n我们认为将强大模型只保留给少数人并非良策。\n\n鉴于其网络能力，我们需要更多时间以确保安全。但希望不会太久！", "x_en": "astra is a powerful model and we are working to make it generally available.\n\nwe do not think it is a good strategy to keep powerful models to a chosen few.\n\ngiven its cyber capabilities, we need a little big longer to do do this safely. but hopefully not too long!", "u": "https://x.com/sama/status/2085862292311396515", "lk": 12000, "rt": 815, "rp": 965, "eng": 13780, "lang": "en", "tags": ["ai_semis", "ai", "executive"], "important": true}, {"h": "gdb", "tier": 2, "b": "ai_semis", "t": "2026-08-07 19:11", "x_zh": "对我们下一个主要模型Astra的评估显示，在智能体编码和网络安全方面有显著能力提升。\n\n团队正在进行安全与安保工作，以使Astra广泛可用，并将其先进的网络能力交到防御者手中：", "x_en": "Evaluations of our next major model, Astra, indicate significant capability advancements in agentic coding and cybersecurity.\n\nTeam is doing the safety and security work to make Astra broadly available, and get its advanced cyber capabilities into the hands of defenders:", "u": "https://x.com/gdb/status/2085805983440499060", "lk": 2680, "rt": 133, "rp": 193, "eng": 3006, "lang": "en", "tags": ["ai_semis", "ai", "executive"], "important": true}, {"h": "natolambert", "tier": 2, "b": "ai_semis", "t": "2026-08-07 14:43", "x_zh": "我的暑期项目完成了！一个20视频、免费的关于后训练的课程，配合我的书，全部在YouTube上，幻灯片可修改和复用。\n\n约12小时的内容涵盖核心基础和一些我认为将日益重要的研究领域。制作过程很有趣。", "x_en": "My summer project is done! A 20 video, free course on post-training to accompany my book is all on YouTube with slides open for modification & re-use. \n\n~12 hours of content covers the core foundations and some research areas I think will grow in importance. It was a fun time to", "u": "https://x.com/natolambert/status/2085738662072127959", "lk": 1180, "rt": 137, "rp": 52, "eng": 1369, "lang": "en", "tags": ["ai_semis", "ai_research", "models"], "important": true}, {"h": "gdb", "tier": 2, "b": "ai_semis", "t": "2026-08-07 20:05", "x_zh": "@gdb\nGPT-5.6 Sol 用于网络安全：", "x_en": "GPT-5.6 Sol for cybersafety:", "u": "https://x.com/gdb/status/2085819760953192790", "lk": 493, "rt": 22, "rp": 33, "eng": 548, "lang": "en", "tags": ["ai_semis", "ai", "executive"], "important": true}, {"h": "fchollet", "tier": 2, "b": "ai_semis", "t": "2026-08-07 18:34", "x_zh": "@fchollet\n在基础 LLM 扩展时代（2022-2024），我曾认为 LLM 研究方向会达到能力平台期（正如后来基础 LLM 所表现的那样）。\n\n2024 年底，在 o3 测试时计算演示之后，我改变了看法：新模型展现出真正的流体智能，并且", "x_en": "In the era of base LLM scaling (2022-2024), I believed the LLM line of research would reach a capability plateau (as later seen with base LLMs).\n\nIn late 2024, after the o3 test-time compute demo, I changed my views: the new models were showing genuine fluid intelligence, and", "u": "https://x.com/fchollet/status/2085796727362052241", "lk": 377, "rt": 36, "rp": 38, "eng": 451, "lang": "en", "tags": ["ai_semis", "ai_research", "models"], "important": true}, {"h": "gdb", "tier": 2, "b": "ai_semis", "t": "2026-08-08 01:32", "x_zh": "@gdb\nChatGPT 团队正在推出：", "x_en": "ChatGPT team is shipping:", "u": "https://x.com/gdb/status/2085901941838844369", "lk": 330, "rt": 16, "rp": 36, "eng": 382, "lang": "en", "tags": ["ai_semis", "ai", "executive"], "important": true}, {"h": "simonw", "tier": 2, "b": "ai_semis", "t": "2026-08-07 23:57", "x_zh": "@simonw\n感谢 Black Hat 安全大会上 OpenAI 关于“Hugging Face 事件”演讲的视频，我们现在有了从 OpenAI 视角出发的详细时间线——我在这里写下了细节，相当疯狂", "x_en": "Thanks to the video from the Black Hat security conference of OpenAI's presentation about \"The Hugging Face Incident\" we now have a detailed timeline of what happened from OpenAI's perspective - I wrote up the details here, it's pretty wild", "u": "https://x.com/simonw/status/2085877951925801274", "lk": 157, "rt": 15, "rp": 20, "eng": 192, "lang": "en", "tags": ["ai_semis", "ai_engineering", "developer"], "important": true}, {"h": "simonw", "tier": 2, "b": "ai_semis", "t": "2026-08-07 19:20", "x_zh": "@simonw\n我让 Codex Desktop 和 GPT-5.6 Sol Ultra 尝试构建我的 Raccoon Heist 游戏，它做得比 Claude Fable 5 还要好！这是“Moonlight & Mayhem”，现在有一队浣熊闯入博物馆偷金沙丁鱼", "x_en": "I had Codex Desktop and GPT-5.6 Sol Ultra take a go at building my Raccoon Heist game and it did an even better job than Claude Fable 5 did! Here's \"Moonlight & Mayhem\", now with a team of raccoons raiding a museum for the Golden Sardine", "u": "https://x.com/simonw/status/2085808307865014295", "lk": 128, "rt": 8, "rp": 19, "eng": 155, "lang": "en", "tags": ["ai_semis", "ai_engineering", "developer"], "important": true}, {"h": "EconomyApp", "tier": 2, "b": "ai_semis", "t": "2026-08-07 14:20", "x_zh": "@EconomyApp\n$UBER\n 2026 财年第二季度可视化。\n\n 预订量增长 24%\n 年化自由现金流超过 100 亿美元\n 自动驾驶汽车已在 7 个城市运营，目标 15 个\n 成熟自动驾驶市场份额增长\n 然而 Uber 交易价格约为 2027 年 EBITDA 的 10 倍", "x_en": "$UBER\n Q2 FY26 visualized.\n\n Bookings grow 24%\n Annualized FCF tops $10B\n AVs live in 7 cities, targeting 15\n Share gains in mature AV markets\n Yet Uber trades at ~10x 2027 EBITDA", "u": "https://x.com/EconomyApp/status/2085732762619986034", "lk": 82, "rt": 15, "rp": 4, "eng": 101, "lang": "en", "tags": ["ai_semis", "app_economy", "technology"], "important": true}, {"h": "fchollet", "tier": 2, "b": "ai_semis", "t": "2026-08-07 18:36", "x_zh": "@fchollet\n在看到测试时计算在 ARC 1（流体智能测试）上的表现后，我的看法是 TTC 将使计算能够转化为任意任务上任意水平的技能。唯一剩下的变量是你愿意为此付出多少。在", "x_en": "My take after seeing what test-time compute could do on ARC 1 (a test of fluid intelligence) was that TTC would make it possible to turn compute into arbitrary levels of skill at arbitrary tasks. The only remaining variable was how much you were willing to pay to achieve it. Over", "u": "https://x.com/fchollet/status/2085797220100522364", "lk": 45, "rt": 2, "rp": 6, "eng": 53, "lang": "en", "tags": ["ai_semis", "ai_research", "models"], "important": false}, {"h": "skorusARK", "tier": 2, "b": "ai_semis", "t": "2026-08-07 16:17", "x_zh": "@skorusARK\n思考一下轨道计算，以及阶梯是否会在先行者之后出现：\n\n这里有一个有趣的时机动态，感觉与电动汽车发生的情况类似。\n\n在计算资源以大幅溢价定价时投资轨道计算，让你能够通过", "x_en": "Thinking about orbital compute a bit and whether the ladder comes up behind first movers:\n\nThere is an interesting timing dynamic here that feels similar to what happened with EVs. \n\nInvesting in orbital compute when compute is priced at a massive premium lets you work through", "u": "https://x.com/skorusARK/status/2085762231166246942", "lk": 22, "rt": 4, "rp": 2, "eng": 28, "lang": "en", "tags": ["ai_semis", "innovation", "autonomy"], "important": false}, {"h": "eric_seufert", "tier": 2, "b": "ai_semis", "t": "2026-08-07 23:21", "x_zh": "这很令人惊讶。我本以为 Chili's 在 AI 应用方面处于最前沿。", "x_en": "This is surprising. I would have assumed that Chili's is at the very bleeding edge of AI adoption.", "u": "https://x.com/eric_seufert/status/2085869021744816449", "lk": 13, "rt": 1, "rp": 2, "eng": 16, "lang": "en", "tags": ["ai_semis", "advertising", "technology"], "important": false}], "indices": {"energy": {"label_zh": "能源", "label_en": "Energy", "color": "#ef8f4c", "score": null, "raw_score": null, "confidence": 0.0, "status": "no_data", "mentions": 0, "signal_tweets": 0, "kols": 0, "bullish": 0, "bearish": 0}, "metals": {"label_zh": "金属", "label_en": "Metals", "color": "#d8ad55", "score": 50.0, "raw_score": 100.0, "confidence": 0.5, "status": "signal", "mentions": 3, "signal_tweets": 2, "kols": 3, "bullish": 2, "bearish": 0}, "grains": {"label_zh": "谷物油籽", "label_en": "Grains & Oilseeds", "color": "#76b77b", "score": null, "raw_score": null, "confidence": 0.0, "status": "no_data", "mentions": 0, "signal_tweets": 0, "kols": 0, "bullish": 0, "bearish": 0}, "softs": {"label_zh": "软商品", "label_en": "Soft Commodi     var url=new URL(location.href);if(st.view==='full')url.searchParams.set('view','full');else url.searchParams.delete('view');history.replaceState(null,'',url.pathname+(url.search?'?'+url.searchParams.toString():'')+url.hash);
    if(scroll)window.scrollTo({top:0,behavior:'smooth'});
  }

  function renderReport(){
    renderAlerts();
    var r=report(),m=cur().meta;
    $("#win").textContent=uiLang==="en"?m.window_en:m.window_zh; $("#sub").textContent=uiLang==="en"?m.subtitle_en:m.subtitle_zh;
    var ih=$("#insights");ih.innerHTML=""; r.insights.forEach(function(it,i){var c=document.createElement("div");c.className="icard";c.innerHTML='<h3><span class="inum">'+(i+1)+'</span><span>'+it.title+'</span></h3><ul>'+it.points.map(function(p){return "<li>"+p+"</li>"}).join("")+'</ul>';ih.appendChild(c)});
    var sh=$("#sections");sh.innerHTML="";
    r.sections.forEach(function(pair){
      var name=pair[0],subs=pair[1],col=REPC[name]||"#5b8def",nvp=subs.reduce(function(a,s){return a+s[1].length},0);
      var inner=subs.map(function(sd){return '<div class="subg"><div class="subh" style="--sc:'+col+';color:'+col+'">'+sd[0]+'</div>'+sd[1].map(function(row){return '<div class="vp"><span class="vh" data-h="'+esc(row[0].replace("@",""))+'">'+row[0]+'</span>'+(row[1]?'<span class="vr">'+row[1]+'</span>':'')+row[2]+'</div>'}).join("")+'</div>'}).join("");
      var box=document.createElement("div");box.className="bsec";box.innerHTML='<div class="bhead" style="background:'+col+'">'+name+' <span style="font-weight:500;opacity:.75;font-size:12px">'+subs.length+' '+tx("domains")+' · '+nvp+' '+tx("items")+'</span><span class="arrow">▾</span></div><div class="bbody">'+inner+'</div>';
      var bd=box.querySelector(".bbody"),hd=box.querySelector(".bhead"); hd.onclick=function(){bd.style.display=bd.style.display==="none"?"":"none";box.querySelector(".arrow").textContent=bd.style.display==="none"?"▸":"▾"}; sh.appendChild(box);
    });
    sh.querySelectorAll(".vh").forEach(function(v){v.onclick=function(){jumpHandle(v.dataset.h)}});
    var uh=$("#unique");uh.innerHTML=""; r.unique.forEach(function(u){var c=document.createElement("div");c.className="ucard";c.innerHTML='<div class="uh" data-h="'+esc(u[0].replace("@",""))+'">'+u[0]+'</div><div class="uv">'+u[1]+'</div><div class="ui">'+tx("meaning")+u[2]+'</div>';c.querySelector(".uh").onclick=function(){jumpHandle(u[0].replace("@",""))};uh.appendChild(c)});
  }
  function buildPills(){
    var tw=cur().tweets,wrap=$("#boardPills");wrap.innerHTML=""; var counts={all:tw.length};Object.keys(BOARDS).forEach(function(k){counts[k]=0}); tw.forEach(function(t){counts[t.b]=(counts[t.b]||0)+1});
    function mk(key,label,color){var p=document.createElement("button");p.className="pill";p.innerHTML=label+' <span class="cnt">'+(counts[key]||0)+'</span>';if(st.board===key){p.setAttribute("data-on","1");p.style.background=color;p.style.borderColor=color} p.onclick=function(){st.board=key;buildPills();render()};return p}
    wrap.appendChild(mk("all",tx("all"),"#e7b24d")); Object.keys(BOARDS).filter(function(k){return BOARDS[k].show!==false}).forEach(function(k){wrap.appendChild(mk(k,boardLabel(k),BOARDS[k].color))});
  }
  function pass(t){
    if(st.board!=="all"&&t.b!==st.board)return false;
    if(st.tier!=="all"&&(""+t.tier)!==st.tier)return false;
    if(st.lang!=="all"&&t.lang!==st.lang)return false;
    if(st.q){var q=st.q.toLowerCase(); var hay=(bodyOf(t)+" "+(t.x_zh||"")+" "+(t.x_en||"")+" @"+t.h+" "+(t.tags||[]).join(" ")).toLowerCase(); if(hay.indexOf(q)<0)return false}
    return true
  }
  function render(){
    var m=cur().meta,tw=cur().tweets.filter(pass); tw.sort(function(a,b){return st.sort==="hot"?b.eng-a.eng:(a.t<b.t?1:-1)});
    var kol=new Set(tw.map(function(t){return t.h})).size; $("#tstat").innerHTML=tx("show")+' <b>'+tw.length+'</b> / '+m.n_tweets+' · <b>'+kol+'</b> '+tx("kols")+' · '+tx("monitor")+' '+m.n_accounts+' '+tx("accounts");
    var s=$("#stream"); if(!tw.length){s.innerHTML='<div class="empty">'+tx("empty")+'</div>';return} s.innerHTML="";
    tw.forEach(function(t){
      var B=BOARDS[t.b]||{color:"#5b8def"}, body=bodyOf(t), tags=(t.tags||[]).map(function(x){return '<span class="tag" data-tag="'+esc(x)+'">'+esc(x)+'</span>'}).join("");
      var c=document.createElement("div"); c.className="card"; c.tabIndex=0; c.style.setProperty("--bc",B.color);
      c.innerHTML='<div class="chead"><span class="hand" data-h="'+esc(t.h)+'">@'+esc(t.h)+'</span><span class="bchip" style="background:'+B.color+'">'+boardShort(t.b)+'</span>'+(t.tier===1?'<span class="t1">'+tx("tier1")+'</span>':'')+'<span class="lang">'+(t.lang==="zh"?tx("langZh"):tx("langEn"))+'</span><span class="time mono">'+esc(t.t)+'</span></div><div class="cbody">'+hl(body,st.q)+'</div><div class="cfoot"><span class="eng mono"><span>♥ '+fmt(t.lk)+'</span><span>⟲ '+fmt(t.rt)+'</span><span>💬 '+fmt(t.rp)+'</span></span><span class="tags">'+tags+'</span><span class="open">'+tx("open")+'</span></div>';
      var bodyEl=c.querySelector(".cbody"); requestAnimationFrame(function(){if(bodyEl.scrollHeight>bodyEl.clientHeight+4){bodyEl.classList.add("clamp"); var mm=document.createElement("span"); mm.className="more"; mm.textContent=tx("more"); bodyEl.after(mm); mm.onclick=function(e){e.stopPropagation();bodyEl.classList.toggle("open");bodyEl.classList.toggle("clamp");mm.textContent=bodyEl.classList.contains("open")?tx("less"):tx("more")}}});
      c.onclick=function(){window.open(t.u,"_blank","noopener")}; c.onkeydown=function(e){if(e.key==="Enter")window.open(t.u,"_blank","noopener")};
      c.querySelector(".hand").onclick=function(e){e.stopPropagation();jumpHandle(t.h)}; c.querySelectorAll(".tag").forEach(function(tg){tg.onclick=function(e){e.stopPropagation();$("#q").value=tg.dataset.tag;st.q=tg.dataset.tag;$("#clr").style.display="block";render()}});
      s.appendChild(c);
    })
  }
  function renderAll(){syncUi();renderReport();renderBrief();renderIndices();buildPills();render();setView(st.view,false)}
  var qi=$("#q"),clr=$("#clr"); qi.oninput=function(){st.q=qi.value.trim();clr.style.display=qi.value?"block":"none";render()}; clr.onclick=function(){qi.value="";st.q="";clr.style.display="none";qi.focus();render()};
  document.addEventListener("keydown",function(e){if(e.key==="/"&&document.activeElement!==qi){e.preventDefault();qi.focus()} if(e.key==="Escape"&&document.activeElement===qi){qi.value="";st.q="";clr.style.display="none";render()}});
  function seg(id,key){var el=$(id);el.querySelectorAll("button").forEach(function(b){b.onclick=function(){el.querySelectorAll("button").forEach(function(x){x.removeAttribute("data-on")});b.setAttribute("data-on","1");st[key]=b.dataset.v;render()}})}
  seg("#sortSeg","sort"); seg("#tierSeg","tier"); seg("#langSeg","lang");
  $("#reset").onclick=function(){st.board="all";st.tier="all";st.lang="all";st.sort="hot";st.q="";qi.value="";clr.style.display="none";[["#sortSeg","hot"],["#tierSeg","all"],["#langSeg","all"]].forEach(function(p){var el=$(p[0]);el.querySelectorAll("button").forEach(function(x){x.setAttribute("data-on",x.dataset.v===p[1]?"1":"")})});buildPills();render()};
  app.querySelectorAll(".langsw button").forEach(function(b){b.onclick=function(){uiLang=b.dataset.lang;renderAll()}});
  $("#viewNav").querySelectorAll("button").forEach(function(b){b.onclick=function(){setView(b.dataset.view,true)}});$("#openFull").onclick=function(){setView('full',true)};
  app.querySelectorAll(".range button").forEach(function(b){b.onclick=function(){st.range=+b.dataset.range;renderAll()}});
  renderAll();
})();
</script>
</div>
