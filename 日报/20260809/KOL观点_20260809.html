idi关于核武器的伪造引文从源头扩散，判断存在系统性破坏谈判的运作。 <span style=\"color:#8fa0b3\">交易含义：谈判进程若被虚假信息干扰，<b class=\"em\">伊朗核风险溢价将重新定价</b></span>"]]], ["俄乌", [["@RALee85", "", "俄军两周前在Azov军团方向进攻虽失败，但暴露其正在学习并实验装甲运用新战术，面对乌最强军团之一仍敢尝试，<b class=\"em\">说明俄军适应能力在提升。</b> <span style=\"color:#8fa0b3\">交易含义：<b class=\"em\">俄军战术迭代可能改变前线消耗节奏，</b>影响乌东防御稳定性预期</span>"], ["@shashj", "", "DHL包裹事件后俄曾因拜登政府信号暂缓混合战，如今再度冒险，判断俄相信特朗普对欧洲支持会减弱，<b class=\"em\">危机风险上升。</b> <span style=\"color:#8fa0b3\">交易含义：俄对美欧同盟裂痕的押注若成立，<b class=\"em\">欧洲安全溢价将显著上升</b></span>"], ["@michaeldweiss", "俄乌问题专家", "泽连斯基称已与特朗普达成许可协议，但感叹若四年前获得这些许可情况会不同，暗示援助时机滞后削弱了战略效果。 <span style=\"color:#8fa0b3\">交易含义：援助到位时间差影响战场态势，若后续许可执行延迟，乌军反攻窗口或收窄</span>"], ["@PhillipsPOBrien", "战略研究", "特朗普对俄法案仍需众议院通过、特朗普签署并实际执行，<b class=\"em\">任何一步未兑现都意味着对俄施压落空，</b>判断当前乐观情绪过早。 <span style=\"color:#8fa0b3\">交易含义：法案落地不确定性高，若最终未执行，<b class=\"em\">俄资产相关交易逻辑需重估</b></span>"]]], ["中美", [["@RushDoshi", "", "国家可自由选择增长模式，<b class=\"em\">但不应通过贸易和资本账户将成本外部化，</b>这是对华经济博弈的核心逻辑框架。 <span style=\"color:#8fa0b3\">交易含义：若美按此逻辑施压，<b class=\"em\">中国出口和资本流动将面临更大政策约束</b></span>"]]], ["其他地缘", [["@DerekJGrossman", "", "<b class=\"em\">印度应更担心中巴在卡拉奇港的作战协作甚至控制，</b>而非瓜达尔港，后者才是对印海军威胁的实质支点。 <span style=\"color:#8fa0b3\">交易含义：<b class=\"em\">中巴海军协作升级将改变印度洋力量平衡，</b>影响南亚安全溢价</span>"]]]]], ["能源", [["最近有效 · 08-08 · 原油", [["@Go_Rozen", "", "霍尔木兹海峡持续受阻数月，美国原油及成品油库存自3月以来已下降约2亿桶，但投资者仍极度看空；我们认为真正的危机可能还在后面，<b class=\"em\">市场低估了供应中断的持续性。</b> <span style=\"color:#8fa0b3\">交易含义：库存大幅消耗与看空情绪背离，<b class=\"em\">若供应中断持续，</b>油价存在向上修正的逆向交易机会</span>"], ["@JavierBlas", "能源记者 (BBG)", "伊朗内部外交官与伊斯兰革命卫队（IRGC）之间存在分歧，<b class=\"em\">这是理解伊朗石油供应前景的关键变量。</b> <span style=\"color:#8fa0b3\">交易含义：伊朗内部权力斗争可能影响其原油出口政策，<b class=\"em\">增加供应端的不确定性</b></span>"]]]]], ["农产品", [["天气气候", [["@climateguyw", "气候研究", "气候变化已使加拿大野火发生概率大致翻倍，这标志着极端天气事件正从‘异常’变为‘新常态’，<b class=\"em\">未来类似灾害的频率和强度可能继续上升。</b> <span style=\"color:#8fa0b3\">交易含义：<b class=\"em\">野火频发将扰动木材、能源供应，</b>并推高保险成本，相关大宗商品或面临长期溢价</span>"]]]]], ["AI半导体", [["最近有效 · 08-08 · 推理", [["@fchollet", "", "测试时计算（TTC）将计算转化为任意任务技能水平，唯一变量是支付意愿，<b class=\"em\">推理算力需求或呈指数级增长。</b> <span style=\"color:#8fa0b3\">交易含义：TTC范式确立，<b class=\"em\">推理算力需求可能远超市场预期</b></span>"]]], ["最近有效 · 08-08 · 其他 AI / 半导体", [["@EconomyApp", "", "Uber Q2 FY26：预订量增长24%，年化FCF超100亿美元，自动驾驶已在7城运营目标15城，成熟市场份额提升，但估值仅约10倍2027年EBITDA。 <span style=\"color:#8fa0b3\">交易含义：Uber估值与增长数据背离，<b class=\"em\">自动驾驶规模化或成估值重估催化剂</b></span>"], ["@skorusARK", "", "轨道计算投资时机与电动车发展相似：当计算资源溢价极高时投资，可让先行者通过成本优势逐步建立壁垒，存在类似EV的爬坡动态。 <span style=\"color:#8fa0b3\">交易含义：轨道计算若复制EV路径，早期投资者或享成本曲线下降红利</span>"]]]]]]}, "report_en": {"insights": [{"title": "Top Trending · Macro Economy", "points": ["Core view: Key View: @MichaelAArouet: Germany's industrial collapse is self-inflicted, and <b class=\"em\">years of misguided left-wing green policies will be seen as the largest act of self-destruction in the history of developed economies;</b> the crisis is masked by more debt and government spending, but that won't work forever."]}, {"title": "Biggest Divergence · Precious Metals", "points": ["Core view: <b class=\"em\">Key View: @TaviCosta (Macro Strategy (Crescat)): Copper has been telling us that gold still has room to catch up,</b> and this is one of the most important divergences in the market right now—this lag is your friend."]}, {"title": "High Alert · Middle East", "points": ["Core view: <b class=\"em\">Key View: @ELuttwak: Iran cannot export oil due to the U.S. blockade,</b> has minimal foreign exchange reserves, and can neither import rocket fuel from China nor pay the Shia militias. Yet the media portrays the U.S. as having no options, suggesting the U.S.'s actual leverage is severely underestimated."]}, {"title": "Contrarian Variable · Macro Economy", "points": ["Core view: Key View: @McClellanOsc (Technical Analysis): The U.S. dollar index fell last week due to joint U.S.-Japan intervention on the yen, breaking below the 100.50 support/resistance level, marking the earlier breakout as a failed one, and <b class=\"em\">commercial traders have already reacted to this.</b>"]}, {"title": "Sentiment Shift · Macro Economy", "points": ["Core view: <b class=\"em\">Key View: @BobEUnlimited (Macro Research): When something extraordinary is priced in as consensus,</b> that's the problem. Market sentiment couldn't be more optimistic—think about that."]}], "unique": [["@McClellanOsc", "The U.S. dollar index fell last week due to joint U.S.-Japan intervention on the yen, breaking below the 100.50 support/resistance level, marking the earlier breakout as a failed one, and commercial traders have already reacted to this.", "After the false breakout and pullback in the dollar index, if it weakens further, it will be positive for dollar-denominated commodities like gold and copper"], ["@michaelkantro", "This year, the market's P/E ratio has fallen about 10%, driven mainly by two trends: one is the pricing of Fed policy expectations, and the other is a double-digit decline in the Mag 7's P/E ratio due to rising debt costs, rather than because the P/E ratios themselves were too high.", "If the Fed shifts to easing or debt costs decline, the valuation pressure on Mag 7 eases, potentially driving a repair in the index's P/E ratio"], ["@TaviCosta", "Copper has been telling us that gold still has room to catch up, and this is one of the most important divergences in the market right now—this lag is your friend.", "If copper prices stay strong while gold catches up, there is a mean-reversion trading opportunity in the gold/silver ratio or the gold/copper ratio"], ["@MichaelAArouet", "Germany's industrial collapse is self-inflicted, and years of misguided left-wing green policies will be seen as the largest act of self-destruction in the history of developed economies; the crisis is masked by more debt and government spending, but that won't work forever.", "If German fiscal stimulus proves unsustainable, the core economic momentum of the eurozone will weaken further, which is bearish for EUR/USD"]], "sections": [["Macro Economy", [["Precious Metals", [["@TaviCosta", "Macro Strategy (Crescat)", "Copper has been telling us that gold still has room to catch up, and this is one of the most important divergences in the market right now—this lag is your friend. <span style=\"color:#8fa0b3\">Trading Implication: If copper prices stay strong while gold catches up, there is a mean-reversion trading opportunity in the gold/silver ratio or the gold/copper ratio</span>"]]], ["Macro Economy", [["@BobEUnlimited", "Macro Research", "When something extraordinary is priced in as consensus, that's the problem. Market sentiment couldn't be more optimistic—think about that. <span style=\"color:#8fa0b3\">Trading Implication: Extreme optimism is a contrarian indicator, <b class=\"em\">be wary of a stampede-style correction in the leverage-driven AI frenzy</b></span>"], ["@MichaelAArouet", "", "Germany's industrial collapse is self-inflicted, <b class=\"em\">and years of misguided left-wing green policies will be seen as the largest act of self-destruction in the history of developed economies;</b> the crisis is masked by more debt and government spending, but that won't work forever. <span style=\"color:#8fa0b3\">Trading Implication: If German fiscal stimulus proves unsustainable, <b class=\"em\">the core economic momentum of the eurozone will weaken further,</b> which is bearish for EUR/USD</span>"], ["@McClellanOsc", "Technical Analysis", "The U.S. dollar index fell last week due to joint U.S.-Japan intervention on the yen, breaking below the 100.50 support/resistance level, marking the earlier breakout as a failed one, <b class=\"em\">and commercial traders have already reacted to this.</b> <span style=\"color:#8fa0b3\">Trading Implication: After the false breakout and pullback in the dollar index, if it weakens further, <b class=\"em\">it will be positive for dollar-denominated commodities like gold and copper</b></span>"], ["@LawrenceLepard", "", "The yen has the most dangerous debt-to-GDP ratio among fiat currencies, but the U.S. is worse on deficit-to-GDP. The carry trade is not just a story between the Eurodollar and the U.S. system. <span style=\"color:#8fa0b3\">Trading Implication: The fiscal divergence between the U.S. and Japan is a core variable for the carry trade; if U.S. deficit issues are repriced by the market, <b class=\"em\">the dollar will come under pressure</b></span>"]]], ["Fed / Rates", [["@michaelkantro", "Macro Strategy (Piper Sandler)", "This year, the market's P/E ratio has fallen about 10%, driven mainly by two trends: one is the pricing of Fed policy expectations, and the other is a double-digit decline in the Mag 7's P/E ratio due to rising debt costs, rather than because the P/E ratios themselves were too high. <span style=\"color:#8fa0b3\">Trading Implication: If the Fed shifts to easing or debt costs decline, the valuation pressure on Mag 7 eases, <b class=\"em\">potentially driving a repair in the index's P/E ratio</b></span>"]]]]], ["Geopolitics", [["Middle East", [["@ELuttwak", "", "Iran cannot export oil due to the U.S. blockade, has minimal foreign exchange reserves, and can neither import rocket fuel from China nor pay the Shia militias. Yet the media portrays the U.S. as having no options, suggesting the U.S.'s actual leverage is severely underestimated. <span style=\"color:#8fa0b3\">Trading Implication: Iran's economic fragility is underestimated; if the blockade persists, <b class=\"em\">its regional proxy network may contract</b></span>"], ["@vali_nasr", "Middle East Scholar", "<b class=\"em\">U.S.-Iran negotiations are being sabotaged by a deliberately manufactured disinformation supply chain,</b> with a forged quote from IRGC commander Vahidi about nuclear weapons spreading from the source, indicating a systematic operation to undermine the talks. <span style=\"color:#8fa0b3\">Trading Implication: If the negotiation process is disrupted by disinformation, <b class=\"em\">the Iran nuclear risk premium will be repriced</b></span>"]]], ["Russia-Ukraine", [["@RALee85", "", "The Russian military's offensive near the Azov Corps two weeks ago failed, but it exposed that they are learning and experimenting with new armored tactics. Even against one of Ukraine's strongest units, they dared to try, <b class=\"em\">indicating Russia's adaptive capacity is improving.</b> <span style=\"color:#8fa0b3\">Trading Implication: <b class=\"em\">Russia's tactical iteration may change the pace of attrition on the front lines,</b> affecting expectations for the stability of Ukraine's eastern defenses</span>"], ["@shashj", "", "After the DHL parcel incident, Russia had temporarily paused hybrid warfare due to signals from the Biden administration, but now it is taking risks again, suggesting Russia believes Trump's support for Europe will weaken, <b class=\"em\">raising the risk of a crisis.</b> <span style=\"color:#8fa0b3\">Trading Implication: If Russia's bet on a U.S.-Europe alliance rift materializes, <b class=\"em\">the European security premium will rise significantly</b></span>"], ["@michaeldweiss", "Russia-Ukraine Expert", "Zelensky said he has reached a licensing agreement with Trump but lamented that things would have been different if these licenses had been obtained four years ago, implying that delayed aid timing has weakened the strategic effect. <span style=\"color:#8fa0b3\">Trading Implication: The time lag in aid delivery affects the battlefield situation; if subsequent license execution is delayed, Ukraine's counteroffensive window may narrow</span>"], ["@PhillipsPOBrien", "Strategic Studies", "Trump's bill on Russia still needs to pass the House, be signed by Trump, and be actually implemented; <b class=\"em\">any step not fulfilled means the pressure on Russia falls short,</b> suggesting current optimism is premature. <span style=\"color:#8fa0b3\">Trading Implication: The uncertainty of the bill's implementation is high; if it ultimately is not executed, <b class=\"em\">the trading logic for Russia-related assets needs to be reassessed</b></span>"]]], ["China-U.S.", [["@RushDoshi", "", "Countries are free to choose their growth models, <b class=\"em\">but should not externalize costs through trade and capital accounts,</b> which is the core logical framework for economic competition with China. <span style=\"color:#8fa0b3\">Trading Implication: If the U.S. pressures based on this logic, <b class=\"em\">China's exports and capital flows will face greater policy constraints</b></span>"]]], ["Other Geopolitics", [["@DerekJGrossman", "", "<b class=\"em\">India should be more concerned about China-Pakistan operational cooperation or even control at Karachi Port,</b> rather than Gwadar Port, as the latter is the real fulcrum of the naval threat to India. <span style=\"color:#8fa0b3\">Trading Implication: <b class=\"em\">Upgraded China-Pakistan naval cooperation will change the balance of power in the Indian Ocean,</b> affecting the South Asian security premium</span>"]]]]], ["Energy", [["Latest valid · 08-08 · Crude Oil", [["@Go_Rozen", "", "The Strait of Hormuz has been blocked for months, and U.S. crude and product inventories have fallen by about 200 million barrels since March, yet investors remain extremely bearish. We think the real crisis may still be ahead; <b class=\"em\">the market underestimates the persistence of supply disruptions.</b> <span style=\"color:#8fa0b3\">Trading implication: The divergence between large inventory draws and bearish sentiment suggests <b class=\"em\">if supply disruptions persist,</b> there is a contrarian opportunity for oil prices to correct higher.</span>"], ["@JavierBlas", "Energy Correspondent (BBG)", "There are divisions between Iranian diplomats and the Islamic Revolutionary Guard Corps (IRGC), <b class=\"em\">a key variable for understanding Iran's oil supply outlook.</b> <span style=\"color:#8fa0b3\">Trading implication: Internal power struggles in Iran could affect its crude export policy, <b class=\"em\">adding to supply-side uncertainty</b>.</span>"]]]]], ["Agriculture", [["Weather & Climate", [["@climateguyw", "Climate Research", "Climate change has roughly doubled the probability of wildfires in Canada, marking a shift of extreme weather events from 'anomalies' to the 'new normal,' <b class=\"em\">and the frequency and intensity of similar disasters may continue to rise in the future.</b> <span style=\"color:#8fa0b3\">Trading Implication: <b class=\"em\">Frequent wildfires will disrupt timber and energy supplies,</b> and push up insurance costs, potentially leading to a long-term premium in related commodities</span>"]]]]], ["AI & Semiconductors", [["Latest valid · 08-06 · AMD", [["@danielnewmanUV", "Technology / Corporate Strategy", "Futurum Equities reiterates a Buy rating on AMD, maintaining a $800 price target, believing the current market panic is a buying opportunity. <span style=\"color:#8fa0b3\">Trading Implication: The $800 price target implies significant upside, <b class=\"em\">but attention should be paid to changes in overall market risk appetite</b></span>"]]]]]]}, "tweets": [{"h": "MichaelAArouet", "tier": 2, "b": "macro", "t": "2026-08-08 09:00", "x_zh": "这是一个令人大开眼界的数据点。德国工业的崩溃是自作自受。多年的糟糕左翼绿色政策将被视为有史以来发达经济体最大的一次自我破坏。危机被更多的债务和政府支出所掩盖，但这不会永远奏效。", "x_en": "This is an eye-opening data point. The collapse of German industry is self-inflicted.\n\nYears of bad left-green policies will be seen as the largest self-sabotage of an advanced economy ever.\n\nThe crisis is masked by more debt and government spending, but it won’t work forever.", "u": "https://x.com/MichaelAArouet/status/2086014759200014434", "lk": 2317, "rt": 736, "rp": 123, "eng": 3176, "lang": "en", "tags": ["macro", "economics", "data"], "important": true}, {"h": "TaviCosta", "tier": 1, "b": "macro", "t": "2026-08-08 14:13", "x_zh": "铜一直在告诉我们，黄金还有追赶的空间。这仍然是当今市场上最重要的背离之一。滞后是你的朋友。https://open.substack.com/pub/tavicosta/p/the-tale-of-two-metals?r=2m39jp&utm_medium=ios …", "x_ 不是因为“市盈率过高”。", "x_en": "There are two trends that largely explain why the market’s P/E is about 10% lower this year - 1 is the pricing of Fed policy expectations and the 2nd is explained by the double-digit drop in Mag 7 P/Es due to increasing costs of debt. Neither are because “P/Es are too high” IMO.", "u": "https://x.com/MichaelKantro/status/2086157605018149289", "lk": 78, "rt": 10, "rp": 13, "eng": 101, "lang": "en", "tags": ["macro", "cycle", "sellside"], "important": true}, {"h": "jam_croissant", "tier": 1, "b": "macro", "t": "2026-08-08 22:13", "x_zh": "谁能预料到这一点 x.com/robin_j_brooks...", "x_en": "Who could have predicted this x.com/robin_j_brooks…", "u": "https://x.com/jam_croissant/status/2086214286863438047", "lk": 56, "rt": 1, "rp": 4, "eng": 61, "lang": "en", "tags": ["macro", "volatility", "options"], "important": false}, {"h": "BobEUnlimited", "tier": 1, "b": "macro", "t": "2026-08-08 10:46", "x_zh": "“当非凡之事被当作共识来定价时，那就是问题所在。”周四很高兴做客彭博电视《监视》节目，讨论杠杆驱动的AI狂热、美联储，以及为什么黄金即将大放异彩。", "x_en": "\"When the extraordinary is priced as consensus, that's a problem.\"\n\nGreat to swing by \n@BloombergTV\n Surveillance on Thursday to discuss the leverage-fueled AI mania, the Fed, and why gold is set to shine ahead.", "u": "https://x.com/BobEUnlimited/status/2086041346612113572", "lk": 39, "rt": 4, "rp": 10, "eng": 53, "lang": "en", "tags": ["macro", "rates_fx", "cycle"], "important": false}, {"h": "SamRo", "tier": 2, "b": "macro", "t": "2026-08-08 16:04", "x_zh": "他们应该让这个永久化。", "x_en": "They should make this permanent", "u": "https://x.com/SamRo/status/2086121372258877807", "lk": 22, "rt": 0, "rp": 3, "eng": 25, "lang": "en", "tags": ["macro", "equities", "data"], "important": false}, {"h": "DiMartinoBooth", "tier": 2, "b": "macro", "t": "2026-08-08 20:23", "x_zh": "《每周羽毛笔》——美国还能继续卡车运输吗？\n立即登录阅读——\n\nhttps://na2.hubs.ly/H0732860\n\n#美联储 #鲍威尔 #迪马蒂诺布斯 #经济 #货运 #卡车运输", "x_en": "The Weekly Quill — Will America Keep Truckin’?\nLog in to read now — \n\n\nhttps://\nna2.hubs.ly/ van in Slovyansk. An indication of Russian advances in this direction. \n\nhttps://\nt.me/dva_majors/972\n13\n…", "u": "https://x.com/RALee85/status/2086218503925666119", "lk": 116, "rt": 13, "rp": 4, "eng": 133, "lang": "en", "tags": ["geopolitics", "russia", "military"], "important": true}, {"h": "ELuttwak", "tier": 2, "b": "geopolitics", "t": "2026-08-08 23:39", "x_zh": "由于美国封锁，伊朗无法出口石油。外汇储备极少，伊朗无法从中国进口火箭燃料，也无法支付什叶派民兵。那么为什么每个媒体报道都把美国描绘成别无选择？而参谋长联席会议主席急于寻找“出口匝道”？", "x_en": "Iran cannot export oil because of the US blockade. With v small foreign exchange reserves, Iran cannot import rocket fuel  from China nor pay off the Shia militias.  So why does every media story depict the US as bereft of options ? \nAnd he CJCS as anxious to find an \"off-ramp\" ?", "u": "https://x.com/ELuttwak/status/2086235872949587993", "lk": 102, "rt": 19, "rp": 10, "eng": 131, "lang": "en", "tags": ["geopolitics", "strategy", "history"], "important": true}, {"h": "PhillipsPOBrien", "tier": 2, "b": "geopolitics", "t": "2026-08-08 05:54", "x_zh": "最新文章。如果人工智能/自主系统是战争的未来（确实如此），它们最近也被过度炒作。美国，其战争机器号称以人工智能为“核心”，刚刚以历史上最令人震惊的方式输掉了一场战争。变革即将到来，但需要时间。", "x_en": "Latest piece. If AI/Autonomous systems are the future of war (and they are) they were also recently oversold, The US, with AI supposedly at the \"heart\" of its war machine, just lost a war in one of the most shocking ways in history. The change is coming, but it will take time.", "u": "https://x.com/PhillipsPOBrien/status/2085967813231956072", "lk": 87, "rt": 22, "rp": 7, "eng": 116, "lang": "en", "tags": ["geopolitics", "ukraine", "military"], "important": true}, {"h": "RushDoshi", "tier": 1, "b": "geopolitics", "t": "2026-08-08 15:01", "x_zh": "“各国应自由选择自己的增长模式，但不应通过贸易和资本账户将相关成本外部化。”", "x_en": "“countries should be free to choose their own growth models, but they should not be able to externalize the associated costs via their trade and capital accounts”", "u": "https://x.com/RushDoshi/status/2086105594973372740", "lk": 27, "rt": 8, "rp":     var tw=cur().tweets,wrap=$("#boardPills");wrap.innerHTML=""; var counts={all:tw.length};Object.keys(BOARDS).forEach(function(k){counts[k]=0}); tw.forEach(function(t){counts[t.b]=(counts[t.b]||0)+1});
    function mk(key,label,color){var p=document.createElement("button");p.className="pill";p.innerHTML=label+' <span class="cnt">'+(counts[key]||0)+'</span>';if(st.board===key){p.setAttribute("data-on","1");p.style.background=color;p.style.borderColor=color} p.onclick=function(){st.board=key;buildPills();render()};return p}
    wrap.appendChild(mk("all",tx("all"),"#e7b24d")); Object.keys(BOARDS).filter(function(k){return BOARDS[k].show!==false}).forEach(function(k){wrap.appendChild(mk(k,boardLabel(k),BOARDS[k].color))});
  }
  function pass(t){
    if(st.board!=="all"&&t.b!==st.board)return false;
    if(st.tier!=="all"&&(""+t.tier)!==st.tier)return false;
    if(st.lang!=="all"&&t.lang!==st.lang)return false;
    if(st.q){var q=st.q.toLowerCase(); var hay=(bodyOf(t)+" "+(t.x_zh||"")+" "+(t.x_en||"")+" @"+t.h+" "+(t.tags||[]).join(" ")).toLowerCase(); if(hay.indexOf(q)<0)return false}
    return true
  }
  function render(){
    var m=cur().meta,tw=cur().tweets.filter(pass); tw.sort(function(a,b){return st.sort==="hot"?b.eng-a.eng:(a.t<b.t?1:-1)});
    var kol=new Set(tw.map(function(t){return t.h})).size; $("#tstat").innerHTML=tx("show")+' <b>'+tw.length+'</b> / '+m.n_tweets+' · <b>'+kol+'</b> '+tx("kols")+' · '+tx("monitor")+' '+m.n_accounts+' '+tx("accounts");
    var s=$("#stream"); if(!tw.length){s.innerHTML='<div class="empty">'+tx("empty")+'</div>';return} s.innerHTML="";
    tw.forEach(function(t){
      var B=BOARDS[t.b]||{color:"#5b8def"}, body=bodyOf(t), tags=(t.tags||[]).map(function(x){return '<span class="tag" data-tag="'+esc(x)+'">'+esc(x)+'</span>'}).join("");
      var c=document.createElement("div"); c.className="card"; c.tabIndex=0; c.style.setProperty("--bc",B.color);
      c.innerHTML='<div class="chead"><span class="hand" data-h="'+esc(t.h)+'">@'+esc(t.h)+'</span><span class="bchip" style="background:'+B.color+'">'+boardShort(t.b)+'</span>'+(t.tier===1?'<span class="t1">'+tx("tier1")+'</span>':'')+'<span class="lang">'+(t.lang==="zh"?tx("langZh"):tx("langEn"))+'</span><span class="time mono">'+esc(t.t)+'</span></div><div class="cbody">'+hl(body,st.q)+'</div><div class="cfoot"><span class="eng mono"><span>♥ '+fmt(t.lk)+'</span><span>⟲ '+fmt(t.rt)+'</span><span>💬 '+fmt(t.rp)+'</span></span><span class="tags">'+tags+'</span><span class="open">'+tx("open")+'</span></div>';
      var bodyEl=c.querySelector(".cbody"); requestAnimationFrame(function(){if(bodyEl.scrollHeight>bodyEl.clientHeight+4){bodyEl.classList.add("clamp"); var mm=document.createElement("span"); mm.className="more"; mm.textContent=tx("more"); bodyEl.after(mm); mm.onclick=function(e){e.stopPropagation();bodyEl.classList.toggle("open");bodyEl.classList.toggle("clamp");mm.textContent=bodyEl.classList.contains("open")?tx("less"):tx("more")}}});
      c.onclick=function(){window.open(t.u,"_blank","noopener")}; c.onkeydown=function(e){if(e.key==="Enter")window.open(t.u,"_blank","noopener")};
      c.querySelector(".hand").onclick=function(e){e.stopPropagation();jumpHandle(t.h)}; c.querySelectorAll(".tag").forEach(function(tg){tg.onclick=function(e){e.stopPropagation();$("#q").value=tg.dataset.tag;st.q=tg.dataset.tag;$("#clr").style.display="block";render()}});
      s.appendChild(c);
    })
  }
  function renderAll(){syncUi();renderReport();renderBrief();renderIndices();buildPills();render();setView(st.view,false)}
  var qi=$("#q"),clr=$("#clr"); qi.oninput=function(){st.q=qi.value.trim();clr.style.display=qi.value?"block":"none";render()}; clr.onclick=function(){qi.value="";st.q="";clr.style.display="none";qi.focus();render()};
  document.addEventListener("keydown",function(e){if(e.key==="/"&&document.activeElement!==qi){e.preventDefault();qi.focus()} if(e.key==="Escape"&&document.activeElement===qi){qi.value="";st.q="";clr.style.display="none";render()}});
  function seg(id,key){var el=$(id);el.querySelectorAll("button").forEach(function(b){b.onclick=function(){el.querySelectorAll("button").forEach(function(x){x.removeAttribute("data-on")});b.setAttribute("data-on","1");st[key]=b.dataset.v;render()}})}
  seg("#sortSeg","sort"); seg("#tierSeg","tier"); seg("#langSeg","lang");
  $("#reset").onclick=function(){st.board="all";st.tier="all";st.lang="all";st.sort="hot";st.q="";qi.value="";clr.style.display="none";[["#sortSeg","hot"],["#tierSeg","all"],["#langSeg","all"]].forEach(function(p){var el=$(p[0]);el.querySelectorAll("button").forEach(function(x){x.setAttribute("data-on",x.dataset.v===p[1]?"1":"")})});buildPills();render()};
  app.querySelectorAll(".langsw button").forEach(function(b){b.onclick=function(){uiLang=b.dataset.lang;renderAll()}});
  $("#viewNav").querySelectorAll("button").forEach(function(b){b.onclick=function(){setView(b.dataset.view,true)}});$("#openFull").onclick=function(){setView('full',true)};
  app.querySelectorAll(".range button").forEach(function(b){b.onclick=function(){st.range=+b.dataset.range;renderAll()}});
  renderAll();
})();
</script>
