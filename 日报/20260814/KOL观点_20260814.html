"color:#8fa0b3\">交易含义：策略师集体上调目标价是典型的情绪指标，<b class=\"em\">可能预示短期市场过热风险</b></span>"]]], ["美联储 / 利率", [["@elerianm", "宏观经济学家", "PPI数据低于预期，叠加昨日CPI，进一步冷却市场对9月美联储加息的预期。 <span style=\"color:#8fa0b3\">交易含义：通胀回落路径若持续，将强化利率见顶逻辑，<b class=\"em\">利好长久期资产</b></span>"], ["@BobEUnlimited", "宏观研究", "<b class=\"em\">又一个通胀下行意外，</b>那些在收益率多年高位时急于卖出债券的人，会因通胀螺旋并未出现而失望。 <span style=\"color:#8fa0b3\">交易含义：通胀持续回落将证伪债券空头逻辑，<b class=\"em\">做空长久期债券的风险收益比不佳</b></span>"], ["@TimmerFidelity", "", "实际利率持续上升，给债券市场带来压力；自2021年以来TIPS表现优于名义债券，<b class=\"em\">预计这一趋势将持续，</b>因为名义收益率相对于隐含通胀预期似乎过低。 <span style=\"color:#8fa0b3\">交易含义：实际利率上升对黄金和成长股构成压力，TIPS相对价值凸显</span>"], ["@michaelkantro", "宏观策略 (Piper Sandler)", "通胀和就业数据 surprises 主导美联储讲话基调，我站在&#x27;更久更高&#x27;阵营，并认为美联储鹰派立场已见顶。 <span style=\"color:#8fa0b3\">交易含义：若鹰派见顶，<b class=\"em\">美债收益率上行空间有限，</b>关注数据 surprises 的边际变化</span>"], ["@McClellanOsc", "技术分析", "60年长周期利率模型显示，<b class=\"em\">长期利率的峰值预计在</b>2040年<b class=\"em\">到来，</b>该模型自18世纪以来一直有效，且与气候周期相关。 <span style=\"color:#8fa0b3\">交易含义：若长周期模型成立，当前利率上行只是长期趋势的一部分，<b class=\"em\">做多债券需等待更长时间</b></span>"]]], ["中国 / 中美", [["@AndreasSteno", "", "PPI报告疲软，确认了我们Nowcast IQ模型的判断，消费品（受关税间接影响）、能源和服务价格均在走软，<b class=\"em\">所有分项都在下行。</b> <span style=\"color:#8fa0b3\">交易含义：通胀全面走软支持利率下行交易，<b class=\"em\">但需警惕关税政策的间接影响未被PPI完全反映</b></span>"]]]]], ["地缘政治", [["中东", [["@BarakRavid", "中东记者 (Axios)", "<b class=\"em\">库什纳下周将先访以色列与内塔尼亚胡谈加沙，</b>随后赴开罗与埃及、卡塔尔、土耳其调解人会晤；美方在中东的穿梭外交重新提速，但加沙停火框架仍无实质突破。 <span style=\"color:#8fa0b3\">交易含义：若库什纳斡旋有实质进展，<b class=\"em\">油价地缘溢价将阶段性回落</b></span>"]]], ["俄乌", [["@RALee85", "", "波兰安全局（ABW）上周逮捕一名受俄情报部门招募的俄罗斯公民，挫败其在波兰境内暗杀一名原籍乌克兰的美国公民的图谋；俄方暗战已延伸至北约领土。 <span style=\"color:#8fa0b3\">交易含义：俄乌冲突外溢至北约成员国，若北约反应升级，<b class=\"em\">能源供给风险将重新定价</b></span>"]]], ["中美", [["@DerekJGrossman", "", "在科伦坡的调研显示，斯里兰卡只想保持中立、不愿在中印美之间选边；但印度洋商业与海军航线的地理枢纽位置，使其“被选边”的压力难以回避。 <span style=\"color:#8fa0b3\">交易含义：印度洋航道地缘博弈升温，<b class=\"em\">航运保险与运费波动需关注</b></span>"]]], ["其他地缘", [["@shashj", "", "《华盛顿邮报》披露，今年厄瓜多尔加拉帕戈斯群岛附近多艘渔船遭神秘袭击，实为CIA秘密行动的一部分；美国在拉美的隐蔽军事介入比公开叙事更深。 <span style=\"color:#8fa0b3\">交易含义：拉美地缘风险被低估，若事件发酵，<b class=\"em\">区域安全与资源供给稳定性将受质疑</b></span>"]]]]], ["能源", [["原油", [["@JavierBlas", "能源记者 (BBG)", "伊拉克已确认在波斯湾内将部分原油售予阿布扎比国家石油公司（Adnoc），由后者负责将船货运出霍尔木兹海峡；Adnoc开创了暗船穿梭往返海峡的先例，<b class=\"em\">显示供应路径正因地缘风险发生结构性调整。</b> <span style=\"color:#8fa0b3\">交易含义：绕行海峡的贸易流增加，可能推高运费并改变区域价差，<b class=\"em\">需关注对布伦特-迪拜价差的影响</b></span>"], ["@chigrl", "", "伊朗否认美国关于霍尔木兹海峡已畅通的说法，称海峡仍被封锁，且通行量已降至近三个月低点；地缘局势的反复表态与实际情况存在明显分歧。 <span style=\"color:#8fa0b3\">交易含义：海峡通行量数据与官方表态背离，<b class=\"em\">意味着供应中断风险未被市场充分定价，</b>油价波动率可能上升</span>"]]]]], ["农产品", [["谷物油籽", [["@staunovo", "", "拉丁美洲的超级厄尔尼诺将如何影响全球最大食品出口地区？<b class=\"em\">这是当前农产品市场最核心的天气风险变量。</b> <span style=\"color:#8fa0b3\">交易含义：若厄尔尼诺导致南美干旱或洪涝，<b class=\"em\">大豆、玉米等主产国供应将受冲击，</b>需跟踪产区降雨预报</span>"]]], ["最近有效 · 08-11 · 天气气候", [["@climateguyw", "气候研究", "8月10日西部CAT3热浪已减弱为CAT2，但平原和南部正形成新的独立CAT2热浪；<b class=\"em\">下一个以化石燃料公司命名的热浪将用“Delphi”。</b> <span style=\"color:#8fa0b3\">交易含义：极端高温事件频发且区域转移，<b class=\"em\">可能加剧局部能源需求与农作物生长压力</b></span>"]]]]], ["AI半导体", [["推理", [["@simonw", "", "谷歌3.7 Flash的&#x27; introductory pricing&#x27;很怪：2026年12月31日价格翻倍，但3.6 Flash三周前才发布，谁会预期五个月后还在用这个旧模型？。 <span style=\"color:#8fa0b3\">交易含义：模型迭代加速使长期定价合同失效，推理成本下降速度或超厂商预期，<b class=\"em\">利空算力需求强度</b></span>"], ["@fchollet", "", "测试时训练（TTT）在ARC Prize 2024期间被推广，但目前ARC 1-2仍是唯一TTT显著优于其他方法的基准；若TTT开始泛化到更多任务，<b class=\"em\">将值得关注。</b> <span style=\"color:#8fa0b3\">交易含义：推理范式若从&#x27;预训练&#x27;转向&#x27;测试时计算&#x27;，<b class=\"em\">将改变算力需求结构，</b>当前市场或未充分定价</span>"]]]]]]}, "report_en": {"insights": [{"title": "Highest Heat · Macro Economy", "points": ["Core view: Core View: @LynAldenContact (Macro (Lyn Alden)): Monthly data is noisy, but the liquidity trend driven by fiscal deficits remains unchanged, 'Nothing stops this train', <b class=\"em\">and one should not extrapolate the full-year deficit from a single bad month.</b>"]}, {"title": "Biggest Divergence · Macro Economy", "points": ["Core view: <b class=\"em\">Core View: @mark_dow: When fiscal deficits are massive,</b> corporate earnings must be strong; this is a basic principle of macro accounting. If one still believes deficits are bad for earnings and growth, they are ignoring this fundamental logic."]}, {"title": "High Vigilance · Macro Economy", "points": ["Core view: <b class=\"em\">Core View: @SantiagoAuFund: The U.S. has been in armed conflict for 80 out of 82 years since WWII,</b> and although often criticized for not winning wars, the U.S. remains ahead, indicating that winning wars is not a necessary condition for staying ahead."]}, {"title": "Reverse Variable · Macro Economy", "points": ["Core view: Core View: @RaoulGMI (Global Macro): By 2030, GDP as a measure of the economy will become obsolete because the equation measuring the economy itself is changing, <b class=\"em\">with structural changes in labor participation being the core.</b>"]}, {"title": "Sentiment Shift · US Stocks / Fund Flows", "points": ["Core view: <b class=\"em\">Core View: @WarrenPies (Macro Strategy): Strategists who had a year-end S&P target of 7400</b> are now raising it to 8300, with market sentiment rapidly turning optimistic."]}], "unique": [["@fchollet", "Test-time training (TTT) was promoted during ARC Prize 2024, but currently ARC 1-2 remains the only benchmark where TTT significantly outperforms other methods; if TTT starts to generalize to more tasks, it will be worth attention.", "If the reasoning paradigm shifts from 'pre-training' to 'test-time compute', it will change the structure of compute demand, and the current market may not be fully pricing this in."], ["@LynAldenContact", "Monthly data is noisy, but the liquidity trend driven by fiscal deficits remains unchanged, 'Nothing stops this train', and one should not extrapolate the full-year deficit from a single bad month.", "If the market trades on monthly data fluctuations, it may go against the broader trend; focus on the trend rather than the noise."], ["@RaoulGMI", "By 2030, GDP as a measure of the economy will become obsolete because the equation measuring the economy itself is changing, with structural changes in labor participation being the core.", "If GDP indicators become invalid, macro trading models based on GDP will face reconstruction; monitor new dimensions of labor data."], ["@elerianm", "PPI data came in below expectations, and combined with yesterday's CPI, further cooled market expectations for a September Fed rate hike.", "If the disinflation path continues, it will reinforce the peak-rate logic, benefiting long-duration assets."]], "sections": [["Macro Economy", [["Macro Economy", [["@LynAldenContact", "Macro (Lyn Alden)", "Monthly data is noisy, but the liquidity trend driven by fiscal deficits remains unchanged, 'Nothing stops this train', <b class=\"em\">and one should not extrapolate the full-year deficit from a single bad month.</b> <span style=\"color:#8fa0b3\">Trading implication: If the market trades on monthly data fluctuations, <b class=\"em\">it may go against the broader trend,</b> focus on the trend rather than the noise.</span>"], ["@LukeGromen", "Global Macro", "Bessent selling euros and buying yen, along with U.S. threats to weaponize stablecoins against the EU, <b class=\"em\">may trigger unforeseen backlash effects.</b> <span style=\"color:#8fa0b3\">Trading implication: The weaponization of dollar policy may accelerate de-dollarization, <b class=\"em\">watch for knock-on effects on EUR/JPY and stablecoin-related policies.</b></span>"], ["@RaoulGMI", "Global Macro", "By 2030, GDP as a measure of the economy will become obsolete because the equation measuring the economy itself is changing, <b class=\"em\">with structural changes in labor participation being the core.</b> <span style=\"color:#8fa0b3\">Trading implication: If GDP indicators become invalid, <b class=\"em\">macro trading models based on GDP will face reconstruction,</b> and new dimensions of labor data should be monitored.</span>"], ["@jimcramer", "", "The market will cry foul over Anthropic's valuation reaching $2 trillion, <b class=\"em\">but as long as its revenue supports it,</b> the valuation is not unreasonable. <span style=\"color:#8fa0b3\">Trading implication: The AI narrative is shifting from concept to revenue validation; focus on the revenue delivery capability of high-valuation tech stocks.</span>"], ["@SantiagoAuFund", "", "The U.S. has been in armed conflict for 80 out of 82 years since WWII, and although often criticized for not winning wars, the U.S. remains ahead, indicating that winning wars is not a necessary condition for staying ahead. <span style=\"color:#8fa0b3\">Trading implication: <b class=\"em\">Geopolitical risk premium may be overestimated,</b> and the correlation between dollar hegemony and military conflict needs reassessment.</span>"], ["@charliebilello", "", "Washington's budget strategy is: raise the debt ceiling, keep spending, maintain massive deficits, and repeat. The result: national debt increased by $3.7 trillion in 13 months. <span style=\"color:#8fa0b3\">Trading implication: Debt growth is a potential driver of long-term rates; watch the pressure of Treasury supply on the yield curve.</span>"], ["@mark_dow", "", "When fiscal deficits are massive, corporate earnings must be strong; this is a basic principle of macro accounting. If one still believes deficits are bad for earnings and growth, they are ignoring this fundamental logic. <span style=\"color:#8fa0b3\">Trading implication: <b class=\"em\">While going long on earnings, one must hedge interest rate risk,</b> because deficit-driven earnings growth may come with bond supply pressure.</span>"]]], ["US Stocks / Fund Flows", [["@WarrenPies", "Macro Strategy", "Strategists who had a year-end S&P target of 7400 are now raising it to 8300, with market sentiment rapidly turning optimistic. <span style=\"color:#8fa0b3\">Trading implication: Collective upward target revisions by strategists are a typical sentiment indicator, <b class=\"em\">possibly signaling short-term market overheating risk.</b></span>"]]], ["Fed / Interest Rates", [["@elerianm", "Macro Economist", "PPI data came in below expectations, and combined with yesterday's CPI, further cooled market expectations for a September Fed rate hike. <span style=\"color:#8fa0b3\">Trading implication: If the disinflation path continues, it will reinforce the peak-rate logic, <b class=\"em\">benefiting long-duration assets.</b></span>"], ["@BobEUnlimited", "Macro Research", "<b class=\"em\">Another downside inflation surprise,</b> and those who rushed to sell bonds when yields were at multi-year highs will be disappointed that the inflation spiral did not materialize. <span style=\"color:#8fa0b3\">Trading implication: Continued disinflation will falsify the bond bear thesis, <b class=\"em\">and the risk-reward for shorting long-duration bonds is poor.</b></span>"], ["@TimmerFidelity", "", "Real interest rates continue to rise, putting pressure on the bond market; since 2021, TIPS have outperformed nominal bonds, <b class=\"em\">and this trend is expected to continue,</b> as nominal yields appear too low relative to implied inflation expectations. <span style=\"color:#8fa0b3\">Trading implication: Rising real rates pressure gold and growth stocks, while TIPS relative value stands out.</span>"], ["@michaelkantro", "Macro Strategy (Piper Sandler)", "Inflation and employment data surprises dominate the tone of Fed speeches; I stand in the 'higher for longer' camp and believe the Fed's hawkish stance has peaked. <span style=\"color:#8fa0b3\">Trading implication: If hawkishness has peaked, <b class=\"em\">upside in Treasury yields is limited,</b> and watch marginal changes in data surprises.</span>"], ["@McClellanOsc", "Technical Analysis", "The 60-year long-cycle interest rate model shows that <b class=\"em\">the peak in long-term rates is expected in</b> 2040, <b class=\"em\">and this model has been valid since the 18th century,</b> and is related to climate cycles. <span style=\"color:#8fa0b3\">Trading implication: If the long-cycle model holds, the current rise in rates is just part of a long-term trend, <b class=\"em\">and going long on bonds requires waiting longer.</b></span>"]]], ["China / US-China", [["@AndreasSteno", "", "The weak PPI report confirms our Nowcast IQ model's assessment: consumer goods (indirectly affected by tariffs), energy, and services prices are all softening, <b class=\"em\">with all components declining.</b> <span style=\"color:#8fa0b3\">Trading implication: Broad disinflation supports rate-cut trades, <b class=\"em\">but be wary that the indirect effects of tariff policies may not be fully reflected in PPI.</b></span>"]]]]], ["Geopolitics", [["Middle East", [["@BarakRavid", "Middle East Correspondent (Axios)", "<b class=\"em\">Kushner will first visit Israel next week to discuss Gaza with Netanyahu,</b> then head to Cairo for meetings with Egyptian, Qatari, and Turkish mediators; U.S. shuttle diplomacy in the Middle East is accelerating again, but the Gaza ceasefire framework still lacks substantive progress. <span style=\"color:#8fa0b3\">Trading implication: If Kushner's mediation yields substantive progress, <b class=\"em\">the geopolitical premium in oil prices will temporarily decline.</b></span>"]]], ["Russia-Ukraine", [["@RALee85", "", "Last week, Poland's Internal Security Agency (ABW) arrested a Russian citizen recruited by Russian intelligence, foiling a plot to assassinate a U.S. citizen of Ukrainian origin on Polish soil; Russia's covert operations have extended into NATO territory. <span style=\"color:#8fa0b3\">Trading implication: The Russia-Ukraine conflict is spilling over into NATO member states; if NATO's response escalates, <b class=\"em\">energy supply risks will be repriced.</b></span>"]]], ["US-China", [["@DerekJGrossman", "", "Research in Colombo shows that Sri Lanka only wants to remain neutral and is unwilling to choose sides among China, India, and the U.S.; but its geographic hub position for Indian Ocean commercial and naval routes makes it difficult to avoid being 'forced to choose'. <span style=\"color:#8fa0b3\">Trading implication: Geopolitical competition over Indian Ocean sea lanes is heating up, <b class=\"em\">and shipping insurance and freight rate volatility need attention.</b></span>"]]], ["Other Geopolitics", [["@shashj", "", "The Washington Post revealed that mysterious attacks on fishing vessels near Ecuador's Galapagos Islands earlier this year were part of a covert CIA operation; U.S. covert military involvement in Latin America is deeper than public narratives suggest. <span style=\"color:#8fa0b3\">Trading implication: Latin American geopolitical risks are underestimated; if events escalate, <b class=\"em\">regional security and resource supply stability will be questioned.</b></span>"]]]]], ["Energy", [["Crude Oil", [["@JavierBlas", "Energy Correspondent (BBG)", "Iraq has confirmed selling some crude oil in the Persian Gulf to Abu Dhabi National Oil Company (Adnoc), which will handle shipping the cargo through the Strait of Hormuz; Adnoc has set a precedent for dark ships shuttling through the strait, <b class=\"em\">indicating that supply routes are undergoing structural adjustments due to geopolitical risks.</b> <span style=\"color:#8fa0b3\">Trading implication: Increased trade flows bypassing the strait may push up freight rates and alter regional spreads, <b class=\"em\">and the impact on Brent-Dubai spreads should be monitored.</b></span>"], ["@chigrl", "", "Iran denies the U.S. claim that the Strait of Hormuz is open, stating that the strait remains blocked and traffic has fallen to a three-month low; there is a clear discrepancy between repeated official statements and actual conditions. <span style=\"color:#8fa0b3\">Trading implication: The divergence between strait traffic data and official statements <b class=\"em\">means supply disruption risk is not fully priced in,</b> and oil price volatility may rise.</span>"]]]]], ["Agriculture", [["Grains & Oilseeds", [["@staunovo", "", "How will the super El Niño in Latin America affect the world's largest food-exporting region? <b class=\"em\">This is the most critical weather risk variable in the agricultural market.</b> <span style=\"color:#8fa0b3\">Trading implication: If El Niño causes drought or flooding in South America, <b class=\"em\">supply from major producers of soybeans, corn, etc. will be impacted,</b> and rainfall forecasts in production areas should be tracked.</span>"]]], ["Latest valid · 08-11 · Weather & Climate", [["@climateguyw", "Climate Research", "On August 10, the western CAT3 heatwave weakened to CAT2, but new independent CAT2 heatwaves are forming in the plains and south; <b class=\"em\">the next heatwave named after a fossil fuel company will be called 'Delphi'.</b> <span style=\"color:#8fa0b3\">Trading implication: Extreme heat events are frequent and shifting regions, <b class=\"em\">may intensify local energy demand and crop growth stress</b></span>"]]]]], ["AI & Semiconductors", [["Inference", [["@simonw", "", "Google's 'introductory pricing' for 3.7 Flash is odd: the price doubles on December 31, 2026, but 3.6 Flash was released just three weeks ago; who would expect to still be using this old model five months later? <span style=\"color:#8fa0b3\">Trading implication: Accelerated model iteration invalidates long-term pricing contracts, and the decline in inference costs may outpace vendor expectations, <b class=\"em\">which is bearish for compute demand intensity.</b></span>"], ["@fchollet", "", "Test-time training (TTT) was promoted during ARC Prize 2024, but currently ARC 1-2 remains the only benchmark where TTT significantly outperforms other methods; if TTT starts to generalize to more tasks, <b class=\"em\">it will be worth attention.</b> <span style=\"color:#8fa0b3\">Trading implication: If the reasoning paradigm shifts from 'pre-training' to 'test-time compute', <b class=\"em\">it will change the structure of compute demand,</b> and the current market may not be fully pricing this in.</span>"]]]]]]}, "tweets": [{"h": "unusual_whales", "tier": 2, "b": "macro", "t": "2026-08-13 22:58", "x_zh": "AOC（亚历山德里娅·奥卡西奥-科尔特斯）刚刚提交了她的年度财务披露。\n\n她报告：\n\n储蓄账户最高5万美元\n支票账户最高1.5万美元\n经纪账户最高1000美元\n401(k)退休账户最高1.5万美元\n学生贷款债务最高5万美元", "x_en": "AOC (Alexandria Ocasio-Cortez) just filed her annual financial disclosure.\n\nShe reported:\n\nUp to $50,000 in savings\nUp to $15,000 in checking\nUp to $1,000 in a brokerage account\nUp to $15,000 in a 401(k)\nUp to $50,000 in student loan debt", "u": "https://x.com/unusual_whales/status/2088037381261971703", "lk": 4334, "rt": 274, "rp": 553, "eng": 5161, "lang": "en", "tags": ["macro", "options_flow", "trader"], "important": true}, {"h": "LynAldenContact", "tier": 1, "b": "macro", "t": "2026-08-13 14:27", "x_zh": "虽然个别月份数据波动较大，但有一点始终不变。\n\n没有什么能阻挡这列火车。", "x_en": "While individual months are noisy, one thing remains true.\n\nNothing stops this train.", "u": "https://x.com/LynAldenContact/status/2087909008384332119", "lk": 4180, "rt": 413, "rp": 105, "eng": 4698, "lang": "en", "tags": ["macro", "rates_fx", "liquidity"], "important": true}, {"h": "charliebilello", "tier": 2, "b": "macro", "t": "2026-08-13 21:12", "x_zh": "“嗯，我们要偿还债务。我们有大量资金流入，比这个国家以往任何时候看到的都要多出数千亿美元。而且可能会有向我国人民进行的分配或分红。我想说，对于中等收入人群来说……”", "x_en": "\"Well, we're going to pay down debt. We have a lot of money coming in, much more money than the country has ever seen by hundreds of billions of dollars. And there could be a distribution or dividend to the people of our country. I would say for people that would be middle-income", "u": "https://x.com/charliebilello/status/2088010845166989736", "lk": 1058, "rt": 336, "rp": 112, "eng": 1506, "lang": "en", "tags": ["macro", "data", "markets"], "important": true}, {"h": "LynAldenContact", "tier": 1, "b": "macro", "t": "2026-08-13 09:24", "x_zh": "尼罗河入海之处。", "x_en": "Where the Nile meets the sea.", "u": "https://x.com/LynAldenContact/status/2087832538219765939", "lk": 1403, "rt": 31, "rp": 54, "eng": 1488, "lang": "en", "tags": ["macro", "rates_fx", "liquidity"], "important": true}, {"h": "LukeGromen", "tier": 1, "b": "macro", "t": "2026-08-13 18:34", "x_zh": "贝森特抛售欧元买入日元，以及美国威胁将美元稳定币武器化以对付欧盟，可能正在引发一些意想不到的反噬。\n\n来源：@dimit", "x_en": "Bessent’s selling of EUR to buy JPY, and US threats to weaponize USD stablecoins against the EU may be triggering some unforeseen blowback.\n\nVia \n@dimit", "u": "https://x.com/LukeGromen/status/2087971095102005720", "lk": 1045, "rt": 235, "rp": 64, "eng": 1344, "lang": "en", "tags": ["macro", "sovereign_debt", "commodities"], "important": true}, {"h": "LawrenceLepard", "tier": 2, "b": "macro", "t": "2026-08-13 22:32", "x_zh": "用高尔夫作为消遣，让我暂时远离美联储、健全货币、第四次转折等话题。专注于此时很难去想那些事情。这让我想起飞行。我已经认真练习大约8个月了。有什么建议吗？", "x_en": "Using golf as a distraction to take me away from the Fed, sound money, Fourth Turning, etc.  Its hard to think about that stuff when focused on this.  Reminds me of flying. Been at it seriously for about 8 months now.  Suggestions?", "u": "https://x.com/LawrenceLepard/status/2088030895005421619", "lk": 630, "rt": 12, "rp": 260, "eng": 902, "lang": "en", "tags": ["macro", "gold", "hard_assets"], "important": true}, {"h": "LynAldenContact", "tier": 1, "b": "macro", "t": "2026-08-13 14:14", "x_zh": "幸好赤字不是用特别糟糕的一个月乘以12来计算的。", "x_en": "Good thing the deficit isn’t derived by taking a particularly bad month and multiplying it by 12.", "u": "https://x.com/LynAldenContact/status/2087905646045766102", "lk": 757, "rt": 27, "rp": 71, "eng": 855, "lang": "en", "tags": ["macro", "rates_fx", "liquidity"], "important": true}, {"h": "LynAldenContact", "tier": 1, "b": "macro", "t": "2026-08-13 16:38", "x_zh": "今天尼罗河三角洲上空的落日，色彩和清晰度都格外漂亮。", "x_en": "The setting sun over the Nile delta today had a particularly neat color/crispness to it.", "u": "https://x.com/LynAldenContact/status/2087941812753195275", "lk": 744, "rt": 6, "rp": 35, "eng": 785, "lang": "en", "tags": ["macro", "rates_fx", "liquidity"], "important": true}, {"h": "LukeGromen", "tier": 1, "b": "macro", "t": "2026-08-13 15:34", "x_zh": "“教授，您不觉得奇怪吗，这么多人争辩说战争对美国经济有利，然而自2001年9月11日之后不久，标普500总回报（蓝线）以黄金计价（红线）下跌了近30%？”\n\n“实际上，如果我想想，我一点也不觉得奇怪。”", "x_en": "\"Professor, don't you find it curious that so many people argue that wars are good for the US economy, yet since shortly after 9/11/01, S&P 500 Total Return (blue line) is down almost 30% in gold terms (red line)?\"\n\n\"Actually, if I think about it, I don't find it curious at all.\"", "u": "https://x.com/LukeGromen/status/2087925843456639050", "lk": 587, "rt": 81, "rp": 31, "eng": 699, "lang": "en", "tags": ["macro", "sovereign_debt", "commodities"], "important": true}, {"h": "RaoulGMI", "tier": 1, "b": "macro", "t": "2026-08-13 19:33", "x_zh": "到2030年，我们所知的GDP将过时。\n\n我不是轻易做出这样的预测，但我们衡量经济的方式即将失效，因为等式本身正在改变。\n\n你听我说过那个神奇公式。它归结为有多少人在工作，", "x_en": "GDP as we know it will be obsolete by 2030.\n\nI don't make calls like this lightly, but the way we've measured economies is about to stop working because the equation itself is changing.\n\nYou've heard me talk about the magic formula. It comes down to how many people are working,", "u": "https://x.com/RaoulGMI/status/2087985812692676858", "lk": 462, "rt": 53, "rp": 45, "eng": 560, "lang": "en", "tags": ["macro", "crypto", "long_cycle"], "important": true}, {"h": "jimcramer", "tier": 1, "b": "macro", "t": "2026-08-13 08:44", "x_zh": "今天一整天我们都会听到，如果Anthropic能估值2万亿美元，那一切都失控了。不过，如果他们有收入，这并不令人担忧。", "x_en": "We will hear all day today that if Anthropic can command $2 trillion than everything is out of hand. It's not fraught, though, if they have the revs", "u": "https://x.com/jimcramer/status/2087822638336844101", "lk": 319, "rt": 24, "rp": 71, "eng": 414, "lang": "en", "tags": ["macro", "equities", "teacher_required"], "important": true}, {"h": "jimcramer", "tier": 1, "b": "macro", "t": "2026-08-13 13:22", "x_zh": "思科的表现远好于预期——而且在新财年伊始非常 s Robotaxi, Optimus, and Terafab, its SpaceX-partnered project, could combine into tens of trillions of dollars.", "u": "https://x.com/ARKInvest/status/2088007692422181250", "lk": 159, "rt": 26, "rp": 12, "eng": 197, "lang": "en", "tags": ["macro", "equities", "innovation"], "important": true}, {"h": "SantiagoAuFund", "tier": 1, "b": "macro", "t": "2026-08-13 21:40", "x_zh": "美国在过去82年中有80年处于武装冲突中（自二战结束以来）。我经常被告知美国在那段时间里没有赢得一场战争。然而美国仍然保持领先。这显然意味着赢得战争并非绝对必要……", "x_en": "US has been in armed conflict 80 of last 82 yrs (since end of WW2).  And I’m often told the US hasn’t won a war during that entire time.  Yet US remains on top. Which apparently means it’s not exactly necessary to win them…", "u": "https://x.com/SantiagoAuFund/status/2088017839760257203", "lk": 112, "rt": 4, "rp": 39, "eng": 155, "lang": "en", "tags": ["macro", "rates_fx", "dollar"], "important": true}, {"h": "McClellanOsc", "tier": 2, "b": "macro", "t": "2026-08-13 21:59", "x_zh": "我最新的《图表聚焦》文章《高收益债券继续警示麻烦》已发布在我的主页上。您也可以在那里注册，以便将文章发送到您的收件箱（绝无垃圾邮件，我们不会分享您的列表）。", "x_en": "My latest Chart In Focus article, \"High Yield Bonds Continue To Warn of Trouble\", is posted at my Home page. You can also sign up there to have them delivered to your inbox (with no spam ever, we don't share our list).", "u": "https://x.com/McClellanOsc/status/2088022684626264343", "lk": 118, "rt": 22, "rp": 13, "eng": 153, "lang": "en", "tags": ["macro", "technical", "cycle"], "important": true}, {"h": "RaoulGMI", "tier": 1, "b": "macro", "t": "2026-08-13 13:43", "x_zh": "评论点赞——如果您对指数时代和经济奇点感兴趣，请考虑免费注册The Exponentialist。", "x_en": "Comment favour - if you are interested in the Exponential Age and the Economic Singularity, please consider signing up to The Exponentialist for free.", "u": "https://x.com/RaoulGMI/status/2087897735919759420", "lk": 122, "rt": 10, "rp": 11, "eng": 143, "lang": "en", "tags": ["macro", "crypto", "long_cycle"], "important": true}, {"h": "TimmerFidelity", "tier": 1, "b": "macro", "t": "2026-08-13 17:56", "x_zh": "利率方面，实际利率持续上升，给债券市场带来压力。", "x_en": "On the interest rate side, real rates continue to rise, putting strains on the bond market", "u": "https://x.com/TimmerFidelity/status/2087961380468985894", "lk": 109, "rt": 15, "rp": 11, "eng": 135, "lang": "en", "tags": ["macro", "equities", "cycle"], "important": true}, {"h": "charliebilello", "tier": 2, "b": "macro", "t": "2026-08-14 02:11", "x_zh": "华盛顿的预算策略：提高债务上限。继续支出。维持巨额赤字。重复。结果：国家债务在13个月内增加了3.7万亿美元。", "x_en": "Washington’s budget strategy:\n\nRaise the debt ceiling.\nKeep spending.\nRun massive deficits.\nRepeat.\n\nResult: The national debt is up $3.7 trillion in 13 months.", "u": "https://x.com/charliebilello/status/2088086018964496885", "lk": 82, "rt": 20, "rp": 16, "eng": 118, "lang": "en", "tags": ["macro", "data", "markets"], "important": true}, {"h": "MichaelAArouet", "tier": 2, "b": "macro", "t": "2026-08-13 13:26", "x_zh": "这里有些人认为任何税收都是盗窃。并非如此。我们都使用同样的基本国家服务，比如法院、国防和边境管控，仅举几例，因此对所有人征收统一税率将是最公平的解决方案。你不同意吗？", "x_en": "Some people argue here that any tax is theft. \n\nIt’s not. We all use the same basic state services like courts, defense and border controls, to name just few, therefore a flat tax for everyone would be the fairest solution. \n\nWouldn’t you agree?", "u": "https://x.com/MichaelAArouet/status/2087893473684812066", "lk": 58, "rt": 10, "rp": 14, "eng": 82, "lang": "en", "tags": ["macro", "economics", "data"], "important": false}, {"h": "TimmerFidelity", "tier": 1, "b": "macro", "t": "2026-08-13 22:30", "x_zh": "对于债券投资者来说，选择总是在名义和实际之间，正如实际收益率与名义收益率图表所示，自2021年以来，TIPS的表现优于名义债券。我预计这种情况将持续，因为考虑到隐含的通胀预期，名义收益率似乎过低。无论是否", "x_en": "For bond investors the choice is always between nominal and real, and as shown in the Real vs. Nominal Yields chart, since 2021 TIPS have outperformed nominals. I expect that to continue as nominals seem too low given where the implied inflation expectations are.\n\nWhether or not", "u": "https://x.com/TimmerFidelity/status/2088030337536262648", "lk": 48, "rt": 8, "rp": 8, "eng": 64, "lang": "en", "tags": ["macro", "equities", "cycle"], "important": false}, {"h": "BobEUnlimited", "tier": 1, "b": "macro", "t": "2026-08-13 16:15", "x_zh": "大多数零售AI可以被视为一种共识机器，这与产生阿尔法所需的非共识视角恰恰相反。", "x_en": "Most retail AI can be thought of as a consensus machine, which is the exact opposite of the type of nonconsensus perspective required for alpha generation.", "u": "https://x.com/BobEUnlimited/status/2087935981089341827", "lk": 43, "rt": 4, "rp": 10, "eng": 57, "lang": "en", "tags": ["macro", "rates_fx", "cycle"], "important": false}, {"h": "DariusDale42", "tier": 2, "b": "macro", "t": "2026-08-13 23:00", "x_zh": "普通投资者将永远能够负担得起@42Macro的研究。这是我对人民的承诺。", "x_en": "Main Street investors will always be able to afford \n@42Macro\n research. That’s my promise to The People.", "u": "https://x.com/DariusDale42/status/2088037965951848861", "lk": 43, "rt": 0, "rp": 4, "eng": 47, "lang": "en", "tags": ["macro", "risk_regime", "quant"], "important": false}, {"h": "LizAnnSonders", "tier": 1, "b": "macro", "t": "2026-08-13 13:24", "x_zh": "我简直不能更喜欢这个了", "x_en": "I couldn’t love this more", "u": "https://x.com/LizAnnSonders/status/2087893141898527171", "lk": 29, "rt": 1, "rp": 3, "eng": 33, "lang": "en", "tags": ["macro", "equities", "sellside"], "important": false}, {"h": "Convertbond", "tier": 2, "b": "macro", "t": "2026-08-13 23:19", "x_zh": "消费者不买石油，他们买精炼产品，比如零售柴油今年迄今上涨55%。期货翻倍。炼油厂冲击加霍尔木兹海峡挤压=货运通胀粘性。这直接传导至CPI和企业利润率，是前瞻而非后顾。今天跟随Omair……", "x_en": "Consumers don’t buy oil, they buy refined products like retail diesel +55% YTD. Futures doubled.\nRefinery hits + Hormuz squeeze = sticky freight inflation. This feeds right into CPI and corporate margins looking FORWARD not backwards. Follow Omair today…", "u": "https://x.com/Convertbond/status/2088042857353384395", "lk": 25, "rt": 5, "rp": 0, "eng": 30, "lang": "en", "tags": ["macro", "credit", "bonds"], "important": false}, {"h": "Convertbond", "tier": 2, "b": "macro", "t": "2026-08-13 23:31", "x_zh": "他们在比赛进行中移动球门柱，即——金融压       var inner=subs.map(function(sd){return '<div class="subg"><div class="subh" style="--sc:'+col+';color:'+col+'">'+sd[0]+'</div>'+sd[1].map(function(row){return '<div class="vp"><span class="vh" data-h="'+esc(row[0].replace("@",""))+'">'+row[0]+'</span>'+(row[1]?'<span class="vr">'+row[1]+'</span>':'')+row[2]+'</div>'}).join("")+'</div>'}).join("");
      var box=document.createElement("div");box.className="bsec";box.innerHTML='<div class="bhead" style="background:'+col+'">'+name+' <span style="font-weight:500;opacity:.75;font-size:12px">'+subs.length+' '+tx("domains")+' · '+nvp+' '+tx("items")+'</span><span class="arrow">▾</span></div><div class="bbody">'+inner+'</div>';
      var bd=box.querySelector(".bbody"),hd=box.querySelector(".bhead"); hd.onclick=function(){bd.style.display=bd.style.display==="none"?"":"none";box.querySelector(".arrow").textContent=bd.style.display==="none"?"▸":"▾"}; sh.appendChild(box);
    });
    sh.querySelectorAll(".vh").forEach(function(v){v.onclick=function(){jumpHandle(v.dataset.h)}});
    var uh=$("#unique");uh.innerHTML=""; r.unique.forEach(function(u){var c=document.createElement("div");c.className="ucard";c.innerHTML='<div class="uh" data-h="'+esc(u[0].replace("@",""))+'">'+u[0]+'</div><div class="uv">'+u[1]+'</div><div class="ui">'+tx("meaning")+u[2]+'</div>';c.querySelector(".uh").onclick=function(){jumpHandle(u[0].replace("@",""))};uh.appendChild(c)});
  }
  function buildPills(){
    var tw=cur().tweets,wrap=$("#boardPills");wrap.innerHTML=""; var counts={all:tw.length};Object.keys(BOARDS).forEach(function(k){counts[k]=0}); tw.forEach(function(t){counts[t.b]=(counts[t.b]||0)+1});
    function mk(key,label,color){var p=document.createElement("button");p.className="pill";p.innerHTML=label+' <span class="cnt">'+(counts[key]||0)+'</span>';if(st.board===key){p.setAttribute("data-on","1");p.style.background=color;p.style.borderColor=color} p.onclick=function(){st.board=key;buildPills();render()};return p}
    wrap.appendChild(mk("all",tx("all"),"#e7b24d")); Object.keys(BOARDS).filter(function(k){return BOARDS[k].show!==false}).forEach(function(k){wrap.appendChild(mk(k,boardLabel(k),BOARDS[k].color))});
  }
  function pass(t){
    if(st.board!=="all"&&t.b!==st.board)return false;
    if(st.tier!=="all"&&(""+t.tier)!==st.tier)return false;
    if(st.lang!=="all"&&t.lang!==st.lang)return false;
    if(st.q){var q=st.q.toLowerCase(); var hay=(bodyOf(t)+" "+(t.x_zh||"")+" "+(t.x_en||"")+" @"+t.h+" "+(t.tags||[]).join(" ")).toLowerCase(); if(hay.indexOf(q)<0)return false}
    return true
  }
  function render(){
    var m=cur().meta,tw=cur().tweets.filter(pass); tw.sort(function(a,b){return st.sort==="hot"?b.eng-a.eng:(a.t<b.t?1:-1)});
    var kol=new Set(tw.map(function(t){return t.h})).size; $("#tstat").innerHTML=tx("show")+' <b>'+tw.length+'</b> / '+m.n_tweets+' · <b>'+kol+'</b> '+tx("kols")+' · '+tx("monitor")+' '+m.n_accounts+' '+tx("accounts");
    var s=$("#stream"); if(!tw.length){s.innerHTML='<div class="empty">'+tx("empty")+'</div>';return} s.innerHTML="";
    tw.forEach(function(t){
      var B=BOARDS[t.b]||{color:"#5b8def"}, body=bodyOf(t), tags=(t.tags||[]).map(function(x){return '<span class="tag" data-tag="'+esc(x)+'">'+esc(x)+'</span>'}).join("");
      var c=document.createElement("div"); c.className="card"; c.tabIndex=0; c.style.setProperty("--bc",B.color);
      c.innerHTML='<div class="chead"><span class="hand" data-h="'+esc(t.h)+'">@'+esc(t.h)+'</span><span class="bchip" style="background:'+B.color+'">'+boardShort(t.b)+'</span>'+(t.tier===1?'<span class="t1">'+tx("tier1")+'</span>':'')+'<span class="lang">'+(t.lang==="zh"?tx("langZh"):tx("langEn"))+'</span><span class="time mono">'+esc(t.t)+'</span></div><div class="cbody">'+hl(body,st.q)+'</div><div class="cfoot"><span class="eng mono"><span>♥ '+fmt(t.lk)+'</span><span>⟲ '+fmt(t.rt)+'</span><span>💬 '+fmt(t.rp)+'</span></span><span class="tags">'+tags+'</span><span class="open">'+tx("open")+'</span></div>';
      var bodyEl=c.querySelector(".cbody"); requestAnimationFrame(function(){if(bodyEl.scrollHeight>bodyEl.clientHeight+4){bodyEl.classList.add("clamp"); var mm=document.createElement("span"); mm.className="more"; mm.textContent=tx("more"); bodyEl.after(mm); mm.onclick=function(e){e.stopPropagation();bodyEl.classList.toggle("open");bodyEl.classList.toggle("clamp");mm.textContent=bodyEl.classList.contains("open")?tx("less"):tx("more")}}});
      c.onclick=function(){window.open(t.u,"_blank","noopener")}; c.onkeydown=function(e){if(e.key==="Enter")window.open(t.u,"_blank","noopener")};
      c.querySelector(".hand").onclick=function(e){e.stopPropagation();jumpHandle(t.h)}; c.querySelectorAll(".tag").forEach(function(tg){tg.onclick=function(e){e.stopPropagation();$("#q").value=tg.dataset.tag;st.q=tg.dataset.tag;$("#clr").style.display="block";render()}});
      s.appendChild(c);
    })
  }
  function renderAll(){syncUi();renderReport();renderBrief();renderIndices();buildPills();render();setView(st.view,false)}
  var qi=$("#q"),clr=$("#clr"); qi.oninput=function(){st.q=qi.value.trim();clr.style.display=qi.value?"block":"none";render()}; clr.onclick=function(){qi.value="";st.q="";clr.style.display="none";qi.focus();render()};
  document.addEventListener("keydown",function(e){if(e.key==="/"&&document.activeElement!==qi){e.preventDefault();qi.focus()} if(e.key==="Escape"&&document.activeElement===qi){qi.value="";st.q="";clr.style.display="none";render()}});
  function seg(id,key){var el=$(id);el.querySelectorAll("button").forEach(function(b){b.onclick=function(){el.querySelectorAll("button").forEach(function(x){x.removeAttribute("data-on")});b.setAttribute("data-on","1");st[key]=b.dataset.v;render()}})}
  seg("#sortSeg","sort"); seg("#tierSeg","tier"); seg("#langSeg","lang");
  $("#reset").onclick=function(){st.board="all";st.tier="all";st.lang="all";st.sort="hot";st.q="";qi.value="";clr.style.display="none";[["#sortSeg","hot"],["#tierSeg","all"],["#langSeg","all"]].forEach(function(p){var el=$(p[0]);el.querySelectorAll("button").forEach(function(x){x.setAttribute("data-on",x.dataset.v===p[1]?"1":"")})});buildPills();render()};
  app.querySelectorAll(".langsw button").forEach(function(b){b.onclick=function(){uiLang=b.dataset.lang;renderAll()}});
  $("#viewNav").querySelectorAll("button").forEach(function(b){b.onclick=function(){setView(b.dataset.view,true)}});$("#openFull").onclick=function(){setView('full',true)};
  app.querySelectorAll(".range button").forEach(function(b){b.onclick=function(){st.range=+b.dataset.range;renderAll()}});
  renderAll();
})();
</script>
