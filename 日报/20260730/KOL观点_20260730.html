<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KOL 交易主线 · 可视化终端 · 2026-07-30</title>
<style>html,body{margin:0;background:#0e1620}</style>
</head>
<body>
<div id="kolapp">
<style>
  #kolapp *{box-sizing:border-box}
  #kolapp{--ink:#0e1620;--panel:#16212e;--panel2:#1b2836;--line:#26374a;--tx:#e7edf4;--mut:#8fa0b3;--mut2:#63748a;--gold:#e7b24d;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--tx);background:var(--ink);min-height:100vh;line-height:1.55;-webkit-font-smoothing:antialiased}
  #kolapp .mono{font-family:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
  #kolapp b{color:#f4b74a;font-weight:700} #kolapp mark{background:rgba(231,178,77,.26);color:#ffe4a3;border-radius:2px;padding:0 3px;font-weight:600}
  #kolapp .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  #kolapp .mast{background:linear-gradient(120deg,#132234,#0e1620);border-bottom:1px solid var(--line);padding:22px 0 18px}
  #kolapp .mast h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.5px}
  #kolapp .mast h1 .g{color:var(--gold)} #kolapp .mast .win{color:var(--mut);font-size:12.5px;margin-top:5px}
  #kolapp .mast .sub{color:var(--mut2);font-size:12px;margin-top:3px}
  #kolapp .mtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  #kolapp .langsw{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);padding:3px}
  #kolapp .langsw button{border:0;background:transparent;color:var(--mut);font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;cursor:pointer}
  #kolapp .langsw button[data-on="1"]{background:var(--gold);color:#0e1620}
  #kolapp select.date{margin-left:auto;background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:13px;cursor:pointer}
  #kolapp .sect{padding:22px 0 6px} #kolapp .stitle{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--mut);text-transform:uppercase;display:flex;align-items:center;gap:10px;margin-bottom:14px}
  #kolapp .stitle::before{content:"";width:5px;height:15px;background:var(--gold);border-radius:2px}
  #kolapp .ins,#kolapp .uq,#kolapp .stream{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  #kolapp .icard,#kolapp .ucard,#kolapp .card,#kolapp .bsec{background:var(--panel);border:1px solid var(--line);border-radius:11px}
  #kolapp .idxgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  #kolapp .idxcard{background:linear-gradient(145deg,var(--panel),#131f2d);border:1px solid var(--line);border-radius:13px;padding:16px 17px;min-width:0;position:relative;overflow:hidden}
  #kolapp .idxcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ic,#8fa0b3)}
  #kolapp .idxcard.nodata{background:var(--panel);border-style:dashed;opacity:.78}
  #kolapp .idxhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.idxhead b{font-size:15px!important;color:var(--tx)!important}
  #kolapp .idxconf{font-size:10px;font-weight:700;letter-spacing:.3px;border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--mut)}
  #kolapp .idxconf.low{color:#e7b24d;border-color:rgba(231,178,77,.35)}.idxconf.mid{color:#71b9e6;border-color:rgba(113,185,230,.35)}.idxconf.high{color:#55c9a5;border-color:rgba(85,201,165,.35)}
  #kolapp .idxhero{display:flex;align-items:flex-end;gap:12px;margin:11px 0 8px}.idxscore{font:800 34px "SF Mono",ui-monospace,monospace;line-height:1}.idxscore.pos{color:#55c9a5}.idxscore.neg{color:#ef7f73}.idxscore.none{color:var(--mut2)}
  #kolapp .idxstate{font-size:12px;color:var(--mut);padding-bottom:3px}.idxunder{font-size:10.5px;color:var(--mut2);line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #kolapp .idxaxis{height:9px;background:var(--panel2);border-radius:6px;position:relative;margin:13px 0 11px}.idxaxis::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:#607086}
  #kolapp .idxfill{position:absolute;height:100%;border-radius:6px}.idxmeta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.idxstat{border-top:1px solid var(--line);padding-top:8px}.idxstat strong{display:block;font:700 14px "SF Mono",ui-monospace,monospace;color:var(--tx)}.idxstat strong small{font-size:9px;color:var(--mut);font-weight:600}.idxstat span{font-size:9.5px;color:var(--mut2)}
  #kolapp .idxtrend{display:flex;align-items:center;gap:10px;margin-top:11px}.idxtrendlabel{font-size:9.5px;color:var(--mut2);white-space:nowrap}.idxspark{height:30px;flex:1}.idxspark svg{width:100%;height:30px;display:block}
  #kolapp .idxempty{margin-top:13px;border:1px dashed var(--line);border-radius:9px;padding:17px 12px;text-align:center;color:var(--mut2);font-size:11px}.idxformula{display:inline-block;margin-top:12px;padding:6px 10px;border:1px solid rgba(231,178,77,.28);border-radius:7px;background:rgba(231,178,77,.07);color:#f1c76f;font:600 11px "SF Mono",ui-monospace,monospace}.idxnote{font-size:10.5px;color:var(--mut2);margin-top:7px;line-height:1.55}
  #kolapp .comp{background:#f3efe5;color:#17202a;border:1px solid #d6ccb6;border-radius:15px;padding:18px;margin-bottom:14px;box-shadow:0 12px 28px rgba(0,0,0,.12)}
  #kolapp .comphead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}.comptitle{font:800 20px Georgia,"Songti SC",serif;color:#13251f}.compsub{font-size:10.5px;color:#7e7565;margin-top:3px}
  #kolapp .range{display:inline-flex;border:1px solid #cfc3aa;border-radius:999px;padding:3px;background:#e8e0d0;white-space:nowrap}.range button{border:0;background:transparent;color:#746a5a;padding:4px 9px;border-radius:999px;font-size:10px;font-weight:700;cursor:pointer}.range button[data-on="1"]{background:#173f35;color:#fff}
  #kolapp .compkpis{display:grid;grid-template-columns:1.25fr repeat(5,1fr);gap:8px;margin-bottom:13px}.compkpi{background:rgba(255,255,255,.58);border:1px solid #ddd3bf;border-radius:10px;padding:10px 11px;min-width:0}.compkpi.hero{background:#173f35;border-color:#173f35}.compkpi span{display:block;color:#837968;font-size:9.5px;white-space:nowrap}.compkpi strong{display:block;color:#17251f;font:800 19px "SF Mono",ui-monospace,monospace;margin-top:2px;white-space:nowrap}.compkpi.hero span{color:#bfcfc7}.compkpi.hero strong{color:#f0be4e;font-size:27px}.compkpi strong.up{color:#168264}.compkpi strong.down{color:#bd4438}.compkpi small{display:block;color:#958a78;font-size:8.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #kolapp .compchart{height:315px;background:#fbfaf6;border:1px solid #ded5c3;border-radius:11px;overflow:hidden;position:relative}.compchart svg{display:block;width:100%;height:100%}.complegend{display:flex;gap:13px;align-items:center;flex-wrap:wrap;color:#786f61;font-size:9.5px;margin:8px 2px 0}.complegend i{display:inline-block;width:12px;height:3px;margin-right:4px;vertical-align:middle}.complegend i.line{height:2px;background:#111}.complegend i.event{height:8px;width:8px;background:#9b7c35;transform:rotate(45deg)}
  #kolapp .charttip{display:none;position:absolute;z-index:3;max-width:270px;padding:8px 10px;border-radius:7px;background:rgba(19,37,31,.96);color:#fff;font-size:10px;line-height:1.55;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.24);white-space:pre-line}.compchart .hoverpoint{cursor:crosshair}
  #kolapp .compformula{margin-top:11px;padding:9px 11px;border-left:3px solid #b78a27;background:#ece4d4;color:#5e5547;font-size:10px;line-height:1.55}.compformula b{color:#173f35!important}
  #kolapp .bt{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:14px}.bttop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.bttitle{font-size:13px;font-weight:800}.btmethod{font-size:9.5px;color:var(--mut2)}.bttable{width:100%;border-collapse:collapse;font-size:10.5px}.bttable th{text-align:left;color:var(--mut2);font-weight:600;padding:6px;border-bottom:1px solid var(--line)}.bttable td{padding:7px 6px;border-bottom:1px solid rgba(38,55,74,.65);font-variant-numeric:tabular-nums}.bttable tr:last-child td{border-bottom:0}.bttable .samplelow{color:#e7b24d}.bttable .positive{color:#55c9a5}.bttable .negative{color:#ef7f73}
  #kolapp .icard{padding:14px 16px} #kolapp .icard h3{margin:0 0 9px;font-size:14.5px;font-weight:700;line-height:1.4;color:#fff;display:flex;gap:8px}
  #kolapp .inum{flex:0 0 auto;width:20px;height:20px;border-radius:6px;background:var(--gold);color:#0e1620;font-size:12px;font-weight:800;display:grid;place-items:center;margin-top:1px}
  #kolapp .icard li{list-style:none;font-size:12.8px;color:#cdd8e6;margin:6px 0;padding-left:12px;position:relative}
  #kolapp .icard li::before{content:"";position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:var(--mut2)}
  #kolapp .icard ul{margin:0;padding:0}
  #kolapp .bhead{padding:9px 14px;font-size:14px;font-weight:700;color:#0e1620;cursor:pointer;display:flex;align-items:center;gap:8px}
  #kolapp .bhead .arrow{margin-left:auto;font-size:12px;opacity:.7} #kolapp .bbody{padding:6px 14px 12px}
  #kolapp .subg{margin-top:11px} #kolapp .subh{font-size:11.5px;font-weight:700;letter-spacing:.5px;padding:2px 0 2px 8px;margin-bottom:5px;border-left:3px solid var(--sc)}
  #kolapp .vp{font-size:12.8px;color:#cdd8e6;margin:5px 0;padding-left:2px} #kolapp .vh{font-weight:700;color:var(--tx);cursor:pointer} #kolapp .vh:hover,#kolapp .ucard .uh:hover{color:var(--gold)}
  #kolapp .vr{color:var(--mut2);font-size:11px;margin:0 5px}
  #kolapp .ucard{border-left:3px solid #35bfad;padding:12px 14px} #kolapp .ucard .uh{font-weight:700;font-size:13px;color:#35bfad;cursor:pointer}
  #kolapp .ucard .uv{font-size:12.6px;color:#cdd8e6;margin:6px 0} #kolapp .ucard .ui{font-size:11.8px;color:var(--mut);border-top:1px solid var(--line);padding-top:7px;margin-top:7px}
  #kolapp .tdiv{margin:30px 0 0;border-top:1px dashed var(--line);padding-top:4px}
  #kolapp .ctrl{position:sticky;top:0;z-index:15;background:rgba(14,22,32,.94);backdrop-filter:blur(6px);padding:12px 0;border-bottom:1px solid var(--line)}
  #kolapp .pills{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  #kolapp .pill{border:1px solid var(--line);background:var(--panel);color:var(--mut);border-radius:999px;padding:5px 13px;font-size:13px;cursor:pointer;display:inline-flex;gap:7px;white-space:nowrap}
  #kolapp .pill[data-on="1"]{color:#0e1620;font-weight:600}
  #kolapp .pill .cnt{font-size:11px;color:var(--mut2)} #kolapp .pill[data-on="1"] .cnt{color:rgba(14,22,32,.6)}
  #kolapp .row2{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  #kolapp .search{flex:1;min-width:190px;position:relative}
  #kolapp .search input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:9px 32px 9px 34px;font-size:14px;outline:none}
  #kolapp .search .ic{position:absolute;left:11px;top:9px;color:var(--mut2)} #kolapp .search .clr{position:absolute;right:9px;top:7px;color:var(--mut2);cursor:pointer;font-size:16px;display:none}
  #kolapp .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden} #kolapp .seg button{background:var(--panel);color:var(--mut);border:0;padding:8px 12px;font-size:12.5px;cursor:pointer}
  #kolapp .seg button+button{border-left:1px solid var(--line)} #kolapp .seg button[data-on="1"]{background:var(--panel2);color:var(--gold)}
  #kolapp .reset{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:8px 12px;font-size:12.5px;cursor:pointer}
  #kolapp .tstat{font-size:12px;color:var(--mut);margin:10px 0} #kolapp .tstat b{color:var(--tx)}
  #kolapp .stream{padding:4px 0 60px;align-items:start}
  #kolapp .card{border-left:3px solid var(--bc,#5b8def);padding:12px 14px;cursor:pointer;overflow:hidden}
  #kolapp .chead{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
  #kolapp .hand{font-weight:700;font-size:13.5px} #kolapp .hand:hover{color:var(--gold)}
  #kolapp .bchip{font-size:10.5px;padding:1px 7px;border-radius:5px;font-weight:600;color:#0e1620}
  #kolapp .t1{font-size:10px;color:var(--gold);border:1px solid rgba(231,178,77,.4);border-radius:4px;padding:0 4px}
  #kolapp .lang{font-size:10px;color:var(--mut2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
  #kolapp .time{margin-left:auto;font-size:11px;color:var(--mut2)}
  #kolapp .cbody{font-size:13.3px;color:#d3ddeb;white-space:pre-wrap;word-break:break-word;max-height:8.6em;overflow:hidden;position:relative}
  #kolapp .cbody.open{max-height:none} #kolapp .cbody.clamp::after{content:"";position:absolute;bottom:0;left:0;right:0;height:2.2em;background:linear-gradient(180deg,transparent,var(--panel))}
  #kolapp .more{font-size:11.5px;color:var(--mut2);margin-top:3px;display:inline-block;cursor:pointer}
  #kolapp .cfoot{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line);flex-wrap:wrap}
  #kolapp .eng{display:flex;gap:11px;font-size:11.5px;color:var(--mut)} #kolapp .tags{display:flex;gap:5px;flex-wrap:wrap}
  #kolapp .tag{font-size:10.5px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;cursor:pointer}
  #kolapp .open{margin-left:auto;font-size:11.5px;color:var(--gold);white-space:nowrap}
  #kolapp .empty{grid-column:1/-1;text-align:center;color:var(--mut2);padding:50px 20px}
  @media (max-width:820px){#kolapp .idxgrid{grid-template-columns:repeat(2,minmax(0,1fr))}#kolapp .compkpis{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:560px){#kolapp .ins,#kolapp .uq,#kolapp .stream,#kolapp .idxgrid{grid-template-columns:1fr}#kolapp .comp{padding:13px}#kolapp .comphead{display:block}#kolapp .range{margin-top:9px}#kolapp .compkpis{grid-template-columns:repeat(2,1fr)}#kolapp .compchart{height:270px}.bttable{font-size:9px}}
</style>

<div class="mast"><div class="wrap">
  <div class="mtop">
    <h1 id="title"></h1>
    <div class="langsw"><button type="button" data-lang="zh">中</button><button type="button" data-lang="en">EN</button></div>
    <select class="date" id="dateSel"></select>
  </div>
  <div class="win" id="win"></div>
  <div class="sub" id="sub"></div>
</div></div>

<div class="wrap">
  <div class="sect"><div class="stitle" id="st1"></div><div class="ins" id="insights"></div></div>
  <div class="sect"><div class="stitle" id="stidx"></div>
    <div class="comp">
      <div class="comphead"><div><div class="comptitle" id="comptitle"></div><div class="compsub" id="compsub"></div></div><div class="range"><button type="button" data-range="30">30D</button><button type="button" data-range="60">60D</button></div></div>
      <div class="compkpis" id="compkpis"></div>
      <div class="compchart" id="compchart"></div>
      <div class="complegend" id="complegend"></div>
      <div class="compformula" id="compformula"></div>
    </div>
    <div class="bt"><div class="bttop"><div class="bttitle" id="bttitle"></div><div class="btmethod" id="btmethod"></div></div><div id="backtest"></div></div>
    <div class="idxgrid" id="indices"></div><div class="idxformula" id="idxformula"></div><div class="idxnote" id="idxnote"></div>
  </div>
  <div class="sect"><div class="stitle" id="st2"></div><div id="sections"></div></div>
  <div class="sect"><div class="stitle" id="st3"></div><div class="uq" id="unique"></div></div>
  <div class="tdiv"></div>
  <div class="sect"><div class="stitle" id="st4"></div></div>
</div>

<div class="ctrl"><div class="wrap">
  <div class="pills" id="boardPills"></div>
  <div class="row2">
    <div class="search"><span class="ic">🔍</span><input id="q" type="text" autocomplete="off"><span class="clr" id="clr">×</span></div>
    <div class="seg" id="sortSeg"><button data-v="hot" data-on="1"></button><button data-v="new"></button></div>
    <div class="seg" id="tierSeg"><button data-v="all" data-on="1"></button><button data-v="1"></button><button data-v="2"></button></div>
    <div class="seg" id="langSeg"><button data-v="all" data-on="1"></button><button data-v="zh"></button><button data-v="en"></button></div>
    <button class="reset" id="reset"></button>
  </div>

imcramer: Market sentiment has sharply deteriorated. What was once applauded is now scorned, but the S&P is only oversold by less than 2%. The decline does not match the sentiment, <b class=\"em\">potentially setting up a rebound.</b>"]}, {"title": "Contrarian Variable · Fed / Interest Rates", "points": ["Core view: <b class=\"em\">Core View: @biancoresearch: Waller voted to keep rates unchanged,</b> but on July 13 he said 'glaring at inflation until it melts is not an option.' His words and actions are contradictory, and the market has priced in his stance as unreliable."]}, {"title": "Sentiment Drift · Fed / Interest Rates", "points": ["Core view: Core View: @AndreasSteno: Quantitative analysis of Fed language shows persistent hawkishness, which may be performative. But the divergence between inflation expectations and nowcasts has reached historical extremes. <b class=\"em\">If rates are actually raised, it will trigger violent volatility.</b>"]}], "unique": [["@biancoresearch", "Waller voted to keep rates unchanged, but on July 13 he said 'glaring at inflation until it melts is not an option.' His words and actions are contradictory, and the market has priced in his stance as unreliable.", "The Fed's internal hawks are inconsistent in words and deeds, deepening market skepticism about the Fed's credibility."], ["@LawrenceLepard", "The 10-year U.S. Treasury yield is 4.687%, with key resistance at 4.70/4.80/4.90. A break above 5.00% would recreate the autumn 2023 scenario, when the Fed said the bond market did their work for them.", "5% is the bull-bear divide for U.S. Treasuries. A break above would trigger systemic deleveraging."], ["@ELuttwak", "Iran's rulers are not 'Islamic' but Shia sectarians. They bombed Pakistan's Balochistan province in January 2024 and recently attacked Bahrain, Egypt, Jordan, Kuwait, Oman, the UAE, and Saudi Arabia. European air forces and navies should defend their oil-supplying countries.", "If Iran continues to attack Sunni neighbors, shipping insurance and tanker rates in the Strait of Hormuz will surge."], ["@AndreasSteno", "Quantitative analysis of Fed language shows persistent hawkishness, which may be performative. But the divergence between inflation expectations and nowcasts has reached historical extremes. If rates are actually raised, it will trigger violent volatility.", "The divergence between Fed words and deeds is the biggest risk. If inflation expectations do not recede, the market will be forced to price in rate hikes."]], "sections": [["Macro Economy", [["US Stocks / Fund Flows", [["@jimcramer", "", "Market sentiment has sharply deteriorated. What was once applauded is now scorned, but the S&P is only oversold by less than 2%. The decline does not match the sentiment, <b class=\"em\">potentially setting up a rebound.</b> <span style=\"color:#8fa0b3\">Trading Implication: Sentiment is extreme but the decline is limited, increasing the probability of a short-term rebound. <b class=\"em\">However, be wary of sustained pressure from Warsh's hawkish remarks.</b></span>"]]], ["Macro Economy", [["@LukeGromen", "Global Macro", "Fauci funded the creation of a virus that primarily kills the elderly, weak, and sick, coinciding with Western welfare systems beginning to threaten sovereign bond solvency. The timing is suspiciously coincidental. <span style=\"color:#8fa0b3\">Trading Implication: The sovereign debt crisis narrative gains new evidence, strengthening the long-term bearish logic for U.S. Treasuries.</span>"], ["@chamath", "", "Infosys lowered its revenue guidance <b class=\"em\">because companies are shifting budgets from outsourced hours to controllable AI.</b> The hourly billing model of outsourcing faces structural disruption. <span style=\"color:#8fa0b3\">Trading Implication: AI replacing outsourcing is a long-term trend. <b class=\"em\">IT service stocks face earnings downgrade risks.</b></span>"]]], ["Fed / Interest Rates", [["@RaoulGMI", "Global Macro", "Global liquidity grows about 8% annually. With 3% inflation, any annual return below 11% means you are getting poorer. L1 is my most confident long-term trend. I don't look at price, only fundamentals. <span style=\"color:#8fa0b3\">Trading Implication: Under the liquidity framework, L1 is an inflation-hedging hard asset. <b class=\"em\">Pullbacks are buying opportunities, not risks.</b></span>"], ["@LynAldenContact", "Macro (Lyn Alden)", "Bond bulls are no longer arguing deflationary reasons; they are just staring at Warsh's expression. This shows the market has abandoned the deflation narrative and <b class=\"em\">fully shifted to inflation/rate hike expectations.</b> <span style=\"color:#8fa0b3\">Trading Implication: The bond market narrative has completely shifted. <b class=\"em\">Going long U.S. Treasuries requires waiting for oversold opportunities after a rate shock.</b></span>"], ["@AndreasSteno", "", "Quantitative analysis of Fed language shows persistent hawkishness, which may be performative. But the divergence between inflation expectations and nowcasts has reached historical extremes. <b class=\"em\">If rates are actually raised, it will trigger violent volatility.</b> <span style=\"color:#8fa0b3\">Trading Implication: The divergence between Fed words and deeds is the biggest risk. If inflation expectations do not recede, <b class=\"em\">the market will be forced to price in rate hikes.</b></span>"], ["@biancoresearch", "", "Waller voted to keep rates unchanged, but on July 13 he said 'glaring at inflation until it melts is not an option.' His words and actions are contradictory, and the market has priced in his stance as unreliable. <span style=\"color:#8fa0b3\">Trading Implication: The Fed's internal hawks are inconsistent in words and deeds, deepening market skepticism about the Fed's credibility.</span>"], ["@jam_croissant", "", "The Fed does not treat inflation as a problem because inflation has become a system feature, not a bug. It is a tool for U.S. debt monetization. Paulson's balloon was released long ago. <span style=\"color:#8fa0b3\">Trading Implication: Long-term inflation is a policy choice. Going long inflation assets (commodities/gold) is a structural trade.</span>"], ["@BobEUnlimited", "Macro Research", "TLT and SPY fell by similar amounts today, a mechanical discount rate shock. But the drag on growth from higher rates has not yet been priced. <b class=\"em\">Stocks should fall more than bonds.</b> <span style=\"color:#8fa0b3\">Trading Implication: The full impact of the rate shock on stocks has not yet materialized. If growth data deteriorates, <b class=\"em\">SPY will catch down.</b></span>"], ["@HenrikZeberg", "", "Chatter around rate hikes shows most people don't understand macro. The market's discussion of the rate path remains superficial, lacking deep understanding of the liquidity cycle. <span style=\"color:#8fa0b3\">Trading Implication: Market consensus may be wrong. <b class=\"em\">True macro traders should focus on liquidity turning points, not rate hikes themselves.</b></span>"], ["@LawrenceLepard", "", "The 10-year U.S. Treasury yield is 4.687%, with key resistance at 4.70/4.80/4.90. A break above 5.00% <b class=\"em\">would recreate</b> the autumn 2023 <b class=\"em\">scenario,</b> when the Fed said the bond market did their work for them. <span style=\"color:#8fa0b3\">Trading Implication: 5% is the bull-bear divide for U.S. Treasuries. <b class=\"em\">A break above would trigger systemic deleveraging.</b></span>"]]], ["Crude Oil / Distillates", [["@EconguyRosie", "", "Before the FOMC, everyone is discussing inflation, but oil prices and industrial goods have moved away from highs. The dollar is strong, wages are not accelerating, <b class=\"em\">demand growth is only</b> 1<b class=\"em\">.</b>5% annualized, and inflation pressures are fading. <span style=\"color:#8fa0b3\">Trading Implication: Market inflation panic is disconnected from fundamentals. If data confirms a slowdown, <b class=\"em\">rate expectations will drop sharply.</b></span>"]]]]], ["Geopolitics", [["Middle East", [["@BarakRavid", "Middle East Reporter (Axios)", "The U.S. military is conducting airstrikes inside Iran. Saudi Defense Minister urgently met with Vance to convey MBS's message, showing the U.S. is trying to end the war through a dual track of military pressure and diplomatic mediation. <span style=\"color:#8fa0b3\">Trading Implication: Airstrikes escalate but diplomacy continues, increasing oil price volatility risk. <b class=\"em\">Watch whether Saudi Arabia's stance shifts.</b></span>"], ["@ksadjadpour", "", "Trump seeks a quick victory or quick peace, but Tehran is not deterred. They fight a long war with the ideology of resistance, revenge, and revolution. <span style=\"color:#8fa0b3\">Trading Implication: The U.S. quick-decision strategy conflicts with Iran's long-war logic. Time is on Iran's side, and oil prices may remain structurally tight.</span>"], ["@ELuttwak", "", "Iran's rulers are not 'Islamic' but Shia sectarians. They bombed Pakistan's Balochistan province in January 2024 and recently attacked Bahrain, Egypt, Jordan, Kuwait, Oman, the UAE, and Saudi Arabia. <b class=\"em\">European air forces and navies should defend their oil-supplying countries.</b> <span style=\"color:#8fa0b3\">Trading Implication: If Iran continues to attack Sunni neighbors, <b class=\"em\">shipping insurance and tanker rates in the Strait of Hormuz will surge.</b></span>"], ["@joshua_landis", "", "Israel's Defense Minister said, 'We would love to strike Iran's energy targets, but the U.S. has not approved it yet due to fears that Iran attacking neighbors could trigger a global oil crisis.' <span style=\"color:#8fa0b3\">Trading Implication: If the U.S. eventually approves, Iran's energy exports will be directly threatened. <b class=\"em\">Oil prices could jump.</b></span>"]]], ["Russia-Ukraine", [["@PhillipsPOBrien", "Strategic Studies", "Trump has the ability to immediately provide Ukraine with Patriot interceptors and sanction Russian companies, but he chooses not to do so. The so-called 'shift to aid Ukraine' is self-deception. <span style=\"color:#8fa0b3\">Trading Implication: If Trump still does not aid Ukraine after re-election, <b class=\"em\">Europe will be forced to bear the support for Ukraine alone,</b> leading to expected increases in eurozone defense spending.</span>"], ["@RALee85", "", "Former Ukrainian Defense Minister Fedorov said there is no personal conflict with Commander-in-Chief Zaluzhnyi. The disagreement lies in different visions for the conduct of the war, <b class=\"em\">and that vision must adapt to reality.</b> <span style=\"color:#8fa0b3\">Trading Implication: The strategic divergence among Ukraine's top military leadership has become public. <b class=\"em\">It may affect the pace of future counteroffensives and Western aid confidence.</b></span>"], ["@LawDavF", "", "Analyzing whether Putin will be forced to announce a large-scale mobilization <b class=\"em\">requires assessing front-line needs and the extent of Russia's conscription crisis.</b> <span style=\"color:#8fa0b3\">Trading Implication: If Putin initiates mobilization, Russia's domestic political risk rises. <b class=\"em\">The ruble may come under pressure.</b></span>"]]], ["Other Geopolitics", [["@PeterZeihan", "", "The combination of weather patterns and battlefield developments <b class=\"em\">could lead to food shortages in parts of North Africa and South Asia.</b> <span style=\"color:#8fa0b3\">Trading Implication: <b class=\"em\">Food security risks for wheat-importing countries like Egypt and Pakistan rise,</b> potentially pushing up global wheat prices.</span>"]]]]], ["Commodities", [["Crude Oil", [["@JavierBlas", "Energy Reporter (BBG)", "Iran is trying to impose unbearable economic costs on the Trump administration by blockading the Strait of Hormuz. But nominal oil price gains are insufficient; after adjusting for inflation, prices are only at moderate levels, failing to create effective pressure. <span style=\"color:#8fa0b3\">Trading Implication: Inflation-adjusted oil prices are key. If real prices do not break historical highs, Iran's strategy will have limited effect.</span>"]]]]], ["Weather / Climate", [["Weather / Climate", [["@commoditywx", "Commodity / Agriculture / Energy Weather", "Typhoon Dolphin turned later than expected, with limited impact on the Northern Hemisphere. <b class=\"em\">However, a subsequent new storm may turn north within 11-15 days,</b> worth watching. <span style=\"color:#8fa0b3\">Trading Implication: Typhoon path uncertainty affects shipping and energy trading rhythms.</span>"], ["@climateguyw", "Climate Research", "A cold front on July 29 will ease the CAT3 heatwave in the Southeast, <b class=\"em\">but the Southwest will warm in the coming days,</b> with regional divergence in heatwave patterns. <span style=\"color:#8fa0b3\">Trading Implication: <b class=\"em\">Heatwave shifts affect regional demand for natural gas and electricity.</b></span>"]]]]], ["AI / Semiconductors", [["Inference", [["@simonw", "", "Optimization of GPT-5.6 Sol reduces inference service costs by 20%. At current scale, this could save billions of dollars per month. The pace of inference efficiency improvement far exceeds expectations. <span style=\"color:#8fa0b3\">Trading Implication: <b class=\"em\">Plummeting inference costs will accelerate AI application penetration,</b> but chip makers need volume growth to offset unit price declines.</span>"], ["@natolambert", "", "There are still many 'engineering low-hanging fruits' in model inference. <b class=\"em\">System optimization from post-training to inference will become a key area for cost savings.</b> <span style=\"color:#8fa0b3\">Trading Implication: System-level optimization capability will become a new dimension of AI chip competitiveness. <b class=\"em\">Pure hardware specification advantages may be diluted.</b></span>"]]]]]]}, "tweets": [{"h": "jimcramer", "tier": 1, "b": "macro", "t": "2026-07-29 15:29", "x_zh": "情绪变得如此迅速地极度负面。我们曾经会称赞的事情现在却憎恨。真是令人瞠目结舌。", "x_en": "Sentiment has tuned incredibly negative so quickly. Things we would have applauded we now hate. Just jaw-dropping.", "u": "https://x.com/jimcramer/status/2082488815483007392", "lk": 1170, "rt": 86, "rp": 266, "eng": 1522, "lang": "en", "tags": ["macro", "equities", "teacher_required"]}, {"h": "LukeGromen", "tier": 1, "b": "macro", "t": "2026-07-29 17:29", "x_zh": "所以福奇监督资助并创造了一种主要杀死老年和患病美国人（及全球人民）的病毒……就在西方福利计划开始严重威胁西方主权债券市场偿付能力的时候？这真是巧合，@RandPaul &", "x_en": "So Fauci oversaw the funding & creation of a virus that primarily killed old & sick Americans (& people worldwide)...\n\n...just as western Entitlement programs began acutely threatening the solvency of western sovereign bond markets?\n\nThat is some coincidence, \n@RandPaul\n &", "u": "https://x.com/LukeGromen/status/2082519010625945905", "lk": 1183, "rt": 177, "rp": 119, "eng": 1479, "lang": "en", "tags": ["macro", "sovereign_debt", "commodities"]}, {"h": "RaoulGMI", "tier": 1, "b": "macro", "t": "2026-07-29 18:05", "x_zh": "我从长期趋势中赚到的钱比任何其他方式都多。而我最有信心的趋势是L1s。人们无法理解我如何在这种回撤中持有。怎么能忽视它跌这么多？简单。我不看价格。我看的是", "x_en": "I've made more money from long-term trends than anything else. And the one I have the most conviction in is L1s.\n\nPeople can't understand how I hold through drawdowns like this. How can you ignore it falling this much? Simple. I'm not looking at the price. I'm looking at what", "u": "https://x.com/RaoulGMI/status/2082528040920158412", "lk": 1124, "rt": 128, "rp": 120, "eng": 1372, "lang": "en", "tags": ["macro", "crypto", "long_cycle"]}, {"h": "LynAldenContact", "tier": 1, "b": "macro", "t": "2026-07-29 20:33", "x_zh": "债券多头不再提出为什么通缩即将到来的论据。他们现在只是像这样看着沃什。", "x_en": "Bond bulls don’t make arguments for why deflation is coming anymore. \n\nThey just look at Warsh like this now.", "u": "https://x.com/LynAldenContact/status/2082565206564127092", "lk": 1218, "rt": 73, "rp": 79, "eng": 1370, "lang": "en", "tags": ["macro", "rates_fx", "liquidity"]}, {"h": "jimcramer", "tier": 1, "b": "macro", "t": "2026-07-30 00:41", "x_zh": "微软的季度业绩让我震惊。力作。我没预料到，因为担心信托在该股中的超重仓位。萨提亚和艾米——难以置信……太棒了……名人堂级别。", "x_en": "Just blown away by the Microsoft quarter. Tour de force. Didn't see it coming because was worried about the trust's oversized load position in it. Satya and Amy--incredible.. Just amazing... HOF", "u": "https://x.com/jimcramer/status/2082627516829680063", "lk": 855, "rt": 76, "rp": 184, "eng": 1115, "lang": "en", "tags": ["macro", "equities", "teacher_required"]}, {"h": "charliebilello", "tier": 2, "b": "macro", "t": "2026-07-29 20:43", "x_zh": "Meta的现实实验室部门在第二季度又亏损了46亿美元，使其自2020年以来的累计亏损达到870亿美元。我们从未见过一家上市公司如此大规模地烧钱。$META", "x_en": "Meta's Reality Labs unit lost another $4.6 billion in Q2, bringing its cumulative losses since 2020 up to $87 billion. We've never seen a public company light money on fire to this extent. \n$META", "u": "https://x.com/charliebilello/status/2082567601071255670", "lk": 887, "rt": 137, "rp": 58, "eng": 1082, "lang": "en", "tags": ["macro", "data", "markets"]}, {"h": "LawrenceLepard", "tier": 2, "b": "macro", "t": "2026-07-29 19:47", "x_zh": "沃什说，“我们将实现我们的通胀目标”债券市场：", "x_en": "Warsh, \"we will achieve our inflation mandate\"\n\nBond market:", "u": "https://x.com/LawrenceLepard/status/2082553543882395896", "lk": 793, "rt": 80, "rp": 44, "eng": 917, "lang": "en", "tags": ["macro", "gold", "hard_assets"]}, {"h": "RaoulGMI", "tier": 1, "b": "macro", "t": "2026-07-29 15:27", "x_zh": "如果你的回报率没有超过每年11%，你就在变穷。全球流动性每年增长约8%。这是货币供应扩张，意味着你口袋里的现金价值每年大约下降那么多。再加上大约3%的正常通胀，你", "x_en": "If your returns aren't beating 11% a year, you're getting poorer.\n\nGlobal liquidity grows about 8% a year. That's the money supply expanding, and it means the value of the cash in your pocket falls by roughly that much every year. Add maybe 3% of normal inflation on top and you", "u": "https://x.com/RaoulGMI/status/2082488065545642198", "lk": 719, "rt": 96, "rp": 75, "eng": 890, "lang": "en", "tags": ["macro", "crypto", "long_cycle"]}, {"h": "chamath", "tier": 1, "b": "macro", "t": "2026-07-29 15:02", "x_zh": "印孚瑟斯本周下调了营收预测。给出的理由是，企业正在将预算从外包工时转移到它们可以控制的人工智能上。外包模式建立在按小时计费的基础上，只有当工作保持缓慢和手动时，这种模式才会增长。所以", "x_en": "Infosys cut its revenue forecast this week. \n\nThe reason it gave is that enterprises are moving their budgets out of outsourced hours and into AI they can control. \n\nThe outsourcing model was built on billing by the hour, which only grows when the work stays slow and manual. So", "u": "https://x.com/chamath/status/2082481943258529873", "lk": 729, "rt": 61, "rp": 82, "eng": 872, "lang": "en", "tags": ["macro", "equities", "technology"]}, {"h": "jimcramer", "tier": 1, "b": "macro", "t": "2026-07-29 23:47", "x_zh": "经历了这一切，我们竟然只超卖了不到2%？？嗯", "x_en": "after all of this an we are less than 2% oversold??? Hmm", "u": "https://x.com/jimcramer/status/2082613944967922134", "lk": 585, "rt": 52, "rp": 171, "eng": 808, "lang": "en", "tags": ["macro", "equities", "teacher_required"]}, {"h": "AndreasSteno", "tier": 1, "b": "macro", "t": "2026-07-29 21:16", "x_zh": "美光现在基本上可以在未来4年内回购所有股票了……差不多", "x_en": "Micron can buy back all shares the next 4 years now.. more or less", "u": "https://x.com/AndreasSteno/status/2082575960705036364", "lk": 513, "rt": 21, "rp": 66, "eng": 600, "lang": "en", "tags": ["macro", "rates_fx", "cross_asset"]}, {"h": "LawrenceLepard", "tier": 2, "b": "macro", "t": "2026-07-29 21:15", "x_zh": "所有人都在关注美国10年期国债收益率。收盘报4.687%。4.70%、4.80%、4.90%，然后是突破点5.00%！上一次达到这个水平是在2023年秋季，当时正如你所记得的，美联储表示债券市场正在为他们完成部分工作。鲍威尔说，这一上涨使他们从", "x_en": "All eyes on the US 10yr.  Went out at 4.687%.\n4.70, 4.80, 4.90 and then the break point 5.00%!\n\nThe last time it was there was fall of 2023 when as you will recall the Fed said the bond market was doing some of its work for them.  Powell said this increase made them shift from an", "u": "https://x.com/LawrenceLepard/status/2082575685294412279", "lk": 501, "rt": 35, "rp": 27, "eng": 563, "lang": "en", "tags": ["macro", "gold", "hard_assets"]}, {"h": "elerianm", "tier": 1, "b": "macro", "t": "2026-07-29 17:04", "x_zh": "终于！#世界杯 @FIFAWorldCup", "x_en": "Finally!\n\n#worldcup \n@FIFAWorldCup", "u": "https://x.com/elerianm/status/2082512490202624494", "lk": 408, "rt": 29, "rp": 50, "eng": 487, "lang": "en", "tags": ["macro", "central_banks", "teacher_required"]}, {"h": "biancoresearch", "tier": 1, "b": "macro", "t": "2026-07-29 20:09", "x_zh": "贝森特多久会揍他一顿？", "x_en": "How long before Bessent punches him in the face?", "u": "https://x.com/biancoresearch/status/2082559156767068409", "lk": 415, "rt": 12, "rp": 47, "eng": 474, "lang": "en", "tags": ["macro", "rates_fx", "bonds"]}, {"h": "Stephanie_Link", "tier": 2, "b": "macro", "t": "2026-07-29 20:45", "x_zh": "$VRT 的反应很荒谬：每股收益超预期，利润率超预期，将2026年有机增长预期上调至31%，第三季度为30%，第四季度为40%左右，2026年积压订单估计为200亿美元，而2025年为150亿美元。有机增长预期为17%而非24%，这更多是转化率的问题，而非需求相关的问题。", "x_en": "$VRT\n reaction is absurd:  Beat EPS, beat margins, raised org g for 2026 to 31% with 30% in 3Q and mid 40% in 4Q and backlog est at $20B for 2026 vs $15B in 2025.  The org miss of 17% vs 24% is more a question of conversion vs anything tied to demand.", "u": "https://x.com/Stephanie_Link/status/2082568100805754997", "lk": 435, "rt": 20, "rp": 15, "eng": 470, "lang": "en", "tags": ["macro", "equities", "fund_manager"]}, {"h": "jam_croissant", "tier": 1, "b": "macro", "t": "2026-07-29 23:56", "x_zh": "“美联储一直没有认真对待通胀‘问题’……”因为他们不认为这是一个‘问题’。通胀已成为当前系统的一个特征，而非缺陷。这是美国将其债务货币化的方式。汉克·保尔森的试探性气球已经清楚地表明", "x_en": "“The Fed has not been taking the inflation \"problem\" seriously..” B/C THEY DO NOT SEE IT AS A ‘PROBLEM’. \n\nInflation has become a feature, not a bug  of the current system. It is how the USA  will monetize its debt. \n\nHank Paulson’s trial balloon has already clearly laid", "u": "https://x.com/jam_croissant/status/2082616236555280398", "lk": 360, "rt": 52, "rp": 44, "eng": 456, "lang": "en", "tags": ["macro", "volatility", "options"]}, {"h": "charliebilello", "tier": 2, "b": "macro", "t": "2026-07-29 20:20", "x_zh": "Meta营收同比增长28%，达到创纪录的608亿美元。但成本/费用同比飙升55%，达到创纪录的420亿美元。因此，净利润同比下降14%至158亿美元。营业利润率31%，低于一年前的43%。$META", "x_en": "Meta revenues increased 28% over the last year to a new record high of $60.8 billion. But costs/expenses rose 55% YoY to a record $42.0 billion. As a result, net income fell 14% YoY to $15.8 billion. And operating profit margin of 31% was down from 43% a year ago. \n$META", "u": "https://x.com/charliebilello/status/2082561830262546664", "lk": 330, "rt": 43, "rp": 26, "eng": 399, "lang": "en", "tags": ["macro", "data", "markets"]}, {"h": "EconguyRosie", "tier": 2, "b": "macro", "t": "2026-07-29 12:15", "x_zh": "在今天的FOMC会议之前，所有讨论都集中在通胀高企上。与此同时，石油和工业大宗商品价格已远低于近期高点。美元走强。工资完全没有加速增长。需求增长目前处于停滞速度的1-1.5%年率。", "x_en": "Ahead of today’s FOMC meeting, all the chatter is about elevated inflation. Meanwhile, oil and industrial commodity prices are well off their nearby highs.  The USD is strong.  There is no wage acceleration at all.  Demand growth is now running at a stall-speed 1-1/2% annual", "u": "https://x.com/EconguyRosie/status/2082439810698854654", "lk": 292, "rt": 49, "rp": 41, "eng": 382, "lang": "en", "tags": ["macro", "economics", "cycle"]}, {"h": "elerianm", "tier": 1, "b": "macro", "t": "2026-07-29 20:55", "x_zh": "继我最近关于债券收益率的帖子之后：在今日再次大幅飙升后，30年期美国国债收益率触及2007年以来未见的水平。（下方彭博图表。）#经济 #市场 #债券", "x_en": "Further to my recent posts on bond yields:\nAfter another sharp surge today, the 30-year U.S. Treasury bond has hit levels not seen since 2007.\n(Bloomberg chart below.)\n#economy #markets #bonds", "u": "https://x.com/elerianm/status/2082570668038643857", "lk": 266, "rt": 72, "rp": 34, "eng": 372, "lang": "en", "tags": ["macro", "central_banks", "teacher_required"]}, {"h": "darioperkins", "tier": 2, "b": "macro", "t": "2026-07-29 19:14", "x_zh": "老实说，我很震惊。这家伙45分钟里除了忽悠什么都没给。就连他对经济状况的描述也是不诚实且略有偏差的。没人关心吗？没人要指出这些问题吗？也许我需要休个假……", "x_en": "honestly, I'm astounded. This guy has given us nothing but spin for 45 minutes. Even his description of what is happening in the economy has been dishonest and slightly inaccurate. And nobody cares? Nobody is going to call this stuff out? Maybe I need a vacation.....", "u": "https://x.com/darioperkins/status/2082545357154611693", "lk": 299, "rt": 18, "rp": 37, "eng": 354, "lang": "en", "tags": ["macro", "central_banks", "economics"]}, {"h": "jimcramer", "tier": 1, "b": "macro", "t": "2026-07-30 01:06", "x_zh": "虽然我确实不喜欢Meta的季度业绩，但该公司确实拥有一套特定的技能，使其仍然值得持有……话虽如此，这就像NFL，你必须进入季后赛。这不是一个季后赛赛季。", "x_en": "While i was certainly not in love with the Meta quarter the company does have a particular set of skills that still make it worth owning... That said, it's like the NFL,  you gotta make the playoffs. This was not a playoff season.", "u": "https://x.com/jimcramer/status/2082634016377737581", "lk": 236, "rt": 12, "rp": 59, "eng": 307, "lang": "en", "tags": ["macro", "equities", "teacher_required"]}, {"h": "darioperkins", "tier": 2, "b": "macro", "t": "2026-07-29 20:43", "x_zh": "当美联储搞砸时——它肯定会搞砸——那将是因为凯文·沃什认为自己比其他人（包括金融市场）都聪明。", "x_en": "When this Fed screws up - and it will screw up - it will be because Kevin Warsh thinks he is cleverer than everyone else, financial markets included", "u": "https://x.com/darioperkins/status/2082567745359794652", "lk": 259, "rt": 20, "rp": 27, "eng": 306, "lang": "en", "tags": ["macro", "central_banks", "economics"]}, {"h": "jimcramer", "tier": 1, "b": "macro", "t": "2026-07-29 10:03", "x_zh": "油价上涨难以推动上涨；与此同时，欧洲银行提醒我们，这个群体目前是赢家。德意志银行不错，桑坦德银行表现最佳。", "x_en": "Hard to amount an advance with oil higher; meanwhile European banks remind us that this group is a winner right now. Deutsche Bank good, SAN best in show", "u": "https://x.com/jimcramer/status/2082406723709530306", "lk": 224, "rt": 13, "rp": 44, "eng": 281, "lang": "en", "tags": ["macro", "equities", "teacher_required"]}, {"h": "AndreasSteno", "tier": 1, "b": "macro", "t": "2026-07-29 21:28", "x_zh": "如果你有一个明确的2%目标，却不想提供预测，当通胀远高于目标且已持续一段时间时，你为什么不现在就加息？", "x_en": "If you have an explicit target of 2% and you don't want to provide forecasts, why on earth aren't you hiking already, when inflation is vastly above target and has been so for a while?", "u": "https://x.com/AndreasSteno/status/2082578924995858702", "lk": 174, "rt": 8, "rp": 65, "eng": 247, "lang": "en", "tags": ["macro", "rates_fx", "cross_asset"]}, {"h": "AndreasSteno", "tier": 1, "b": "macro", "t": "2026-07-29 21:02", "x_zh": "目前的问题是，如果你从量化角度衡量“措辞”，它们会变得越来越鹰派（今天也是如此）。这可能全是作秀（我很想这么认为），但我们面临着通胀预期（以及我们的现在预测，顺便说一句）之间最大的脱节。", "x_en": "The issue, for now, is that if you measure the “wordings” from a quantitative standpoint, they keep getting more hawkish (also today). \n\nIt may all be a show (I am very tempted to think so), but we have the biggest disconnect between inflation expectations (and our nowcasts, btw)", "u": "https://x.com/AndreasSteno/status/2082572456938602778", "lk": 157, "rt": 13, "rp": 23, "eng": 193, "lang": "en", "tags": ["macro", "rates_fx", "cross_asset"]}, {"h": "biancoresearch", "tier": 1, "b": "macro", "t": "2026-07-29 20:04", "x_zh": "美联储理事克里斯·沃勒投票支持维持利率不变。沃勒在7月13日曾表示：“严厉地盯着通胀，直到它在我们的怒视下融化，这不是一个选项。”我同意，债券市场也同意。那么为什么沃勒投票支持维持利率不变？如果他投票支持加息，会不会...", "x_en": "Fed Gov Chris Waller voted to hold rates steady.\n\nWaller said this on July 13:\n\n\"Sternly staring at inflation until it melts before our withering gaze is not an option.\"\n\nI agree, as does the bond market.\n\nSo why did Waller vote to hold rates steady? Had he voted to hike, would", "u": "https://x.com/biancoresearch/status/2082557825629487420", "lk": 132, "rt": 20, "rp": 30, "eng": 182, "lang": "en", "tags": ["macro", "rates_fx", "bonds"]}, {"h": "elerianm", "tier": 1, "b": "macro", "t": "2026-07-29 17:04", "x_zh": "值得注意的是，今年迄今为止关键市场价格的一轮波动不仅限于石油。我们还看到政府债券收益率出现大幅波动，这些收益率在国内——某些情况下在国际上——作为企业借贷、住房抵押贷款的基准。", "x_en": "It is important to note that the bout of volatility so far this year in key market prices extends beyond oil.\nWe are also seeing big moves in government bond yields, which serve nationally—and in some cases, internationally—as benchmarks for corporate borrowing, home mortgages,", "u": "https://x.com/elerianm/status/2082512551640785044", "lk": 148, "rt": 15, "rp": 16, "eng": 179, "lang": "en", "tags": ["macro", "central_banks", "teacher_required"]}, {"h": "WarrenPies", "tier": 1, "b": "macro", "t": "2026-07-30 01:28", "x_zh": "现在每个人都看到了这一点", "x_en": "Everyone sees this now", "u": "https://x.com/WarrenPies/status/2082639348504084496", "lk": 144, "rt": 13, "rp": 20, "eng": 177, "lang": "en", "tags": ["macro", "oil_energy", "cycle"]}, {"h": "jimcramer", "tier": 1, "b": "macro", "t": "2026-07-30 01:50", "x_zh": "来自星巴克的精彩问题...就在人们放弃它的时候", "x_en": "Awesome q from SBUX... Just when people were giving up on it", "u": "https://x.com/jimcramer/status/2082644975511036040", "lk": 123, "rt": 8, "rp": 45, "eng": 176, "lang": "en", "tags": ["macro", "equities", "teacher_required"]}, {"h": "LukeGromen", "tier": 1, "b": "macro", "t": "2026-07-29 22:42", "x_zh": "又一天，石油大涨，黄金...也涨了。", "x_en": "Another day with oil up big and gold...up.", "u": "https://x.com/LukeGromen/status/2082597720544424320", "lk": 151, "rt": 4, "rp": 17, "eng": 172, "lang": "en", "tags": ["macro", "sovereign_debt", "commodities"]}, {"h": "Stephanie_Link", "tier": 2, "b": "macro", "t": "2026-07-30 00:24", "x_zh": "我知道我今天和上周买了什么...顺便说一句 PWR VRT ETN GEV", "x_en": "I know what I bought today and last week… btw\nPWR VRT ETN GEV", "u": "https://x.com/Stephanie_Link/status/2082623387608719809", "lk": 147, "rt": 11, "rp": 3, "eng": 161, "lang": "en", "tags": ["macro", "equities", "fund_manager"]}, {"h": "hkuppy", "tier": 2, "b": "macro", "t": "2026-07-30 01:30", "x_zh": "差不多两个月过去了，我看到的全是韩国人失去毕生积蓄的截图。这很可悲，但我想金融机构的状况要糟糕得多。不知道真正的尸体什么时候会暴露出来...", "x_en": "Almost 2 months later, and all I see are screenshots of Koreans who lost their life’s savings. It’s sad and all, but I imagine that the financial institutions are in far worse shape. Wonder when the real corpses get exposed…", "u": "https://x.com/hkuppy/status/2082639901061750869", "lk": 141, "rt": 10, "rp": 9, "eng": 160, "lang": "en", "tags": ["macro", "commodities", "fund_manager"]}, {"h": "EconguyRosie", "tier": 2, "b": "macro", "t": "2026-07-29 18:32", "x_zh": "Logan、Hammack和Kashkari在美联储会议上均投反对票，支持加息。这真是个大意外。这三位鹰派成员在4月29日鲍威尔的上次会议中也投了反对票。他们除了制造头条新闻外，毫无影响力。", "x_en": "Logan, Hammack and Kashkari all dissented at the Fed meeting in favor of a rate hike. What a big surprise. Same Gang of Three hawks who dissented at Powell’s last meeting on April 29th. They have zero influence outside of making headlines.", "u": "https://x.com/EconguyRosie/status/2082534642876375191", "lk": 129, "rt": 15, "rp": 16, "eng": 160, "lang": "en", "tags": ["macro", "economics", "cycle"]}, {"h": "BobEUnlimited", "tier": 1, "b": "macro", "t": "2026-07-29 20:38", "x_zh": "TLT和SPY今日跌幅大致相同，受Warsh言论影响。这是机械性的。更高的贴现率直接拖累股价（通过降低未来盈利的贴现价值）。但这对股票的影响*应该*更糟，因为更高的利率拖累经济增长。这部分尚未被定价。", "x_en": "TLT and SPY are down roughly the same today are Warsh's comments.\n\nThat's mechanical. Higher discount rates directly drag on stock prices (through lower discounted future earnings).\n\nBut it *should* be worse for stocks b/c higher rates drag on growth. That part isn't priced yet.", "u": "https://x.com/BobEUnlimited/status/2082566343249809507", "lk": 122, "rt": 7, "rp": 19, "eng": 148, "lang": "en", "tags": ["macro", "rates_fx", "cycle"]}, {"h": "HenrikZeberg", "tier": 1, "b": "macro", "t": "2026-07-29 18:28", "x_zh": "围绕加息的闲聊真的让我看到有多少人不懂宏观经济学...", "x_en": "The chit-chat around Rate Hikes really show me how few people who understand Macro...", "u": "https://x.com/HenrikZeberg/status/2082533778929381765", "lk": 141, "rt": 4, "rp": 2, "eng": 147, "lang": "en", "tags": ["macro", "technical", "cross_asset"]}, {"h": "MichaelAArouet", "tier": 2, "b": "macro", "t": "2026-07-29 19:21", "x_zh": "德国人更愿意为政府“工作”，而不是创业，并且认真假设他们会保持繁荣。拥有这种心态的国家不会保持繁荣。他们目前用更多债务掩盖持续的衰退。企业家创造繁荣，而不是政府。", "x_en": "Germans prefer „working“ for the government over starting a business and seriously assume they will keep their prosperity.\n\nA nation with such a mindset won’t stay prosperous. They cover the steady decline with more debt for now\n\nEntrepreneurs build prosperity, not the government", "u": "https://x.com/MichaelAArouet/status/2082546963094884470", "lk": 112, "rt": 21, "rp": 8, "eng": 141, "lang": "en", "tags": ["macro", "economics", "data"]}, {"h": "darioperkins", "tier": 2, "b": "macro", "t": "2026-07-29 19:55", "x_zh": "债券市场的反应基本上是“我觉得这是扯淡”...", "x_en": "The reaction in bonds is basically \"I smell bullshit\"...", "u": "https://x.com/darioperkins/status/2082555694553907304", "lk": 118, "rt": 5, "rp": 15, "eng": 138, "lang": "en", "tags": ["macro", "central_banks", "economics"]}, {"h": "MichaelAArouet", "tier": 2, "b": "macro", "t": "2026-07-29 14:21", "x_zh": "人口结构问题不仅存在于亚洲。意大利、西班牙、波兰和德国也在梦游般地走向危机。不要指望那里的养老金足以体面退休，许多房产将从资产变成无价值的负债。据此规划。", "x_en": "Demographics is not only an issue in Asia. \n\nItaly, Spain, Poland and Germany are sleepwalking into a crisis as well.\n\nDon’t count on a pension sufficient for a decent retirement there, and many properties will turn from assets to worthless liabilities. Plan accordingly.", "u": "https://x.com/MichaelAArouet/status/2082471523495886978", "lk": 105, "rt": 19, "rp": 8, "eng": 132, "lang": "en", "tags": ["macro", "economics", "data"]}, {"h": "darioperkins", "tier": 2, "b": "macro", "t": "2026-07-29 19:06", "x_zh": "这听起来几乎像是9月加息的指引...", "x_en": "that almost sounded like forward guidance for a September hike...", "u": "https://x.com/darioperkins/status/2082543357343965208", "lk": 106, "rt": 5, "rp": 12, "eng": 123, "lang": "en", "tags": ["macro", "central_banks", "economics"]}, {"h": "elerianm", "tier": 1, "b": "macro", "t": "2026-07-29 16:52", "x_zh": "来自《华尔街日报》头版（如下）。虽然这无疑是一个公司特定问题，但它也指向更广泛的问题——实时展开的双向因果关系：债券市场融资需求上升，主要由科技资本支出推动，", "x_en": "From the front page of the Wall Street Journal (below).\nWhile this is undoubtedly a firm-specific issue, it also points to something much broader -- a two-sided causality unfolding in real time between:\nRising funding needs in the bond market, fueled primarily by tech capex and", "u": "https://x.com/elerianm/status/2082509615141359949", "lk": 83, "rt": 13, "rp": 19, "eng": 115, "lang": "en", "tags": ["macro", "central_banks", "teacher_required"]}, {"h": "AndreasSteno", "tier": 1, "b": "macro", "t": "2026-07-29 19:38", "x_zh": "我怀疑这全是无所作为的废话行话。", "x_en": "I suspect that it is all bullshit lingo for doing nothing", "u": "https://x.com/AndreasSteno/status/2082551305839456608", "lk": 97, "rt": 3, "rp": 12, "eng": 112, "lang": "en", "tags": ["macro", "rates_fx", "cross_asset"]}, {"h": "TaviCosta", "tier": 1, "b": "macro", "t": "2026-07-30 03:07", "x_zh": "当收益率飙升而你的货币无法上涨时，你就知道有些东西从根本上出了问题。这是我们这个时代最具标志性的宏观信号之一：美国的债务负担正在将更高的收益率转化为财政压力的证据。我们中没有人拥有足够的硬资产。", "x_en": "You know something is fundamentally broken when yields surge and your currency can’t rally.\n\nThis is one of the defining macro signals of our time:\n\nAmerica’s debt burden is turning higher yields into evidence of fiscal stress.\n\nNone of us own enough hard assets.", "u": "https://x.com/TaviCosta/status/2082664241002090908", "lk": 78, "rt": 16, "rp": 16, "eng": 110, "lang": "en", "tags": ["macro", "commodities", "cycle"]}, {"h": "Stephanie_Link", "tier": 2, "b": "macro", "t": "2026-07-29 20:48", "x_zh": "$SBUX：出色的执行，同店销售和利润率好于预期，指引上调。飞轮效应显现：每股收益同比增长82%，同店销售增长7.9%，营业利润率提高430个基点——巨大进展，定位良好，每股收益潜力超过4美元。", "x_en": "$SBUX\n:  fabulous execution with better than expected SSS and margins w higher guide.  Flywheel working:  EPS +82% y/y, SSS +7.9%, and OM +430 bps - huge progress and positions + EPS Power $4+.", "u": "https://x.com/Stephanie_Link/status/2082568965788778553", "lk": 102, "rt": 4, "rp": 1, "eng": 107, "lang": "en", "tags": ["macro", "equities", "fund_manager"]}, {"h": "TimmerFidelity", "tier": 1, "b": "macro", "t": "2026-07-29 16:56", "x_zh": "上周收益率的上升同时体现在名义和实际端，通胀盈亏平衡率保持在2.3%左右。10年期实际收益率现在达到慷慨的2.43%，在我看来，这比4.7%的名义收益率更具价值。", "x_en": "The rise in yi /2082665971521581566", "lk": 10, "rt": 1, "rp": 4, "eng": 15, "lang": "en", "tags": ["macro", "rates_fx", "market_narrative"]}, {"h": "PhillipsPOBrien", "tier": 2, "b": "geopolitics", "t": "2026-07-29 14:31", "x_zh": "如果特朗普想帮助乌克兰，他现在就可以。他可以发送武器，比如爱国者拦截弹，他可以制裁俄罗斯公司以及与它们做生意的公司——立即行动。除了他不想这么做之外，没有任何东西阻止他。这是为什么？", "x_en": "If Trump wanted to help Ukraine, he could right now. He could send weapons such as Patriot interceptors, he could sanction Russian companies and those who do business with them--immediately. There is nothing stopping him except for the fact that he doesnt want to. Why is that?", "u": "https://x.com/PhillipsPOBrien/status/2082474052803830061", "lk": 1378, "rt": 299, "rp": 67, "eng": 1744, "lang": "en", "tags": ["geopolitics", "ukraine", "military"]}, {"h": "BarakRavid", "tier": 1, "b": "geopolitics", "t": "2026-07-29 23:11", "x_zh": "美国军方正在伊朗进行空袭，美国官员告诉我。", "x_en": "The U.S. military is conducting air strikes in Iran, U.S. official tells me", "u": "https://x.com/BarakRavid/status/2082604988048523324", "lk": 1226, "rt": 269, "rp": 83, "eng": 1578, "lang": "en", "tags": ["geopolitics", "middle_east", "diplomacy"]}, {"h": "BarakRavid", "tier": 1, "b": "geopolitics", "t": "2026-07-30 00:41", "x_zh": "一位美国官员称，特朗普总统周三会见了沙特国防大臣哈立德·本·萨勒曼王子。沙特大臣向特朗普转达了沙特王储穆罕默德·本·萨勒曼关于与伊朗战争及地区局势升级的口信。", "x_en": "President Trump met on Wednesday with the Saudi minister of defense prince Khalid Bin Salman, a U.S. official said\nThe Saudi minister gave Trump a message from the Saudi Crown prince MBS about the war with Iran and the regional escalation", "u": "https://x.com/BarakRavid/status/2082627663026331945", "lk": 465, "rt": 97, "rp": 26, "eng": 588, "lang": "en", "tags": ["geopolitics", "middle_east", "diplomacy"]}, {"h": "PhillipsPOBrien", "tier": 2, "b": "geopolitics", "t": "2026-07-29 18:24", "x_zh": "值得注意的是，现在有42%的共和党选民似乎完全接受一场永久战争……", "x_en": "Remarkable that 42% of Republican voters now seem totally fine with a forever war...", "u": "https://x.com/PhillipsPOBrien/status/2 ing to attack Sunni states.  In Jan 2024 it bombed  Pakistan's Baluchistan, and now Bahrein, Egypt, Jordan, Kuwait, Oman (!) the UAE & Saudi Arabia. European air forces and navies should defend their oil suppliers", "u": "https://x.com/ELuttwak/status/2082635981086241267", "lk": 47, "rt": 9, "rp": 2, "eng": 58, "lang": "en", "tags": ["geopolitics", "strategy", "history"]}, {"h": "PeterZeihan", "tier": 1, "b": "geopolitics", "t": "2026-07-29 20:00", "x_zh": "天气模式与战场事态的结合可能导致北非和南亚部分地区出现粮食短缺。#小麦 #地缘政治", "x_en": "A combination of weather patterns and battlefield developments could contribute to food shortages in parts of North Africa and South Asia.\n\n#wheat #geopolitics", "u": "https://x.com/PeterZeihan/status/2082556772514947319", "lk": 34, "rt": 6, "rp": 4, "eng": 44, "lang": "en", "tags": ["geopolitics", "demographics", "supply_chain"]}, {"h": "joshua_landis", "tier": 2, "b": "geopolitics", "t": "2026-07-29 21:01", "x_zh": "“我们非常想打击伊朗的能源目标，但美国目前未批准，因为担心伊朗会攻击邻国并引发全球石油危机，”以色列国防部长表示。", "x_en": "“We very much want to strike Iran’s energy targets, but the US is not approving it at the moment because of concerns that Iran would attack neighboring countries and trigger a global oil crisis,” Israel's Def Min says.", "u": "https://x.com/joshua_landis/status/2082572221134864746", "lk": 22, "rt": 10, "rp": 1, "eng": 33, "lang": "en", "tags": ["geopolitics", "middle_east", "syria"]}, {"h": "LawDavF", "tier": 2, "b": "geopolitics", "t": "2026-07-29 08:45", "x_zh": "@LawDavF\n新文章探讨普京是否会转向大规模动员。我考虑了前线需求以及俄罗斯征兵危机的程度。（£/免费试用）\nhttps://\nopen.substack.com/pub/samf/p/wil\nl-putin-be-forced-to-announce\n…?", "x_en": "New post looks at whether or not Putin will move to a large-scale mobilisation. I consider the needs of the front and the extent of Russia’s recruitment crisis. (£/free trial) \nhttps://\nopen.substack.com/pub/samf/p/wil\nl-putin-be-forced-to-announce\n…?", "u": "https://x.com/LawDavF/status/2082387132279050436", "lk": 17, "rt": 6, "rp": 0, "eng": 23, "lang": "en", "tags": ["geopolitics", "ukraine", "military"]}, {"h": "JavierBlas", "tier": 1, "b": "commodities", "t": "2026-07-29 16:07", "x_zh": "@JavierBlas\n今日图表：伊朗正试图通过霍尔木兹海峡关闭，以油价对特朗普施加难以承受的经济成本。\n目前，不仅油价名义上未上涨到足以实现此目的，而且经通胀调整后仍处于仅能称为温和的水平。", "x_en": "CHART OF THE DAY: Iran is trying to impose an intolerable economic cost on Trump via oil prices.  by shutting Hormuz.\n\nFor now, not only oil prices haven't risen enough in nominal terms to do so, but adjusted by inflation remain at levels that can only be described as moderate.", "u": "https://x.com/JavierBlas/status/2082498171502989740", "lk": 424, "rt": 82, "rp": 63, "eng": 569, "lang": "en", "tags": ["commodities", "oil_energy", "supply_demand"]}, {"h": "JavierBlas", "tier": 1, "b": "commodities", "t": "2026-07-29 16:09", "x_zh": "@JavierBlas\n美国军方@CENTCOM表示，“自5月初以来”，已协助“总计5亿桶原油的运输通过”霍尔木兹海峡。\n如果从5月1日算起至今，为安全起见，共89天，即每天约560万桶通过霍尔木兹海峡。", "x_en": "US military \n@CENTCOM\n says that \"since early May,\" it has assisted \"shipments totaling 500 million barrels of crude oil in transiting\" the Strait of Hormuz.\n\nIf calculating it from, to be safe, May 1 to date, that's 89 days, or ~5.6 million barrels a day via the Strait of Hormuz.", "u": "https://x.com/JavierBlas/status/2082498877937095149", "lk": 250, "rt": 37, "rp": 39, "eng": 326, "lang": "en", "tags": ["commodities", "oil_energy", "supply_demand"]}, {"h": "PeterLBrandt", "tier": 1, "b": "commodities", "t": "2026-07-29 21:02", "x_zh": "@PeterLBrandt\n亲爱的读者们。\n这些是我们在1970年代初期仅有的图表，除非你想用方格纸自己画。我每两到四周买一次，然后用细尖黑笔和尺子每天画出高低线。\n如今的交易员真是软弱。", "x_en": "Dear readers.\nThese were the only charts we had back in the early 1970 unless you wanted to make your own from graph paper. I would buy these every two to four weeks and then with a fine point black pen and ruler draw in the high to low line each day\nTraders today are such wimps", "u": "https://x.com/PeterLBrandt/status/2082572482742222956", "lk": 260, "rt": 11, "rp": 41, "eng": 312, "lang": "en", "tags": ["commodities", "technical", "trader"]}, {"h": "PeterLBrandt", "tier": 1, "b": "commodities", "t": "2026-07-29 22:57", "x_zh": "@PeterLBrandt\n学习风险管理的最佳理由：\n这样你就不必反复赚取同样的美元。\n我喜欢赚到它，然后保留它，或者保留大部分。", "x_en": "The best reason to learn risk management:\n\nSo you do not have to make the same dollar over and over again\n\nI like to earn it, then keep it, or most of it", "u": "https://x.com/PeterLBrandt/status/2082601526317744539", "lk": 247, "rt": 10, "rp": 8, "eng": 265, "lang": "en", "tags": ["commodities", "technical", "trader"]}, {"h": "PeterLBrandt", "tier": 1, "b": "commodities", "t": "2026-07-29 23:33", "x_zh": "@PeterLBrandt\n我最喜欢的图表形态之一——我首次在1977年交易大豆时使用，比你们中一些人的父母出生还早。\n还展示了去年我在比特币中交易的一个形态。\n变化越多，越保持不变。\n老派方法有效。", "x_en": "One of my favorite chart patterns -- one I first traded in 1977 in Soybeans, years before the parents of some of you were born.\nAlso shown is one I traded last year in Bitcoin\nThe more things change the more they stay the same\nOld school works", "u": "https://x.com/PeterLBrandt/status/2082610391709020336", "lk": 197, "rt": 13, "rp": 11, "eng": 221, "lang": "en", "tags": ["commodities", "technical", "trader"]}, {"h": "staunovo", "tier": 1, "b": "commodities", "t": "2026-07-29 19:41", "x_zh": "@staunovo\n特朗普称英国首相告诉他北海将重新开放石油开采\n#oott", "x_en": "Trump says British prime minister told him North Sea will reopen to oil\n#oott", "u": "https://x.com/staunovo/status/2082552179399840196", "lk": 7, "rt": 2, "rp": 0, "eng": 9, "lang": "en", "tags": ["commodities", "oil_energy", "sellside"]}, {"h": "staunovo", "tier": 1, "b": "commodities", "t": "2026-07-29 23:28", "x_zh": "@staunovo\n美国指挥官制定两周计划升级对伊朗打击\n随着伊朗最新导弹袭击，特朗普将决定是否重新", "x_en": "The U.S. Commander With a Two-Week Plan to Escalate Strikes in Iran\nWith Iran’s latest missile attack, Trump will decide whether to re", "u": "https://x.com/staunovo/status/2082609144977129600", "lk": 7, "rt": 0, "rp": 1, "eng": 8, "lang": "en", "tags": ["commodities", "oil_energy", "sellside"]}, {"h": "commoditywx", "tier": 2, "b": "weather", "t": e"]}, {"h": "fchollet", "tier": 2, "b": "ai_semis", "t": "2026-07-29 10:43", "x_zh": "当前AI“讨论”中很大一部分与其说是关于技术能力，不如说是前沿实验室员工在应对自己的自尊和身份认同。", "x_en": "A significant portion of current AI \"discourse\" is less about technological capabilities and more about frontier lab employees navigating their own self-esteem and sense of identity.", "u": "https://x.com/fchollet/status/2082416792744419749", "lk": 1359, "rt": 96, "rp": 75, "eng": 1530, "lang": "en", "tags": ["ai_semis", "ai_research", "models"]}, {"h": "gdb", "tier": 2, "b": "ai_semis", "t": "2026-07-29 17:46", "x_zh": "当更多研究者能使用最佳工具时，科学进展更快。将前沿AI交到学术研究者手中，意味着对人类最棘手问题有更多尝试机会，以及更多惠及所有人的突破。期待他们的发现。", "x_en": "Science moves faster when more researchers have access to the best tools.\n\nGetting frontier AI into the hands of academic researchers means more shots on goal against humanity’s hardest problems — and more breakthroughs that benefit all of us.\n\nExcited to see what they discover.", "u": "https://x.com/gdb/status/2082523070968070359", "lk": 690, "rt": 47, "rp": 75, "eng": 812, "lang": "en", "tags": ["ai_semis", "ai", "executive"]}, {"h": "gdb", "tier": 2, "b": "ai_semis", "t": "2026-07-29 21:31", "x_zh": "GPT-5.6 Sol用于提升生产服务效率。这是我们能实现如此出色性价比的方式之一：", "x_en": "GPT-5.6 Sol for improving production serving efficiency. One of the ways we're able to get such great price-performance:", "u": "https://x.com/gdb/status/2082579736065372189", "lk": 696, "rt": 21, "rp": 56, "eng": 773, "lang": "en", "tags": ["ai_semis", "ai", "executive"]}, {"h": "EconomyApp", "tier": 2, "b": "ai_semis", "t": "2026-07-29 20:26", "x_zh": "$META Meta Q2 FY26：日活跃用户同比+3%至36亿。广告展示量同比+14%。• 营收同比+28%至608亿美元（超预期5亿）。• 每股收益6.18美元（低于预期1.04美元）。• FY26资本支出1300亿至1450亿美元（区间收窄）。", "x_en": "$META\n Meta Q2 FY26:\n\n Daily active people +3% Y/Y to 3.60B.\n Ad impressions +14% Y/Y.\n\n• Revenue +28% Y/Y to $60.8B ($0.5B beat).\n• EPS $6.18 ($1.04 miss).\n• FY26 Capex $130B to 145B (narrower).", "u": "https://x.com/EconomyApp/status/2082563528951775600", "lk": 515, "rt": 76, "rp": 8, "eng": 599, "lang": "en", "tags": ["ai_semis", "app_economy", "technology"]}, {"h": "gdb", "tier": 2, "b": "ai_semis", "t": "2026-07-29 21:45", "x_zh": "ChatGPT Voice 让你更多时间在想去的地方工作。", "x_en": "ChatGPT Voice for spending more time working from where you want:", "u": "https://x.com/gdb/status/2082583297809699300", "lk": 346, "rt": 13, "rp": 35, "eng": 394, "lang": "en", "tags": ["ai_semis", "ai", "executive"]}, {"h": "simonw", "tier": 2, "b": "ai_semis", "t": "2026-07-29 15:22", "x_zh": "我现在的怪癖是让 GPT-5.6 Pro 过度分析事物。我想对 Bebop 和 Rocksteady 进行深度角色研究——我想了解他们的动机、兴趣、希望和抱负，以及他们之间的差异——真的过度分析一下。", "x_en": "My current weird hobby is having GPT-5.6 Pro \"over-analyze\" things\n\n> I want a deep character study of Bebop and Rocksteady - I want to understand their motivations, their interests, their hopes and aspirations, how they differ from each other - really over-analyze this", "u": "https://x.com/simonw/status/2082487009642479972", "lk": 176, "rt": 14, "rp": 29, "eng": 219, "lang": "en", "tags": ["ai_semis", "ai_engineering", "developer"]}, {"h": "jaminball", "tier": 2, "b": "ai_semis", "t": "2026-07-29 20:40", "x_zh": "Azure 年化收入约 1240 亿美元，增长 43%。季度同比增长趋势如下 $MSFT。", "x_en": "Azure at a ~$124B run rate growing 43%\n\nQuarterly YoY growth trends below \n$MSFT", "u": "https://x.com/jaminball/status/2082566858449055793", "lk": 94, "rt": 17, "rp": 4, "eng": 115, "lang": "en", "tags": ["ai_semis", "software", "tech_equities"]}, {"h": "simonw", "tier": 2, "b": "ai_semis", "t": "2026-07-30 01:34", "x_zh": "GPT-5.6 发现了优化，使 OpenAI 服务该模型的端到端成本降低了 20%。按此计算，每月节省可能达数十亿美元？", "x_en": "GPT-5.6 found optimizations that \"reduced end-to-end serving costs by 20%\" for OpenAI to serve that model\n\nPresumably that's billions of dollars a month in savings at this point?", "u": "https://x.com/simonw/status/2082641030093127768", "lk": 97, "rt": 5, "rp": 12, "eng": 114, "lang": "en", "tags": ["ai_semis", "ai_engineering", "developer"]}, {"h": "natolambert", "tier": 2, "b": "ai_semis", "t": "2026-07-30 03:18", "x_zh": "利用工程中的低垂果实令人难以置信。此外，在如何最好地研究利用效果方面，有一个有趣的科学/工程领域，从后训练到评估/推理。这将是一个相当有影响力的领域（在每性能成本节省方面）。", "x_en": "The low hanging fruit on harness engineering is insane. \n\nOntop of that, there's an interesting area of science/engineering on how to best study the effect of harnesses, from post training through eval/inference. Will be a fairly impactful area (in cost savings per performance)", "u": "https://x.com/natolambert/status/2082667019045081511", "lk": 58, "rt": 5, "rp": 8, "eng": 71, "lang": "en", "tags": ["ai_semis", "ai_research", "models"]}, {"h": "cristianoamon", "tier": 2, "b": "ai_semis", "t": "2026-07-29 16:18", "x_zh": "宝马集团已选择 @Qualcomm 用于其下一代 ADAS 和自动驾驶系统以及未来十年车型项目的数字座舱，确立 Qualcomm 为其主要计算芯片供应商。对此合作感到无比自豪！", "x_en": "BMW Group has selected \n@Qualcomm\n for their next-generation ADAS and automated driving systems as well as digital cockpit for model programs through the next decade, establishing Qualcomm as their lead compute silicon provider. Incredibly proud of this partnership!", "u": "https://x.com/cristianoamon/status/2082501016994672774", "lk": 51, "rt": 8, "rp": 2, "eng": 61, "lang": "en", "tags": ["ai_semis", "semiconductors", "edge_ai"]}, {"h": "swyx", "tier": 2, "b": "ai_semis", "t": "2026-07-30 00:02", "x_zh": "今天我想注册 @docusign，但遇到了一个我无法解决的验证码。这是一家市值 110 亿美元、人人讨厌的公司。那些说“做出人们想要的东西”的人并不了解全貌。", "x_en": "today i tried to sign up for \n@docusign\n and was presented a captcha that i could not solve\n\nthis is an $11B company that everyone hates\n\npeople who say \"make something people want\" dont have the full picture", "u": "https://x.com/swyx/status/2082617801362313527", "lk": 18, "rt": 0, "rp": 16, "eng": 34, "lang": "en", "tags": ["ai_semis", "ai_engineering", "developer"]}], "indices": {"energy": {"label_zh": "能源", "label_en": "Energy", "color": "#ef8f4c", "score": null, "raw_score": null, "confidence": 0.0, "status": "no_direction", "mentions": 1, "signal_tweets": 0, "kols": 1, "bullish": 0, "bearish": 0}, "me   var qi=$("#q"),clr=$("#clr"); qi.oninput=function(){st.q=qi.value.trim();clr.style.display=qi.value?"block":"none";render()}; clr.onclick=function(){qi.value="";st.q="";clr.style.display="none";qi.focus();render()};
  document.addEventListener("keydown",function(e){if(e.key==="/"&&document.activeElement!==qi){e.preventDefault();qi.focus()} if(e.key==="Escape"&&document.activeElement===qi){qi.value="";st.q="";clr.style.display="none";render()}});
  function seg(id,key){var el=$(id);el.querySelectorAll("button").forEach(function(b){b.onclick=function(){el.querySelectorAll("button").forEach(function(x){x.removeAttribute("data-on")});b.setAttribute("data-on","1");st[key]=b.dataset.v;render()}})}
  seg("#sortSeg","sort"); seg("#tierSeg","tier"); seg("#langSeg","lang");
  $("#reset").onclick=function(){st.board="all";st.tier="all";st.lang="all";st.sort="hot";st.q="";qi.value="";clr.style.display="none";[["#sortSeg","hot"],["#tierSeg","all"],["#langSeg","all"]].forEach(function(p){var el=$(p[0]);el.querySelectorAll("button").forEach(function(x){x.setAttribute("data-on",x.dataset.v===p[1]?"1":"")})});buildPills();render()};
  app.querySelectorAll(".langsw button").forEach(function(b){b.onclick=function(){uiLang=b.dataset.lang;renderAll()}});
  app.querySelectorAll(".range button").forEach(function(b){b.onclick=function(){st.range=+b.dataset.range;renderAll()}});
  renderAll();
})();
</script>
</div>
</body>
