llanOsc", "技术分析", "小盘股跑赢大盘股并非偶然，收益率曲线给出了约15个月的领先信号；按此推算，小盘股相对强势有望延续至2027年。 <span style=\"color:#8fa0b3\">交易含义：若收益率曲线信号有效，<b class=\"em\">小盘股相对大盘的超额收益将是中期趋势而非短期波动</b></span>"]]], ["贵金属", [["@TimmerFidelity", "", "全球流动性已开始恢复，基于全球M2与黄金的回归模型，金价公允价值约5000美元；欧元区银行股动能强劲，<b class=\"em\">中国股市也在获得上行动力，</b>跨资产轮动信号明显。 <span style=\"color:#8fa0b3\">交易含义：若全球M2持续扩张，黄金重估空间巨大，<b class=\"em\">但需警惕流动性转向时金价回撤风险</b></span>"]]], ["原油 / 馏分油", [["@charliebilello", "", "美国战略石油储备降至1983年1月以来最低，过去5年累计减少3.22亿桶，降幅达52%；能源安全缓冲垫已大幅削弱。 <span style=\"color:#8fa0b3\">交易含义：若地缘冲突或供应中断，美国应对油价冲击的能力显著下降，<b class=\"em\">能源价格波动风险溢价上升</b></span>"]]]]], ["地缘政治", [["中东", [["@BarakRavid", "中东记者 (Axios)", "特朗普对内塔尼亚胡个人喜欢但对其政策沮丧，称其为自己最大的敌人；以色列防长表态IDF不再处理定居者袭击，政策与现实严重脱节。 <span style=\"color:#8fa0b3\">交易含义：美以关系与以色列内部政策混乱，增加中东局势不可预测性</span>"], ["@AliVaez", "", "<b class=\"em\">伊朗可能通过 targeting 美国海军资产或推动胡塞武装收紧对区域能源出口的封锁来升级局势。</b> <span style=\"color:#8fa0b3\">交易含义：伊朗升级选项直接威胁霍尔木兹海峡能源运输，<b class=\"em\">油价地缘风险溢价或显著上升</b></span>"], ["@joshua_landis", "", "叙利亚总统沙拉阿领导下，酷刑和暴力机器正在重建，证据令人震惊；<b class=\"em\">同时叙利亚国有银行不应私有化，</b>因私营银行不向小企业贷款。 <span style=\"color:#8fa0b3\">交易含义：叙利亚内部不稳定与人权状况恶化，或影响重建进程和地区稳定，<b class=\"em\">但经济改革停滞可能限制投资吸引力</b></span>"]]], ["俄乌", [["@PhillipsPOBrien", "战略研究", "美国政策实际是在帮助俄罗斯轰炸乌克兰，所谓反对‘永久战争’却接受‘无限期战争’，立场自相矛盾。 <span style=\"color:#8fa0b3\">交易含义：<b class=\"em\">美国对乌政策模糊性增加冲突长期化风险，</b>对欧洲安全格局和能源市场构成持续压力</span>"], ["@shashj", "", "半小时内手机收到三次警报，暗示欧洲安全警报频率异常升高，甚至超过对俄核攻击的预警级别。 <span style=\"color:#8fa0b3\">交易含义：警报频发反映欧洲安全局势急剧恶化，<b class=\"em\">市场或需为更高地缘风险溢价定价</b></span>"]]], ["中美", [["@DerekJGrossman", "", "美国对斯里兰卡汉班托塔港的叙事有误：港口由北京建造，因财务问题斯里兰卡以99年租约卖给中国，并非中国掠夺行为。 <span style=\"color:#8fa0b3\">交易含义：纠正对华叙事偏差，<b class=\"em\">或影响市场对‘债务陷阱’风险的评估，</b>降低相关地缘溢价</span>"]]], ["其他地缘", [["@ianbremmer", "地缘政治 (Eurasia Group)", "中期选举临近，特朗普在经济与通胀议题上支持率大幅落后，政治压力显著上升。 <span style=\"color:#8fa0b3\">交易含义：美国内政不确定性或加剧市场波动，关注选举预期对政策路径的影响</span>"]]]]], ["能源", [["原油", [["@JavierBlas", "能源记者 (BBG)", "Vortexa数据显示海上原油库存正快速下降，因俄罗斯、哈萨克、沙特、美国和伊朗出口同步下滑；这是重要的看涨信号。 <span style=\"color:#8fa0b3\">交易含义：多国出口同步收缩较为罕见，若持续将加速库存去化，<b class=\"em\">强化布伦特近月合约上行支撑</b></span>"], ["@chigrl", "", "美国大型页岩油企业正削减资本开支，将高油价带来的现金流用于股东回报和偿债而非增产；<b class=\"em\">未来美国原油产量增长将面临明显阻力。</b> <span style=\"color:#8fa0b3\">交易含义：页岩油供给弹性下降，<b class=\"em\">油价上行时供给响应滞后，</b>或延长本轮油价高位持续时间</span>"]]], ["天然气", [["@JKempEnergy", "", "美国天然气库存过去40天持续高于十年季节性均值，8月7日库存较均值高出1960亿立方英尺（+7%），尽管期货价格下跌，<b class=\"em\">库存过剩格局未改。</b> <span style=\"color:#8fa0b3\">交易含义：库存压力未消化前，<b class=\"em\">天然气价格反弹空间受限，</b>关注秋季注入季结束后的库存拐点</span>"]]]]], ["金属", [["金属", [["@Ole_S_Hansen", "盛宝银行 商品策略", "全球三大交易所铜库存连续第12周下降至94万吨，LME与上海库存持续去化，但COMEX因美国关税前囤货而逆势累库，跨市场库存分化明显。 <span style=\"color:#8fa0b3\">交易含义：<b class=\"em\">COMEX与LME价差可能维持高位，</b>关注关税落地后库存流向反转带来的套利机会</span>"]]]]], ["农产品", [["谷物油籽", [["@mkt_intl", "", "加拿大萨斯喀彻温省作物报告显示收获完成2%，凉爽天气和零星阵雨缓解了压力，但整体仍偏干，<b class=\"em\">晚播作物需要更多降雨支撑。</b> <span style=\"color:#8fa0b3\">交易含义：若后续降雨不足，<b class=\"em\">油菜籽等作物单产预期可能下修，</b>关注天气溢价重新计入</span>"]]], ["最近有效 · 08-11 · 天气气候", [["@climateguyw", "气候研究", "8月10日西部CAT3热浪已减弱为CAT2，但平原和南部正形成新的独立CAT2热浪；<b class=\"em\">下一个以化石燃料公司命名的热浪将用“Delphi”。</b> <span style=\"color:#8fa0b3\">交易含义：极端高温事件频发且区域转移，<b class=\"em\">可能加剧局部能源需求与农作物生长压力</b></span>"]]]]], ["AI半导体", [["推理", [["@simonw", "", "Qwen 3.7 27B以17GB GGUF格式在M5 Max笔记本上流畅运行，其生成质量（如画鹈鹕骑自行车）是我在本地模型上见过最好的，端侧推理能力已跨过实用门槛。 <span style=\"color:#8fa0b3\">交易含义：端侧模型能力跃升，可能分流部分云端推理需求，<b class=\"em\">对数据中心GPU的边际需求增速构成潜在压制</b></span>"]]], ["其他 AI / 半导体", [["@fchollet", "", "公开的ARC 3游戏集是&#x27;演示集&#x27;而非&#x27;评估集&#x27;或&#x27;训练集&#x27;，其分数不能代表模型在私有评估集上的真实表现，当前社区对模型能力的排名存在系统性偏差。 <span style=\"color:#8fa0b3\">交易含义：若市场基于演示集分数高估模型能力，<b class=\"em\">则对AI芯片需求预期可能过度前置，</b>存在预期差修正风险</span>"], ["@natolambert", "", "GLM 5.3等中国模型的实力是真实的，<b class=\"em\">市场不应再对其表现感到惊讶；</b>我们此前的否认情绪源于认知惯性，这些模型已具备与顶尖模型竞争的能力。 <span style=\"color:#8fa0b3\">交易含义：国产模型能力被低估，<b class=\"em\">意味着其对应的AI芯片需求（如国产算力链）可能同样被低估，</b>存在价值重估机会</span>"]]]]]]}, "report_en": {"insights": [{"title": "Hottest · Crude Oil / Distillates", "points": ["Core view: <b class=\"em\">Key View: @charliebilello: U.S. Strategic Petroleum Reserve falls to</b> lowest since January 1983<b class=\"em\">,</b> down 322 million barrels over the past 5 years, a 52% decline; the energy security buffer has been significantly eroded."]}, {"title": "Biggest Divergence · Crude Oil", "points": ["Core view: <b class=\"em\">Key View: @JavierBlas (Energy Correspondent (BBG)): Vortexa data shows offshore crude inventories rapidly declining,</b> as exports from Russia, Kazakhstan, Saudi Arabia, the U.S., and Iran fall simultaneously; this is an important bullish signal."]}, {"title": "High Alert · Macro Economy", "points": ["Core view: Key View: @LukeGromen (Global Macro): U.S. federal spending on interest + welfare + defense already equals ~120% of tax revenue; fiscal math dictates Warsh cannot truly turn hawkish; DOGE cuts are bound to fail, <b class=\"em\">market expectations for tightening need significant downward revision.</b>"]}, {"title": "Contrarian Variable · Macro Economy", "points": ["Core view: <b class=\"em\">Key View: @WarrenPies (Macro Strategy): Model economics should be assessed by per-task cost, not token price;</b> open-source models have low token costs but poor efficiency; on a per-task basis, K3 is ~25% more expensive than frontier models."]}, {"title": "Sentiment Shift · Other AI / Semiconductors", "points": ["Core view: Key View: @natolambert: The strength of Chinese models like GLM 5.3 is real, <b class=\"em\">the market should no longer be surprised by their performance;</b> our previous denial stemmed from cognitive inertia; these models are already competitive with top-tier models."]}], "unique": [["@PhillipsPOBrien", "U.S. policy is effectively helping Russia bomb Ukraine; opposing 'forever wars' while accepting 'endless wars' is contradictory.", "U.S. policy ambiguity toward Ukraine increases the risk of prolonged conflict, exerting sustained pressure on European security and energy markets"], ["@RaoulGMI", "Stablecoins, RWAs, and other assets are moving on-chain; the entire financial system is being rebuilt on crypto rails; holding underlying L1 tokens is the most direct way to capture gains from this systemic shift, akin to buying the common equity layer of the entire industry.", "If L1 tokens become the value carrier for new financial infrastructure, their valuation logic will shift from speculation to discounted cash flow"], ["@LukeGromen", "U.S. federal spending on interest + welfare + defense already equals ~120% of tax revenue; fiscal math dictates Warsh cannot truly turn hawkish; DOGE cuts are bound to fail, market expectations for tightening need significant downward revision.", "If fiscal constraints force the Fed to remain accommodative, long-end rate upside risk and dollar credit weakening will develop simultaneously"], ["@WarrenPies", "Model economics should be assessed by per-task cost, not token price; open-source models have low token costs but poor efficiency; on a per-task basis, K3 is ~25% more expensive than frontier models.", "If measured by task cost, the cost advantage of open-source models is overestimated, AI compute demand may be stronger than market expectations"]], "sections": [["Macro Economy", [["Macro Economy", [["@RaoulGMI", "Global Macro", "Stablecoins, RWAs, and other assets are moving on-chain; the entire financial system is being rebuilt on crypto rails; holding underlying L1 tokens is the most direct way to capture gains from this systemic shift, akin to buying the common equity layer of the entire industry. <span style=\"color:#8fa0b3\">Trading Implication: If L1 tokens become the value carrier for new financial infrastructure, <b class=\"em\">their valuation logic will shift from speculation to discounted cash flow</b></span>"], ["@LukeGromen", "Global Macro", "U.S. federal spending on interest + welfare + defense already equals ~120% of tax revenue; fiscal math dictates Warsh cannot truly turn hawkish; DOGE cuts are bound to fail, <b class=\"em\">market expectations for tightening need significant downward revision.</b> <span style=\"color:#8fa0b3\">Trading Implication: If fiscal constraints force the Fed to remain accommodative, <b class=\"em\">long-end rate upside risk and dollar credit weakening will develop simultaneously</b></span>"], ["@WarrenPies", "Macro Strategy", "<b class=\"em\">Model economics should be assessed by per-task cost, not token price;</b> open-source models have low token costs but poor efficiency; on a per-task basis, K3 is ~25% more expensive than frontier models. <span style=\"color:#8fa0b3\">Trading Implication: If measured by task cost, the cost advantage of open-source models is overestimated, <b class=\"em\">AI compute demand may be stronger than market expectations</b></span>"], ["@chamath", "", "<b class=\"em\">The insurance industry has begun pricing AI risk: this year, insurers applied to state regulators to exclude AI-related damages from general liability policies,</b> with over 80% of applications approved, covering ~82% of standard policies; AI risk is moving from theoretical discussion to actual cost transfer. <span style=\"color:#8fa0b3\">Trading Implication: If AI risk is systematically excluded from insurance coverage, contingent liabilities for related companies will rise, <b class=\"em\">tech valuations need repricing</b></span>"], ["@DariusDale42", "", "After the AI bubble bursts, there is a high probability of a multi-year bear market; the sustainability of the current Paradigm C bull market is questionable, <b class=\"em\">investors should prepare for potential prolonged downside.</b> <span style=\"color:#8fa0b3\">Trading Implication: If the AI bubble bursts, <b class=\"em\">high-valuation tech stocks will face sharp repricing,</b> highlighting the value of defensive asset allocation</span>"]]], ["Fed / Rates", [["@elerianm", "Macro Economist", "The August preliminary University of Michigan consumer sentiment index fell to 51.0, well below the expected 55.0, driven by cost-of-living concerns; combined with broad retail sales misses and recent soft inflation and employment data, expectations for a September rate hike will further cool, <b class=\"em\">putting downward pressure on front-end yields.</b> <span style=\"color:#8fa0b3\">Trading Implication: If September does not deliver a hike, lower short-end rates will benefit growth stocks, <b class=\"em\">but sovereign supply peaks may limit the scope for yield declines</b></span>"], ["@McClellanOsc", "Technical Analysis", "Small caps outperforming large caps is not coincidental; the yield curve provides a leading signal of about 15 months; by this measure, small-cap relative strength could persist into 2027. <span style=\"color:#8fa0b3\">Trading Implication: If the yield curve signal is valid, <b class=\"em\">small-cap outperformance over large caps is a medium-term trend rather than short-term noise</b></span>"]]], ["Precious Metals", [["@TimmerFidelity", "", "Global liquidity has begun to recover; based on a regression model of global M2 and gold, fair value for gold is around $5,000; eurozone bank stocks show strong momentum, <b class=\"em\">Chinese equities are also gaining upward traction,</b> with clear cross-asset rotation signals. <span style=\"color:#8fa0b3\">Trading Implication: If global M2 continues to expand, gold has significant re-rating potential, <b class=\"em\">but be wary of gold pullback risk when liquidity turns</b></span>"]]], ["Crude Oil / Distillates", [["@charliebilello", "", "U.S. Strategic Petroleum Reserve falls to lowest since January 1983, down 322 million barrels over the past 5 years, a 52% decline; the energy security buffer has been significantly eroded. <span style=\"color:#8fa0b3\">Trading Implication: In the event of geopolitical conflict or supply disruption, the U.S. ability to respond to oil price shocks is significantly reduced, <b class=\"em\">raising the risk premium for energy price volatility</b></span>"]]]]], ["Geopolitics", [["Middle East", [["@BarakRavid", "Middle East Correspondent (Axios)", "Trump personally likes Netanyahu but is frustrated with his policies, calling him his biggest enemy; Israel's defense minister stated the IDF will no longer handle settler attacks, showing a disconnect between policy and reality. <span style=\"color:#8fa0b3\">Trading Implication: U.S.-Israel relations and internal Israeli policy chaos increase unpredictability in the Middle East</span>"], ["@AliVaez", "", "<b class=\"em\">Iran may escalate by targeting U.S. naval assets or pushing the Houthis to tighten blockades on regional energy exports.</b> <span style=\"color:#8fa0b3\">Trading Implication: Iranian escalation options directly threaten energy transit through the Strait of Hormuz, <b class=\"em\">potentially significantly raising geopolitical risk premium for oil</b></span>"], ["@joshua_landis", "", "Under Syrian President Sharaa, the machinery of torture and violence is being rebuilt, with shocking evidence; <b class=\"em\">also, Syria's state banks should not be privatized,</b> as private banks do not lend to small businesses. <span style=\"color:#8fa0b3\">Trading Implication: Internal instability and worsening human rights in Syria may affect reconstruction and regional stability, <b class=\"em\">but stalled economic reforms may limit investment appeal</b></span>"]]], ["Russia-Ukraine", [["@PhillipsPOBrien", "Strategic Studies", "U.S. policy is effectively helping Russia bomb Ukraine; opposing 'forever wars' while accepting 'endless wars' is contradictory. <span style=\"color:#8fa0b3\">Trading Implication: <b class=\"em\">U.S. policy ambiguity toward Ukraine increases the risk of prolonged conflict,</b> exerting sustained pressure on European security and energy markets</span>"], ["@shashj", "", "Received three alerts on my phone within half an hour, suggesting an abnormal frequency of European security alerts, even exceeding warning levels for a Russian nuclear attack. <span style=\"color:#8fa0b3\">Trading Implication: Frequent alerts reflect a sharp deterioration in European security, <b class=\"em\">markets may need to price in higher geopolitical risk</b></span>"]]], ["China-US", [["@DerekJGrossman", "", "The U.S. narrative on Sri Lanka's Hambantota port is flawed: the port was built by Beijing, and due to financial problems, Sri Lanka sold it to China on a 99-year lease, not Chinese predation. <span style=\"color:#8fa0b3\">Trading Implication: Correcting the narrative bias on China, <b class=\"em\">may affect market assessments of 'debt trap' risks,</b> reducing related geopolitical premiums</span>"]]], ["Other Geopolitics", [["@ianbremmer", "Geopolitics (Eurasia Group)", "With midterm elections approaching, Trump trails significantly on economic and inflation issues, with rising political pressure. <span style=\"color:#8fa0b3\">Trading Implication: U.S. domestic political uncertainty may increase market volatility; watch election expectations for policy paths</span>"]]]]], ["Energy", [["Crude Oil", [["@JavierBlas", "Energy Correspondent (BBG)", "Vortexa data shows offshore crude inventories rapidly declining, as exports from Russia, Kazakhstan, Saudi Arabia, the U.S., and Iran fall simultaneously; this is an important bullish signal. <span style=\"color:#8fa0b3\">Trading Implication: Synchronized export contraction across multiple countries is rare; if sustained, it will accelerate inventory drawdowns, <b class=\"em\">strengthening upside support for front-month Brent contracts</b></span>"], ["@chigrl", "", "Major U.S. shale oil companies are cutting capital expenditures, using cash flow from high oil prices for shareholder returns and debt repayment rather than increasing production; <b class=\"em\">future U.S. crude output growth will face significant headwinds.</b> <span style=\"color:#8fa0b3\">Trading Implication: Shale supply elasticity is declining, <b class=\"em\">supply response lags during price increases,</b> potentially extending the duration of high oil prices</span>"]]], ["Natural Gas", [["@JKempEnergy", "", "U.S. natural gas inventories have remained above the ten-year seasonal average for the past 40 days; on August 7, inventories were 196 billion cubic feet (+7%) above the average, despite falling futures prices, <b class=\"em\">the surplus remains unchanged.</b> <span style=\"color:#8fa0b3\">Trading Implication: Until inventory pressure is absorbed, <b class=\"em\">gas price rebound potential is limited,</b> watch for inventory inflection after the fall injection season</span>"]]]]], ["Metals", [["Metals", [["@Ole_S_Hansen", "Saxo Bank Commodity Strategy", "Global copper inventories at the three major exchanges fell for the 12th consecutive week to 940,000 tons, with LME and Shanghai inventories continuing to draw down, but COMEX bucked the trend with builds due to pre-tariff hoarding in the U.S., showing clear divergence across markets. <span style=\"color:#8fa0b3\">Trading Implication: <b class=\"em\">COMEX-LME spreads may remain elevated,</b> watch for arbitrage opportunities from inventory flow reversals after tariffs are implemented</span>"]]]]], ["Agriculture", [["Grains & Oilseeds", [["@mkt_intl", "", "Saskatchewan's crop report shows harvest 2% complete; cool weather and scattered showers have eased pressure, but conditions remain dry overall, <b class=\"em\">late-planted crops need more rainfall.</b> <span style=\"color:#8fa0b3\">Trading Implication: If subsequent rainfall is insufficient, <b class=\"em\">yield expectations for canola and other crops may be revised down,</b> watch for weather premium to be re-added</span>"]]], ["Latest valid · 08-11 · Weather & Climate", [["@climateguyw", "Climate Research", "On August 10, the western CAT3 heatwave weakened to CAT2, but new independent CAT2 heatwaves are forming in the plains and south; <b class=\"em\">the next heatwave named after a fossil fuel company will be called 'Delphi'.</b> <span style=\"color:#8fa0b3\">Trading implication: Extreme heat events are frequent and shifting regions, <b class=\"em\">may intensify local energy demand and crop growth stress</b></span>"]]]]], ["AI & Semiconductors", [["Inference", [["@simonw", "", "Qwen 3.7 27B runs smoothly on an M5 Max laptop in 17GB GGUF format, and its generation quality (like drawing a pelican riding a bicycle) is the best I've seen from a local model; on-device inference has crossed the practicality threshold. <span style=\"color:#8fa0b3\">Trading Implication: The leap in on-device model capabilities may divert some cloud inference demand, <b class=\"em\">potentially suppressing marginal growth in data center GPU demand</b></span>"]]], ["Other AI / Semiconductors", [["@fchollet", "", "The public ARC 3 game set is a 'demo set' rather than an 'evaluation set' or 'training set'; its scores do not represent true performance on private evaluation sets, and current community rankings of model capabilities are systematically biased. <span style=\"color:#8fa0b3\">Trading Implication: If the market overestimates model capabilities based on demo set scores, <b class=\"em\">AI chip demand expectations may be front-loaded excessively,</b> posing a risk of expectation gap correction</span>"], ["@natolambert", "", "The strength of Chinese models like GLM 5.3 is real, <b class=\"em\">the market should no longer be surprised by their performance;</b> our previous denial stemmed from cognitive inertia; these models are already competitive with top-tier models. <span style=\"color:#8fa0b3\">Trading Implication: Domestic model capabilities are underestimated, <b class=\"em\">implying corresponding AI chip demand (e.g., domestic compute chain) may also be underestimated,</b> presenting re-rating opportunities</span>"]]]]]]}, "tweets": [{"h": "BillAckman", "tier": 1, "b": "macro", "t": "2026-08-14 21:14", "x_zh": "如果这是真的，那就是欺诈，应该受到惩罚。食品和成分中的欺诈行为应构成刑事犯罪。", "x_en": "If true this is crooked and should be punishable. Fraud in food and ingredients should be a criminal offense.", "u": "https://x.com/BillAckman/status/2088373685828669562", "lk": 4494, "rt": 459, "rp": 178, "eng": 5131, "lang": "en", "tags": ["macro", "equities", "activist"], "important": true}, {"h": "charliebilello", "tier": 2, "b": "macro", "t": "2026-08-14 16:03", "x_zh": "美国国债2016年3月：19万亿美元；如今：40万亿美元。", "x_en": "US National Debt in March 2016: $19 trillion\nUS National Debt Today: $40 trillion", "u": "https://x.com/charliebilello/status/2088295576420978912", "lk": 1605, "rt": 438, "rp": 123, "eng": 2166, "lang": "en", "tags": ["macro", "data", "markets"], "important": true}, {"h": "michaelkantro", "tier": 2, "b": "macro", "t": "2026-08-14 22:56", "x_zh": "2008年到2026年：从婴儿床到大学……哇，18年飞逝太快了。", "x_en": "2008 -> 2026: From crib to college … wow, 18 years flew by too fast", "u": "https://x.com/MichaelKantro/status/2088399274178384010", "lk": 1719, "rt": 12, "rp": 28, "eng": 1759, "lang": "en", "tags": ["macro", "cycle", "sellside"], "important": true}, {"h": "RaoulGMI", "tier": 1, "b": "macro", "t": "2026-08-14 17:59", "x_zh": "一切都在上链。稳定币、现实世界资产……整个金融体系正在加密轨道上重建。而拥有这一切的方式简单得愚蠢：只需买入承载这一切的L1。这是为我们所有人准备的通用基础股权层。如果最大的部分……", "x_en": "Everything's coming onchain. \n\nStablecoins, RWAs… the whole financial system is rebuilding itself on crypto rails. And the way you own that is stupidly simple. Just buy the L1s it all runs on.\n\nThis is the universal basic equity layer for all of us. If the biggest parts of the", "u": "https://x.com/RaoulGMI/status/2088324736388657526", "lk": 1260, "rt": 204, "rp": 155, "eng": 1619, "lang": "en", "tags": ["macro", "crypto", "long_cycle"], "important": true}, {"h": "LukeGromen", "tier": 1, "b": "macro", "t": "2026-08-14 15:07", "x_zh": "DOGE会失败，这对任何理解美国仅利息、福利和国防开支就消耗了接近创纪录的联邦收入的约120%的人来说都是显而易见的。同样显而易见的是，这种数学也使得沃什不可能持鹰派立场。", "x_en": "That DOGE would fail was obvious to anyone who understood that the US was spending ~120% of near-record Federal receipts just on Interest, Entitlements, & Defense.\n\nIt should be equally obvious that this math also makes it mathematically impossible for Warsh to be hawkish.", "u": "https://x.com/LukeGromen/status/2088281394610884802", "lk": 826, "rt": 107, "rp": 54, "eng": 987, "lang": "en", "tags": ["macro", "sovereign_debt", "commodities"], "important": true}, {"h": "charliebilello", "tier": 2, "b": "macro", "t": "2026-08-14 15:17", "x_zh": "“每个人都在赚钱。”——特朗普总统。除了那些买了他币的人……特朗普家族加密收入：14亿美元。$TRUMP meme币：-98%。$MELANIA meme币：-99%。这也许是美国政治史上最明目张胆的腐败例子。", "x_en": "“Everybody’s profiting.” -President Trump\n\nExcept the people who bought his coins...\nTrump family crypto earnings: $1.4 billion\n\n$TRUMP\n meme coin: -98%\n\n$MELANIA\n meme coin: -99%\n\nPerhaps the most blatant example of corruption in the history of American politics.", "u": "https://x.com/charliebilello/status/2088283834806583634", "lk": 664, "rt": 173, "rp": 80, "eng": 917, "lang": "en", "tags": ["macro", "data", "markets"], "important": true}, {"h": "leadlagreport", "tier": 2, "b": "macro", "t": "2026-08-14 23:17", "x_zh": "如果你吃的食物200年前不存在，那就别吃。", "x_en": "If the food you eat did not exist 200 years ago, do not eat it.", "u": "https://x.com/leadlagreport/status/2088404643604811960", "lk": 720, "rt": 46, "rp": 127, "eng": 893, "lang": "en", "tags": ["macro", "cross_asset", "risk"], "important": true}, {"h": "charliebilello", "tier": 2, "b": "macro", "t": "2026-08-14 13:56", "x_zh": "美国战略石油储备现在处于1983年1月以来的最低水平。过去5年，我们看到了3.22亿桶的减少，下降了52%。", "x_en": "The US Strategic Petroleum Reserve is now at its lowest level since January 1983. Over the past 5 years we've seen a drawdown of 322 million barrels, a 52% decline.", "u": "https://x.com/charliebilello/status/2088263401923399895", "lk": 413, "rt": 125, "rp": 65, "eng": 603, "lang": "en", "tags": ["macro", "data", "markets"], "important": true}, {"h": "WarrenPies", "tier": 1, "b": "macro", "t": "2026-08-14 12:06", "x_zh": "太多人关注代币成本下降，并假设开源模型比前沿模型“更便宜”。但许多开源模型在代币使用上效率低下。评估模型经济性的更好方式是看每任务成本。基于此，我们认为K3比前沿模型贵约25%。", "x_en": "Too many are focused on the falling cost of tokens and  assume OS models are \"cheaper\" than the frontier\n\nBut, many open source models use tokens inefficiently\n\nThe better way to judge model economics is cost per task. On that basis, we see K3 as ~25% more expensive vs frontier", "u": "https://x.com/WarrenPies/status/2088235751410368796", "lk": 428, "rt": 66, "rp": 32, "eng": 526, "lang": "en", "tags": ["macro", "oil_energy", "cycle"], "important": true}, {"h": "jimcramer", "tier": 1, "b": "macro", "t": "2026-08-14 12:38", "x_zh": "那是我，站在一条叫美光的鱼后面！", "x_en": "That’s me, behind a fish named Micron!", "u": "https://x.com/jimcramer/status/2088243822685802775", "lk": 317, "rt": 25, "rp": 117, "eng": 459, "lang": "en", "tags": ["macro", "equities", "teacher_required"], "important": true}, {"h": "leadlagreport", "tier": 2, "b": "macro", "t": "2026-08-15 00:48", "x_zh": "当你感到最孤独时，你会做什么？", "x_en": "When you feel most alone, what do you do?", "u": "https://x.com/leadlagreport/status/2088427508429463919", "lk": 142, "rt": 5, "rp": 176, "eng": 323, "lang": "en", "tags": ["macro", "cross_asset", "risk"], "important": true}, {"h": "hkuppy", "tier": 2, "b": "macro", "t": "2026-08-14 03:51", "x_zh": "实际上，现在我对AI更加看好了，因为我知道有强烈的爱泼斯坦关联。难怪他们一直吹大这个泡沫……", "x_en": "I’m actually more bullish on AI now that I know there’s a strong Epstein connection. No wonder they keep pumping this bubble…", "u": "https://x.com/hkuppy/status/2088111277281329248", "lk": 275, "rt": 17, "rp": 13, "eng": 305, "lang": "en", "tags": ["macro", "commodities", "fund_manager"], "important": true}, {"h": "LynAldenContact", "tier": 1, "b": "macro", "t": "2026-08-14 12:50", "x_zh": "在《斯托尔加德事件》中，设定是这样的：1）监控收集持续增加了几十年，直到2）发生了一次灾难性的大规模数据泄露，以至于人们实际上采取了一些保护措施，部分地将其撤回。https://amazon.com/dp/B0GNS9MYB5", "x_en": "In The Stolguard Incident, the setting is such that 1) surveillance gathering kept increasing for decades until 2) a catastrophic databreach occurred at such a scale that people actually put in some protections against it, rolling it part-way back.\n\nhttps://\namazon.com/dp/B0GNS9MYB5", "u": "https://x.com/LynAldenContact/status/2088246839480844494", "lk": 275, "rt": 9, "rp": 19, "eng": 303, "lang": "en", "tags": ["macro", "rates_fx", "liquidity"], "important": true}, {"h": "RaoulGMI", "tier": 1, "b": "macro", "t": "2026-08-14 22:15", "x_zh": "我们所知的世界几十亿年来一直运行在基本相同的操作系统上。现在，在几年之内，一切都在以前所未有的速度加速。计算和智能的加速速度超过了机构、法规和……", "x_en": "The world as we've known it has been running on basically the same operating system for billions of years.\n\nNow in the space of a few years everything's speeding up faster than ever before.\n\nCompute and intelligence are accelerating faster than institutions, regulations, and the", "u": "https://x.com/RaoulGMI/status/2088389017314423041", "lk": 231, "rt": 31, "rp": 25, "eng": 287, "lang": "en", "tags": ["macro", "crypto", "long_cycle"], "important": true}, {"h": "McClellanOsc", "tier": 2, "b": "macro", "t": "2026-08-14 17:12", "x_zh": "一些分析师想知道为什么现在小盘股跑赢大盘股。答案是它们现在就应该跑赢。收益率曲线为我们提供了大约15个月的领先指标，显示小盘股应该跑赢到2027年。", "x_en": "Some analysts are wondering why small caps are outperforming large caps now. The answer is that they are supposed to be outperforming now. The yield curve gives us about a 15-month leading indication for what that should look like. Small caps should outperform into 2027.", "u": "https://x.com/McClellanOsc/status/2088312747268399164", "lk": 202, "rt": 36, "rp": 25, "eng": 263, "lang": "en", "tags": ["macro", "technical", "cycle"], "important": true}, {"h": "chamath", "tier": 1, "b": "macro", "t": "2026-08-14 19:44", "x_zh": "保险行业已经对AI风险进行了定价。今年，保险公司向州监管机构申请将AI相关损害排除在普通一般责任险之外。监管机构批准了超过80%的申请，标准保单覆盖了约82%的……", "x_en": "The insurance industry has priced the AI risk. \n\nCarriers went to state regulators this year asking to exclude AI-related damages from ordinary general liability policies.   Regulators approved more than 80% of those requests, and the standard forms behind roughly 82% of", "u": "https://x.com/chamath/status/2088350985739755860", "lk": 201, "rt": 25, "rp": 31, "eng": 257, "lang": "en", "tags": ["macro", "equities", "technology"], "important": true}, {"h": "elerianm", "tier": 1, "b": "macro", "t": "2026-08-14 12:45", "x_zh": "根据彭博数据，美国零售销售在所有主要指标上均未达到共识预期。结合过去一周较为温和的通胀和就业数据，这将再次降低市场对9月加息的预期，压低前端收益率。主权债券和……的密集日程", "x_en": "Per Bloomberg data below, US retail sales missed consensus across all primary metrics.\nAlongside the past week's softer inflation and labor prints, this will again lower market expectations of a September rate hike, reducing front-end yields.\nThe heavy calendar of sovereign and", "u": "https://x.com/elerianm/status/2088245679881646214", "lk": 186, "rt": 43, "rp": 26, "eng": 255, "lang": "en", "tags": ["macro", "central_banks", "teacher_required"], "important": true}, {"h": "TimmerFidelity", "tier": 1, "b": "macro", "t": "2026-08-14 22:30", "x_zh": "至于黄金，上周金价上涨，因为全球流动性状况开始复苏。根据我对全球M2与黄金的回归分析，黄金价值约为5000美元。下图是更长周期的图表，展示了黄金如何从纯粹的实际……", "x_en": "As for gold, it gained ground last week as the global liquidity profile has started to recover. Based on my Gold & Liquidity regression between global M2 and gold, gold is worth around $5k.\n\nBelow is a longer chart, which illustrates how gold has gone from a pure play on real", "u": "https://x.com/TimmerFidelity/status/2088392723145605458", "lk": 167, "rt": 28, "rp": 21, "eng": 216, "lang": "en", "tags": ["macro", "equities", "cycle"], "important": true}, {"h": "MichaelAArouet", "tier": 2, "b": "macro", "t": "2026-08-14 18:01", "x_zh": "在丹麦，最高所得税率为60%，购买任何东西还需支付25%的增值税，而人们却在那里认真谈论“免费医疗”。没有什么是免费的。", "x_en": "In Denmark, the top income tax rate amounts to 60%, then you pay 25% VAT when you buy anything, and people are seriously talking about \"free healthcare\" there.\n\nNothing is free.", "u": "https://x.com/MichaelAArouet/status/2088325048306213091", "lk": 169, "rt": 22, "rp": 12, "eng": 203, "lang": "en", "tags": ["macro", "economics", "data"], "important": true}, {"h": "chamath", "tier": 1, "b": "macro", "t": "2026-0 库存正在快速下降。他的完整评论在此：https://lnkd.in/p/e4USgTWP", "x_en": "CHART OF THE DAY: An important (and bullish) chart from David Welch at \n@Vortexa\n, highlighting how oil-on-the-water is falling very quickly due to a simultaneous drop in exports from Russia, Kaz, Saudi, US and Iran. \n\nHis full commentary is here: \nhttps://\nlnkd.in/p/e4USgTWP", "u": "https://x.com/JavierBlas/status/2088245502731047130", "lk": 280, "rt": 53, "rp": 19, "eng": 352, "lang": "en", "tags": ["commodities", "oil_energy", "supply_demand"], "important": true}, {"h": "JavierBlas", "tier": 1, "b": "energy", "t": "2026-08-14 16:52", "x_zh": "俄罗斯各地区现在正引入燃料配给措施，特别是汽油和柴油，在乌克兰每天对俄炼油厂进行一系列打击之后。", "x_en": "Russian regions are now introducing fuel rationing measures, particularly for gasoline and diesel, after a barrage of daily Ukrainian strikes against the country oil refineries.", "u": "https://x.com/JavierBlas/status/2088307860295885264", "lk": 168, "rt": 26, "rp": 8, "eng": 202, "lang": "en", "tags": ["commodities", "oil_energy", "supply_demand"], "important": true}, {"h": "chigrl", "tier": 1, "b": "energy", "t": "2026-08-14 14:00", "x_zh": "美国石油增长面临逆风，页岩生产商削减支出\n\n一些美国最大的石油公司正在减少在美国页岩盆地的资本支出，因为他们利用高油价带来的意外之财来提高股东回报和偿还债务，而不是……", "x_en": "US Oil Growth Faces Headwinds as Shale Producers Cut Spending\n\nSome of the largest US oil companies are dialing back capital spending in the country’s shale basins as they use the windfall from high crude prices to boost shareholder returns and pay down debt rather than", "u": "https://x.com/chigrl/status/2088264610218471866", "lk": 145, "rt": 27, "rp": 3, "eng": 175, "lang": "en", "tags": ["commodities", "oil_energy", "metals"], "important": true}, {"h": "Ole_S_Hansen", "tier": 1, "b": "metals", "t": "2026-08-14 08:56", "x_zh": "全球三大期货交易所监测的铜库存已连续第12周下降，降至94万吨。伦敦金属交易所（LME）和上海库存继续下滑，而纽约商品交易所（COMEX）库存持续上升，因美国关税前囤货将金属吸引至美国仓库。", "x_en": "Global #copper stocks monitored across the three major futures exchanges have fallen for a 12th consecutive week to 940kt. LME and Shanghai inventories continue to decline, while COMEX stocks keep rising as pre-tariff stockpiling in the US draws metal into American warehouses,", "u": "https://x.com/Ole_S_Hansen/status/2088188046793425200", "lk": 132, "rt": 36, "rp": 4, "eng": 172, "lang": "en", "tags": ["commodities", "cross_commodity", "sellside"], "important": true}, {"h": "chigrl", "tier": 1, "b": "energy", "t": "2026-08-14 09:57", "x_zh": "更新：巴拿马运河通行费催生460万美元过闸费\n\n一艘空载天然气超级油轮下周将在支付460万美元的高额费用后，插队通过巴拿马运河，因伊朗战争扰乱全球能源流动并重塑既定贸易路线。该费用已支付", "x_en": "UPDATE: Panama Canal Traffic Spurs $4.6 Million Payment for a Crossing\n\nAn empty gas supertanker will cut the line at the Panama Canal next week after a bumper payment of $4.6 million, as the Iran war upends global energy flows and redraws established trade routes.\n\nThe fee, paid", "u": "https://x.com/chigrl/status/2088203365444444410", "lk": 88, "rt": 16, "rp": 3, "eng": 107, "lang": "en", "tags": ["commodities", "oil_energy", "metals"], "important": true}, {"h": "JKempEnergy", "tier": 1, "b": "energy", "t": "2026-08-14 09:42", "x_zh": "美国天然气库存过去40天一直保持稳定的季节性盈余，尽管期货价格暴跌。8月7日库存较十年季节性均值高出1960亿立方英尺（+7%或+0.60σ），且自上周以来一直处于类似盈余状态。", "x_en": "U.S. GAS STOCKS have remained in a steady seasonal surplus for the last 40 days despite the slump in futures prices. Inventories were 196 billion cubic feet (+7% or +0.60σ) above the ten-year seasonal average on August 7 and have been in a similar surplus since the last week of", "u": "https://x.com/JKempEnergy/status/2088199449352777804", "lk": 19, "rt": 8, "rp": 1, "eng": 28, "lang": "en", "tags": ["commodities", "oil_energy", "data"], "important": false}, {"h": "mkt_intl", "tier": 2, "b": "commodities", "t": "2026-08-14 09:33", "x_zh": "加拿大植物油、大麦、硬质小麦、油菜籽、豆类作物报告（@SKGov）：作物继续成熟，收获进度2%。凉爽天气和零星阵雨缓解了压力，但条件依然干燥，更多降雨将有利于晚播作物。", "x_en": "CANADA #vegoils #barley #durum #rapeseed #pulses\nCrop Report \n@SKGov\n:\nCrops continue to mature, with harvest 2% complete. Cooler weather and scattered showers eased stress, but condi
